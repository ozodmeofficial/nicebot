# Publishes to PyPI with Trusted Publishing — no API token is stored anywhere.
#
# One-time setup on https://pypi.org/manage/account/publishing/ → "Add a new pending publisher":
#   PyPI project name: nicebot
#   Owner:             <your GitHub username>
#   Repository name:   nicebot
#   Workflow name:     publish.yml
#   Environment name:  pypi
#
# Then create a GitHub release (e.g. tag v0.1.0) and this workflow uploads the package.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nicebot/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
