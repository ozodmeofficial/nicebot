<title>nicebot — Telegram botlar uchun Python kutubxonasi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* nicebot docs — GitHub look: Primer colors, Mona Sans headings, system body text.
   Docs pages follow docs.github.com (light/dark); the landing page is dark like github.com. */
:root {
  --bg: #ffffff; --bg-muted: #f6f8fa; --bg-neutral: rgba(129, 139, 152, 0.12);
  --border: #d1d9e0; --border-muted: rgba(209, 217, 224, 0.7);
  --fg: #1f2328; --fg-muted: #59636e;
  --accent: #0969da; --accent-bg: #ddf4ff; --accent-emph: #0969da;
  --success: #1a7f37; --btn-primary: #1f883d; --btn-primary-hover: #1c8139;
  --attention: #9a6700; --attention-bg: #fff8c5; --done: #8250df; --danger: #d1242f;
  --header-bg: #f6f8fa; --code-bg: #f6f8fa; --code-fg: #1f2328;
  --c-key: #cf222e; --c-str: #0a3069; --c-com: #59636e; --c-num: #0550ae; --c-fn: #8250df; --c-built: #953800; --c-attr: #0550ae; --c-tag: #116329;
  --chat-bg: #e7ebf0; --chat-bot: #ffffff; --chat-me: #e0f7cf; --chat-fg: #111; --chat-dim: #6b7280; --chat-btn: rgba(17, 17, 17, 0.07);
  --shadow-lg: 0 8px 24px rgba(66, 74, 83, 0.12), 0 1px 3px rgba(31, 35, 40, 0.12);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --display: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --top-h: 64px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --bg-muted: #151b23; --bg-neutral: rgba(101, 108, 118, 0.2); --border: #3d444d; --border-muted: rgba(61, 68, 77, 0.7);
    --fg: #f0f6fc; --fg-muted: #9198a1; --accent: #4493f8; --accent-bg: rgba(56, 139, 253, 0.1); --accent-emph: #1f6feb; --success: #3fb950;
    --btn-primary: #238636; --btn-primary-hover: #29903b; --attention: #d29922; --attention-bg: rgba(187, 128, 9, 0.15); --done: #ab7df8; --danger: #f85149;
    --header-bg: #010409; --code-bg: #151b23; --code-fg: #f0f6fc;
    --c-key: #ff7b72; --c-str: #a5d6ff; --c-com: #9198a1; --c-num: #79c0ff; --c-fn: #d2a8ff; --c-built: #ffa657; --c-attr: #79c0ff; --c-tag: #7ee787;
    --chat-bg: #0e1621; --chat-bot: #182533; --chat-me: #2b5278; --chat-fg: #f1f5f9; --chat-dim: #8fa3b8; --chat-btn: rgba(255, 255, 255, 0.08);
    --shadow-lg: 0 8px 24px rgba(1, 4, 9, 0.75); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --bg-muted: #151b23; --bg-neutral: rgba(101, 108, 118, 0.2); --border: #3d444d; --border-muted: rgba(61, 68, 77, 0.7);
  --fg: #f0f6fc; --fg-muted: #9198a1; --accent: #4493f8; --accent-bg: rgba(56, 139, 253, 0.1); --accent-emph: #1f6feb; --success: #3fb950;
  --btn-primary: #238636; --btn-primary-hover: #29903b; --attention: #d29922; --attention-bg: rgba(187, 128, 9, 0.15); --done: #ab7df8; --danger: #f85149;
  --header-bg: #010409; --code-bg: #151b23; --code-fg: #f0f6fc;
  --c-key: #ff7b72; --c-str: #a5d6ff; --c-com: #9198a1; --c-num: #79c0ff; --c-fn: #d2a8ff; --c-built: #ffa657; --c-attr: #79c0ff; --c-tag: #7ee787;
  --chat-bg: #0e1621; --chat-bot: #182533; --chat-me: #2b5278; --chat-fg: #f1f5f9; --chat-dim: #8fa3b8; --chat-btn: rgba(255, 255, 255, 0.08);
  --shadow-lg: 0 8px 24px rgba(1, 4, 9, 0.75); color-scheme: dark;
}
.gh-dark {
  --bg: #0d1117; --bg-muted: #151b23; --bg-neutral: rgba(101, 108, 118, 0.2); --border: #30363d; --border-muted: rgba(48, 54, 61, 0.7);
  --fg: #f0f6fc; --fg-muted: #9198a1; --accent: #4493f8; --accent-bg: rgba(56, 139, 253, 0.12); --success: #3fb950;
  --btn-primary: #238636; --btn-primary-hover: #29903b; --attention: #d29922; --done: #ab7df8; --code-bg: #0d1117; --code-fg: #e6edf3;
  --c-key: #ff7b72; --c-str: #a5d6ff; --c-com: #8b949e; --c-num: #79c0ff; --c-fn: #d2a8ff; --c-built: #ffa657; --c-attr: #79c0ff; --c-tag: #7ee787;
  --chat-bg: #0e1621; --chat-bot: #182533; --chat-me: #2b5278; --chat-fg: #f1f5f9; --chat-dim: #8fa3b8; --chat-btn: rgba(255, 255, 255, 0.08);
  background: var(--bg); color: var(--fg); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 20px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body.is-landing { background: #0d1117; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--header-bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: .2rem; }
button, select, input { font: inherit; color: inherit; }
svg { flex: none; }
:focus-visible { outline: 2px solid var(--accent-emph); outline-offset: -2px; border-radius: 6px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); }
.ico { width: 16px; height: 16px; fill: currentColor; vertical-align: text-bottom; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h); background: var(--header-bg); border-bottom: 1px solid var(--border); }
.is-landing .top { --border: rgba(240, 246, 252, 0.1); --fg: #f0f6fc; --fg-muted: #9198a1; --bg: #0d1117; --bg-muted: #151b23; --bg-neutral: rgba(101, 108, 118, .2); color: #f0f6fc; background: rgba(13, 17, 23, 0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color-scheme: dark; }
.top-inner { height: 100%; max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding-left: var(--gut); padding-right: var(--gut-r); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); margin-right: 12px; flex: none; }
.brand:hover { text-decoration: none; }
.brand svg { width: 32px; height: 32px; }
.brand b { font: 600 17px/1 var(--display); }
.brand .sep { color: var(--fg-muted); font-weight: 300; }
.brand .docs-word { font: 500 16px/1 var(--display); color: var(--fg); }
.tabs { display: flex; gap: 2px; }
.tabs a { position: relative; color: var(--fg); padding: 6px 10px; border-radius: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tabs a:hover { background: var(--bg-neutral); text-decoration: none; }
.tabs a[aria-current="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -15px; height: 2px; border-radius: 2px; background: #fd8c73; }
.spacer { flex: 1; }
.search-btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; width: 270px; padding: 0 6px 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg-muted); cursor: pointer; font-size: 14px; text-align: left; }
.is-landing .search-btn { background: rgba(255, 255, 255, 0.04); }
.search-btn:hover { border-color: var(--fg-muted); }
.search-btn .sb-label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
kbd { display: inline-block; font: 500 11px/16px var(--mono); color: var(--fg-muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; box-shadow: inset 0 -1px 0 var(--border); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg-muted); cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--fg); background: var(--bg-neutral); text-decoration: none; }
.menu-btn { display: none; }
.lang { position: relative; flex: none; display: inline-flex; align-items: center; }
.lang .globe { position: absolute; left: 8px; color: var(--fg-muted); pointer-events: none; }
.lang select { appearance: none; -webkit-appearance: none; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); font-size: 13px; font-weight: 600; padding: 0 24px 0 28px; cursor: pointer; }
.lang select option { color: #1f2328; background: #fff; }
.lang .caret { position: absolute; right: 7px; color: var(--fg-muted); pointer-events: none; width: 12px; height: 12px; }
.gh-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--fg); font-size: 14px; font-weight: 500; background: var(--bg-muted); flex: none; }
.gh-btn:hover { text-decoration: none; background: var(--bg-neutral); }
.theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: block; }
:root[data-theme="dark"] .theme-btn .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .sun { display: block; } :root:not([data-theme="light"]) .theme-btn .moon { display: none; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 6px; font: 600 16px/1 var(--sans); cursor: pointer; border: 1px solid transparent; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.btn:hover { text-decoration: none; }
.btn.primary { background: var(--btn-primary); color: #fff; border-color: rgba(31, 35, 40, 0.15); }
.btn.primary:hover { background: var(--btn-primary-hover); }
.btn.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
.btn.secondary:hover { border-color: var(--fg-muted); background: var(--bg-neutral); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 14px; }

/* code */
figure.code { position: relative; margin: 16px 0 24px; border-radius: 6px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); color: var(--code-fg); }
figure.code figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 36px; padding: 0 4px 0 12px; border-bottom: 1px solid var(--border); background: var(--bg-muted); }
.code-lang { font: 600 12px/1 var(--mono); color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.copy { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--sans); color: var(--fg-muted); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
.copy svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.copy:hover { color: var(--fg); background: var(--bg-neutral); border-color: var(--border); }
.copy.done { color: var(--success); }
pre { margin: 0; padding: 16px; overflow-x: auto; font: 400 13.6px/1.45 var(--mono); tab-size: 4; font-variant-ligatures: none; }
pre code { font: inherit; background: none; padding: 0; border: 0; color: inherit; }
.hljs-keyword, .hljs-literal, .hljs-selector-tag, .hljs-doctag { color: var(--c-key); }
.hljs-string, .hljs-regexp, .hljs-template-string, .hljs-addition { color: var(--c-str); }
.hljs-comment, .hljs-quote { color: var(--c-com); }
.hljs-number, .hljs-variable, .hljs-template-variable, .hljs-selector-attr { color: var(--c-num); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: var(--c-fn); }
.hljs-built_in, .hljs-type { color: var(--c-built); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-class, .hljs-meta { color: var(--c-attr); }
.hljs-name, .hljs-tag { color: var(--c-tag); }
.hljs-params, .hljs-subst { color: var(--code-fg); }
.numbered pre code .ln { display: block; padding-left: 3.4em; position: relative; }
.numbered pre code .ln::before { content: attr(data-n); position: absolute; left: 0; width: 2.4em; text-align: right; color: var(--fg-muted); opacity: .6; user-select: none; }

/* chat preview (Telegram look) */
.chat { background: var(--chat-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); color: var(--chat-fg); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; background: var(--chat-bot); border-bottom: 1px solid color-mix(in srgb, var(--chat-fg) 8%, transparent); }
.chat-ava { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #2f81f7, #8957e5); color: #fff; font: 700 12px/1 var(--sans); }
.chat-who { flex: 1; display: grid; line-height: 1.25; }
.chat-who b { font-weight: 600; font-size: 14px; }
.chat-who small { color: var(--chat-dim); font-size: 12px; }
.chat-replay { width: 30px; height: 30px; border-radius: 6px; border: 0; background: transparent; color: var(--chat-dim); cursor: pointer; display: grid; place-items: center; }
.chat-replay:hover { background: var(--chat-btn); color: var(--chat-fg); }
.chat-replay svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.chat-body { padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.msg { max-width: 86%; display: flex; flex-direction: column; gap: 4px; }
.chat .msg p { margin: 0; padding: 7px 11px 8px; border-radius: 14px; background: var(--chat-bot); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.06); overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; }
.msg.bot p { border-bottom-left-radius: 5px; }
.msg.me { align-self: flex-end; }
.chat .msg.me p { background: var(--chat-me); border-bottom-right-radius: 5px; }
.edited { font-style: normal; font-size: 11px; color: var(--chat-dim); margin-left: 4px; }
.kb { display: grid; gap: 4px; }
.kb-row { display: flex; gap: 4px; }
.kb-row span { flex: 1; text-align: center; padding: 7px 8px; border-radius: 9px; background: color-mix(in srgb, var(--chat-bot) 55%, transparent); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid color-mix(in srgb, var(--chat-fg) 8%, transparent); }
.tap { align-self: center; font-size: 12px; color: var(--chat-dim); padding: 2px 0; }
.tap span { background: var(--chat-btn); padding: 3px 10px; border-radius: 99px; }
.chat.anim .chat-body > * { opacity: 0; }
.chat.play .chat-body > * { animation: msg-in .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 0.6s + 0.15s); }
@keyframes msg-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.demo { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; margin: 16px 0 24px; align-items: stretch; }
.demo pre { font-size: 12.8px; }
.demo.stack { grid-template-columns: minmax(0, 1fr); }
.demo.stack .demo-chat .chat { max-width: 420px; }
.demo figure.code { margin: 0; height: 100%; }
.demo-chat { display: flex; flex-direction: column; gap: 8px; }
.demo-chat .chat { flex: 1; }
.demo-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--fg-muted); padding: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

/* landing */
.landing { overflow: hidden; }
.hero { position: relative; isolation: isolate; padding: 96px 0 72px; }
.hero::before { content: ""; position: absolute; inset: -200px -10% auto; height: 900px; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 50% at 30% 30%, rgba(137, 87, 229, 0.35), transparent 70%), radial-gradient(35% 45% at 72% 22%, rgba(31, 111, 235, 0.32), transparent 70%), radial-gradient(30% 40% at 55% 70%, rgba(46, 160, 67, 0.16), transparent 70%); filter: blur(10px); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
  background-image: radial-gradient(rgba(240, 246, 252, 0.18) 1px, transparent 1px); background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 20%, #000, transparent 75%); mask-image: radial-gradient(ellipse 60% 55% at 50% 20%, #000, transparent 75%); }
.hero-copy { text-align: center; max-width: 920px; margin: 0 auto; }
.pill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 14px 4px 4px; border-radius: 999px; border: 1px solid rgba(240, 246, 252, 0.15); background: rgba(240, 246, 252, 0.04); color: var(--fg); font-size: 14px; margin-bottom: 28px; }
.pill:hover { text-decoration: none; border-color: rgba(240, 246, 252, 0.3); }
.pill b { background: linear-gradient(90deg, #8957e5, #2f81f7); color: #fff; font: 700 12px/1 var(--sans); padding: 6px 10px; border-radius: 999px; }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--fg-muted); }
.hero h1 { margin: 0 0 24px; font: 800 clamp(44px, 7.4vw, 88px)/1.02 var(--display); letter-spacing: -0.035em; text-wrap: balance; }
.grad { background: linear-gradient(90deg, #a371f7 0%, #79c0ff 50%, #56d364 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { margin: 0 auto 36px; max-width: 680px; font-size: clamp(17px, 2vw, 20px); line-height: 1.55; color: var(--fg-muted); text-wrap: pretty; }
.install { max-width: 560px; margin: 0 auto 24px; border: 1px solid var(--border); border-radius: 12px; background: rgba(1, 4, 9, 0.6); text-align: left; overflow: hidden; }
.install-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); }
.install-tabs button { border: 0; background: none; padding: 12px 10px; font-size: 13px; font-weight: 600; color: var(--fg-muted); cursor: pointer; position: relative; }
.install-tabs button:hover, .install-tabs button[aria-selected="true"] { color: var(--fg); }
.install-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: #fd8c73; }
.install-cmd { display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 16px; font: 500 15px/1.4 var(--mono); }
.install-cmd .p { color: var(--success); user-select: none; }
.install-cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.window { margin: 64px auto 0; max-width: 1080px; border: 1px solid var(--border); border-radius: 12px; background: #0d1117; overflow: hidden; box-shadow: 0 40px 120px -30px rgba(31, 111, 235, 0.45), 0 30px 60px -40px rgba(137, 87, 229, 0.6); }
.window-bar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--border); background: #010409; font-size: 13px; color: var(--fg-muted); }
.window-bar .file { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 600; }
.window-bar .file .ico { color: var(--fg-muted); }
.window-bar .lines { margin-left: auto; font-family: var(--mono); font-size: 12px; }
.window-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.window-body figure.code { margin: 0; border: 0; border-radius: 0; background: transparent; }
.window-body figure.code figcaption { display: none; }
.window-body pre { padding: 18px 20px; font-size: 14px; line-height: 1.75; }
.window-body .chat { border: 0; border-left: 1px solid var(--border); border-radius: 0; min-height: 100%; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 1080px; margin: 48px auto 0; }
.stats div { padding: 8px 24px; border-left: 1px solid var(--border); }
.stats div:first-child { border-left: 0; }
.stats b { display: block; font: 700 clamp(30px, 4vw, 44px)/1.05 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stats span { display: block; margin-top: 6px; color: var(--fg-muted); font-size: 14px; }
.section { padding: 104px 0; position: relative; border-top: 1px solid var(--border); }
.section-head { max-width: 760px; margin-bottom: 48px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; margin-bottom: 14px; }
.eyebrow .ico { width: 20px; height: 20px; }
.eyebrow.purple { color: #a371f7; } .eyebrow.blue { color: #79c0ff; } .eyebrow.green { color: #56d364; } .eyebrow.orange { color: #ffa657; } .eyebrow.pink { color: #ff7b72; }
.section h2 { margin: 0 0 16px; font: 700 clamp(32px, 4.4vw, 52px)/1.08 var(--display); letter-spacing: -0.03em; text-wrap: balance; }
.section .sub { margin: 0; color: var(--fg-muted); font-size: 19px; line-height: 1.55; text-wrap: pretty; }
.timeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; position: relative; align-items: start; }
.timeline::before { content: ""; position: absolute; left: 20px; right: 20px; top: 19px; height: 2px; background: linear-gradient(90deg, #a371f7, #79c0ff, #56d364); opacity: .55; }
.step { position: relative; display: flex; flex-direction: column; min-width: 0; }
.step-n { position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #0d1117; border: 2px solid; font: 700 16px/1 var(--display); margin-bottom: 20px; }
.step:nth-child(1) .step-n { border-color: #a371f7; color: #a371f7; } .step:nth-child(2) .step-n { border-color: #79c0ff; color: #79c0ff; } .step:nth-child(3) .step-n { border-color: #56d364; color: #56d364; }
.step h3 { margin: 0 0 6px; font: 600 22px/1.3 var(--display); }
.step p { margin: 0 0 16px; color: var(--fg-muted); font-size: 16px; }
.step figure.code, .step .chat { margin: 0; }
.step pre { font-size: 12.5px; padding: 12px 14px; }
.step .term { display: grid; gap: 10px; }
.compare-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 56px; align-items: center; }
.bars { display: grid; gap: 20px; margin-top: 32px; }
.bar-label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 8px; }
.bar-label b { font-weight: 600; }
.bar-label span { font: 500 13px/1.6 var(--mono); color: var(--fg-muted); }
.bar { height: 10px; border-radius: 6px; background: rgba(240, 246, 252, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: #6e7681; width: var(--w); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
.bar.win i { background: linear-gradient(90deg, #2ea043, #56d364); }
.bars:not(.seen) .bar i { width: 0; }
.less { margin-top: 24px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(63, 185, 80, 0.4); background: rgba(46, 160, 67, 0.15); color: #56d364; font-weight: 600; font-size: 14px; }
.code-tabs { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0d1117; }
.code-tabs-bar { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); background: #010409; }
.code-tabs-bar button { border: 0; background: none; color: var(--fg-muted); padding: 12px 10px; font: 600 13px/1 var(--mono); cursor: pointer; position: relative; }
.code-tabs-bar button:hover, .code-tabs-bar button[aria-selected="true"] { color: var(--fg); }
.code-tabs-bar button[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: #fd8c73; border-radius: 2px; }
.code-tabs figure.code { margin: 0; border: 0; border-radius: 0; background: transparent; }
.code-tabs figure.code figcaption { position: absolute; right: 6px; top: 6px; border: 0; height: auto; padding: 0; background: none; }
.code-tabs figure.code figcaption .code-lang { display: none; }
.code-tabs .pane { position: relative; }
.code-tabs .pane[hidden] { display: none; }
.code-tabs pre { max-height: 460px; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(180deg, rgba(240, 246, 252, .03), transparent); color: var(--fg); min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { text-decoration: none; border-color: rgba(240, 246, 252, 0.3); transform: translateY(-2px); }
.card-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.card-ico .ico { width: 20px; height: 20px; }
.c1 .card-ico { background: rgba(163, 113, 247, .15); color: #a371f7; } .c2 .card-ico { background: rgba(121, 192, 255, .15); color: #79c0ff; } .c3 .card-ico { background: rgba(86, 211, 100, .15); color: #56d364; }
.c4 .card-ico { background: rgba(255, 166, 87, .15); color: #ffa657; } .c5 .card-ico { background: rgba(255, 123, 114, .15); color: #ff7b72; } .c6 .card-ico { background: rgba(240, 136, 62, .15); color: #f0883e; }
.card h3 { margin: 6px 0 0; font: 600 19px/1.3 var(--display); display: flex; align-items: center; gap: 6px; }
.card h3 .arrow { color: var(--fg-muted); transition: transform .15s; }
.card:hover h3 .arrow { transform: translateX(3px); color: var(--fg); }
.card p { margin: 0; color: var(--fg-muted); font-size: 15px; line-height: 1.55; }
.card .snip { margin-top: auto; padding-top: 10px; }
.card .snip code { display: block; font: 12.5px/1.5 var(--mono); background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e6edf3; }
.more-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; font-weight: 600; font-size: 16px; }
.paths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.path { border: 1px solid var(--border); border-radius: 12px; padding: 20px; background: #0d1117; }
.path-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.path-top .ico { color: var(--fg-muted); }
.path h3 { margin: 0; font: 600 17px/1.3 var(--display); }
.path > p { margin: 0 0 14px; color: var(--fg-muted); font-size: 14px; }
.label { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; line-height: 18px; padding: 0 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--fg-muted); white-space: nowrap; }
.path ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.path li a { display: flex; align-items: center; gap: 10px; padding: 9px 0; color: var(--fg); font-size: 14px; border-bottom: 1px solid var(--border-muted); }
.path li:last-child a { border-bottom: 0; }
.path li a:hover { color: var(--accent); text-decoration: none; }
.path li a .ico { color: var(--fg-muted); }
.faq-grid { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 56px; align-items: start; }
.faq details { border-bottom: 1px solid var(--border); }
.faq details:first-child { border-top: 1px solid var(--border); }
.faq summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 2px; font: 600 18px/1.4 var(--display); }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .ico { color: var(--fg-muted); transition: transform .2s; }
.faq details[open] summary .ico { transform: rotate(45deg); }
.faq details p { margin: -4px 0 22px; color: var(--fg-muted); font-size: 16px; line-height: 1.65; max-width: 64ch; }
.final { position: relative; isolation: isolate; padding: 120px 0; text-align: center; overflow: hidden; border-top: 1px solid var(--border); }
.final::before { content: ""; position: absolute; z-index: -1; left: 50%; bottom: -320px; width: 1100px; height: 640px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(137, 87, 229, 0.35), rgba(31, 111, 235, 0.2) 50%, transparent 80%); }
.final h2 { margin: 0 0 16px; font: 800 clamp(34px, 5vw, 60px)/1.05 var(--display); letter-spacing: -0.035em; text-wrap: balance; }
.final p { margin: 0 auto 36px; color: var(--fg-muted); font-size: 19px; max-width: 560px; }

/* docs */
.shell { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 286px minmax(0, 1fr) 240px; }
.shell.no-toc { grid-template-columns: 286px minmax(0, 1fr); }
.shell.no-toc .toc { display: none; }
.side { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 20px 16px 48px var(--gut); border-right: 1px solid var(--border); scrollbar-width: thin; scrollbar-color: var(--border) transparent; overscroll-behavior: contain; }
.side-tabs { display: none; }
.side-product { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; margin-bottom: 8px; border-bottom: 1px solid var(--border); font: 600 16px/1.3 var(--display); color: var(--fg); }
.side-product:hover { text-decoration: none; }
.side-product .label { margin-left: auto; }
.side .overview { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); font-size: 14px; font-weight: 600; }
.side .overview .ico { color: var(--fg-muted); }
.side .overview:hover { background: var(--bg-neutral); text-decoration: none; }
.side .overview[aria-current="page"] { background: var(--bg-neutral); }
.grp { margin-top: 2px; }
.grp-head { display: flex; align-items: center; gap: 2px; }
.grp-toggle { display: grid; place-items: center; width: 24px; height: 24px; border: 0; background: none; color: var(--fg-muted); border-radius: 6px; cursor: pointer; flex: none; }
.grp-toggle:hover { background: var(--bg-neutral); color: var(--fg); }
.grp-toggle .ico { width: 12px; height: 12px; transition: transform .15s; }
.grp.open .grp-toggle .ico { transform: rotate(90deg); }
.grp-title { flex: 1; display: block; padding: 6px 8px 6px 4px; border-radius: 6px; font-size: 14px; font-weight: 600; color: var(--fg); }
.grp-title:hover { text-decoration: none; color: var(--accent); }
.grp-title[aria-current="page"] { color: var(--accent); }
.grp-items { display: none; padding: 2px 0 6px; }
.grp.open .grp-items { display: block; }
.side a.item { position: relative; display: block; margin-left: 26px; padding: 5px 8px; border-radius: 6px; color: var(--fg-muted); font-size: 14px; line-height: 1.4; }
.side a.item:hover { color: var(--fg); background: var(--bg-neutral); text-decoration: none; }
.side a.item[aria-current="page"] { color: var(--fg); background: var(--bg-neutral); font-weight: 600; }
.side a.item[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 4px; border-radius: 6px; background: var(--accent-emph); }
main.docs { min-width: 0; padding: 32px 48px 96px; }
.doc { max-width: 880px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 14px; margin-bottom: 16px; }
.crumb .sep { color: var(--fg-muted); padding: 0 2px; }
.crumb span:last-child { color: var(--fg-muted); }
.doc h1 { font: 600 32px/1.25 var(--display); margin: 0 0 12px; text-wrap: balance; }
.lede { font-size: 20px; line-height: 1.5; color: var(--fg-muted); margin: 0 0 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--fg-muted); }
.meta span, .meta a { display: inline-flex; align-items: center; gap: 6px; }
.meta a { color: var(--fg-muted); }
.meta a:hover { color: var(--accent); }
.prose { font-size: 16px; line-height: 1.6; overflow-wrap: break-word; }
.prose > :first-child { margin-top: 0; }
.prose h2 { position: relative; font: 600 24px/1.25 var(--display); margin: 40px 0 16px; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
.prose h3 { position: relative; font: 600 20px/1.25 var(--display); margin: 28px 0 12px; }
.anchor { margin-left: 8px; color: var(--fg-muted); font-weight: 400; opacity: 0; transition: opacity .15s; }
.prose h2:hover .anchor, .prose h3:hover .anchor { opacity: 1; }
.prose p { margin: 0 0 16px; }
.prose ul, .prose ol { padding-left: 2em; margin: 0 0 16px; }
.prose li + li { margin-top: .25em; }
.prose strong { font-weight: 600; }
.prose a:not(.anchor) { text-decoration: underline; text-underline-offset: .2rem; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.prose a:not(.anchor):hover { text-decoration-color: var(--accent); }
.prose :not(pre) > code, .flist code { font: 85%/1.4 var(--mono); padding: .2em .4em; margin: 0; background: var(--bg-neutral); border-radius: 6px; white-space: break-spaces; color: var(--fg); }
.table { overflow-x: auto; margin: 0 0 16px; }
table { border-collapse: collapse; border-spacing: 0; width: max-content; max-width: 100%; font-size: 14px; }
th, td { padding: 6px 13px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
th { font-weight: 600; background: var(--bg-muted); }
tbody tr:nth-child(2n) td { background: var(--bg-muted); }
td:first-child { white-space: nowrap; }
.alert { margin: 0 0 16px; padding: 8px 16px; border-left: .25em solid var(--accent-emph); }
.alert p { margin: 0 0 8px; }
.alert p:last-child { margin-bottom: 0; }
.alert-title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.alert-title svg { width: 16px; height: 16px; fill: currentColor; }
.alert-note .alert-title { color: var(--accent); }
.alert-tip { border-left-color: var(--success); } .alert-tip .alert-title { color: var(--success); }
.alert-warning { border-left-color: var(--attention); } .alert-warning .alert-title { color: var(--attention); }
.ref { padding: 20px 0 8px; border-top: 1px solid var(--border-muted); }
.ref h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; font: 600 15px/1.5 var(--mono); }
.ref h3 .sig { background: none; padding: 0; font-size: 15px; white-space: normal; word-break: break-word; }
.ref > p { margin: 0 0 10px; }
.ref figure.code { margin: 8px 0 12px; }
.ref figure.code figcaption { height: 30px; }
.ref pre { font-size: 13px; padding: 12px 14px; }
.badge { display: inline-flex; font: 500 12px/18px var(--sans); padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg-muted); }
.badge-async { color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, transparent); }
.badge-decorator { color: var(--attention); border-color: color-mix(in srgb, var(--attention) 40%, transparent); }
.badge-class { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, transparent); }
.badge-property { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.toc { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start; padding: 32px 24px 40px 0; max-height: calc(100vh - var(--top-h)); overflow-y: auto; scrollbar-width: none; }
.toc h4 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.toc a { display: block; padding: 4px 0 4px 12px; border-left: 2px solid var(--border-muted); color: var(--fg-muted); font-size: 14px; line-height: 1.4; }
.toc a:hover { color: var(--accent); text-decoration: none; }
.toc a.on { color: var(--fg); font-weight: 600; border-left-color: var(--accent-emph); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); max-width: 880px; }
.pager a { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; color: var(--fg); }
.pager a:hover { text-decoration: none; border-color: var(--accent); }
.pager small { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); }
.pager span { font-weight: 600; color: var(--accent); }
.pager .next { text-align: right; grid-column: 2; align-items: flex-end; }
.over-hero { padding: 8px 0 32px; margin-bottom: 32px; border-bottom: 1px solid var(--border); max-width: 880px; }
.over-hero h1 { font: 600 40px/1.2 var(--display); letter-spacing: -0.02em; margin: 0 0 12px; }
.over-hero p { margin: 0; color: var(--fg-muted); font-size: 20px; line-height: 1.5; }
.over-hero .btn { margin-top: 24px; }
.over-title { font: 600 20px/1.3 var(--display); margin: 0 0 16px; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 48px; }
.box { display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
.box:hover { text-decoration: none; border-color: var(--accent); }
.box h3 { margin: 0; font: 600 16px/1.4 var(--display); color: var(--accent); }
.box p { margin: 0; color: var(--fg-muted); font-size: 14px; }
.box .num { font: 600 12px/1 var(--mono); color: var(--fg-muted); }
.secs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.sec { border: 1px solid var(--border); border-radius: 6px; padding: 16px 16px 12px; background: var(--bg); }
.sec-head { display: flex; align-items: center; gap: 10px; color: var(--fg); }
.sec-head:hover { text-decoration: none; }
.sec-head:hover h3 { color: var(--accent); }
.sec-ico { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; background: var(--bg-muted); border: 1px solid var(--border); color: var(--fg-muted); }
.sec-head h3 { margin: 0; font: 600 16px/1.3 var(--display); }
.sec-head small { display: block; font-size: 12px; color: var(--fg-muted); font-weight: 400; }
.sec > p { margin: 10px 0 8px; color: var(--fg-muted); font-size: 14px; }
.sec ul { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 16px; }
.sec li { break-inside: avoid; padding: 3px 0; font-size: 14px; }
.plist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 6px; max-width: 880px; overflow: hidden; }
.plist li + li { border-top: 1px solid var(--border); }
.plist a { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 14px 16px; color: var(--fg); }
.plist a:hover { text-decoration: none; background: var(--bg-muted); }
.plist .n { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--mono); border: 1px solid var(--border); color: var(--fg-muted); }
.plist b { font-weight: 600; color: var(--accent); }
.plist small { grid-column: 2; font-size: 14px; color: var(--fg-muted); }
.plist .ico { grid-row: 1 / span 2; grid-column: 3; color: var(--fg-muted); }
.fgroup h2 { display: flex; align-items: baseline; gap: 10px; }
.fcount { font: 500 12px/18px var(--sans); color: var(--fg-muted); border: 1px solid var(--border); padding: 0 7px; border-radius: 999px; }
.flist { list-style: none; padding: 0; margin: 0 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.flist li { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin: 0; }
.flist p { margin: 6px 0 0; font-size: 14px; color: var(--fg-muted); }
.fnum { font: 500 12px/1.9 var(--mono); color: var(--fg-muted); flex: none; width: 20px; }

/* command palette */
.palette { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center; align-items: start; padding: max(10vh, 16px) 16px 16px; background: rgba(1, 4, 9, 0.5); }
.palette[hidden] { display: none; }
.palette-box { width: min(680px, 100%); max-height: min(560px, 80vh); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; color: var(--fg); }
.palette-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.palette-in .ico { color: var(--fg-muted); }
.palette-in input { flex: 1; min-width: 0; height: 52px; border: 0; outline: 0; background: none; color: var(--fg); font-size: 16px; }
.palette-list { overflow-y: auto; padding: 8px; flex: 1; }
.palette-list a { display: flex; gap: 12px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; color: var(--fg); }
.palette-list a:hover { text-decoration: none; }
.palette-list a .ico { margin-top: 3px; color: var(--fg-muted); }
.palette-list a.on { background: var(--bg-neutral); box-shadow: inset 2px 0 0 var(--accent-emph); }
.palette-list .r { min-width: 0; flex: 1; }
.palette-list small { display: block; font-size: 12px; color: var(--fg-muted); }
.palette-list b { display: block; font-weight: 600; font-size: 14px; }
.palette-list span.s { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg-muted); font-size: 13px; }
.palette-list mark { background: var(--attention-bg); color: var(--fg); border-radius: 2px; }
.palette-list .empty { padding: 28px 12px; text-align: center; color: var(--fg-muted); }
.palette-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--fg-muted); background: var(--bg-muted); }
.palette-foot span { display: inline-flex; align-items: center; gap: 6px; }

/* footer */
footer.foot { border-top: 1px solid var(--border); background: var(--bg-muted); }
.is-landing footer.foot { background: #010409; color: #f0f6fc; --fg: #f0f6fc; --fg-muted: #9198a1; --border: #30363d; --accent: #4493f8; }
.foot-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 32px; padding-top: 48px; padding-bottom: 32px; }
.foot-brand p { margin: 12px 0 0; color: var(--fg-muted); font-size: 14px; max-width: 34ch; }
.foot h5 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--fg); }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot ul a { color: var(--fg-muted); font-size: 14px; }
.foot ul a:hover { color: var(--accent); }
.foot-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding-top: 16px; padding-bottom: 28px; border-top: 1px solid var(--border); font-size: 12px; color: var(--fg-muted); }
.scrim { display: none; }

/* responsive */
@media (max-width: 1280px) { .shell { grid-template-columns: 270px minmax(0, 1fr); } .toc { display: none; } main.docs { padding: 32px 40px 96px; } }
@media (max-width: 1012px) {
  .window-body { grid-template-columns: minmax(0, 1fr); }
  .window-body .chat { border-left: 0; border-top: 1px solid var(--border); }
  .window-body .chat-body { max-width: 440px; width: 100%; margin: 0 auto; }
  .compare-grid, .faq-grid { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .cards, .paths { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .demo { grid-template-columns: minmax(0, 1fr); }
  .demo-chat .chat { max-width: 440px; }
  .search-btn { width: 200px; }
}
@media (max-width: 860px) {
  .tabs, .brand .sep, .brand .docs-word, .gh-btn span { display: none; }
  .menu-btn { display: inline-grid; }
  .is-landing .menu-btn { display: none; }
  .search-btn { width: 32px; padding: 0; justify-content: center; }
  .search-btn .sb-label, .search-btn kbd { display: none; }
  .shell, .shell.no-toc { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 35; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: min(320px, 88vw); height: auto; background: var(--bg); padding: 16px 16px 48px max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow-lg); }
  .side-tabs { display: grid; gap: 2px; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .side-tabs a { padding: 8px; border-radius: 6px; color: var(--fg); font-weight: 600; font-size: 14px; }
  .side-tabs a:hover { background: var(--bg-neutral); text-decoration: none; }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 34; background: rgba(1, 4, 9, 0.4); }
  main.docs { padding: 24px var(--gut-r) 72px var(--gut); }
  .timeline { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .timeline::before { left: 19px; right: auto; top: 20px; bottom: 20px; width: 2px; height: auto; background: linear-gradient(180deg, #a371f7, #79c0ff, #56d364); }
  .step { padding-left: 60px; }
  .step-n { position: absolute; left: 0; top: 0; }
  .quick, .secs, .flist { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 24px; }
  .stats div:nth-child(3) { border-left: 0; }
  .foot-grid { grid-template-columns: 1fr 1fr; }
  .foot-brand { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .hero { padding: 56px 0 48px; }
  .section, .final { padding: 72px 0; }
  .cards, .paths { grid-template-columns: minmax(0, 1fr); }
  .window { margin-top: 40px; }
  .window-body pre { padding: 14px; font-size: 12.5px; }
  .actions .btn { flex: 1 1 auto; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  td:first-child { white-space: normal; }
  .doc h1 { font-size: 28px; }
  .lede { font-size: 18px; }
  .over-hero h1 { font-size: 32px; }
  .sec ul { columns: 1; }
  .plist a { grid-template-columns: 28px minmax(0, 1fr); }
  .plist .ico { display: none; }
  .palette { padding-top: 12px; }
}
@media (max-width: 400px) { .gh-btn { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } .chat.anim .chat-body > * { opacity: 1; } }

      "</div></section>" +
      '<section class="section"><div class="wrap"><div class="section-head"><div class="eyebrow blue">' + ico("layers") + e(h.features_kicker) + "</div><h2>" + e(h.features_title) + '</h2><p class="sub">' + e(h.features_sub) + "</p></div>" +
        '<div class="cards">' + feats + '</div><a class="more-link" href="#features">' + e(h.all_features) + ico("arrow") + "</a>" +
      "</div></section>" +
      '<section class="section"><div class="wrap"><div class="section-head"><div class="eyebrow orange">' + ico("book") + e(h.path_kicker) + "</div><h2>" + e(h.path_title) + '</h2><p class="sub">' + e(h.path_sub) + "</p></div>" +
        '<div class="paths">' + paths + "</div>" +
      "</div></section>" +
      '<section class="section"><div class="wrap faq-grid"><div class="section-head"><div class="eyebrow pink">' + ico("chat") + e(h.faq_kicker) + "</div><h2>" + e(h.faq_title) + '</h2></div><div class="faq">' + faq + "</div></div></section>" +
      '<section class="final"><div class="wrap"><h2>' + e(h.final_title) + "</h2><p>" + e(h.final_sub) + "</p>" + installBox() +
        '<div class="actions"><a class="btn primary" href="#first-bot">' + e(h.cta) + ico("arrow") + '</a><a class="btn secondary" href="' + REPO + '" target="_blank" rel="noopener">' + ico("star") + "Star on GitHub</a></div></div></section>" +
      "</div>";
  }

  // ---------- docs views
  function crumb(parts) {
    return '<nav class="crumb" aria-label="Breadcrumb">' + parts.map(function (p, i) {
      return (i ? '<span class="sep">/</span>' : "") + (p[1] ? '<a href="' + p[1] + '">' + e(p[0]) + "</a>" : "<span>" + e(p[0]) + "</span>");
    }).join("") + "</nav>";
  }
  function pager(prev, next) {
    var h = '<nav class="pager">';
    if (prev) h += '<a href="#' + prev[0] + '"><small>' + ico("left") + e(U("prev")) + "</small><span>" + e(prev[1]) + "</span></a>";
    if (next) h += '<a class="next" href="#' + next[0] + '"><small>' + e(U("next")) + ico("arrow") + "</small><span>" + e(next[1]) + "</span></a>";
    return h + "</nav>";
  }
  function docsShell(cur, inner, toc) {
    app.innerHTML = '<div class="shell' + (toc ? "" : " no-toc") + '" id="shell">' + sidebar(cur) + '<main class="docs" id="main">' + inner + "</main>" +
      (toc ? '<aside class="toc" id="toc">' + toc + "</aside>" : "") + '</div><div class="scrim" id="scrim"></div>';
  }
  function renderOverview() {
    var l = L(), h = l.home;
    var quick = ["intro", "first-bot", "vscode", "media-receive", "miniapp", "ref-ctx"].map(function (id, i) {
      return '<a class="box" href="#' + id + '"><span class="num">0' + (i + 1) + "</span><h3>" + e(title(id)) + "</h3><p>" + e(l.pages[id].desc) + "</p></a>";
    }).join("");
    var secs = D.nav.map(function (g) {
      return '<div class="sec"><a class="sec-head" href="#' + g[0] + '"><span class="sec-ico">' + ico(D.groupIcon[g[0]] || "doc") + "</span><div><h3>" + e(l.groups[g[0]]) + "</h3><small>" + e(fmt(U("pages_n"), g[1].length)) + "</small></div></a><p>" + e(l.groupDesc[g[0]]) + "</p><ul>" +
        g[1].map(function (id) { return '<li><a href="#' + id + '">' + e(title(id)) + "</a></li>"; }).join("") + "</ul></div>";
    }).join("");
    docsShell("docs",
      '<div class="over-hero"><h1>' + e(h.docs_title) + "</h1><p>" + e(h.docs_lead) + "</p></div>" +
      '<h2 class="over-title">' + e(h.start_here) + '</h2><div class="quick">' + quick + "</div>" +
      '<h2 class="over-title">' + e(h.sections) + '</h2><div class="secs">' + secs + "</div>", "");
  }
  function renderGroup(gid) {
    var l = L(), gi = groupIds.indexOf(gid), ids = D.nav[gi][1];
    var list = ids.map(function (id, i) {
      var p = l.pages[id];
      return '<li><a href="#' + id + '"><span class="n">' + (i + 1) + "</span><b>" + e(p.title) + "</b><small>" + e(p.desc) + "</small>" + ico("chev") + "</a></li>";
    }).join("");
    var prev = gi > 0 ? [groupIds[gi - 1], l.groups[groupIds[gi - 1]]] : null, next = gi < groupIds.length - 1 ? [groupIds[gi + 1], l.groups[groupIds[gi + 1]]] : null;
    docsShell(gid,
      '<div class="doc">' + crumb([[U("docs"), "#docs"], [l.groups[gid]]]) +
      '<div class="over-hero"><h1>' + e(l.groups[gid]) + "</h1><p>" + e(l.groupDesc[gid]) + '</p><a class="btn primary sm" href="#' + ids[0] + '">' + e(U("start_reading")) + ico("arrow") + "</a></div>" +
      '<ol class="plist">' + list + "</ol></div>" + pager(prev, next), "");
  }
  function renderPage(id) {
    var l = L(), p = l.pages[id], idx = order.indexOf(id), g = groupOf[id];
    var prev = order[idx - 1], next = order[idx + 1];
    var file = id.indexOf("ref-") === 0 ? "docs/src/reference.py" : "docs/src";
    var toc = p.toc.length > 1 ? "<h4>" + e(U("on_this_page")) + "</h4>" + p.toc.map(function (t) { return '<a href="#' + id + "/" + t[0] + '" data-toc="' + t[0] + '">' + e(t[1]) + "</a>"; }).join("") : "";
    docsShell(id,
      '<article class="doc">' + crumb([[U("docs"), "#docs"], [l.groups[g], "#" + g], [p.title]]) +
      "<h1>" + e(p.title) + '</h1><p class="lede">' + e(p.desc) + "</p>" +
      '<div class="meta"><span>' + ico("clock") + e(fmt(U("read_min"), p.min)) + '</span><a href="' + REPO + "/tree/main/" + file + '" target="_blank" rel="noopener">' + ico("edit") + e(U("edit")) + "</a></div>" +
      '<div class="prose">' + p.html + "</div></article>" +
      pager(prev ? [prev, title(prev)] : null, next ? [next, title(next)] : null), toc);
  }

  // ---------- after render
  function highlight(root) {
    if (!window.hljs) return;
    $$("pre code", root).forEach(function (el) {
      if (el.className.indexOf("plaintext") < 0 && !el.dataset.hl) { try { window.hljs.highlightElement(el); el.dataset.hl = 1; } catch (err) {} }
    });
    $$(".numbered pre code", root).forEach(function (el) {
      if (el.dataset.ln) return;
      el.innerHTML = el.innerHTML.split("\n").map(function (ln, i) { return '<span class="ln" data-n="' + (i + 1) + '">' + (ln || " ") + "</span>"; }).join("");
      el.dataset.ln = 1;
    });
  }
  function labels(root) {
    $$("[data-t]", root).forEach(function (el) { el.textContent = U(el.getAttribute("data-t")); });
    $$("[data-t-title]", root).forEach(function (el) { el.title = U(el.getAttribute("data-t-title")); el.setAttribute("aria-label", el.title); });
  }
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, io = null, spy = null;
  function play(chat) { chat.classList.remove("play"); void chat.offsetWidth; chat.classList.add("play"); }
  function observe() {
    if (io) io.disconnect();
    if (spy) spy.disconnect();
    var chats = $$("[data-chat]"), bars = $("#bars");
    if (!reduce && "IntersectionObserver" in window) {
      io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) {
          if (!en.isIntersecting) return;
          if (en.target.hasAttribute("data-chat")) play(en.target); else en.target.classList.add("seen");
          io.unobserve(en.target);
        });
      }, { threshold: 0.35 });
      chats.forEach(function (c) { c.classList.add("anim"); io.observe(c); });
      if (bars) io.observe(bars);
    } else if (bars) bars.classList.add("seen");
    var links = $$("#toc a[data-toc]");
    if (links.length && "IntersectionObserver" in window) {
      var heads = links.map(function (a) { return document.getElementById(a.getAttribute("data-toc")); }).filter(Boolean), visible = {};
      spy = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { visible[en.target.id] = en.isIntersecting; });
        var cur = null;
        for (var i = 0; i < heads.length; i++) { if (visible[heads[i].id]) { cur = heads[i].id; break; } }
        if (!cur) { for (var j = heads.length - 1; j >= 0; j--) { if (heads[j].getBoundingClientRect().top < 120) { cur = heads[j].id; break; } } }
        if (cur) links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-toc") === cur); });
      }, { rootMargin: "-70px 0px -60% 0px" });
      heads.forEach(function (h) { spy.observe(h); });
    }
    var side = $("#side"), activeItem = $(".side a[aria-current='page']");
    if (side && activeItem && activeItem.offsetTop > side.clientHeight - 80) side.scrollTop = activeItem.offsetTop - side.clientHeight / 2;
  }
  function scrollToId(hid, smooth) { var el = document.getElementById(hid); if (el) el.scrollIntoView({ behavior: smooth && !reduce ? "smooth" : "auto", block: "start" }); }

  // ---------- router: "" landing · docs · <group> · <page> · <page>/<heading>
  var current = null;
  function parse() {
    var raw = decodeURIComponent((location.hash || "").slice(1)), cut = raw.indexOf("/");
    return { id: cut < 0 ? raw : raw.slice(0, cut), anchor: cut < 0 ? "" : raw.slice(cut + 1) };
  }
  function route(keep) {
    var r = parse(), l = L(), id = r.id, kind;
    if (l.pages[id]) kind = "page"; else if (groupIds.indexOf(id) >= 0) kind = "group"; else if (id === "docs") kind = "docs"; else { kind = "home"; id = ""; }
    var same = current === kind + ":" + id + ":" + lang;
    if (!same) {
      document.body.classList.toggle("is-landing", kind === "home");
      if (kind === "page") renderPage(id); else if (kind === "group") renderGroup(id); else if (kind === "docs") renderOverview(); else renderLanding();
      renderTabs(id);
      labels(document);
      highlight(app);
      observe();
      current = kind + ":" + id + ":" + lang;
      document.title = kind === "page" ? l.pages[id].title + " · nicebot" : kind === "group" ? l.groups[id] + " · nicebot" : kind === "docs" ? U("docs") + " · nicebot" : "nicebot — " + U("tagline");
    }
    closeNav();
    if (r.anchor) requestAnimationFrame(function () { scrollToId(r.anchor, same); });
    else if (!keep && !same) window.scrollTo(0, 0);
  }
  function closeNav() { document.body.classList.remove("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "false"); }
  function setLang(next) {
    lang = next;
    store("nb-lang", next);
    document.documentElement.lang = next;
    $("#lang").value = next;
    q.placeholder = U("search");
    renderFooter();
    current = null;
    route(true);
    if (!palette.hidden) search();
  }

  // ---------- search
  var active = 0, hits = [];
  function openSearch() { palette.hidden = false; q.value = ""; search(); setTimeout(function () { q.focus(); }, 0); document.body.style.overflow = "hidden"; }
  function closeSearch() { palette.hidden = true; document.body.style.overflow = ""; }
  function snippet(text, term) {
    var at = text.toLowerCase().indexOf(term);
    if (at < 0) return "";
    var s = Math.max(0, at - 50), raw = text.slice(s, at + term.length + 90), k = raw.toLowerCase().indexOf(term);
    return (s > 0 ? "…" : "") + e(raw.slice(0, k)) + "<mark>" + e(raw.slice(k, k + term.length)) + "</mark>" + e(raw.slice(k + term.length)) + "…";
  }
  function search() {
    var term = q.value.trim().toLowerCase(), l = L();
    hits = [];
    if (!term) {
      ["first-bot", "vscode", "conversations", "media-receive", "miniapp", "ref-ctx"].forEach(function (id) { hits.push({ href: "#" + id, g: l.groups[groupOf[id]], t: title(id), s: e(l.pages[id].desc), icon: "doc" }); });
    } else {
      order.forEach(function (id) {
        var p = l.pages[id], score = 0, t = p.title.toLowerCase();
        if (t.indexOf(term) === 0) score += 20; else if (t.indexOf(term) >= 0) score += 12;
        if (p.desc.toLowerCase().indexOf(term) >= 0) score += 5;
        if (p.text.toLowerCase().indexOf(term) >= 0) score += 2;
        if (score) hits.push({ score: score, href: "#" + id, g: l.groups[groupOf[id]], t: p.title, s: snippet(p.desc + " " + p.text, term) || e(p.desc), icon: "doc" });
        p.toc.forEach(function (h) { if (h[1].toLowerCase().indexOf(term) >= 0) hits.push({ score: 9, href: "#" + id + "/" + h[0], g: p.title, t: h[1], s: "", icon: "hash" }); });
      });
      hits.sort(function (a, b) { return b.score - a.score; });
      hits = hits.slice(0, 12);
    }
    active = 0;
    results.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<a href="' + h.href + '" role="option" data-i="' + i + '" class="' + (i === 0 ? "on" : "") + '">' + ico(h.icon) + '<div class="r"><small>' + e(h.g) + "</small><b>" + e(h.t) + "</b>" + (h.s ? '<span class="s">' + h.s + "</span>" : "") + "</div></a>";
    }).join("") : '<div class="empty">' + e(U("no_results")) + "</div>";
  }
  function moveActive(d) {
    var links = $$("a", results);
    if (!links.length) return;
    active = (active + d + links.length) % links.length;
    links.forEach(function (a, i) { a.classList.toggle("on", i === active); });
    links[active].scrollIntoView({ block: "nearest" });
  }
  q.addEventListener("input", search);
  q.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); moveActive(1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); moveActive(-1); }
    else if (ev.key === "Enter") { var a = $$("a", results)[active]; if (a) { ev.preventDefault(); closeSearch(); location.hash = a.getAttribute("href"); } }
  });
  results.addEventListener("mousemove", function (ev) {
    var a = ev.target.closest("a[data-i]");
    if (a && +a.dataset.i !== active) { active = +a.dataset.i; $$("a", results).forEach(function (x, i) { x.classList.toggle("on", i === active); }); }
  });
  palette.addEventListener("click", function (ev) { if (ev.target === palette) closeSearch(); else if (ev.target.closest("a")) closeSearch(); });
  $("#search-btn").addEventListener("click", openSearch);
  document.addEventListener("keydown", function (ev) {
    var tag = ((document.activeElement || {}).tagName || "").toLowerCase();
    if ((ev.key === "k" || ev.key === "K") && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); palette.hidden ? openSearch() : closeSearch(); }
    else if (ev.key === "/" && palette.hidden && tag !== "input" && tag !== "textarea" && tag !== "select") { ev.preventDefault(); openSearch(); }
    else if (ev.key === "Escape") { if (!palette.hidden) closeSearch(); else closeNav(); }
  });

  // ---------- clicks
  function copyText(btn, text, target) {
    var done = function () {
      var label = btn.querySelector("[data-t]");
      btn.classList.add("done");
      if (label) label.textContent = U("copied");
      setTimeout(function () { btn.classList.remove("done"); if (label) label.textContent = U("copy"); }, 1400);
    };
    var fallback = function () { var r = document.createRange(); r.selectNodeContents(target); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t.closest) return;
    var c = t.closest("[data-copy], [data-copy-text]");
    if (c) {
      var text = c.getAttribute("data-copy-text"), target = c.parentElement;
      if (text === null) { target = c.closest("figure").querySelector("pre"); text = target.innerText.replace(/\n$/, ""); }
      copyText(c, text, target);
      return;
    }
    var gt = t.closest(".grp-toggle");
    if (gt) {
      var grp = gt.closest(".grp"), open = !grp.classList.contains("open");
      grp.classList.toggle("open", open);
      gt.setAttribute("aria-expanded", String(open));
      openGroups[grp.getAttribute("data-grp")] = open;
      store("nb-open", JSON.stringify(openGroups));
      return;
    }
    var it = t.closest("[data-itab]");
    if (it) {
      installTab = +it.getAttribute("data-itab");
      $$(".install").forEach(function (box) {
        $$("[data-itab]", box).forEach(function (b) { b.setAttribute("aria-selected", String(+b.getAttribute("data-itab") === installTab)); });
        $("[data-icmd]", box).textContent = INSTALL[installTab];
        $("[data-copy-text]", box).setAttribute("data-copy-text", INSTALL[installTab]);
      });
      return;
    }
    var ct = t.closest("[data-ctab]");
    if (ct) {
      var n = ct.getAttribute("data-ctab"), box2 = ct.closest(".code-tabs");
      $$("[data-ctab]", box2).forEach(function (b) { b.setAttribute("aria-selected", String(b === ct)); });
      $$("[data-cpane]", box2).forEach(function (p) { p.hidden = p.getAttribute("data-cpane") !== n; });
      return;
    }
    var rp = t.closest("[data-replay]");
    if (rp) { var ch = rp.closest("[data-chat]"); ch.classList.add("anim"); play(ch); return; }
    var an = t.closest("[data-anchor]");
    if (an) {
      ev.preventDefault();
      history.replaceState(null, "", "#" + parse().id + "/" + an.getAttribute("data-anchor"));
      scrollToId(an.getAttribute("data-anchor"), true);
      try { navigator.clipboard.writeText(location.href); } catch (err) {}
      return;
    }
    var a = t.closest("a[href^='#']");
    if (a && a.getAttribute("href") === location.hash) { ev.preventDefault(); route(); return; }
    if (a && a.getAttribute("href") === "#") { ev.preventDefault(); history.pushState(null, "", location.pathname + location.search); route(); return; }
    if (t.closest("#scrim")) closeNav();
  });
  $("#menu-btn").addEventListener("click", function () { var open = document.body.classList.toggle("nav-open"); this.setAttribute("aria-expanded", String(open)); });
  $("#theme-btn").addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store("nb-theme", next);
  });
  $("#lang").addEventListener("change", function () { setLang(this.value); });
  window.addEventListener("hashchange", function () { route(); });
  window.addEventListener("popstate", function () { route(); });
  setLang(lang);
})();
</script>
