[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nicebot"
dynamic = ["version"]
description = "Telegram botlar uchun eng qulay Python kutubxonasi: kam kod, ichki ORM, tugmalar, suhbatlar, Mini App — hammasi bitta importda."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozodbek Sobirjonovich" }]
keywords = ["telegram", "bot", "telegram-bot", "bot-api", "async", "orm", "mini-app", "aiogram-alternative", "uzbek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "msgspec>=0.18",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]
mongo = ["motor>=3.3"]
redis = ["redis>=5.0"]
all = ["asyncpg>=0.29", "aiomysql>=0.2", "motor>=3.3", "redis>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mongomock-motor>=0.0.29", "typing-extensions>=4"]  # mongomock-motor imports it without declaring it (seen on 3.13)

[project.scripts]
nicebot = "nicebot.cli:main"

[project.urls]
Homepage = "https://ozodmeofficial.github.io/nicebot/"
Documentation = "https://ozodmeofficial.github.io/nicebot/"
Repository = "https://github.com/ozodmeofficial/nicebot"
Issues = "https://github.com/ozodmeofficial/nicebot/issues"
Changelog = "https://github.com/ozodmeofficial/nicebot/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/nicebot/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nicebot"]

[tool.hatch.build.targets.sdist]
include = ["src/nicebot", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
