<title>nicebot — Telegram botlar uchun Python kutubxonasi</title>

<style>
/* nicebot docs — clean, quiet reading surfaces (white / near-black, hairline borders) with one bright accent:
   the yellow "highlighter". Landing hero and final call-to-action are always dark stages. */
:root {
  --bg: #ffffff;
  --bg-soft: #f7f7f8;
  --bg-mute: #efeff1;
  --fg: #0d0d0d;
  --fg-2: #4a4a55;
  --fg-3: #6b6b78;
  --line: #e7e7ea;
  --line-2: #d6d6dc;
  --accent: #ffd60a;
  --accent-ink: #111111;
  --accent-text: #8a6100;
  --accent-soft: #fff7cf;
  --accent-line: #e9bb00;
  --code-bg: #0f0f10;
  --code-line: #232326;
  --code-fg: #e9e9ec;
  --code-dim: #8a8a93;
  --chat-bg: #e9edf2;
  --chat-bot: #ffffff;
  --chat-me: #ddf6c8;
  --chat-fg: #111111;
  --chat-dim: #6b7280;
  --chat-btn: rgba(17, 17, 17, 0.07);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -12px rgba(0, 0, 0, 0.16);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top-h: 60px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --bg-soft: #121214; --bg-mute: #1b1b1e; --fg: #ededef; --fg-2: #a9a9b3; --fg-3: #8a8a95;
    --line: #232327; --line-2: #313137; --accent-text: #ffd60a; --accent-soft: rgba(255, 214, 10, 0.1); --accent-line: #ffd60a;
    --code-bg: #111113; --code-line: #26262a;
    --chat-bg: #0e1621; --chat-bot: #182533; --chat-me: #2b5278; --chat-fg: #f1f5f9; --chat-dim: #8fa3b8; --chat-btn: rgba(255, 255, 255, 0.08);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px -16px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --bg-soft: #121214; --bg-mute: #1b1b1e; --fg: #ededef; --fg-2: #a9a9b3; --fg-3: #8a8a95;
  --line: #232327; --line-2: #313137; --accent-text: #ffd60a; --accent-soft: rgba(255, 214, 10, 0.1); --accent-line: #ffd60a;
  --code-bg: #111113; --code-line: #26262a;
  --chat-bg: #0e1621; --chat-bot: #182533; --chat-me: #2b5278; --chat-fg: #f1f5f9; --chat-dim: #8fa3b8; --chat-btn: rgba(255, 255, 255, 0.08);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px -16px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}
/* always-dark stage (landing hero, final CTA) */
.stage {
  --bg: #0a0a0b; --bg-soft: #141416; --bg-mute: #1c1c1f; --fg: #f4f4f5; --fg-2: #b4b4bd; --fg-3: #8d8d97;
  --line: #26262a; --line-2: #34343a; --accent-text: #ffd60a; --accent-soft: rgba(255, 214, 10, 0.12);
  --chat-bg: #0e1621; --chat-bot: #182533; --chat-me: #2b5278; --chat-fg: #f1f5f9; --chat-dim: #8fa3b8; --chat-btn: rgba(255, 255, 255, 0.08);
  background: var(--bg); color: var(--fg); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 24px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 16px/1.7 var(--sans); font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
a { color: inherit; }
button { font: inherit; color: inherit; }
svg { flex: none; }
:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.top-inner { height: 100%; max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding-left: var(--gut); padding-right: var(--gut-r); }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; margin-right: 14px; flex: none; }
.brand svg { width: 26px; height: 26px; }
.brand b { font: 650 18px/1 var(--sans); letter-spacing: -0.03em; }
.brand .ver { font: 500 11px/1 var(--mono); color: var(--fg-3); border: 1px solid var(--line); padding: 4px 7px; border-radius: 99px; }
.tabs { display: flex; gap: 2px; }
.tabs a {
  font: 500 14px/1 var(--sans); color: var(--fg-2); text-decoration: none; padding: 9px 12px; border-radius: 8px; white-space: nowrap;
  transition: color .15s, background-color .15s;
}
.tabs a:hover { color: var(--fg); background: var(--bg-soft); }
.tabs a[aria-current="true"] { color: var(--fg); }
.tabs a[aria-current="true"]::after { content: ""; display: block; height: 2px; background: var(--accent); border-radius: 2px; margin: 6px 0 -8px; }
.spacer { flex: 1; }
.search-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; width: 220px; padding: 0 8px 0 11px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg-soft); color: var(--fg-3); cursor: pointer; font-size: 14px; text-align: left;
  transition: border-color .15s;
}
.search-btn:hover { border-color: var(--line-2); color: var(--fg-2); }
.search-btn .label { flex: 1; }
kbd { font: 500 11px/1 var(--mono); color: var(--fg-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; background: var(--bg); }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 0; background: none;
  color: var(--fg-2); cursor: pointer; text-decoration: none; flex: none; transition: color .15s, background-color .15s;
}
.icon-btn:hover { color: var(--fg); background: var(--bg-soft); }
.menu-btn { display: none; }
.lang { position: relative; flex: none; }
.lang select {
  appearance: none; -webkit-appearance: none; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg);
  color: var(--fg); font: 600 12.5px/1 var(--sans); letter-spacing: 0.04em; padding: 0 26px 0 11px; cursor: pointer;
}
.lang svg { position: absolute; right: 8px; top: 12px; width: 12px; height: 12px; pointer-events: none; color: var(--fg-3); }
.theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: block; }
:root[data-theme="dark"] .theme-btn .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-btn .sun { display: block; }
  :root:not([data-theme="light"]) .theme-btn .moon { display: none; }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 99px;
  font: 600 15px/1 var(--sans); text-decoration: none; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  transition: background-color .15s, border-color .15s, color .15s, transform .15s;
}
.btn .ico { width: 16px; height: 16px; stroke-width: 2; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #ffe14d; transform: translateY(-1px); }
.btn.dark { background: var(--fg); color: var(--bg); }
.btn.dark:hover { opacity: .88; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--bg-soft); border-color: var(--fg-3); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; }

/* ---------- code ---------- */
figure.code { margin: 20px 0 24px; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-line); color: var(--code-fg); }
figure.code figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 40px; padding: 0 6px 0 14px; border-bottom: 1px solid var(--code-line); }
.code-lang { font: 500 12px/1 var(--mono); color: var(--code-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.copy {
  display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--sans); color: var(--code-dim); background: transparent;
  border: 0; border-radius: 7px; padding: 7px 9px; cursor: pointer; transition: color .15s, background-color .15s;
}
.copy svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.copy:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.copy.done { color: var(--accent); }
pre { margin: 0; padding: 16px 18px 18px; overflow-x: auto; font: 400 13.5px/1.7 var(--mono); font-variant-ligatures: none; tab-size: 4; scrollbar-width: thin; scrollbar-color: #3a3a40 transparent; }
pre code { font: inherit; background: none; padding: 0; color: inherit; }
.hljs-keyword, .hljs-literal, .hljs-selector-tag { color: #ffd60a; }
.hljs-string, .hljs-regexp, .hljs-template-string { color: #a3e3a0; }
.hljs-comment, .hljs-quote { color: #7c7c86; font-style: italic; }
.hljs-number { color: #ffab70; }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: #7fd4ff; }
.hljs-built_in, .hljs-type { color: #c6a8ff; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-params, .hljs-name, .hljs-tag, .hljs-symbol { color: #e9e9ec; }
.hljs-meta { color: #ff9ad5; }
.hljs-subst { color: var(--code-fg); }

/* ---------- chat preview ---------- */
.chat { background: var(--chat-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); color: var(--chat-fg); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; background: var(--chat-bot); border-bottom: 1px solid color-mix(in srgb, var(--chat-fg) 8%, transparent); }
.chat-ava { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 12px/1 var(--sans); }
.chat-who { flex: 1; display: grid; line-height: 1.25; }
.chat-who b { font-weight: 600; font-size: 14px; }
.chat-who small { color: var(--chat-dim); font-size: 12px; }
.chat-replay { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--chat-dim); cursor: pointer; display: grid; place-items: center; }
.chat-replay:hover { background: var(--chat-btn); color: var(--chat-fg); }
.chat-replay svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.chat-body { padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.msg { max-width: 86%; display: flex; flex-direction: column; gap: 4px; }
.chat .msg p { margin: 0; padding: 7px 11px 8px; border-radius: 14px; background: var(--chat-bot); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.06); overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; }
.msg.bot p { border-bottom-left-radius: 5px; }
.msg.me { align-self: flex-end; }
.msg.me p { background: var(--chat-me); border-bottom-right-radius: 5px; }
.msg + .msg.bot, .msg + .msg.me { margin-top: 2px; }
.edited { font-style: normal; font-size: 11px; color: var(--chat-dim); margin-left: 4px; }
.kb { display: grid; gap: 4px; }
.kb-row { display: flex; gap: 4px; }
.kb-row span {
  flex: 1; text-align: center; padding: 7px 8px; border-radius: 9px; background: color-mix(in srgb, var(--chat-bot) 55%, transparent);
  backdrop-filter: blur(4px); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 1px solid color-mix(in srgb, var(--chat-fg) 8%, transparent);
}
.tap { align-self: center; font-size: 12px; color: var(--chat-dim); padding: 2px 0; }
.tap span { background: var(--chat-btn); padding: 3px 10px; border-radius: 99px; }
.chat.anim .chat-body > * { opacity: 0; }
.chat.play .chat-body > * { animation: msg-in .4s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 0.6s + 0.15s); }
@keyframes msg-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

.demo { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; margin: 20px 0 28px; align-items: stretch; }
.demo pre { font-size: 12.8px; }
.demo.stack { grid-template-columns: minmax(0, 1fr); }
.demo.stack .demo-chat .chat { max-width: 420px; }
.demo figure.code { margin: 0; height: 100%; }
.demo-chat { display: flex; flex-direction: column; gap: 8px; }
.demo-chat .chat { flex: 1; }
.demo-label { display: flex; align-items: center; gap: 8px; font: 600 11.5px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); padding: 4px 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px color-mix(in srgb, #22c55e 20%, transparent); }

/* ---------- landing ---------- */
.landing { overflow: hidden; }
.hero { position: relative; isolation: isolate; padding: 76px 0 56px; border-bottom: 1px solid var(--line); }
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 56px 56px; background-position: center top;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, #000 30%, transparent 75%);
  opacity: .55;
}
.hero::after {
  content: ""; position: absolute; z-index: -1; left: 50%; top: -220px; width: 900px; height: 600px; transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 214, 10, 0.2), transparent 70%);
}
.hero-copy { text-align: center; max-width: 860px; margin: 0 auto; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 99px; border: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--bg-soft) 80%, transparent); color: var(--fg-2); font-size: 13.5px; text-decoration: none; margin-bottom: 26px;
  transition: border-color .15s, color .15s;
}
.pill:hover { border-color: var(--fg-3); color: var(--fg); }
.pill { max-width: 100%; }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill b { background: var(--accent); color: var(--accent-ink); font: 700 11px/1 var(--mono); padding: 4px 7px; border-radius: 99px; }
.pill .ico { width: 14px; height: 14px; }
.hero h1 { margin: 0 0 22px; font: 650 clamp(42px, 7vw, 84px)/1 var(--sans); letter-spacing: -0.045em; text-wrap: balance; }
.hl { position: relative; white-space: nowrap; color: var(--accent); }
.hero .lead { margin: 0 auto 34px; max-width: 640px; font-size: clamp(17px, 1.9vw, 19.5px); line-height: 1.6; color: var(--fg-2); text-wrap: pretty; }
.install { max-width: 520px; margin: 0 auto 22px; border: 1px solid var(--line-2); border-radius: 14px; background: var(--bg-soft); text-align: left; overflow: hidden; }
.install-tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
.install-tabs button {
  border: 0; background: none; padding: 8px 12px 10px; font: 500 13px/1 var(--sans); color: var(--fg-3); cursor: pointer; border-radius: 8px 8px 0 0; position: relative;
}
.install-tabs button:hover { color: var(--fg); }
.install-tabs button[aria-selected="true"] { color: var(--fg); }
.install-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.install-cmd { display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px; font: 500 14.5px/1.4 var(--mono); }
.install-cmd .p { color: var(--accent); user-select: none; }
.install-cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.install-cmd .copy { color: var(--fg-3); }
.install-cmd .copy:hover { color: var(--fg); background: var(--bg-mute); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.window { margin: 56px auto 0; max-width: 1040px; border: 1px solid var(--line-2); border-radius: 18px; background: var(--bg-soft); box-shadow: 0 40px 120px -40px rgba(255, 214, 10, 0.18), 0 24px 60px -30px rgba(0, 0, 0, 0.8); overflow: hidden; }
.window-bar { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.window-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--line-2); }
.window-bar span { margin-left: 10px; font: 500 12.5px/1 var(--mono); color: var(--fg-3); }
.window-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.window-body figure.code { margin: 0; border: 0; border-radius: 0; background: transparent; }
.window-body figure.code figcaption { display: none; }
.window-body pre { padding: 22px 24px; font-size: 14px; line-height: 1.8; }
.window-body .chat { border: 0; border-left: 1px solid var(--line); border-radius: 0; min-height: 100%; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 1040px; margin: 44px auto 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stats div { padding: 20px 22px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font: 650 clamp(30px, 3.6vw, 40px)/1 var(--sans); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stats span { display: block; margin-top: 8px; color: var(--fg-3); font-size: 14px; line-height: 1.35; }

.section { padding: 96px 0; border-bottom: 1px solid var(--line); }
.section-head { max-width: 680px; margin-bottom: 44px; }
.section-head.center { text-align: center; margin-left: auto; margin-right: auto; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font: 600 12.5px/1 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 16px; }
.kicker::before { content: ""; width: 14px; height: 2px; background: var(--accent); border-radius: 2px; }
.section h2 { margin: 0 0 14px; font: 650 clamp(30px, 4vw, 46px)/1.08 var(--sans); letter-spacing: -0.035em; text-wrap: balance; }
.section .sub { margin: 0; color: var(--fg-2); font-size: 17.5px; line-height: 1.6; text-wrap: pretty; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: step; }
.step { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
.step-n { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 14px/1 var(--mono); margin-bottom: 18px; }
.step h3 { margin: 0 0 6px; font: 600 19px/1.3 var(--sans); letter-spacing: -0.02em; }
.step p { margin: 0 0 18px; color: var(--fg-2); font-size: 15px; line-height: 1.55; }
.steps { align-items: start; }
.step figure.code, .step .chat { margin: 0; }
.step .term { display: grid; gap: 10px; }
.step pre { font-size: 12.5px; padding: 12px 14px; }
.step .term pre { padding: 14px; }

.compare-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 56px; align-items: center; }
.bars { display: grid; gap: 22px; margin-top: 30px; }
.bar-row { display: grid; gap: 8px; }
.bar-label { display: flex; justify-content: space-between; font-size: 14.5px; }
.bar-label b { font-weight: 600; }
.bar-label span { font: 500 13.5px/1.5 var(--mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.bar { height: 14px; border-radius: 99px; background: var(--bg-mute); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--fg-3); width: var(--w); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
.bar.win i { background: var(--accent); }
.bars:not(.seen) .bar i { width: 0; }
.less { margin-top: 26px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--fg); font-weight: 600; font-size: 15px; }
.less svg { color: var(--accent-text); }
.code-tabs { border: 1px solid var(--code-line); border-radius: 14px; overflow: hidden; background: var(--code-bg); }
.code-tabs-bar { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--code-line); }
.code-tabs-bar button { border: 0; background: none; color: var(--code-dim); padding: 9px 12px 11px; font: 500 13px/1 var(--mono); cursor: pointer; position: relative; }
.code-tabs-bar button:hover { color: #fff; }
.code-tabs-bar button[aria-selected="true"] { color: #fff; }
.code-tabs-bar button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.code-tabs figure.code { margin: 0; border: 0; border-radius: 0; }
.code-tabs figure.code figcaption { position: absolute; right: 6px; top: 6px; border: 0; height: auto; padding: 0; }
.code-tabs figure.code figcaption .code-lang { display: none; }
.code-tabs .pane { position: relative; }
.code-tabs .pane[hidden] { display: none; }
.code-tabs pre { max-height: 440px; font-size: 13px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--bg); text-decoration: none; min-width: 0; transition: border-color .15s, box-shadow .15s, transform .15s;
}
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-2px); }
.card-ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent-line) 30%, transparent); }
.card-ico .ico { width: 20px; height: 20px; }
.card h3 { margin: 6px 0 0; font: 600 18px/1.3 var(--sans); letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
.card h3 .arrow { color: var(--fg-3); transition: transform .15s, color .15s; }
.card:hover h3 .arrow { transform: translateX(3px); color: var(--fg); }
.card p { margin: 0; color: var(--fg-2); font-size: 15px; line-height: 1.55; }
.card .snip { margin-top: auto; padding-top: 8px; }
.card .snip code { display: block; font: 500 12.5px/1.5 var(--mono); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
.more-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 26px; font-weight: 600; font-size: 15px; text-decoration: underline; text-decoration-color: var(--accent-line); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.more-link:hover { text-decoration-color: var(--fg); }

.paths { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.path { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--bg); }
.path-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.path-n { font: 600 12px/1 var(--mono); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent-line) 45%, transparent); background: var(--accent-soft); padding: 5px 8px; border-radius: 99px; }
.path h3 { margin: 0; font: 600 18px/1.3 var(--sans); letter-spacing: -0.02em; }
.path > p { margin: 0 0 16px; color: var(--fg-2); font-size: 15px; line-height: 1.55; }
.path ol { list-style: none; margin: 0; padding: 0; counter-reset: p; border-top: 1px solid var(--line); }
.path li { counter-increment: p; border-bottom: 1px solid var(--line); }
.path li:last-child { border-bottom: 0; }
.path li a { display: flex; align-items: center; gap: 12px; padding: 11px 2px; text-decoration: none; font-size: 15px; font-weight: 500; }
.path li a::before { content: counter(p, decimal-leading-zero); font: 500 12px/1 var(--mono); color: var(--fg-3); }
.path li a .ico { margin-left: auto; width: 15px; height: 15px; color: var(--fg-3); transition: transform .15s; }
.path li a:hover .ico { transform: translateX(3px); color: var(--fg); }

.faq-grid { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 56px; align-items: start; }
.faq details { border-bottom: 1px solid var(--line); }
.faq details:first-child { border-top: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 2px; font: 600 17px/1.4 var(--sans); letter-spacing: -0.01em; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; flex: none; transition: transform .2s, background-color .15s; }
.faq summary .plus .ico { width: 14px; height: 14px; stroke-width: 2; }
.faq details[open] summary .plus { transform: rotate(45deg); background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.faq details p { margin: -4px 0 22px; color: var(--fg-2); font-size: 16px; line-height: 1.7; max-width: 62ch; }

.final { position: relative; isolation: isolate; padding: 96px 0; text-align: center; overflow: hidden; }
.final::before { content: ""; position: absolute; z-index: -1; left: 50%; bottom: -300px; width: 1000px; height: 600px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255, 214, 10, 0.22), transparent 70%); }
.final h2 { margin: 0 0 14px; font: 650 clamp(32px, 4.6vw, 54px)/1.05 var(--sans); letter-spacing: -0.04em; text-wrap: balance; }
.final p { margin: 0 auto 32px; color: var(--fg-2); font-size: 18px; max-width: 520px; }
.final .install { margin-bottom: 22px; }

/* ---------- docs shell ---------- */
.shell { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 264px minmax(0, 1fr) 232px; padding-left: var(--gut); padding-right: var(--gut-r); }
.shell.no-toc { grid-template-columns: 264px minmax(0, 1fr); }
.shell.no-toc .toc { display: none; }
.side {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 24px 20px 48px 0; border-right: 1px solid var(--line);
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; overscroll-behavior: contain;
}
.side-tabs { display: none; }
.side .grp { margin-top: 22px; }
.side .grp:first-of-type { margin-top: 10px; }
.side .grp-title { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 2px; font: 600 13px/1.3 var(--sans); color: var(--fg); text-decoration: none; border-radius: 8px; }
.side .grp-title .ico { width: 15px; height: 15px; color: var(--fg-3); }
.side .grp-title:hover { background: var(--bg-soft); }
.side .grp-title[aria-current="page"] { background: var(--bg-mute); }
.side a.item { position: relative; display: block; padding: 6px 10px 6px 33px; border-radius: 8px; color: var(--fg-2); text-decoration: none; font-size: 14.5px; line-height: 1.4; transition: color .12s, background-color .12s; }
.side a.item:hover { color: var(--fg); background: var(--bg-soft); }
.side a.item[aria-current="page"] { color: var(--fg); background: var(--bg-mute); font-weight: 500; }
.side a.item[aria-current="page"]::before { content: ""; position: absolute; left: 17px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
.side .overview { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-weight: 500; font-size: 14.5px; }
.side .overview .ico { width: 15px; height: 15px; color: var(--fg-3); }
.side .overview:hover { background: var(--bg-soft); }
.side .overview[aria-current="page"] { background: var(--bg-mute); }

main.docs { min-width: 0; padding: 40px 0 96px 56px; }
.doc { max-width: 760px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--fg-3); margin-bottom: 16px; }
.crumb a { text-decoration: none; color: var(--fg-3); }
.crumb a:hover { color: var(--fg); }
.crumb .ico { width: 13px; height: 13px; }
.crumb span:last-child { color: var(--fg); font-weight: 500; }
.doc h1 { font: 650 clamp(32px, 4.4vw, 42px)/1.12 var(--sans); letter-spacing: -0.035em; margin: 0 0 14px; text-wrap: balance; }
.doc .lede { font-size: 19px; line-height: 1.6; color: var(--fg-2); margin: 0 0 20px; text-wrap: pretty; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-bottom: 26px; margin-bottom: 32px; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--fg-3); }
.meta span, .meta a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.meta a:hover { color: var(--fg); }
.meta .ico { width: 15px; height: 15px; }
.prose h2 { position: relative; font: 650 26px/1.25 var(--sans); letter-spacing: -0.025em; margin: 52px 0 14px; text-wrap: balance; }
.prose h3 { position: relative; font: 600 19px/1.35 var(--sans); letter-spacing: -0.015em; margin: 34px 0 10px; }
.prose > :first-child { margin-top: 0; }
.anchor { margin-left: 10px; color: var(--fg-3); text-decoration: none; font-weight: 400; opacity: 0; transition: opacity .15s; }
.prose h2:hover .anchor, .prose h3:hover .anchor { opacity: 1; }
.anchor:hover { color: var(--accent-text); }
.prose p { margin: 0 0 18px; }
.prose ul, .prose ol { padding-left: 22px; margin: 0 0 20px; }
.prose li { margin: 7px 0; padding-left: 4px; }
.prose li::marker { color: var(--fg-3); }
.prose strong { font-weight: 600; }
.prose a { font-weight: 500; text-decoration: underline; text-decoration-color: var(--accent-line); text-decoration-thickness: 1.5px; text-underline-offset: 4px; transition: text-decoration-color .15s; }
.prose a:hover { text-decoration-color: var(--fg); }
.prose :not(pre) > code, .flist code {
  font: 500 0.86em/1 var(--mono); font-variant-ligatures: none; background: var(--bg-mute); color: var(--fg);
  padding: 0.2em 0.42em; border-radius: 6px; border: 1px solid var(--line); overflow-wrap: anywhere;
}
.note { display: flex; gap: 12px; margin: 24px 0; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent-line) 35%, transparent); }
.note svg { width: 20px; height: 20px; margin-top: 2px; fill: none; stroke: var(--accent-text); stroke-width: 1.8; stroke-linecap: round; }
.note p { margin: 0; font-size: 15.5px; line-height: 1.65; }
.table { overflow-x: auto; margin: 20px 0 28px; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.5; }
th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 600 13px/1.3 var(--sans); color: var(--fg-2); background: var(--bg-soft); }
td:first-child { white-space: nowrap; }
tbody tr:hover td { background: color-mix(in srgb, var(--bg-soft) 60%, transparent); }

.toc { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start; padding: 44px 0 40px 32px; max-height: calc(100vh - var(--top-h)); overflow-y: auto; scrollbar-width: none; }
.toc h4 { margin: 0 0 12px; font: 600 13px/1 var(--sans); color: var(--fg); }
.toc a { display: block; padding: 5px 0 5px 14px; border-left: 2px solid var(--line); color: var(--fg-3); text-decoration: none; font-size: 13.5px; line-height: 1.4; transition: color .12s, border-color .12s; }
.toc a:hover { color: var(--fg); }
.toc a.on { color: var(--fg); border-left-color: var(--accent); font-weight: 500; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 64px; padding-top: 28px; border-top: 1px solid var(--line); max-width: 760px; }
.pager a { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; transition: border-color .15s, background-color .15s; }
.pager a:hover { border-color: var(--line-2); background: var(--bg-soft); }
.pager small { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-3); }
.pager small .ico { width: 14px; height: 14px; }
.pager span { font: 600 16px/1.35 var(--sans); letter-spacing: -0.01em; }
.pager .next { text-align: right; grid-column: 2; align-items: flex-end; }

/* docs overview + section landing */
.over-hero { padding-bottom: 32px; margin-bottom: 36px; border-bottom: 1px solid var(--line); max-width: 760px; }
.over-hero h1 { font: 650 clamp(34px, 5vw, 48px)/1.08 var(--sans); letter-spacing: -0.04em; margin: 0 0 14px; }
.over-hero p { margin: 0; color: var(--fg-2); font-size: 19px; line-height: 1.6; }
.over-hero .btn { margin-top: 24px; }
.over-title { font: 600 13px/1 var(--sans); color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 16px; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 48px; }
.quick .card { padding: 18px; }
.quick .card h3 { font-size: 16.5px; margin: 0; }
.quick .card p { font-size: 14.5px; }
.quick .num { font: 600 12px/1 var(--mono); color: var(--accent-text); }
.secs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.sec { border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.sec-head .card-ico { width: 36px; height: 36px; }
.sec-head h3 { margin: 0; font: 600 17px/1.3 var(--sans); letter-spacing: -0.015em; }
.sec-head small { display: block; font-size: 13px; color: var(--fg-3); font-weight: 400; }
.sec-head:hover h3 { text-decoration: underline; text-decoration-color: var(--accent-line); text-underline-offset: 4px; }
.sec > p { margin: 0; color: var(--fg-2); font-size: 14.5px; line-height: 1.55; }
.sec ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.sec ul a { display: inline-block; padding: 5px 10px; border-radius: 99px; background: var(--bg-soft); border: 1px solid var(--line); font-size: 13.5px; text-decoration: none; color: var(--fg-2); transition: color .12s, border-color .12s; }
.sec ul a:hover { color: var(--fg); border-color: var(--line-2); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 760px; counter-reset: pl; }
.plist a { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 18px 18px 18px 14px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; transition: border-color .15s, background-color .15s, transform .15s; }
.plist a:hover { border-color: var(--line-2); background: var(--bg-soft); transform: translateX(2px); }
.plist .n { grid-row: span 2; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font: 600 13px/1 var(--mono); background: var(--bg-mute); color: var(--fg-2); justify-self: center; }
.plist li:first-child .n { background: var(--accent); color: var(--accent-ink); }
.plist b { font: 600 16.5px/1.3 var(--sans); letter-spacing: -0.01em; }
.plist small { grid-column: 2; font-size: 14.5px; color: var(--fg-2); line-height: 1.5; }
.plist .ico { grid-row: 1 / span 2; grid-column: 3; color: var(--fg-3); }
.plist time { font-size: 12.5px; color: var(--fg-3); font-weight: 400; margin-left: 8px; white-space: nowrap; }

/* features page */
.fgroup h2 { display: flex; align-items: baseline; gap: 10px; }
.fcount { font: 500 13px/1 var(--mono); color: var(--fg-3); background: var(--bg-mute); padding: 4px 8px; border-radius: 99px; }
.flist { list-style: none; padding: 0; margin: 0 0 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.flist li { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; margin: 0; }
.flist code { font-size: 0.84em; }
.flist p { margin: 6px 0 0; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
.fnum { font: 500 12px/1.9 var(--mono); color: var(--accent-text); font-variant-numeric: tabular-nums; flex: none; width: 20px; }

/* ---------- search palette ---------- */
.palette { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center; align-items: start; padding: max(10vh, 16px) 16px 16px; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(2px); }
.palette[hidden] { display: none; }
.palette-box { width: min(640px, 100%); max-height: min(560px, 80vh); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.45); overflow: hidden; }
.palette-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.palette-in .ico { color: var(--fg-3); }
.palette-in input { flex: 1; min-width: 0; height: 56px; border: 0; outline: 0; background: none; color: var(--fg); font: 400 17px var(--sans); }
.palette-in input::placeholder { color: var(--fg-3); }
.palette-list { overflow-y: auto; padding: 8px; flex: 1; }
.palette-list a { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; text-decoration: none; }
.palette-list a .ico { margin-top: 3px; color: var(--fg-3); }
.palette-list a.on { background: var(--bg-mute); }
.palette-list a.on .ico { color: var(--accent-text); }
.palette-list .r { min-width: 0; flex: 1; }
.palette-list small { display: block; font-size: 12px; color: var(--fg-3); line-height: 1.3; }
.palette-list b { display: block; font-weight: 600; font-size: 15px; line-height: 1.4; }
.palette-list span.s { display: block; color: var(--fg-2); font-size: 13.5px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.palette-list mark { background: var(--accent-soft); color: var(--fg); border-radius: 3px; padding: 0 1px; box-shadow: inset 0 -2px 0 var(--accent-line); }
.palette-list .empty { padding: 28px 12px; text-align: center; color: var(--fg-3); }
.palette-foot { display: flex; gap: 16px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-3); background: var(--bg-soft); }
.palette-foot span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- footer ---------- */
footer.foot { border-top: 1px solid var(--line); background: var(--bg); }
.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; padding-top: 48px; padding-bottom: 32px; }
.foot-brand p { margin: 12px 0 0; color: var(--fg-3); font-size: 14px; max-width: 34ch; line-height: 1.6; }
.foot h5 { margin: 0 0 12px; font: 600 13px/1 var(--sans); }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot ul a { color: var(--fg-3); text-decoration: none; font-size: 14px; }
.foot ul a:hover { color: var(--fg); }
.foot-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding-top: 18px; padding-bottom: 28px; border-top: 1px solid var(--line); font-size: 13px; color: var(--fg-3); }
.foot-bottom code { font-family: var(--mono); font-size: 12.5px; }

.scrim { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) { .shell { grid-template-columns: 248px minmax(0, 1fr); } .toc { display: none; } main.docs { padding-left: 44px; } }
@media (max-width: 1000px) {
  .window-body { grid-template-columns: minmax(0, 1fr); }
  .window-body .chat { border-left: 0; border-top: 1px solid var(--line); }
  .window-body .chat-body { max-width: 420px; width: 100%; margin: 0 auto; }
  .compare-grid, .faq-grid { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .cards, .steps, .paths { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .demo { grid-template-columns: minmax(0, 1fr); }
  .demo-chat .chat { max-width: 420px; }
}
@media (max-width: 860px) {
  .tabs, .brand .ver { display: none; }
  .menu-btn { display: inline-grid; }
  .is-landing .menu-btn { display: none; }
  .search-btn { width: 36px; padding: 0; justify-content: center; border-color: transparent; background: none; }
  .search-btn .label, .search-btn kbd { display: none; }
  .shell, .shell.no-toc { grid-template-columns: minmax(0, 1fr); }
  .side {
