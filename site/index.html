2\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Bir vaqtda minglab foydalanuvchi bilan suhbat qilish mumkin. Har biri o'z handlerida kutadi va bir-biriga xalaqit bermaydi.<\/p><\/aside>", "toc": [["ask", "ask"], ["confirm", "confirm"], ["choose", "choose"], ["form-bir-nechta-savol-ketma-ket", "form: bir nechta savol ketma-ket"]], "text": "nicebot'ning eng katta qulayligi shu. Savol berasiz va javobni o'sha funksiya ichida kutasiz. ask bot.py Foydalanuvchi /cancel yozsa yoki \"🚫 Bekor qilish\" tugmasini bossa, suhbat jimgina tugaydi 10 daqiqa javob bo'lmasa, \"⌛️ Javob kutish vaqti tugadi\" chiqadi. Buni timeout=\"5m\" bilan o'zgartirish mumkin Noto'g'ri qiymat kiritilsa, tushunarli xato ko'rsatiladi va savol qayta so'raladi. Urinishlar soni retries= bilan beriladi confirm bot.py choose Python form: bir nechta savol ketma-ket Python form natijasi dict bo'ladi, lekin maydonlarga nuqta orqali ham murojaat qilish mumkin: data.name . Bir vaqtda minglab foydalanuvchi bilan suhbat qilish mumkin. Har biri o'z handlerida kutadi va bir-biriga xalaqit bermaydi.", "min": 1}, "validators": {"title": "Validatorlar", "desc": "Telefon, email, sana, son va boshqa javoblarni tekshirish.", "html": "<p>Validator foydalanuvchi javobini tekshiradi va toza qiymatga aylantiradi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Text, Integer, Number, Phone, Email, Url, Date, Choice, Regex, Photo, File, Location\n\nawait ctx.ask(\"Izoh?\", Text(min=10, max=500))\nawait ctx.ask(\"Summa?\", Number(min=1000))\nawait ctx.ask(\"Rasm yuboring\", Photo)              # -&gt; PhotoSize (file_id bor)\nawait ctx.ask(\"Pasport seriyasi?\", Regex(r\"[A-Z]{2}\\d{7}\"))\nawait ctx.ask(\"Kod?\", lambda t: t.upper())         # o'z funksiyangiz<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Validator<\/th><th>Qaytaradi<\/th><th>Qo'shimcha<\/th><\/tr><\/thead><tbody><tr><td><code>Text(min=, max=)<\/code><\/td><td><code>str<\/code><\/td><td>Uzunlik chegarasi<\/td><\/tr><tr><td><code>Integer(min=, max=)<\/code> / <code>int<\/code><\/td><td><code>int<\/code><\/td><td><code>1 000 000<\/code> kabi bo'shliqlarni tushunadi<\/td><\/tr><tr><td><code>Number<\/code> / <code>float<\/code><\/td><td><code>float<\/code><\/td><td>Vergulni ham qabul qiladi: <code>12,5<\/code><\/td><\/tr><tr><td><code>Phone<\/code><\/td><td><code>\"+998901234567\"<\/code><\/td><td>Kontakt tugmasi. O'zbek operator kodlarini tekshiradi<\/td><\/tr><tr><td><code>Email<\/code><\/td><td><code>str<\/code><\/td><td>Kichik harfga o'tkazadi<\/td><\/tr><tr><td><code>Url<\/code><\/td><td><code>str<\/code><\/td><td><code>https://<\/code> bilan boshlanishi kerak<\/td><\/tr><tr><td><code>Date(format=)<\/code><\/td><td><code>date<\/code><\/td><td>Standart format: <code>KK.OO.YYYY<\/code><\/td><\/tr><tr><td><code>Choice(choices=)<\/code><\/td><td><code>str<\/code><\/td><td>Variantlarni tugma qilib ko'rsatadi<\/td><\/tr><tr><td><code>Regex(pattern)<\/code><\/td><td><code>str<\/code><\/td><td><\/td><\/tr><tr><td><code>Photo<\/code> / <code>File<\/code><\/td><td>media obyekti<\/td><td><code>.file_id<\/code> bor<\/td><\/tr><tr><td><code>Location<\/code><\/td><td><code>Location<\/code><\/td><td>Joylashuv tugmasi<\/td><\/tr><\/tbody><\/table><\/div><p>Telefon raqami har qanday ko'rinishda kiritilishi mumkin: <code>90 123 45 67<\/code>, <code>+998 (90) 123-45-67<\/code> yoki <code>8 90 1234567<\/code>. Natija har doim <code>+998901234567<\/code> bo'ladi.<\/p>", "toc": [], "text": "Validator foydalanuvchi javobini tekshiradi va toza qiymatga aylantiradi. Python Validator Qaytaradi Qo'shimcha Text(min=, max=) str Uzunlik chegarasi Integer(min=, max=) / int int 1 000 000 kabi bo'shliqlarni tushunadi Number / float float Vergulni ham qabul qiladi: 12,5 Phone \"+998901234567\" Kontakt tugmasi. O'zbek operator kodlarini tekshiradi Email str Kichik harfga o'tkazadi Url str https:// bilan boshlanishi kerak Date(format=) date Standart format: KK.OO.YYYY Choice(choices=) str Variantlarni tugma qilib ko'rsatadi Regex(pattern) str Photo / File media obyekti .file_id bor Location Location Joylashuv tugmasi Telefon raqami har qanday ko'rinishda kiritilishi mumkin: 90 123 45 67 , +998 (90) 123-45-67 yoki 8 90 1234567 . Natija har doim +998901234567 bo'ladi.", "min": 1}, "state": {"title": "Holat (state)", "desc": "Bir necha kun davom etadigan jarayonlar uchun bazada saqlanadigan holat.", "html": "<p>Ko'p hollarda <code>ctx.ask()<\/code> yetarli. Ammo foydalanuvchi bot bilan uzoq vaqt, masalan bir necha kun davomida bir qadamda tursa, holatdan foydalaning. Holat bazada saqlanadi va restartdan keyin ham yo'qolmaydi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"feedback\")\nasync def feedback(ctx):\n    await ctx.set_state(\"feedback\", step=1)\n    await ctx.reply(\"Fikringizni yozing:\")\n\n@bot.text(state=\"feedback\")\nasync def got_feedback(ctx, text):\n    data = await ctx.state_data()      # {\"step\": 1}\n    await ctx.clear_state()\n    await ctx.reply(\"Rahmat!\")<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Metod<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>await ctx.set_state(\"nom\", **data)<\/code><\/td><td>Holatni o'rnatish<\/td><\/tr><tr><td><code>await ctx.get_state()<\/code><\/td><td>Joriy holat yoki <code>None<\/code><\/td><\/tr><tr><td><code>await ctx.state_data()<\/code><\/td><td>Saqlangan ma'lumotlar<\/td><\/tr><tr><td><code>await ctx.update_data(**data)<\/code><\/td><td>Ma'lumot qo'shish<\/td><\/tr><tr><td><code>await ctx.clear_state()<\/code><\/td><td>Tozalash<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [], "text": "Ko'p hollarda ctx.ask() yetarli. Ammo foydalanuvchi bot bilan uzoq vaqt, masalan bir necha kun davomida bir qadamda tursa, holatdan foydalaning. Holat bazada saqlanadi va restartdan keyin ham yo'qolmaydi. Python Metod Ma'nosi await ctx.set_state(\"nom\", **data) Holatni o'rnatish await ctx.get_state() Joriy holat yoki None await ctx.state_data() Saqlangan ma'lumotlar await ctx.update_data(**data) Ma'lumot qo'shish await ctx.clear_state() Tozalash", "min": 1}, "menus": {"title": "Menyu va sahifalash", "desc": "Ko'p darajali menyu va uzun ro'yxatlarni sahifalash.", "html": "<h2 id=\"kop-darajali-menyu\">Ko'p darajali menyu<a class=\"anchor\" href=\"#\" data-anchor=\"kop-darajali-menyu\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Menyuni lug'at ko'rinishida yozasiz. Navigatsiya va \"⬅️ Orqaga\" tugmasi avtomatik ishlaydi, xabar esa yangisi yuborilmasdan joyida tahrirlanadi.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Menu\n\nmain = Menu(\"🏠 Bosh menyu\", {\n    \"🛍 Do'kon\": Menu(\"Bo'limni tanlang\", {\n        \"👕 Kiyim\": \"Kiyimlar tez orada qo'shiladi\",\n        \"📚 Kitoblar\": show_books,        # funksiya chaqiriladi\n    }),\n    \"📞 Aloqa\": \"+998 90 123 45 67\",\n    \"🌐 Sayt\": \"https://tezbaraka.uz\",\n})\n\n@bot.command(\"menu\")\nasync def menu(ctx):\n    await ctx.menu(main)    # \"⬅️ Orqaga\" o'zi qo'shiladi<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/menu<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>🏠 Bosh menyu<\/p><div class=\"kb\"><div class=\"kb-row\"><span>🛍 Do'kon<\/span><span>📞 Aloqa<\/span><span>🌐 Sayt ↗<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 🛍 Do'kon<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Bo'limni tanlang <i class=\"edited\" data-t=\"edited\"><\/i><\/p><div class=\"kb\"><div class=\"kb-row\"><span>👕 Kiyim<\/span><span>📚 Kitoblar<\/span><\/div><div class=\"kb-row\"><span>⬅️ Orqaga<\/span><\/div><\/div><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>Qiymat turlari: matn (ko'rsatiladi), <code>Menu<\/code> yoki <code>dict<\/code> (ichki menyu), funksiya (chaqiriladi), URL (havola tugmasi) yoki <code>Button<\/code>.<\/p><h2 id=\"sahifalash\">Sahifalash<a class=\"anchor\" href=\"#\" data-anchor=\"sahifalash\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Uzun ro'yxatni ◀️ 2/5 ▶️ tugmalari bilan sahifalarga bo'ladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">products = await Product.all().order_by(\"title\")\nawait ctx.paginate(\n    products,\n    per_page=10,\n    title=\"📦 Mahsulotlar\",\n    render=lambda p, i: f\"{i + 1}. {p.title} — {p.price} so'm\",\n)\n# tugmalarni ham sahifalash mumkin:\nawait ctx.paginate([Button(p.title, on_click=open_product, id=p.id) for p in products], columns=2)<\/code><\/pre><\/figure>", "toc": [["kop-darajali-menyu", "Ko'p darajali menyu"], ["sahifalash", "Sahifalash"]], "text": "Ko'p darajali menyu Menyuni lug'at ko'rinishida yozasiz. Navigatsiya va \"⬅️ Orqaga\" tugmasi avtomatik ishlaydi, xabar esa yangisi yuborilmasdan joyida tahrirlanadi. bot.py Qiymat turlari: matn (ko'rsatiladi), Menu yoki dict (ichki menyu), funksiya (chaqiriladi), URL (havola tugmasi) yoki Button . Sahifalash Uzun ro'yxatni ◀️ 2/5 ▶️ tugmalari bilan sahifalarga bo'ladi. Python", "min": 1}, "database": {"title": "Baza (ORM)", "desc": "SQLite, PostgreSQL, MySQL va MongoDB uchun bitta ORM.", "html": "<p>nicebot'da o'z ORM'i bor. Bitta kod SQLite, PostgreSQL, MySQL/MariaDB va MongoDB'da bir xil ishlaydi. To'rttalasi ham avtomatik testlar bilan tekshirilgan.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Nicebot(db=\"sqlite:///bot.db\")\nNicebot(db=\"postgres://user:pass@localhost:5432/mybot\")\nNicebot(db=\"mysql://user:pass@localhost:3306/mybot\")\nNicebot(db=\"mongodb://localhost:27017/mybot\")<\/code><\/pre><\/figure><h2 id=\"model\">Model<a class=\"anchor\" href=\"#\" data-anchor=\"model\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Model, fields\n\nclass Product(Model):\n    title = fields.Str(120)\n    price = fields.Int(default=0)\n    active = fields.Bool(default=True)\n    tags = fields.JSON(default=list)\n    created = fields.DateTime(auto_now_add=True)\n\nclass Order(Model):\n    user = fields.ForeignKey(\"User\")\n    product = fields.ForeignKey(Product)\n    qty = fields.Int(default=1)<\/code><\/pre><\/figure><p>Maydonlar: <code>Int<\/code>, <code>BigInt<\/code>, <code>Float<\/code>, <code>Str(max_length)<\/code>, <code>Text<\/code>, <code>Bool<\/code>, <code>DateTime(auto_now_add=, auto_now=)<\/code>, <code>Date<\/code>, <code>JSON<\/code> va <code>ForeignKey<\/code>. Umumiy parametrlar: <code>default=<\/code>, <code>null=<\/code>, <code>unique=<\/code>, <code>index=<\/code> va <code>choices=<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p><strong>Avto-migratsiya:<\/strong> bot ishga tushganda jadvallar yaratiladi. Modelga yangi maydon qo'shsangiz, ustun ham o'zi qo'shiladi. Ma'lumotlaringiz hech qachon o'chirilmaydi.<\/p><\/aside><h2 id=\"yaratish-oqish-yangilash-ochirish\">Yaratish, o'qish, yangilash, o'chirish<a class=\"anchor\" href=\"#\" data-anchor=\"yaratish-oqish-yangilash-ochirish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">p = await Product.create(title=\"Kitob\", price=50_000)\n\np = await Product.get(id=1)              # topilmasa DoesNotExist\np = await Product.get_or_none(title=\"X\") # topilmasa None\nuser, created = await User.get_or_create(id=5, defaults={\"first_name\": \"Ali\"})\n\np.price = 45_000\nawait p.save()\nawait p.update(price=40_000)            # faqat shu maydon\nawait p.increment(\"price\", 1000)\nawait p.delete()<\/code><\/pre><\/figure><h2 id=\"sorovlar\">So'rovlar<a class=\"anchor\" href=\"#\" data-anchor=\"sorovlar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">cheap = await Product.filter(price__lt=100_000, active=True).order_by(\"price\")\ncount = await Product.filter(title__icontains=\"kitob\").count()\nlast5 = await Product.all().order_by(\"-created\").limit(5)\npage2 = await Product.all().page(2, 10)\ntitles = await Product.all().values_list(\"title\")\ntotal = await Order.filter(user=ctx.user).sum(\"qty\")\n\nfrom nicebot import Q, Col\nawait Product.filter(Q(price__gt=1_000_000) | Q(active=False))\nawait User.filter(id=5).update(balance=Col(\"balance\") + 1000)<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Lookup<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>price=5<\/code><\/td><td>teng<\/td><\/tr><tr><td><code>price__ne=5<\/code><\/td><td>teng emas<\/td><\/tr><tr><td><code>__gt<\/code> <code>__gte<\/code> <code>__lt<\/code> <code>__lte<\/code><\/td><td>katta yoki kichik<\/td><\/tr><tr><td><code>__in=[...]<\/code> / <code>__not_in<\/code><\/td><td>ro'yxat ichida yoki tashqarisida<\/td><\/tr><tr><td><code>__contains<\/code> / <code>__icontains<\/code><\/td><td>ichida bor (<code>i<\/code> — harf katta-kichikligiga qaramaydi)<\/td><\/tr><tr><td><code>__startswith<\/code> / <code>__endswith<\/code><\/td><td>bilan boshlanadi yoki tugaydi<\/td><\/tr><tr><td><code>__isnull=True<\/code><\/td><td>bo'sh<\/td><\/tr><tr><td><code>__between=(a, b)<\/code><\/td><td>oraliqda<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"foreignkey\">ForeignKey<a class=\"anchor\" href=\"#\" data-anchor=\"foreignkey\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>await order.product<\/code> bog'langan obyektni yuklaydi va keshlaydi. <code>order.product_id<\/code> esa raqamning o'zi.<\/p><h2 id=\"tranzaksiya\">Tranzaksiya<a class=\"anchor\" href=\"#\" data-anchor=\"tranzaksiya\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async with bot.db.transaction():\n    await Order.create(user=ctx.user, product=p)\n    await p.update(stock=Col(\"stock\") - 1)\n# xato bo'lsa — ikkalasi ham bekor bo'ladi<\/code><\/pre><\/figure><p>MongoDB'da tranzaksiya faqat replica set'da ishlaydi, shuning uchun u yerda <code>transaction()<\/code> hech narsa qilmaydi.<\/p>", "toc": [["model", "Model"], ["yaratish-oqish-yangilash-ochirish", "Yaratish, o'qish, yangilash, o'chirish"], ["sorovlar", "So'rovlar"], ["foreignkey", "ForeignKey"], ["tranzaksiya", "Tranzaksiya"]], "text": "nicebot'da o'z ORM'i bor. Bitta kod SQLite, PostgreSQL, MySQL/MariaDB va MongoDB'da bir xil ishlaydi. To'rttalasi ham avtomatik testlar bilan tekshirilgan. Python Model Python Maydonlar: Int , BigInt , Float , Str(max_length) , Text , Bool , DateTime(auto_now_add=, auto_now=) , Date , JSON va ForeignKey . Umumiy parametrlar: default= , null= , unique= , index= va choices= . Avto-migratsiya: bot ishga tushganda jadvallar yaratiladi. Modelga yangi maydon qo'shsangiz, ustun ham o'zi qo'shiladi. Ma'lumotlaringiz hech qachon o'chirilmaydi. Yaratish, o'qish, yangilash, o'chirish Python So'rovlar Python Lookup Ma'nosi price=5 teng price__ne=5 teng emas __gt __gte __lt __lte katta yoki kichik __in=[...] / __not_in ro'yxat ichida yoki tashqarisida __contains / __icontains ichida bor ( i — harf katta-kichikligiga qaramaydi) __startswith / __endswith bilan boshlanadi yoki tugaydi __isnull=True bo'sh __between=(a, b) oraliqda ForeignKey await order.product bog'langan obyektni yuklaydi va keshlaydi. order.product_id esa raqamning o'zi. Tranzaksiya Python MongoDB'da tranzaksiya faqat replica set'da ishlaydi, shuning uchun u yerda transaction() hech narsa qilmaydi.", "min": 1}, "users": {"title": "Foydalanuvchilar va referal", "desc": "Avtomatik saqlanadigan foydalanuvchilar, o'z maydonlaringiz va referal.", "html": "<p>Botga yozgan har bir odam <code>nb_users<\/code> jadvaliga avtomatik saqlanadi va <code>ctx.user<\/code> orqali keladi. Ism, username va oxirgi faollik vaqti ham o'zi yangilanib turadi.<\/p><div class=\"table\"><table><thead><tr><th>Maydon<\/th><th><\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>Telegram id<\/td><\/tr><tr><td><code>first_name<\/code>, <code>last_name<\/code>, <code>username<\/code><\/td><td><\/td><\/tr><tr><td><code>lang<\/code><\/td><td>Tanlangan til<\/td><\/tr><tr><td><code>phone<\/code><\/td><td>Telefon<\/td><\/tr><tr><td><code>is_blocked<\/code><\/td><td>Botni bloklaganmi (avtomatik)<\/td><\/tr><tr><td><code>is_premium<\/code><\/td><td>Telegram Premium<\/td><\/tr><tr><td><code>referrer_id<\/code><\/td><td>Kim taklif qilgan<\/td><\/tr><tr><td><code>data<\/code><\/td><td>Istalgan JSON<\/td><\/tr><tr><td><code>created_at<\/code>, <code>last_seen<\/code><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"oz-maydonlaringizni-qoshish\">O'z maydonlaringizni qo'shish<a class=\"anchor\" href=\"#\" data-anchor=\"oz-maydonlaringizni-qoshish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot, User, fields\n\nclass Customer(User):              # o'sha \"nb_users\" jadvali, yangi ustunlar\n    balance = fields.Int(default=0)\n    city = fields.Str(64, null=True)\n\nbot = Nicebot(token=\"...\", user_model=Customer)\n\n@bot.command(\"balans\")\nasync def balans(ctx, user: Customer):\n    await ctx.reply(f\"Balans: {user.balance} so'm\")<\/code><\/pre><\/figure><h2 id=\"referal-tizimi\">Referal tizimi<a class=\"anchor\" href=\"#\" data-anchor=\"referal-tizimi\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>ctx.ref_link<\/code> havolasi orqali kirgan yangi foydalanuvchiga <code>referrer_id<\/code> o'zi yoziladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"taklif\")\nasync def invite(ctx):\n    n = await ctx.user.referrals_count()\n    await ctx.reply(f\"Havolangiz: {ctx.ref_link}\\nTaklif qilganlaringiz: {n}\")\n\n@bot.on_referral\nasync def rewarded(ctx, referrer):\n    await referrer.update(balance=Col(\"balance\") + 5000)\n    await bot.send_message(referrer.id, \"🎉 Do'stingiz qo'shildi, +5000!\")<\/code><\/pre><\/figure><h2 id=\"hayot-sikli-hodisalari\">Hayot sikli hodisalari<a class=\"anchor\" href=\"#\" data-anchor=\"hayot-sikli-hodisalari\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on_startup\nasync def ready(bot):\n    await bot.notify_admins(\"✅ Bot ishga tushdi\")\n\n@bot.on_new_user\nasync def welcome(ctx, user):\n    await bot.notify_admins(f\"🆕 Yangi foydalanuvchi: {user.mention}\")<\/code><\/pre><\/figure>", "toc": [["oz-maydonlaringizni-qoshish", "O'z maydonlaringizni qo'shish"], ["referal-tizimi", "Referal tizimi"], ["hayot-sikli-hodisalari", "Hayot sikli hodisalari"]], "text": "Botga yozgan har bir odam nb_users jadvaliga avtomatik saqlanadi va ctx.user orqali keladi. Ism, username va oxirgi faollik vaqti ham o'zi yangilanib turadi. Maydon id Telegram id first_name , last_name , username lang Tanlangan til phone Telefon is_blocked Botni bloklaganmi (avtomatik) is_premium Telegram Premium referrer_id Kim taklif qilgan data Istalgan JSON created_at , last_seen O'z maydonlaringizni qo'shish Python Referal tizimi ctx.ref_link havolasi orqali kirgan yangi foydalanuvchiga referrer_id o'zi yoziladi. Python Hayot sikli hodisalari Python", "min": 1}, "i18n": {"title": "Ko'p tillilik", "desc": "Botni bir nechta tilda ishlatish uchun JSON tarjima fayllari.", "html": "<p><code>locales/<\/code> papkasiga har bir til uchun JSON fayl qo'ying:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">JSON<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-json\">// locales/uz.json\n{ \"hello\": \"Assalomu alaykum, {name}!\", \"menu\": { \"shop\": \"🛍 Do'kon\" } }\n\n// locales/ru.json\n{ \"hello\": \"Здравствуйте, {name}!\", \"menu\": { \"shop\": \"🛍 Магазин\" } }<\/code><\/pre><\/figure><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(ctx.t(\"hello\", name=ctx.name))\nawait ctx.reply(ctx.t(\"menu.shop\"))\nawait ctx.set_lang(\"ru\")        # foydalanuvchi tilini saqlaydi<\/code><\/pre><\/figure><p>Foydalanuvchi tili quyidagi tartibda aniqlanadi: avval <code>ctx.set_lang()<\/code> bilan saqlangan til, keyin Telegram ilovasidagi til, oxirida <code>Nicebot(lang=\"uz\")<\/code>. Kalit topilmasa, standart tildagi matn olinadi. Kutubxonaning o'z matnlari (\"Ha\", \"Bekor qilindi\" va boshqalar) uz, ru va en tillarida tayyor turadi. Ularni ham o'z faylingizda qayta yozishingiz mumkin, masalan: <code>\"nb.yes\": \"Albatta\"<\/code>.<\/p>", "toc": [], "text": "locales/ papkasiga har bir til uchun JSON fayl qo'ying: JSON Python Foydalanuvchi tili quyidagi tartibda aniqlanadi: avval ctx.set_lang() bilan saqlangan til, keyin Telegram ilovasidagi til, oxirida Nicebot(lang=\"uz\") . Kalit topilmasa, standart tildagi matn olinadi. Kutubxonaning o'z matnlari (\"Ha\", \"Bekor qilindi\" va boshqalar) uz, ru va en tillarida tayyor turadi. Ularni ham o'z faylingizda qayta yozishingiz mumkin, masalan: \"nb.yes\": \"Albatta\" .", "min": 1}, "admin": {"title": "Admin panel va statistika", "desc": "Tayyor admin buyruqlari, statistika va xatolar haqida hisobot.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", admins=[123456789])\n# adminlar menyusida avtomatik paydo bo'ladi:\n# /stats        — statistika\n# /broadcast    — xabarga reply qilib hammaga yuborish\n# /maintenance  — texnik ishlar rejimi (on / off)\n# /backup       — SQLite bazaning nusxasi<\/code><\/pre><\/figure><p>Admin buyruqlari faqat adminlarning menyusida ko'rinadi. Oddiy foydalanuvchilar ularni ko'rmaydi va ishlata olmaydi.<\/p><h2 id=\"statistika\">Statistika<a class=\"anchor\" href=\"#\" data-anchor=\"statistika\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">s = await bot.stats()\n# {\"users\": 1520, \"dau\": 310, \"mau\": 1104, \"new_today\": 42, \"blocked\": 37,\n#  \"retention_d7\": 34.5, \"top_commands\": [(\"start\", 900), ...], ...}<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Ko'rsatkich<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td>DAU / WAU / MAU<\/td><td>1, 7 va 30 kunda faol bo'lganlar<\/td><\/tr><tr><td><code>retention_d7<\/code><\/td><td>7–14 kun oldin kelganlarning qanchasi so'nggi haftada qaytgan (%)<\/td><\/tr><tr><td><code>top_commands<\/code><\/td><td>30 kundagi eng ko'p ishlatilgan buyruqlar<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"texnik-ishlar-rejimi\">Texnik ishlar rejimi<a class=\"anchor\" href=\"#\" data-anchor=\"texnik-ishlar-rejimi\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>await bot.maintenance(True)<\/code> yoqilganda adminlardan boshqa hamma \"🛠 texnik ishlar\" xabarini oladi. Rejim restartdan keyin ham saqlanadi.<\/p><h2 id=\"xatolar-haqida-hisobot\">Xatolar haqida hisobot<a class=\"anchor\" href=\"#\" data-anchor=\"xatolar-haqida-hisobot\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Handlerda xato bo'lsa, foydalanuvchi muloyim xabar oladi, adminlar esa traceback'li hisobot oladi. Bir xil xato 10 daqiqada faqat bir marta yuboriladi.<\/p>", "toc": [["statistika", "Statistika"], ["texnik-ishlar-rejimi", "Texnik ishlar rejimi"], ["xatolar-haqida-hisobot", "Xatolar haqida hisobot"]], "text": "Python Admin buyruqlari faqat adminlarning menyusida ko'rinadi. Oddiy foydalanuvchilar ularni ko'rmaydi va ishlata olmaydi. Statistika Python Ko'rsatkich Ma'nosi DAU / WAU / MAU 1, 7 va 30 kunda faol bo'lganlar retention_d7 7–14 kun oldin kelganlarning qanchasi so'nggi haftada qaytgan (%) top_commands 30 kundagi eng ko'p ishlatilgan buyruqlar Texnik ishlar rejimi await bot.maintenance(True) yoqilganda adminlardan boshqa hamma \"🛠 texnik ishlar\" xabarini oladi. Rejim restartdan keyin ham saqlanadi. Xatolar haqida hisobot Handlerda xato bo'lsa, foydalanuvchi muloyim xabar oladi, adminlar esa traceback'li hisobot oladi. Bir xil xato 10 daqiqada faqat bir marta yuboriladi.", "min": 1}, "broadcast": {"title": "Broadcast (hammaga xabar)", "desc": "Hamma foydalanuvchiga xabar: tezlik chegarasi va davom ettirish bilan.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">result = await bot.broadcast(\n    \"🎉 Yangi aksiya boshlandi!\",\n    buttons=[Button(\"Ko'rish\", url=\"https://tezbaraka.uz\")],\n    id=\"aksiya-noyabr\",     # to'xtab qolsa, shu id bilan davom etadi\n)\n# {\"total\": 1500, \"sent\": 1462, \"failed\": 38, \"blocked\": 35}\n\nawait bot.broadcast(lambda uid: f\"Salom! Sizning id: {uid}\")\nawait bot.broadcast(None, copy_from=(chat_id, message_id))   # istalgan xabarni nusxalash<\/code><\/pre><\/figure><ul><li>Telegram chegarasi hisobga olinadi: standart tezlik soniyasiga 25 ta. <code>rate=<\/code> bilan o'zgartirish mumkin<\/li><li>429 flood xatosida kerakli vaqt kutib, davom etadi<\/li><li>Botni bloklaganlar <code>is_blocked=True<\/code> deb belgilanadi va keyingi safar o'tkazib yuboriladi<\/li><li><code>id=<\/code> berilsa, jarayon har 20 ta xabarda saqlanadi. Bot to'xtab qolsa, o'sha <code>id<\/code> bilan qayta chaqiring, u qolgan joyidan davom etadi<\/li><li><code>on_progress=<\/code> funksiyasi har 3 soniyada joriy holatni oladi<\/li><\/ul>", "toc": [], "text": "Python Telegram chegarasi hisobga olinadi: standart tezlik soniyasiga 25 ta. rate= bilan o'zgartirish mumkin 429 flood xatosida kerakli vaqt kutib, davom etadi Botni bloklaganlar is_blocked=True deb belgilanadi va keyingi safar o'tkazib yuboriladi id= berilsa, jarayon har 20 ta xabarda saqlanadi. Bot to'xtab qolsa, o'sha id bilan qayta chaqiring, u qolgan joyidan davom etadi on_progress= funksiyasi har 3 soniyada joriy holatni oladi", "min": 1}, "payments": {"title": "To'lovlar (Telegram Stars)", "desc": "Telegram Stars orqali to'lov qabul qilish.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"premium\")\nasync def premium(ctx):\n    await ctx.invoice(\"Premium\", \"30 kunlik obuna\", amount=100, payload=\"premium30\")\n\n@bot.paid()\nasync def paid(ctx):\n    sp = ctx.message.successful_payment\n    await ctx.user.update(data={**ctx.user.data, \"premium\": True})\n    await ctx.reply(f\"⭐️ {sp.total_amount} Stars uchun rahmat!\")<\/code><\/pre><\/figure><p><code>pre_checkout_query<\/code> avtomatik tasdiqlanadi. O'zingiz tekshirmoqchi bo'lsangiz, <code>@bot.pre_checkout()<\/code> handlerini yozing. Pulni qaytarish: <code>await ctx.refund()<\/code>.<\/p>", "toc": [], "text": "Python pre_checkout_query avtomatik tasdiqlanadi. O'zingiz tekshirmoqchi bo'lsangiz, @bot.pre_checkout() handlerini yozing. Pulni qaytarish: await ctx.refund() .", "min": 1}, "groups": {"title": "Guruhlar, obuna va support", "desc": "Guruhni boshqarish, captcha, majburiy obuna va support rejimi.", "html": "<h2 id=\"guruhni-boshqarish\">Guruhni boshqarish<a class=\"anchor\" href=\"#\" data-anchor=\"guruhni-boshqarish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"warn\")\nasync def warn(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.warn(\"Reklama taqiqlangan\", limit=3)   # 3 tadan keyin ban\n\n@bot.command(\"mute\")\nasync def mute(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.mute(\"1h\")       # reply qilingan odamni 1 soatga\n\nawait ctx.ban(for_=\"7d\")\nawait ctx.unban()\nawait ctx.kick()<\/code><\/pre><\/figure><p>Bu metodlar reply qilingan odam ustida ishlaydi yoki <code>user_id=<\/code> qabul qiladi. Bot guruhda admin bo'lishi kerak.<\/p><h2 id=\"captcha\">Captcha<a class=\"anchor\" href=\"#\" data-anchor=\"captcha\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", captcha=\"2m\")\n# guruhga kirgan odam 2 daqiqada \"🤖 Men robot emasman\" ni bosmasa — chiqariladi<\/code><\/pre><\/figure><h2 id=\"majburiy-obuna\">Majburiy obuna<a class=\"anchor\" href=\"#\" data-anchor=\"majburiy-obuna\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", required_channels=[\"@kanalim\", \"@yangiliklar\"])\n# obuna bo'lmagan foydalanuvchi kanallar ro'yxati va \"✅ Tekshirish\" tugmasini ko'radi<\/code><\/pre><\/figure><p>Bot kanalda admin bo'lishi kerak, aks holda a'zolikni tekshira olmaydi. Natija bir daqiqa keshlanadi, shuning uchun Telegram'ga ortiqcha so'rov ketmaydi.<\/p><h2 id=\"support-rejimi\">Support rejimi<a class=\"anchor\" href=\"#\" data-anchor=\"support-rejimi\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", support_chat=-1001234567890)\n# hech bir handlerga tushmagan shaxsiy xabarlar guruhga boradi;\n# guruhda o'sha xabarga reply qilsangiz — javob foydalanuvchiga ketadi<\/code><\/pre><\/figure>", "toc": [["guruhni-boshqarish", "Guruhni boshqarish"], ["captcha", "Captcha"], ["majburiy-obuna", "Majburiy obuna"], ["support-rejimi", "Support rejimi"]], "text": "Guruhni boshqarish Python Bu metodlar reply qilingan odam ustida ishlaydi yoki user_id= qabul qiladi. Bot guruhda admin bo'lishi kerak. Captcha Python Majburiy obuna Python Bot kanalda admin bo'lishi kerak, aks holda a'zolikni tekshira olmaydi. Natija bir daqiqa keshlanadi, shuning uchun Telegram'ga ortiqcha so'rov ketmaydi. Support rejimi Python", "min": 1}, "middleware": {"title": "Middleware, DI va xatolar", "desc": "Har bir update atrofidagi kod, bog'liqlik kiritish va xatolarni ushlash.", "html": "<h2 id=\"middleware\">Middleware<a class=\"anchor\" href=\"#\" data-anchor=\"middleware\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Middleware har bir update atrofida ishlaydi va handlerdan oldin ham, keyin ham kod bajarishi mumkin.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import time\n\n@bot.middleware\nasync def timing(ctx, next):\n    start = time.perf_counter()\n    await next()                                  # keyingi qadam / handler\n    print(f\"{ctx.text!r}: {time.perf_counter() - start:.3f}s\")\n\n@bot.middleware\nasync def ban_check(ctx, next):\n    if ctx.user and ctx.user.data.get(\"banned\"):\n        return                                    # next() chaqirilmasa — to'xtaydi\n    await next()<\/code><\/pre><\/figure><h2 id=\"bogliqlik-kiritish-di\">Bog'liqlik kiritish (DI)<a class=\"anchor\" href=\"#\" data-anchor=\"bogliqlik-kiritish-di\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Handler o'ziga kerakli narsani parametr nomi yoki turi orqali so'raydi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from dataclasses import dataclass\n\n@dataclass\nclass Settings:\n    price: int = 50_000\n\nbot.provide(Settings, Settings())\n\n@bot.callback(\"buy:{id:int}\")\nasync def buy(ctx, id: int, user: Customer, cfg: Settings, text, args):\n    ...   # kerakli narsani nomi yoki turi bilan so'raysiz<\/code><\/pre><\/figure><p>Nom bo'yicha keladiganlar: <code>bot<\/code>, <code>message<\/code>, <code>callback<\/code>, <code>user<\/code>, <code>chat<\/code>, <code>text<\/code>, <code>args<\/code>, <code>arg<\/code>, <code>payload<\/code>, <code>data<\/code>, <code>value<\/code>, <code>album<\/code>, <code>lang<\/code>, <code>state<\/code>, <code>config<\/code>, <code>db<\/code> va <code>storage<\/code>, shuningdek callback va regex parametrlari.<\/p><h2 id=\"xatolar\">Xatolar<a class=\"anchor\" href=\"#\" data-anchor=\"xatolar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.error(ValueError)\nasync def bad_value(ctx, error):\n    await ctx.reply(f\"Xato qiymat: {error}\")\n\n# qolgan xatolar: foydalanuvchiga muloyim xabar,\n# adminlarga esa traceback bilan hisobot avtomatik yuboriladi<\/code><\/pre><\/figure>", "toc": [["middleware", "Middleware"], ["bogliqlik-kiritish-di", "Bog'liqlik kiritish (DI)"], ["xatolar", "Xatolar"]], "text": "Middleware Middleware har bir update atrofida ishlaydi va handlerdan oldin ham, keyin ham kod bajarishi mumkin. Python Bog'liqlik kiritish (DI) Handler o'ziga kerakli narsani parametr nomi yoki turi orqali so'raydi: Python Nom bo'yicha keladiganlar: bot , message , callback , user , chat , text , args , arg , payload , data , value , album , lang , state , config , db va storage , shuningdek callback va regex parametrlari. Xatolar Python", "min": 1}, "miniapp": {"title": "Mini App", "desc": "Bot bilan bitta jarayonda ishlaydigan Mini App server va API.", "html": "<p>nicebot'da bot bilan bitta jarayonda ishlaydigan veb-server bor. U Mini App fayllarini beradi va API endpoint'larni yaratadi. Telegram <code>initData<\/code> imzosi HMAC orqali avtomatik tekshiriladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.webapp(\"webapp\")                # webapp/index.html ni beradi\n\n@bot.api(\"/api/score\")\nasync def score(req):\n    user = await req.db_user()          # initData tekshirilgan, foydalanuvchi aniq\n    points = int(req.json[\"points\"])\n    await user.update(data={**user.data, \"score\": points})\n    return {\"ok\": True, \"score\": points}\n\n@bot.command(\"play\")\nasync def play(ctx):\n    await ctx.reply(\"O'ynash\", buttons=[Button(\"🎮 Boshlash\", webapp=\"https://game.tezbaraka.uz\")])\n\nbot.start(port=8080)<\/code><\/pre><\/figure><p>Brauzer tomonida tayyor <code>nicebot.js<\/code> ulanadi. U <code>initData<\/code>'ni o'zi qo'shib yuboradi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">HTML<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-xml\">&lt;script src=\"https://telegram.org/js/telegram-web-app.js\"&gt;&lt;/script&gt;\n&lt;script src=\"/nicebot.js\"&gt;&lt;/script&gt;\n&lt;script&gt;\n  nicebot.post(\"/api/score\", { points: 120 }).then(r =&gt; console.log(r.score));\n  console.log(nicebot.user.first_name);\n&lt;/script&gt;<\/code><\/pre><\/figure><p><code>initData<\/code> noto'g'ri yoki eskirgan bo'lsa, so'rov <code>401<\/code> bilan rad etiladi. <code>@bot.api(..., auth=False)<\/code> ochiq endpoint yaratadi. <code>WebAppRequest<\/code> obyektida <code>user<\/code>, <code>json<\/code>, <code>query<\/code>, <code>params<\/code> va <code>db_user()<\/code> bor.<\/p>", "toc": [], "text": "nicebot'da bot bilan bitta jarayonda ishlaydigan veb-server bor. U Mini App fayllarini beradi va API endpoint'larni yaratadi. Telegram initData imzosi HMAC orqali avtomatik tekshiriladi. Python Brauzer tomonida tayyor nicebot.js ulanadi. U initData 'ni o'zi qo'shib yuboradi: HTML initData noto'g'ri yoki eskirgan bo'lsa, so'rov 401 bilan rad etiladi. @bot.api(..., auth=False) ochiq endpoint yaratadi. WebAppRequest obyektida user , json , query , params va db_user() bor.", "min": 1}, "scheduler": {"title": "Rejalashtirish, fon va kesh", "desc": "Jadval bo'yicha vazifalar, fon ishlari, kesh va fayllar.", "html": "<h2 id=\"rejalashtirilgan-vazifalar\">Rejalashtirilgan vazifalar<a class=\"anchor\" href=\"#\" data-anchor=\"rejalashtirilgan-vazifalar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.every(\"1h\")\nasync def sync_prices(bot):\n    ...\n\n@bot.at(\"09:00\", tz=\"Asia/Tashkent\")\nasync def morning(bot):\n    await bot.broadcast(\"☀️ Xayrli tong!\")\n\n@bot.at(\"18:00\", days=[\"mon\", \"fri\"])\nasync def weekly_report(bot):\n    await bot.notify_admins(str(await bot.stats()))<\/code><\/pre><\/figure><p>Kunlar inglizcha (<code>mon<\/code>…<code>sun<\/code>) yoki o'zbekcha (<code>du<\/code>, <code>se<\/code>, <code>chor<\/code>, <code>pay<\/code>, <code>ju<\/code>, <code>shan<\/code>, <code>yak<\/code>) yoziladi.<\/p><h2 id=\"fon-vazifalari\">Fon vazifalari<a class=\"anchor\" href=\"#\" data-anchor=\"fon-vazifalari\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"report\")\nasync def report(ctx):\n    ctx.background(build_heavy_report, ctx.user_id, retries=3)   # handler darhol tugaydi\n    await ctx.reply(\"Hisobot tayyorlanmoqda, tayyor bo'lgach yuboraman\")\n\nbot.later(\"10m\", bot.send_message(admin_id, \"10 daqiqa o'tdi\"))<\/code><\/pre><\/figure><p>Fon vazifasi xato bersa, eksponensial kutish bilan qayta uriniladi. Bot to'xtatilganda tugallanmagan vazifalar kutib olinadi.<\/p><h2 id=\"kesh\">Kesh<a class=\"anchor\" href=\"#\" data-anchor=\"kesh\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import cache\n\n@cache(\"10m\")\nasync def dollar_rate():\n    ...   # 10 daqiqada bir marta haqiqiy so'rov<\/code><\/pre><\/figure><h2 id=\"fayllar\">Fayllar<a class=\"anchor\" href=\"#\" data-anchor=\"fayllar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on(\"document\")\nasync def doc(ctx):\n    data = await ctx.download()               # bytes\n    await ctx.save(f\"uploads/{ctx.message.document.file_name}\")\n\nawait ctx.photo(\"logo.png\")   # birinchi marta yuklanadi,\nawait ctx.photo(\"logo.png\")   # keyingi safar file_id bilan — bir zumda<\/code><\/pre><\/figure>", "toc": [["rejalashtirilgan-vazifalar", "Rejalashtirilgan vazifalar"], ["fon-vazifalari", "Fon vazifalari"], ["kesh", "Kesh"], ["fayllar", "Fayllar"]], "text": "Rejalashtirilgan vazifalar Python Kunlar inglizcha ( mon … sun ) yoki o'zbekcha ( du , se , chor , pay , ju , shan , yak ) yoziladi. Fon vazifalari Python Fon vazifasi xato bersa, eksponensial kutish bilan qayta uriniladi. Bot to'xtatilganda tugallanmagan vazifalar kutib olinadi. Kesh Python Fayllar Python", "min": 1}, "deploy": {"title": "Ishga tushirish va deploy", "desc": "Polling yoki webhook, to'g'ri to'xtash va Docker.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.start()                                   # polling\nbot.start(reload=True)                        # kod o'zgarsa o'zi qayta ishga tushadi\nbot.start(webhook=\"https://bot.tezbaraka.uz/hook\", port=8080)\nNicebot.run_all(shop_bot, support_bot)        # bitta jarayonda bir nechta bot<\/code><\/pre><\/figure><h2 id=\"polling-yoki-webhook\">Polling yoki webhook<a class=\"anchor\" href=\"#\" data-anchor=\"polling-yoki-webhook\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Polling sozlash talab qilmaydi va kichik hamda o'rta botlar uchun yetarli. Webhook uchun HTTPS domen kerak. nicebot <code>setWebhook<\/code>'ni maxfiy token bilan o'zi chaqiradi va kelgan so'rovlarni tekshiradi. Server sog'lig'ini <code>/nicebot/health<\/code> manzilida tekshirish mumkin.<\/p><h2 id=\"togri-toxtash\">To'g'ri to'xtash<a class=\"anchor\" href=\"#\" data-anchor=\"togri-toxtash\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Ctrl+C yoki SIGTERM kelganda bot yangi update olishni to'xtatadi va ishlayotgan handlerlar tugashini kutadi. Keyin offset'ni Telegram'ga tasdiqlaydi, shuning uchun restartda birorta update yo'qolmaydi va ikki marta ham ishlanmaydi.<\/p><h2 id=\"docker\">Docker<a class=\"anchor\" href=\"#\" data-anchor=\"docker\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Dockerfile<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-dockerfile\">FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install --no-cache-dir \"nicebot[postgres]\"\nCMD [\"python\", \"bot.py\"]<\/code><\/pre><\/figure><h2 id=\"ishonchlilik\">Ishonchlilik<a class=\"anchor\" href=\"#\" data-anchor=\"ishonchlilik\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><ul><li>Flood control (429): kerakli soniya kutiladi va so'rov qayta yuboriladi<\/li><li>Tarmoq va 5xx xatolari: eksponensial kutish bilan 3 marta qayta urinadi<\/li><li>Noma'lum yangi update turlari bot ishini to'xtatmaydi, ular logga yozilib, o'tkazib yuboriladi<\/li><li>Bir vaqtdagi handlerlar soni <code>max_concurrency=256<\/code> bilan cheklangan<\/li><\/ul>", "toc": [["polling-yoki-webhook", "Polling yoki webhook"], ["togri-toxtash", "To'g'ri to'xtash"], ["docker", "Docker"], ["ishonchlilik", "Ishonchlilik"]], "text": "Python Polling yoki webhook Polling sozlash talab qilmaydi va kichik hamda o'rta botlar uchun yetarli. Webhook uchun HTTPS domen kerak. nicebot setWebhook 'ni maxfiy token bilan o'zi chaqiradi va kelgan so'rovlarni tekshiradi. Server sog'lig'ini /nicebot/health manzilida tekshirish mumkin. To'g'ri to'xtash Ctrl+C yoki SIGTERM kelganda bot yangi update olishni to'xtatadi va ishlayotgan handlerlar tugashini kutadi. Keyin offset'ni Telegram'ga tasdiqlaydi, shuning uchun restartda birorta update yo'qolmaydi va ikki marta ham ishlanmaydi. Docker Dockerfile Ishonchlilik Flood control (429): kerakli soniya kutiladi va so'rov qayta yuboriladi Tarmoq va 5xx xatolari: eksponensial kutish bilan 3 marta qayta urinadi Noma'lum yangi update turlari bot ishini to'xtatmaydi, ular logga yozilib, o'tkazib yuboriladi Bir vaqtdagi handlerlar soni max_concurrency=256 bilan cheklangan", "min": 1}, "testing": {"title": "Testlash", "desc": "Botni Telegram'siz, haqiqiy foydalanuvchidek sinash.", "html": "<p>Botni Telegram'siz, haqiqiy foydalanuvchidek sinab ko'rish mumkin. Soxta API barcha chaqiruvlarni yozib boradi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">test_bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from bot import bot\n\nasync def test_register():\n    async with bot.test() as t:\n        ali = t.user(first_name=\"Ali\")\n        await ali.send(\"/register\")\n        assert t.last.text == \"Ismingiz?\"\n        await ali.send(\"Ali\")\n        await ali.send(\"25\")\n        await ali.click(\"M\")\n        assert \"Rahmat\" in t.last.text<\/code><\/pre><\/figure><div class=\"table\"><table><tbody><tr><td><code>t.user(...)<\/code><\/td><td>Soxta foydalanuvchi<\/td><\/tr><tr><td><code>user.send(text)<\/code><\/td><td>Xabar yuborish<\/td><\/tr><tr><td><code>user.click(\"matn\")<\/code><\/td><td>Tugmani bosish<\/td><\/tr><tr><td><code>user.send_photo()<\/code> / <code>send_contact()<\/code> / <code>send_location()<\/code> / <code>send_album()<\/code><\/td><td>Media yuborish<\/td><\/tr><tr><td><code>t.last<\/code><\/td><td>Oxirgi xabar: <code>.text<\/code>, <code>.buttons<\/code>, <code>.keyboard<\/code><\/td><\/tr><tr><td><code>t.messages<\/code> / <code>t.texts<\/code><\/td><td>Barcha xabarlar<\/td><\/tr><tr><td><code>t.calls_of(\"sendPhoto\")<\/code><\/td><td>API chaqiruvlari<\/td><\/tr><tr><td><code>t.blocked = {id}<\/code><\/td><td>Botni bloklagan foydalanuvchi<\/td><\/tr><\/tbody><\/table><\/div><p><code>pytest<\/code> va <code>pytest-asyncio<\/code> bilan ishlaydi.<\/p>", "toc": [], "text": "Botni Telegram'siz, haqiqiy foydalanuvchidek sinab ko'rish mumkin. Soxta API barcha chaqiruvlarni yozib boradi. test_bot.py t.user(...) Soxta foydalanuvchi user.send(text) Xabar yuborish user.click(\"matn\") Tugmani bosish user.send_photo() / send_contact() / send_location() / send_album() Media yuborish t.last Oxirgi xabar: .text , .buttons , .keyboard t.messages / t.texts Barcha xabarlar t.calls_of(\"sendPhoto\") API chaqiruvlari t.blocked = {id} Botni bloklagan foydalanuvchi pytest va pytest-asyncio bilan ishlaydi.", "min": 1}, "features": {"title": "50 ta imkoniyat", "desc": "nicebot ichidagi 50 ta tayyor imkoniyat bir sahifada.", "html": "<section class=\"fgroup\"><h2 id=\"suhbat\">Suhbat <span class=\"fcount\">5<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">01<\/span><div><code>await ctx.ask()<\/code><p>FSM klasslarisiz savol-javob<\/p><\/div><\/li><li><span class=\"fnum\">02<\/span><div><code>ctx.confirm()<\/code><p>Ha/Yo'q savol, True/False qaytaradi<\/p><\/div><\/li><li><span class=\"fnum\">03<\/span><div><code>ctx.choose(multiple=True)<\/code><p>✅/⬜️ bilan bir nechta variant tanlash<\/p><\/div><\/li><li><span class=\"fnum\">04<\/span><div><code>ctx.form()<\/code><p>Bir nechta savol, validatsiya va qayta so'rash<\/p><\/div><\/li><li><span class=\"fnum\">05<\/span><div><code>Validatorlar<\/code><p>Telefon (+998), email, sana, son, URL, rasm va boshqalar<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"tugmalar\">Tugmalar <span class=\"fcount\">12<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">06<\/span><div><code>Button(on_click=)<\/code><p>Tugma to'g'ridan-to'g'ri funksiyaga bog'lanadi<\/p><\/div><\/li><li><span class=\"fnum\">07<\/span><div><code>Callback shablonlari<\/code><p>\"buy:{id:int}\" avtomatik parse qilinadi<\/p><\/div><\/li><li><span class=\"fnum\">08<\/span><div><code>Avto-joylashuv<\/code><p>Qisqa tugmalar bir qatorga o'zi joylashadi<\/p><\/div><\/li><li><span class=\"fnum\">09<\/span><div><code>Toggle<\/code><p>✅/⬜️ sozlamalar, qiymat saqlanadi<\/p><\/div><\/li><li><span class=\"fnum\">10<\/span><div><code>ttl= va only=<\/code><p>Muddatli va faqat bir kishi bosa oladigan tugmalar<\/p><\/div><\/li><li><span class=\"fnum\">11<\/span><div><code>once=True<\/code><p>Bir martalik tugma<\/p><\/div><\/li><li><span class=\"fnum\">12<\/span><div><code>64 bayt chegarasi yo'q<\/code><p>Uzun callback ma'lumoti bazada saqlanadi<\/p><\/div><\/li><li><span class=\"fnum\">13<\/span><div><code>Avto-javob<\/code><p>Tugmadagi soat belgisi qotib qolmaydi<\/p><\/div><\/li><li><span class=\"fnum\">14<\/span><div><code>Reply qisqartmalari<\/code><p>\"📞 Raqam:contact\", \":location\"<\/p><\/div><\/li><li><span class=\"fnum\">15<\/span><div><code>ctx.respond()<\/code><p>Tugmadan bo'lsa tahrirlaydi, aks holda yuboradi<\/p><\/div><\/li><li><span class=\"fnum\">16<\/span><div><code>Ko'p darajali Menu<\/code><p>\"Orqaga\" tugmasi avtomatik<\/p><\/div><\/li><li><span class=\"fnum\">17<\/span><div><code>ctx.paginate()<\/code><p>◀️ 2/5 ▶️ sahifalash<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"malumotlar\">Ma'lumotlar <span class=\"fcount\">4<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">18<\/span><div><code>Ichki ORM<\/code><p>SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan<\/p><\/div><\/li><li><span class=\"fnum\">19<\/span><div><code>ctx.user<\/code><p>Foydalanuvchi bazaga avtomatik yoziladi<\/p><\/div><\/li><li><span class=\"fnum\">20<\/span><div><code>i18n<\/code><p>ctx.t(), uz/ru/en tayyor matnlar<\/p><\/div><\/li><li><span class=\"fnum\">21<\/span><div><code>file_id keshi<\/code><p>Lokal fayl bir marta yuklanadi<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"biznes\">Biznes <span class=\"fcount\">10<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">22<\/span><div><code>Referal tizimi<\/code><p>ctx.ref_link, referrer_id va @bot.on_referral<\/p><\/div><\/li><li><span class=\"fnum\">23<\/span><div><code>Broadcast<\/code><p>Tezlik chegarasi, bloklanganlarni belgilash va davom ettirish<\/p><\/div><\/li><li><span class=\"fnum\">24<\/span><div><code>Admin panel<\/code><p>/stats, /broadcast, /maintenance va /backup<\/p><\/div><\/li><li><span class=\"fnum\">25<\/span><div><code>Analitika<\/code><p>DAU/MAU, retention va top buyruqlar<\/p><\/div><\/li><li><span class=\"fnum\">26<\/span><div><code>Majburiy obuna<\/code><p>required_channels=[…]<\/p><\/div><\/li><li><span class=\"fnum\">27<\/span><div><code>Support rejimi<\/code><p>Xabar guruhga boradi, javob foydalanuvchiga qaytadi<\/p><\/div><\/li><li><span class=\"fnum\">28<\/span><div><code>Texnik ishlar rejimi<\/code><p>Adminlar baribir ishlata oladi<\/p><\/div><\/li><li><span class=\"fnum\">29<\/span><div><code>Telegram Stars<\/code><p>ctx.invoice() va @bot.paid<\/p><\/div><\/li><li><span class=\"fnum\">30<\/span><div><code>Guruh va captcha<\/code><p>ban, mute, warn (3 → ban), yangi a'zolarga captcha<\/p><\/div><\/li><li><span class=\"fnum\">31<\/span><div><code>Xato hisoboti<\/code><p>Adminlarga traceback avtomatik yuboriladi<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"arxitektura\">Arxitektura <span class=\"fcount\">11<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">32<\/span><div><code>Type hint orqali DI<\/code><p>async def h(ctx, user: Customer, cfg: Settings)<\/p><\/div><\/li><li><span class=\"fnum\">33<\/span><div><code>Nicebot.from_env()<\/code><p>.env faylidan sozlash<\/p><\/div><\/li><li><span class=\"fnum\">34<\/span><div><code>bot.include(\"handlers\")<\/code><p>Router'larni avtomatik topish<\/p><\/div><\/li><li><span class=\"fnum\">35<\/span><div><code>@cache(\"5m\")<\/code><p>Async funksiyalar uchun kesh<\/p><\/div><\/li><li><span class=\"fnum\">36<\/span><div><code>ctx.background()<\/code><p>Retry bilan fon vazifalari<\/p><\/div><\/li><li><span class=\"fnum\">37<\/span><div><code>@bot.every / @bot.at<\/code><p>Rejalashtiruvchi, vaqt zonasi bilan<\/p><\/div><\/li><li><span class=\"fnum\">38<\/span><div><code>Albomlar<\/code><p>Media group bitta handlerga ro'yxat bo'lib keladi<\/p><\/div><\/li><li><span class=\"fnum\">39<\/span><div><code>Mini App server<\/c , "SQLite, PostgreSQL, MySQL/MariaDB va MongoDB. Kod bir xil qoladi, faqat db= manzili o'zgaradi. SQLite qo'shimcha o'rnatishsiz ishlaydi."], ["Katta botlar uchun yaroqlimi?", "nicebot async asosida ishlaydi: flood-wait'ni o'zi kutadi, tarmoq xatolarida qayta uradi, to'xtatilganda update yo'qotmaydi. Webhook rejimi va Docker ham qo'llab-quvvatlanadi."], ["Bepulmi?", "Ha. nicebot MIT litsenziyasi ostida ochiq kodli, tijoriy loyihalarda ham bemalol ishlatishingiz mumkin."]], "final_title": "Birinchi botingizni hozir yozing", "final_sub": "O'rnatish bir daqiqa, birinchi bot besh daqiqa vaqt oladi.", "docs_title": "nicebot qo'llanmasi", "docs_lead": "O'rnatishdan production'gacha — Telegram bot yozish uchun kerakli hamma narsa. Ketma-ket o'qing yoki kerakli bo'limga o'ting.", "start_here": "Shu yerdan boshlang", "sections": "Bo'limlar"}}, "ru": {"ui": {"search": "Поиск…", "on_this_page": "На этой странице", "copy": "Копировать", "copied": "Скопировано", "prev": "Назад", "next": "Далее", "menu": "Разделы", "no_results": "Ничего не найдено", "theme": "Тема", "edit_hint": "Bot API", "tagline": "Python-библиотека для Telegram-ботов", "home": "Главная", "docs": "Документация", "features_tab": "Возможности", "api_tab": "Bot API", "result": "Результат", "code": "Код", "overview": "Обзор", "pages_n": "{n} стр.", "read_min": "{n} мин чтения", "edit": "Редактировать на GitHub", "search_btn": "Поиск", "search_hint_nav": "выбрать", "search_hint_open": "открыть", "search_hint_close": "закрыть", "replay": "Показать снова", "edited": "изменено", "start_reading": "Начать читать", "copy_link": "Скопировать ссылку", "lang": "Язык", "bot": "бот", "online": "в сети", "footer_docs": "Документация", "footer_res": "Ресурсы", "footer_note": "Открытый код под лицензией MIT.", "changelog": "Изменения"}, "groups": {"start": "Начало", "basics": "Основы", "ui": "Кнопки и диалоги", "data": "Данные", "business": "Для бизнеса", "advanced": "Продвинутое", "reference": "Справочник"}, "groupDesc": {"start": "От установки до первого работающего бота. Если вы новичок, начните здесь.", "basics": "Обработчики, объект ctx и форматирование — основа любого бота.", "ui": "Кнопки, клавиатуры, диалоги и меню: всё, что видит пользователь.", "data": "База данных, пользователи и мультиязычность.", "business": "Админ-панель, рассылки, платежи и управление группами.", "advanced": "Middleware, Mini App, планировщик, деплой и тесты.", "reference": "Полный список возможностей и справочник Bot API."}, "pages": {"intro": {"title": "Введение", "desc": "Что такое nicebot, что он упрощает и чем отличается от aiogram.", "html": "<p>nicebot — Python-библиотека, которая делает разработку Telegram-ботов максимально простой. Один импорт, один объект и обычные функции. База данных, кнопки, диалоги, переводы, статистика и админ-панель уже встроены.<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Salom, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>Это полностью рабочий бот. В нём нет <code>Dispatcher<\/code>, <code>Router<\/code> и классов состояний, а пользователь автоматически сохраняется в базу.<\/p><h2 id=\"почему-nicebot\">Почему nicebot?<a class=\"anchor\" href=\"#\" data-anchor=\"почему-nicebot\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Сравним простой бот регистрации. Сначала aiogram:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import asyncio\nfrom aiogram import Bot, Dispatcher, F, Router\nfrom aiogram.filters import Command, CommandStart\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.fsm.state import State, StatesGroup\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import Message\n\nrouter = Router()\n\nclass Reg(StatesGroup):\n    name = State()\n    age = State()\n\n@router.message(CommandStart())\nasync def start(message: Message, state: FSMContext):\n    await state.set_state(Reg.name)\n    await message.answer(\"Ismingiz?\")\n\n@router.message(Reg.name)\nasync def got_name(message: Message, state: FSMContext):\n    await state.update_data(name=message.text)\n    await state.set_state(Reg.age)\n    await message.answer(\"Yoshingiz?\")\n\n@router.message(Reg.age)\nasync def got_age(message: Message, state: FSMContext):\n    if not message.text.isdigit():\n        await message.answer(\"Butun son kiriting.\")\n        return\n    data = await state.get_data()\n    await state.clear()\n    await message.answer(f\"{data['name']}, {message.text} yosh\")\n\nasync def main():\n    bot = Bot(\"TOKEN\")\n    dp = Dispatcher(storage=MemoryStorage())\n    dp.include_router(router)\n    await dp.start_polling(bot)\n\nasyncio.run(main())<\/code><\/pre><\/figure><p>Тот же бот на nicebot:<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"TOKEN\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    name = await ctx.ask(\"Ismingiz?\")\n    age = await ctx.ask(\"Yoshingiz?\", int)\n    await ctx.reply(f\"{name}, {age} yosh\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Ismingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:2\"><p>Ali<\/p><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Yoshingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:4\"><p>yigirma<\/p><\/div><div class=\"msg bot\" style=\"--i:5\"><p>Butun son kiriting.<\/p><\/div><div class=\"msg me\" style=\"--i:6\"><p>20<\/p><\/div><div class=\"msg bot\" style=\"--i:7\"><p>Ali, 20 yosh<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><p><code>ctx.ask()<\/code> задаёт вопрос и ждёт ответ. Если передать <code>int<\/code>, бот вежливо переспросит, пока не получит число. Не нужно писать <code>StatesGroup<\/code>, сохранять и очищать состояние.<\/p><h2 id=\"что-внутри\">Что внутри<a class=\"anchor\" href=\"#\" data-anchor=\"что-внутри\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><ul><li><strong>Полный Bot API 10.3:<\/strong> 403 типа и 185 методов сгенерированы из официальной спецификации<\/li><li><strong>Встроенная ORM:<\/strong> один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями<\/li><li><strong>Диалоги:<\/strong> <code>ask<\/code>, <code>confirm<\/code>, <code>choose<\/code>, <code>form<\/code> и готовые валидаторы<\/li><li><strong>Кнопки:<\/strong> <code>on_click<\/code>, шаблоны, переключатели, кнопки с таймером и одноразовые, авто-раскладка<\/li><li><strong>Бизнес:<\/strong> рефералы, рассылки, статистика, админ-панель, обязательная подписка, поддержка, Telegram Stars<\/li><li><strong>Надёжность:<\/strong> сам ждёт flood-wait, повторяет запрос при сетевой ошибке, не теряет апдейты при перезапуске<\/li><li><strong>Скорость:<\/strong> типы на msgspec и один пул соединений<\/li><\/ul><p>Полный список на странице <a href=\"#features\">50 возможностей<\/a>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>nicebot построен на <code>async<\/code>. Каждый обработчик объявляется через <code>async def<\/code>, а каждый запрос к Telegram пишется с <code>await<\/code>.<\/p><\/aside>", "toc": [["почему-nicebot", "Почему nicebot?"], ["что-внутри", "Что внутри"]], "text": "nicebot — Python-библиотека, которая делает разработку Telegram-ботов максимально простой. Один импорт, один объект и обычные функции. База данных, кнопки, диалоги, переводы, статистика и админ-панель уже встроены. bot.py Это полностью рабочий бот. В нём нет Dispatcher , Router и классов состояний, а пользователь автоматически сохраняется в базу. Почему nicebot? Сравним простой бот регистрации. Сначала aiogram: bot.py Тот же бот на nicebot: bot.py ctx.ask() задаёт вопрос и ждёт ответ. Если передать int , бот вежливо переспросит, пока не получит число. Не нужно писать StatesGroup , сохранять и очищать состояние. Что внутри Полный Bot API 10.3: 403 типа и 185 методов сгенерированы из официальной спецификации Встроенная ORM: один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями Диалоги: ask , confirm , choose , form и готовые валидаторы Кнопки: on_click , шаблоны, переключатели, кнопки с таймером и одноразовые, авто-раскладка Бизнес: рефералы, рассылки, статистика, админ-панель, обязательная подписка, поддержка, Telegram Stars Надёжность: сам ждёт flood-wait, повторяет запрос при сетевой ошибке, не теряет апдейты при перезапуске Скорость: типы на msgspec и один пул соединений Полный список на странице 50 возможностей . nicebot построен на async . Каждый обработчик объявляется через async def , а каждый запрос к Telegram пишется с await .", "min": 2}, "install": {"title": "Установка", "desc": "Установите библиотеку и создайте готовый проект одной командой.", "html": "<p>Нужен Python 3.10 или новее.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">pip install nicebot                 # с SQLite\npip install \"nicebot[postgres]\"     # + PostgreSQL\npip install \"nicebot[mysql]\"        # + MySQL / MariaDB\npip install \"nicebot[mongo]\"        # + MongoDB\npip install \"nicebot[redis]\"        # + Redis\npip install \"nicebot[all]\"          # всё сразу<\/code><\/pre><\/figure><p>Часть в квадратных скобках устанавливает драйвер нужной базы. SQLite работает без дополнений.<\/p><h2 id=\"создать-готовый-проект\">Создать готовый проект<a class=\"anchor\" href=\"#\" data-anchor=\"создать-готовый-проект\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">nicebot new mybot\ncd mybot\npython bot.py<\/code><\/pre><\/figure><p>Команда создаёт такую структуру:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">mybot/<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-plaintext\">mybot/\n├── bot.py            # главный файл\n├── .env              # BOT_TOKEN, DATABASE_URL, ADMINS\n├── handlers/\n│   └── basic.py      # обработчики с Router\n└── locales/\n    ├── uz.json\n    ├── ru.json\n    └── en.json<\/code><\/pre><\/figure><p>Откройте <code>.env<\/code> и вместо <code>BOT_TOKEN<\/code> впишите токен, который выдал @BotFather.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">.env<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">BOT_TOKEN=123456:ABC-your-token\nDATABASE_URL=sqlite:///bot.db\nADMINS=123456789,987654321\nTZ=Asia/Tashkent<\/code><\/pre><\/figure><h2 id=\"проверить-версию\">Проверить версию<a class=\"anchor\" href=\"#\" data-anchor=\"проверить-версию\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Команда <code>nicebot version<\/code> показывает версии библиотеки, Bot API и Python.<\/p>", "toc": [["создать-готовый-проект", "Создать готовый проект"], ["проверить-версию", "Проверить версию"]], "text": "Нужен Python 3.10 или новее. Terminal Часть в квадратных скобках устанавливает драйвер нужной базы. SQLite работает без дополнений. Создать готовый проект Terminal Команда создаёт такую структуру: mybot/ Откройте .env и вместо BOT_TOKEN впишите токен, который выдал @BotFather. .env Проверить версию Команда nicebot version показывает версии библиотеки, Bot API и Python.", "min": 1}, "first-bot": {"title": "Первый бот", "desc": "Получить токен, написать 6 строк и запустить — пять минут.", "html": "<h2 id=\"1-получите-токен\">1. Получите токен<a class=\"anchor\" href=\"#\" data-anchor=\"1-получите-токен\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Откройте @BotFather в Telegram, отправьте <code>/newbot<\/code>, задайте имя и username. Вы получите токен вида <code>123456:ABC-DEF...<\/code>. Никому его не показывайте.<\/p><h2 id=\"2-напишите-код\">2. Напишите код<a class=\"anchor\" href=\"#\" data-anchor=\"2-напишите-код\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Создайте файл <code>bot.py<\/code>:<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Salom, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><h2 id=\"3-запустите\">3. Запустите<a class=\"anchor\" href=\"#\" data-anchor=\"3-запустите\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">python bot.py<\/code><\/pre><\/figure><p>В терминале появится <code>✅ @ваш_бот ishga tushdi<\/code>. Напишите боту <code>/st
