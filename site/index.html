window.NB_DATA = {"nav": [["start", ["intro", "install", "first-bot", "concepts"]], ["basics", ["handlers", "ctx", "formatting"]], ["ui", ["buttons", "keyboards", "conversations", "validators", "state", "menus"]], ["data", ["database", "users", "i18n"]], ["business", ["admin", "broadcast", "payments", "groups"]], ["advanced", ["middleware", "miniapp", "scheduler", "deploy", "testing"]], ["reference", ["features", "api"]]], "langs": {"uz": {"ui": {"search": "Qidirish…", "on_this_page": "Shu sahifada", "copy": "Nusxa", "copied": "Olindi", "prev": "Oldingi", "next": "Keyingi", "menu": "Bo'limlar", "no_results": "Hech narsa topilmadi", "theme": "Mavzu", "edit_hint": "Bot API", "tagline": "Telegram botlar uchun Python kutubxonasi", "home": "Bosh sahifa", "docs": "Qo'llanma", "features_tab": "Imkoniyatlar", "api_tab": "Bot API", "result": "Natija", "code": "Kod", "overview": "Umumiy ko'rinish", "pages_n": "{n} ta sahifa", "read_min": "{n} daqiqada o'qiladi", "edit": "GitHub'da tahrirlash", "search_btn": "Qidirish", "search_hint_nav": "tanlash", "search_hint_open": "ochish", "search_hint_close": "yopish", "replay": "Qayta ko'rsatish", "edited": "tahrirlandi", "start_reading": "O'qishni boshlash", "copy_link": "Havolani nusxalash", "lang": "Til", "bot": "bot", "online": "onlayn", "footer_docs": "Qo'llanma", "footer_res": "Manbalar", "footer_note": "MIT litsenziyasi ostida ochiq kodli.", "changelog": "O'zgarishlar"}, "groups": {"start": "Boshlash", "basics": "Asoslar", "ui": "Tugmalar va suhbat", "data": "Ma'lumotlar", "business": "Biznes vositalari", "advanced": "Ilg'or", "reference": "Ma'lumotnoma"}, "groupDesc": {"start": "O'rnatishdan birinchi ishlaydigan botgacha. Yangi bo'lsangiz, shu yerdan boshlang.", "basics": "Handlerlar, ctx obyekti va matn formatlash — har bir botning poydevori.", "ui": "Tugmalar, klaviaturalar, savol-javob va menyular: foydalanuvchi ko'radigan hamma narsa.", "data": "Baza, foydalanuvchilar va ko'p tillilik.", "business": "Admin panel, broadcast, to'lovlar va guruhlarni boshqarish.", "advanced": "Middleware, Mini App, rejalashtirish, deploy va testlar.", "reference": "Barcha imkoniyatlar ro'yxati va Bot API ma'lumotnomasi."}, "pages": {"intro": {"title": "Kirish", "desc": "nicebot nima, u nimani osonlashtiradi va aiogram'dan qanday farq qiladi.", "html": "<p>nicebot — Telegram bot yozishni iloji boricha sodda qiladigan Python kutubxonasi. Bitta import, bitta obyekt va oddiy funksiyalar. Baza, tugmalar, suhbatlar, tarjimalar, statistika va admin panel ichida tayyor turadi.<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Salom, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>Bu to'liq ishlaydigan bot. Unda <code>Dispatcher<\/code>, <code>Router<\/code> yoki holatlar klassi yo'q. Foydalanuvchi esa avtomatik bazaga saqlanadi.<\/p><h2 id=\"nega-nicebot\">Nega nicebot?<a class=\"anchor\" href=\"#\" data-anchor=\"nega-nicebot\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Oddiy ro'yxatdan o'tish botini ikki usulda solishtiramiz. Avval aiogram:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import asyncio\nfrom aiogram import Bot, Dispatcher, F, Router\nfrom aiogram.filters import Command, CommandStart\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.fsm.state import State, StatesGroup\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import Message\n\nrouter = Router()\n\nclass Reg(StatesGroup):\n    name = State()\n    age = State()\n\n@router.message(CommandStart())\nasync def start(message: Message, state: FSMContext):\n    await state.set_state(Reg.name)\n    await message.answer(\"Ismingiz?\")\n\n@router.message(Reg.name)\nasync def got_name(message: Message, state: FSMContext):\n    await state.update_data(name=message.text)\n    await state.set_state(Reg.age)\n    await message.answer(\"Yoshingiz?\")\n\n@router.message(Reg.age)\nasync def got_age(message: Message, state: FSMContext):\n    if not message.text.isdigit():\n        await message.answer(\"Butun son kiriting.\")\n        return\n    data = await state.get_data()\n    await state.clear()\n    await message.answer(f\"{data['name']}, {message.text} yosh\")\n\nasync def main():\n    bot = Bot(\"TOKEN\")\n    dp = Dispatcher(storage=MemoryStorage())\n    dp.include_router(router)\n    await dp.start_polling(bot)\n\nasyncio.run(main())<\/code><\/pre><\/figure><p>Endi xuddi shu bot nicebot'da:<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"TOKEN\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    name = await ctx.ask(\"Ismingiz?\")\n    age = await ctx.ask(\"Yoshingiz?\", int)\n    await ctx.reply(f\"{name}, {age} yosh\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Ismingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:2\"><p>Ali<\/p><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Yoshingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:4\"><p>yigirma<\/p><\/div><div class=\"msg bot\" style=\"--i:5\"><p>Butun son kiriting.<\/p><\/div><div class=\"msg me\" style=\"--i:6\"><p>20<\/p><\/div><div class=\"msg bot\" style=\"--i:7\"><p>Ali, 20 yosh<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><p><code>ctx.ask()<\/code> savol beradi va javobni kutadi. <code>int<\/code> bersangiz, son kiritilmaguncha muloyim qayta so'raydi. <code>StatesGroup<\/code> yozish, holatni saqlash va tozalash kerak emas.<\/p><h2 id=\"ichida-nimalar-bor\">Ichida nimalar bor<a class=\"anchor\" href=\"#\" data-anchor=\"ichida-nimalar-bor\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><ul><li><strong>Bot API 10.3 to'liq:<\/strong> 403 ta tur va 185 ta metod rasmiy spetsifikatsiyadan generatsiya qilingan<\/li><li><strong>Ichki ORM:<\/strong> SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan<\/li><li><strong>Suhbatlar:<\/strong> <code>ask<\/code>, <code>confirm<\/code>, <code>choose<\/code>, <code>form<\/code> va tayyor validatorlar<\/li><li><strong>Tugmalar:<\/strong> <code>on_click<\/code>, shablonlar, toggle, muddatli va bir martalik tugmalar, avto-joylashuv<\/li><li><strong>Biznes:<\/strong> referal, broadcast, statistika, admin panel, majburiy obuna, support, Telegram Stars<\/li><li><strong>Ishonchlilik:<\/strong> flood-wait'ni o'zi kutadi, tarmoq xatosida qayta uradi, restartda update yo'qolmaydi<\/li><li><strong>Tezlik:<\/strong> msgspec turlari va bitta ulanish pooli<\/li><\/ul><p>To'liq ro'yxat <a href=\"#features\">50 ta imkoniyat<\/a> sahifasida.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>nicebot <code>async<\/code> asosida ishlaydi. Har bir handler <code>async def<\/code> bo'ladi, Telegram'ga har bir murojaat esa <code>await<\/code> bilan yoziladi.<\/p><\/aside>", "toc": [["nega-nicebot", "Nega nicebot?"], ["ichida-nimalar-bor", "Ichida nimalar bor"]], "text": "nicebot — Telegram bot yozishni iloji boricha sodda qiladigan Python kutubxonasi. Bitta import, bitta obyekt va oddiy funksiyalar. Baza, tugmalar, suhbatlar, tarjimalar, statistika va admin panel ichida tayyor turadi. bot.py Bu to'liq ishlaydigan bot. Unda Dispatcher , Router yoki holatlar klassi yo'q. Foydalanuvchi esa avtomatik bazaga saqlanadi. Nega nicebot? Oddiy ro'yxatdan o'tish botini ikki usulda solishtiramiz. Avval aiogram: bot.py Endi xuddi shu bot nicebot'da: bot.py ctx.ask() savol beradi va javobni kutadi. int bersangiz, son kiritilmaguncha muloyim qayta so'raydi. StatesGroup yozish, holatni saqlash va tozalash kerak emas. Ichida nimalar bor Bot API 10.3 to'liq: 403 ta tur va 185 ta metod rasmiy spetsifikatsiyadan generatsiya qilingan Ichki ORM: SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan Suhbatlar: ask , confirm , choose , form va tayyor validatorlar Tugmalar: on_click , shablonlar, toggle, muddatli va bir martalik tugmalar, avto-joylashuv Biznes: referal, broadcast, statistika, admin panel, majburiy obuna, support, Telegram Stars Ishonchlilik: flood-wait'ni o'zi kutadi, tarmoq xatosida qayta uradi, restartda update yo'qolmaydi Tezlik: msgspec turlari va bitta ulanish pooli To'liq ro'yxat 50 ta imkoniyat sahifasida. nicebot async asosida ishlaydi. Har bir handler async def bo'ladi, Telegram'ga har bir murojaat esa await bilan yoziladi.", "min": 2}, "install": {"title": "O'rnatish", "desc": "Kutubxonani o'rnating va bitta buyruq bilan tayyor loyiha yarating.", "html": "<p>Python 3.10 yoki undan yangi versiya kerak.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">pip install nicebot                 # SQLite bilan\npip install \"nicebot[postgres]\"     # + PostgreSQL\npip install \"nicebot[mysql]\"        # + MySQL / MariaDB\npip install \"nicebot[mongo]\"        # + MongoDB\npip install \"nicebot[redis]\"        # + Redis\npip install \"nicebot[all]\"          # hammasi<\/code><\/pre><\/figure><p>Kvadrat qavs ichidagi qism kerakli baza drayverini qo'shib o'rnatadi. SQLite qo'shimchasiz ishlaydi.<\/p><h2 id=\"tayyor-loyiha-yaratish\">Tayyor loyiha yaratish<a class=\"anchor\" href=\"#\" data-anchor=\"tayyor-loyiha-yaratish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">nicebot new mybot\ncd mybot\npython bot.py<\/code><\/pre><\/figure><p>Buyruq quyidagi tuzilmani yaratadi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">mybot/<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-plaintext\">mybot/\n├── bot.py            # asosiy fayl\n├── .env              # BOT_TOKEN, DATABASE_URL, ADMINS\n├── handlers/\n│   └── basic.py      # Router bilan handlerlar\n└── locales/\n    ├── uz.json\n    ├── ru.json\n    └── en.json<\/code><\/pre><\/figure><p><code>.env<\/code> faylini ochib, <code>BOT_TOKEN<\/code> o'rniga @BotFather bergan tokenni yozing.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">.env<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">BOT_TOKEN=123456:ABC-your-token\nDATABASE_URL=sqlite:///bot.db\nADMINS=123456789,987654321\nTZ=Asia/Tashkent<\/code><\/pre><\/figure><h2 id=\"versiyani-tekshirish\">Versiyani tekshirish<a class=\"anchor\" href=\"#\" data-anchor=\"versiyani-tekshirish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>nicebot version<\/code> buyrug'i kutubxona, Bot API va Python versiyalarini ko'rsatadi.<\/p>", "toc": [["tayyor-loyiha-yaratish", "Tayyor loyiha yaratish"], ["versiyani-tekshirish", "Versiyani tekshirish"]], "text": "Python 3.10 yoki undan yangi versiya kerak. Terminal Kvadrat qavs ichidagi qism kerakli baza drayverini qo'shib o'rnatadi. SQLite qo'shimchasiz ishlaydi. Tayyor loyiha yaratish Terminal Buyruq quyidagi tuzilmani yaratadi: mybot/ .env faylini ochib, BOT_TOKEN o'rniga @BotFather bergan tokenni yozing. .env Versiyani tekshirish nicebot version buyrug'i kutubxona, Bot API va Python versiyalarini ko'rsatadi.", "min": 1}, "first-bot": {"title": "Birinchi bot", "desc": "Token olish, 6 qatorlik kod va ishga tushirish — besh daqiqalik ish.", "html": "<h2 id=\"1-token-oling\">1. Token oling<a class=\"anchor\" href=\"#\" data-anchor=\"1-token-oling\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Telegram'da @BotFather'ni oching, <code>/newbot<\/code> yozing, botga nom va username bering. U <code>123456:ABC-DEF...<\/code> ko'rinishidagi token beradi. Tokenni hech kimga ko'rsatmang.<\/p><h2 id=\"2-kod-yozing\">2. Kod yozing<a class=\"anchor\" href=\"#\" data-anchor=\"2-kod-yozing\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>bot.py<\/code> faylini yarating:<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Salom, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><h2 id=\"3-ishga-tushiring\">3. Ishga tushiring<a class=\"anchor\" href=\"#\" data-anchor=\"3-ishga-tushiring\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">python bot.py<\/code><\/pre><\/figure><p>Terminalda <code>✅ @sizning_bot ishga tushdi<\/code> yozuvi chiqadi. Telegram'da botingizga <code>/start<\/code> yozing, u ismingiz bilan salomlashadi.<\/p><h2 id=\"nima-boldi\">Nima bo'ldi?<a class=\"anchor\" href=\"#\" data-anchor=\"nima-boldi\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><thead><tr><th>Qator<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>Nicebot(token=...)<\/code><\/td><td>Botni yaratadi. Baza berilmasa, xotiradagi SQLite ishlatiladi<\/td><\/tr><tr><td><code>@bot.command(\"start\")<\/code><\/td><td><code>/start<\/code> buyrug'i kelganda pastdagi funksiyani chaqiradi<\/td><\/tr><tr><td><code>async def start(ctx)<\/code><\/td><td><code>ctx<\/code> joriy xabar haqidagi hamma narsani biladi<\/td><\/tr><tr><td><code>await ctx.reply(...)<\/code><\/td><td>Shu chatga javob yuboradi<\/td><\/tr><tr><td><code>bot.start()<\/code><\/td><td>Telegram'dan xabarlarni olishni boshlaydi. To'xtatish uchun Ctrl+C<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Ma'lumotlar restartdan keyin ham saqlansin desangiz, <code>Nicebot(token=..., db=\"sqlite:///bot.db\")<\/code> deb yozing.<\/p><\/aside><h2 id=\"kod-ozgarganda-avtomatik-qayta-yuklash\">Kod o'zgarganda avtomatik qayta yuklash<a class=\"anchor\" href=\"#\" data-anchor=\"kod-ozgarganda-avtomatik-qayta-yuklash\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>bot.start(reload=True)<\/code> bilan har safar faylni saqlaganingizda bot o'zi qayta ishga tushadi. Ishlab chiqish paytida bu juda qulay.<\/p>", "toc": [["1-token-oling", "1. Token oling"], ["2-kod-yozing", "2. Kod yozing"], ["3-ishga-tushiring", "3. Ishga tushiring"], ["nima-boldi", "Nima bo'ldi?"], ["kod-ozgarganda-avtomatik-qayta-yuklash", "Kod o'zgarganda avtomatik qayta yuklash"]], "text": "1. Token oling Telegram'da @BotFather'ni oching, /newbot yozing, botga nom va username bering. U 123456:ABC-DEF... ko'rinishidagi token beradi. Tokenni hech kimga ko'rsatmang. 2. Kod yozing bot.py faylini yarating: bot.py 3. Ishga tushiring Terminal Terminalda ✅ @sizning_bot ishga tushdi yozuvi chiqadi. Telegram'da botingizga /start yozing, u ismingiz bilan salomlashadi. Nima bo'ldi? Qator Ma'nosi Nicebot(token=...) Botni yaratadi. Baza berilmasa, xotiradagi SQLite ishlatiladi @bot.command(\"start\") /start buyrug'i kelganda pastdagi funksiyani chaqiradi async def start(ctx) ctx joriy xabar haqidagi hamma narsani biladi await ctx.reply(...) Shu chatga javob yuboradi bot.start() Telegram'dan xabarlarni olishni boshlaydi. To'xtatish uchun Ctrl+C Ma'lumotlar restartdan keyin ham saqlansin desangiz, Nicebot(token=..., db=\"sqlite:///bot.db\") deb yozing. Kod o'zgarganda avtomatik qayta yuklash bot.start(reload=True) bilan har safar faylni saqlaganingizda bot o'zi qayta ishga tushadi. Ishlab chiqish paytida bu juda qulay.", "min": 1}, "concepts": {"title": "Asosiy tushunchalar", "desc": "Bot, handler va ctx: nicebot'dagi uchta asosiy tushuncha.", "html": "<p>nicebot'da faqat uchta tushuncha bor.<\/p><h2 id=\"bot\">Bot<a class=\"anchor\" href=\"#\" data-anchor=\"bot\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Nicebot<\/code> — butun ilovangiz. Token, baza, adminlar va til kabi sozlamalar shu yerda beriladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(\n    token=\"...\",\n    db=\"postgres://user:pass@localhost/mybot\",\n    admins=[123456789],\n    lang=\"uz\",                       # standart til\n    required_channels=[\"@mykanal\"],  # majburiy obuna\n    support_chat=-1001234567890,     # yordam guruhi\n    captcha=\"2m\",                    # guruhga yangi kirganlarga\n    tz=\"Asia/Tashkent\",\n)<\/code><\/pre><\/figure><h2 id=\"handler\">Handler<a class=\"anchor\" href=\"#\" data-anchor=\"handler\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Handler — biror hodisa bo'lganda chaqiriladigan <code>async<\/code> funksiya. Dekorator qachon chaqirilishini aytadi: <code>@bot.command(\"start\")<\/code>, <code>@bot.text(\"salom\")<\/code>, <code>@bot.callback(\"buy:{id:int}\")<\/code> va hokazo. Handlerlar yozilgan tartibda tekshiriladi va birinchi mos kelgani ishlaydi.<\/p><h2 id=\"ctx-kontekst\">ctx (kontekst)<a class=\"anchor\" href=\"#\" data-anchor=\"ctx-kontekst\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Har bir xabar uchun yangi <code>ctx<\/code> yaratiladi va handlerga birinchi argument bo'lib keladi. U ikki xil ish qiladi:<\/p><ul><li><strong>ma'lumot beradi:<\/strong> <code>ctx.text<\/code>, <code>ctx.user<\/code>, <code>ctx.chat_id<\/code>, <code>ctx.args<\/code>…<\/li><li><strong>amal bajaradi:<\/strong> <code>ctx.reply()<\/code>, <code>ctx.edit()<\/code>, <code>ctx.ask()<\/code>, <code>ctx.photo()<\/code>…<\/li><\/ul><h2 id=\"hayot-sikli\">Hayot sikli<a class=\"anchor\" href=\"#\" data-anchor=\"hayot-sikli\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Xabar kelgach quyidagilar sodir bo'ladi:<\/p><ol><li>Agar foydalanuvchi <code>ctx.ask()<\/code> javobini kutayotgan bo'lsa, xabar o'sha yerga uzatiladi<\/li><li>Ichki middleware'lar ishlaydi: foydalanuvchi bazaga saqlanadi, texnik ishlar rejimi va majburiy obuna tekshiriladi<\/li><li>Sizning middleware'laringiz ishlaydi<\/li><li>Birinchi mos handler chaqiriladi<\/li><li>Hech biri mos kelmasa, <code>@bot.fallback()<\/code> yoki support rejimi ishlaydi<\/li><li>Tugma bosilgan bo'lsa va siz javob bermagan bo'lsangiz, <code>answerCallbackQuery<\/code> avtomatik yuboriladi<\/li><\/ol>", "toc": [["bot", "Bot"], ["handler", "Handler"], ["ctx-kontekst", "ctx (kontekst)"], ["hayot-sikli", "Hayot sikli"]], "text": "nicebot'da faqat uchta tushuncha bor. Bot Nicebot — butun ilovangiz. Token, baza, adminlar va til kabi sozlamalar shu yerda beriladi. Python Handler Handler — biror hodisa bo'lganda chaqiriladigan async funksiya. Dekorator qachon chaqirilishini aytadi: @bot.command(\"start\") , @bot.text(\"salom\") , @bot.callback(\"buy:{id:int}\") va hokazo. Handlerlar yozilgan tartibda tekshiriladi va birinchi mos kelgani ishlaydi. ctx (kontekst) Har bir xabar uchun yangi ctx yaratiladi va handlerga birinchi argument bo'lib keladi. U ikki xil ish qiladi: ma'lumot beradi: ctx.text , ctx.user , ctx.chat_id , ctx.args … amal bajaradi: ctx.reply() , ctx.edit() , ctx.ask() , ctx.photo() … Hayot sikli Xabar kelgach quyidagilar sodir bo'ladi: Agar foydalanuvchi ctx.ask() javobini kutayotgan bo'lsa, xabar o'sha yerga uzatiladi Ichki middleware'lar ishlaydi: foydalanuvchi bazaga saqlanadi, texnik ishlar rejimi va majburiy obuna tekshiriladi Sizning middleware'laringiz ishlaydi Birinchi mos handler chaqiriladi Hech biri mos kelmasa, @bot.fallback() yoki support rejimi ishlaydi Tugma bosilgan bo'lsa va siz javob bermagan bo'lsangiz, answerCallbackQuery avtomatik yuboriladi", "min": 1}, "handlers": {"title": "Handlerlar", "desc": "Buyruq, matn va boshqa hodisalarni ushlash, filtrlar va Router.", "html": "<h2 id=\"turlari\">Turlari<a class=\"anchor\" href=\"#\" data-anchor=\"turlari\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"help\", description=\"Yordam\")\nasync def help_(ctx):\n    await ctx.reply(\"Men nima qila olaman...\")\n\n@bot.text(\"salom\")                       # aniq matn (katta-kichik harf farqsiz)\nasync def salom(ctx):\n    await ctx.reply(\"Va alaykum assalom!\")\n\n@bot.text(contains=\"narx\")               # ichida \"narx\" bo'lsa\nasync def narx(ctx):\n    await ctx.reply(\"Narxlar: ...\")\n\n@bot.text(regex=r\"^buy (?P&lt;qty&gt;\\d+)$\")  # regex guruhlari parametr bo'ladi\nasync def buy(ctx, qty: int):\n    await ctx.reply(f\"{qty} dona\")\n\n@bot.on(\"photo\")                          # rasm kelsa\nasync def photo(ctx):\n    await ctx.reply(\"Chiroyli rasm!\")\n\n@bot.text()                               # istalgan oddiy matn\nasync def echo(ctx):\n    await ctx.reply(ctx.text)\n\n@bot.fallback()                           # hech narsa mos kelmasa\nasync def unknown(ctx):\n    await ctx.reply(\"Tushunmadim 🤔\")<\/code><\/pre><\/figure><h2 id=\"handler-parametrlari\">Handler parametrlari<a class=\"anchor\" href=\"#\" data-anchor=\"handler-parametrlari\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Har qanday dekoratorga quyidagi parametrlarni qo'shish mumkin:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"admin\", admin=True)              # faqat adminlar\n@bot.command(\"bonus\", throttle=\"1d\")           # kuniga 1 marta\n@bot.command(\"report\", typing=True)            # \"yozmoqda...\" ko'rsatadi\n@bot.text(\"salom\", chat=\"private\")             # faqat shaxsiy chatda\n@bot.text(state=\"waiting_phone\")               # faqat shu holatda\n@bot.command(\"vip\", users=[111, 222])          # faqat shu odamlar\n@bot.message(F.photo &amp; F.private)              # filtrlar\n@bot.deep_link(r\"promo_(?P&lt;code&gt;\\w+)\")         # t.me/bot?start=promo_X\nasync def handler(ctx): ...<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Parametr<\/th><th>Nima qiladi<\/th><\/tr><\/thead><tbody><tr><td><code>admin=True<\/code><\/td><td>Faqat <code>Nicebot(admins=[...])<\/code> dagilar uchun<\/td><\/tr><tr><td><code>chat=\"private\"<\/code><\/td><td><code>private<\/code>, <code>group<\/code>, <code>supergroup<\/code>, <code>channel<\/code><\/td><\/tr><tr><td><code>throttle=\"3s\"<\/code><\/td><td>Bir foydalanuvchi uchun tezlik chegarasi. Oshib ketsa, \"⏳ Biroz kuting\" chiqadi<\/td><\/tr><tr><td><code>typing=True<\/code><\/td><td>Handler ishlayotgan paytda \"yozmoqda…\" ko'rinadi. <code>\"upload_photo\"<\/code> ham bo'ladi<\/td><\/tr><tr><td><code>state=\"x\"<\/code><\/td><td>Faqat foydalanuvchi shu holatda bo'lsa ishlaydi<\/td><\/tr><tr><td><code>users=[...]<\/code><\/td><td>Faqat shu id'lar uchun<\/td><\/tr><tr><td><code>description=\"...\"<\/code><\/td><td>Buyruq Telegram menyusida paydo bo'ladi. <code>{\"uz\": ..., \"ru\": ...}<\/code> ham bo'ladi<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"filtrlar\">Filtrlar<a class=\"anchor\" href=\"#\" data-anchor=\"filtrlar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>F<\/code> tayyor filtrlarni beradi. Ularni <code>&amp;<\/code> (va), <code>|<\/code> (yoki) va <code>~<\/code> (emas) bilan birlashtirish mumkin.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import F\n\n@bot.message(F.photo | F.document)\n@bot.message(F.text &amp; ~F.command)\n@bot.message(F.regex(r\"\\d{4}\"))\n@bot.message(F.contains(\"chegirma\", \"aksiya\"))\n@bot.message(F.user(123, 456))\n@bot.message(lambda ctx: len(ctx.text or \"\") &gt; 100)   # o'z filtringiz\nasync def h(ctx): ...<\/code><\/pre><\/figure><h2 id=\"router-kodni-fayllarga-bolish\">Router: kodni fayllarga bo'lish<a class=\"anchor\" href=\"#\" data-anchor=\"router-kodni-fayllarga-bolish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># handlers/shop.py\nfrom nicebot import Router\n\nrouter = Router(chat=\"private\")   # barcha handlerlarga qo'llanadi\n\n@router.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Do'kon\")\n\n# bot.py\nbot.include(\"handlers\")           # papkadagi barcha Router'lar\n# yoki: from handlers.shop import router; bot.include(router)<\/code><\/pre><\/figure><h2 id=\"barcha-hodisa-turlari\">Barcha hodisa turlari<a class=\"anchor\" href=\"#\" data-anchor=\"barcha-hodisa-turlari\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>@bot.callback<\/code>, <code>@bot.inline<\/code>, <code>@bot.chosen_inline<\/code>, <code>@bot.edited<\/code>, <code>@bot.channel<\/code>, <code>@bot.join<\/code>, <code>@bot.leave<\/code>, <code>@bot.album<\/code>, <code>@bot.paid<\/code>, <code>@bot.pre_checkout<\/code>, <code>@bot.webapp_data<\/code>, <code>@bot.my_chat_member<\/code>, <code>@bot.chat_member<\/code>, <code>@bot.join_request<\/code>, <code>@bot.reaction<\/code>, <code>@bot.poll_answer<\/code>. Qolgan har qanday update uchun: <code>@bot.event(\"chat_boost\")<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Handlerda <code>raise SkipHandler<\/code> desangiz, keyingi mos handler ishlaydi.<\/p><\/aside>", "toc": [["turlari", "Turlari"], ["handler-parametrlari", "Handler parametrlari"], ["filtrlar", "Filtrlar"], ["router-kodni-fayllarga-bolish", "Router: kodni fayllarga bo'lish"], ["barcha-hodisa-turlari", "Barcha hodisa turlari"]], "text": "Turlari Python Handler parametrlari Har qanday dekoratorga quyidagi parametrlarni qo'shish mumkin: Python Parametr Nima qiladi admin=True Faqat Nicebot(admins=[...]) dagilar uchun chat=\"private\" private , group , supergroup , channel throttle=\"3s\" Bir foydalanuvchi uchun tezlik chegarasi. Oshib ketsa, \"⏳ Biroz kuting\" chiqadi typing=True Handler ishlayotgan paytda \"yozmoqda…\" ko'rinadi. \"upload_photo\" ham bo'ladi state=\"x\" Faqat foydalanuvchi shu holatda bo'lsa ishlaydi users=[...] Faqat shu id'lar uchun description=\"...\" Buyruq Telegram menyusida paydo bo'ladi. {\"uz\": ..., \"ru\": ...} ham bo'ladi Filtrlar F tayyor filtrlarni beradi. Ularni & (va), | (yoki) va ~ (emas) bilan birlashtirish mumkin. Python Router: kodni fayllarga bo'lish Python Barcha hodisa turlari @bot.callback , @bot.inline , @bot.chosen_inline , @bot.edited , @bot.channel , @bot.join , @bot.leave , @bot.album , @bot.paid , @bot.pre_checkout , @bot.webapp_data , @bot.my_chat_member , @bot.chat_member , @bot.join_request , @bot.reaction , @bot.poll_answer . Qolgan har qanday update uchun: @bot.event(\"chat_boost\") . Handlerda raise SkipHandler desangiz, keyingi mos handler ishlaydi.", "min": 2}, "ctx": {"title": "ctx — kontekst", "desc": "Kelgan xabar haqidagi ma'lumotlar, javob yuborish va tahrirlash.", "html": "<h2 id=\"malumotlar\">Ma'lumotlar<a class=\"anchor\" href=\"#\" data-anchor=\"malumotlar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.message()\nasync def info(ctx):\n    ctx.text        # xabar matni (yoki rasm izohi)\n    ctx.name        # foydalanuvchi ismi\n    ctx.user        # bazadagi foydalanuvchi (avtomatik saqlanadi)\n    ctx.user_id     # Telegram id\n    ctx.chat_id     # chat id\n    ctx.command     # \"/start ref_5\" -&gt; \"start\"\n    ctx.args        # \"/give 10 ali\" -&gt; [\"10\", \"ali\"]\n    ctx.payload     # deep link: \"ref_5\"\n    ctx.lang        # \"uz\", \"ru\", \"en\"\n    ctx.is_private  # shaxsiy chatmi\n    ctx.is_admin    # bot adminimi\n    ctx.message     # to'liq Message obyekti\n    ctx.mention     # bosiladigan ism (HTML)<\/code><\/pre><\/figure><h2 id=\"yuborish\">Yuborish<a class=\"anchor\" href=\"#\" data-anchor=\"yuborish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Salom!\")                          # matn\nawait ctx.reply(\"Tanlang\", buttons=[\"A\", \"B\"])    # inline tugmalar bilan\nawait ctx.reply(\"Yozing\", keyboard=[\"Menyu\"])     # pastki klaviatura\nawait ctx.reply(\"30 soniyada o'chadi\", delete_after=\"30s\")\nawait ctx.reply(\"Ovozsiz\", silent=True, protect=True)\n\nawait ctx.photo(\"rasm.jpg\", caption=\"Mana\")       # fayl, URL yoki file_id\nawait ctx.video(\"https://site.uz/v.mp4\")\nawait ctx.document(\"hisobot.pdf\")\nawait ctx.media_group([\"1.jpg\", \"2.jpg\", \"3.jpg\"], caption=\"Albom\")\nawait ctx.location(40.10, 65.37)\nawait ctx.poll(\"Qaysi biri?\", [\"Python\", \"Go\"])\nawait ctx.dice(\"🎯\")<\/code><\/pre><\/figure><p>Yuborish metodlarining hammasi bir xil qo'shimcha parametrlarni qabul qiladi:<\/p><div class=\"table\"><table><thead><tr><th>Parametr<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>buttons=<\/code><\/td><td>Inline tugmalar (<a href=\"#buttons\">Tugmalar<\/a>)<\/td><\/tr><tr><td><code>keyboard=<\/code><\/td><td>Pastki klaviatura. <code>False<\/code> bo'lsa yopadi<\/td><\/tr><tr><td><code>columns=<\/code><\/td><td>Tugmalar ustunlari soni<\/td><\/tr><tr><td><code>delete_after=\"1m\"<\/code><\/td><td>Xabarni avtomatik o'chirish<\/td><\/tr><tr><td><code>silent=True<\/code><\/td><td>Ovozsiz bildirishnoma<\/td><\/tr><tr><td><code>protect=True<\/code><\/td><td>Forward va saqlashni taqiqlash<\/td><\/tr><tr><td><code>quote=True<\/code><\/td><td>Kelgan xabarga reply qilib yuborish<\/td><\/tr><tr><td><code>preview=False<\/code><\/td><td>Havola preview'sini o'chirish<\/td><\/tr><tr><td><code>chat_id=<\/code><\/td><td>Boshqa chatga yuborish<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"tahrirlash-va-javob\">Tahrirlash va javob<a class=\"anchor\" href=\"#\" data-anchor=\"tahrirlash-va-javob\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.edit(\"Yangi matn\")               # tugma bosilgan xabarni tahrirlash\nawait ctx.edit_buttons([Button(\"OK\", data=\"ok\")])\nawait ctx.respond(\"Javob\")                 # tugmadan bo'lsa tahrirlaydi, aks holda yuboradi\nawait ctx.answer(\"Saqlandi ✅\")             # tugma ustida kichik xabar\nawait ctx.answer(\"Diqqat!\", alert=True)    # oyna ko'rinishida\nawait ctx.delete()                          # xabarni o'chirish\nawait ctx.react(\"🔥\")                       # reaksiya\nawait ctx.pin()<\/code><\/pre><\/figure><p><code>ctx.edit()<\/code> xabarda rasm bo'lsa izohni, bo'lmasa matnni o'zi tanlab tahrirlaydi. \"message is not modified\" xatosini esa jimgina o'tkazib yuboradi.<\/p><h2 id=\"yana-foydali-metodlar\">Yana foydali metodlar<a class=\"anchor\" href=\"#\" data-anchor=\"yana-foydali-metodlar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><thead><tr><th>Metod<\/th><th>Nima qiladi<\/th><\/tr><\/thead><tbody><tr><td><code>ctx.forward(chat)<\/code> / <code>ctx.copy(chat)<\/code><\/td><td>Xabarni boshqa chatga yuborish<\/td><\/tr><tr><td><code>ctx.download()<\/code> / <code>ctx.save(path)<\/code><\/td><td>Faylni yuklab olish<\/td><\/tr><tr><td><code>ctx.action(\"upload_photo\")<\/code><\/td><td>Status ko'rsatish<\/td><\/tr><tr><td><code>ctx.is_member(\"@kanal\")<\/code><\/td><td>Obunani tekshirish<\/td><\/tr><tr><td><code>ctx.notify_admins(text)<\/code><\/td><td>Adminlarga xabar<\/td><\/tr><tr><td><code>ctx.background(func)<\/code><\/td><td>Fon vazifasi<\/td><\/tr><tr><td><code>ctx.t(\"key\")<\/code><\/td><td>Tarjima<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["malumotlar", "Ma'lumotlar"], ["yuborish", "Yuborish"], ["tahrirlash-va-javob", "Tahrirlash va javob"], ["yana-foydali-metodlar", "Yana foydali metodlar"]], "text": "Ma'lumotlar Python Yuborish Python Yuborish metodlarining hammasi bir xil qo'shimcha parametrlarni qabul qiladi: Parametr Ma'nosi buttons= Inline tugmalar ( Tugmalar ) keyboard= Pastki klaviatura. False bo'lsa yopadi columns= Tugmalar ustunlari soni delete_after=\"1m\" Xabarni avtomatik o'chirish silent=True Ovozsiz bildirishnoma protect=True Forward va saqlashni taqiqlash quote=True Kelgan xabarga reply qilib yuborish preview=False Havola preview'sini o'chirish chat_id= Boshqa chatga yuborish Tahrirlash va javob Python ctx.edit() xabarda rasm bo'lsa izohni, bo'lmasa matnni o'zi tanlab tahrirlaydi. \"message is not modified\" xatosini esa jimgina o'tkazib yuboradi. Yana foydali metodlar Metod Nima qiladi ctx.forward(chat) / ctx.copy(chat) Xabarni boshqa chatga yuborish ctx.download() / ctx.save(path) Faylni yuklab olish ctx.action(\"upload_photo\") Status ko'rsatish ctx.is_member(\"@kanal\") Obunani tekshirish ctx.notify_admins(text) Adminlarga xabar ctx.background(func) Fon vazifasi ctx.t(\"key\") Tarjima", "min": 1}, "formatting": {"title": "Matn formatlash", "desc": "HTML formatlash va foydalanuvchi matnini xavfsiz qo'shish.", "html": "<p>nicebot standart holatda HTML parse mode'dan foydalanadi, shuning uchun <code>&lt;b&gt;<\/code>, <code>&lt;i&gt;<\/code>, <code>&lt;code&gt;<\/code> va <code>&lt;a href&gt;<\/code> teglari darhol ishlaydi.<\/p><h2 id=\"foydalanuvchi-matni-bilan-xavfsiz-ishlash\">Foydalanuvchi matni bilan xavfsiz ishlash<a class=\"anchor\" href=\"#\" data-anchor=\"foydalanuvchi-matni-bilan-xavfsiz-ishlash\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Foydalanuvchi yozgan matnda <code>&lt;<\/code> yoki <code>&amp;<\/code> belgilari bo'lishi mumkin. To'g'ridan-to'g'ri qo'shilsa, Telegram xato beradi. <code>html()<\/code> qiymatlarni xavfsiz qiladi, shablon esa o'zgarmaydi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import html, bold, link, mention\n\nname = ctx.text                                 # foydalanuvchi yozgan matn\nawait ctx.reply(html(\"&lt;b&gt;Salom, {}!&lt;/b&gt;\", name))  # name xavfsiz escape qilinadi\nawait ctx.reply(bold(\"Muhim\") + \" xabar\")\nawait ctx.reply(link(\"Saytimiz\", \"https://tezbaraka.uz\"))<\/code><\/pre><\/figure><p>Tayyor yordamchilar: <code>bold<\/code>, <code>italic<\/code>, <code>underline<\/code>, <code>strike<\/code>, <code>spoiler<\/code>, <code>code<\/code>, <code>pre<\/code>, <code>link<\/code>, <code>mention<\/code>, <code>quote<\/code>, <code>escape<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Agar formatlashda xato bo'lsa ham bot yiqilmaydi. nicebot xabarni formatlashsiz qayta yuboradi va logga ogohlantirish yozadi.<\/p><\/aside><h2 id=\"boshqa-rejimlar\">Boshqa rejimlar<a class=\"anchor\" href=\"#\" data-anchor=\"boshqa-rejimlar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Nicebot(parse_mode=\"MarkdownV2\")<\/code> yoki formatlashsiz ishlash uchun <code>parse_mode=None<\/code>.<\/p>", "toc": [["foydalanuvchi-matni-bilan-xavfsiz-ishlash", "Foydalanuvchi matni bilan xavfsiz ishlash"], ["boshqa-rejimlar", "Boshqa rejimlar"]], "text": "nicebot standart holatda HTML parse mode'dan foydalanadi, shuning uchun <b> , <i> , <code> va <a href> teglari darhol ishlaydi. Foydalanuvchi matni bilan xavfsiz ishlash Foydalanuvchi yozgan matnda < yoki & belgilari bo'lishi mumkin. To'g'ridan-to'g'ri qo'shilsa, Telegram xato beradi. html() qiymatlarni xavfsiz qiladi, shablon esa o'zgarmaydi: Python Tayyor yordamchilar: bold , italic , underline , strike , spoiler , code , pre , link , mention , quote , escape . Agar formatlashda xato bo'lsa ham bot yiqilmaydi. nicebot xabarni formatlashsiz qayta yuboradi va logga ogohlantirish yozadi. Boshqa rejimlar Nicebot(parse_mode=\"MarkdownV2\") yoki formatlashsiz ishlash uchun parse_mode=None .", "min": 1}, "buttons": {"title": "Inline tugmalar", "desc": "Inline tugmalar: on_click, parametrlar, shablonlar va avto-joylashuv.", "html": "<h2 id=\"tugma-va-uning-amali\">Tugma va uning amali<a class=\"anchor\" href=\"#\" data-anchor=\"tugma-va-uning-amali\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Button<\/code> matn va bitta amalni oladi. Eng qulayi <code>on_click<\/code>: tugma bosilganda oddiy funksiya chaqiriladi. Callback data o'ylab topish va uni alohida handlerda tutib olish shart emas.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Button\n\nasync def buy(ctx):\n    await ctx.edit(\"✅ Sotib olindi\")\n\n@bot.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Mahsulot: Kitob — 50 000 so'm\", buttons=[\n        [Button(\"🛒 Sotib olish\", on_click=buy)],\n        [Button(\"🌐 Sayt\", url=\"https://tezbaraka.uz\"),\n         Button(\"📋 Promo\", copy=\"NICE2026\")],\n        [Button(\"📱 Ilova\", webapp=\"https://app.tezbaraka.uz\")],\n    ])<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/shop<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Mahsulot: Kitob — 50 000 so'm<\/p><div class=\"kb\"><div class=\"kb-row\"><span>🛒 Sotib olish<\/span><\/div><div class=\"kb-row\"><span>🌐 Sayt ↗<\/span><span>📋 Promo<\/span><\/div><div class=\"kb-row\"><span>📱 Ilova<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 🛒 Sotib olish<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>✅ Sotib olindi <i class=\"edited\" data-t=\"edited\"><\/i><\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><div class=\"table\"><table><thead><tr><th>Turi<\/th><th>Yozilishi<\/th><\/tr><\/thead><tbody><tr><td>Funksiya<\/td><td><code>Button(\"OK\", on_click=func)<\/code><\/td><\/tr><tr><td>Havola<\/td><td><code>Button(\"Sayt\", url=\"https://...\")<\/code><\/td><\/tr><tr><td>Mini App<\/td><td><code>Button(\"Ilova\", webapp=\"https://...\")<\/code><\/td><\/tr><tr><td>Nusxa olish<\/td><td><code>Button(\"Kod\", copy=\"PROMO\")<\/code><\/td><\/tr><tr><td>Ulashish<\/td><td><code>Button(\"Ulashish\", share=\"matn\")<\/code><\/td><\/tr><tr><td>Oddiy data<\/td><td><code>Button(\"Ha\", data=\"yes\")<\/code><\/td><\/tr><tr><td>To'lov<\/td><td><code>Button(\"To'lash\", pay=True)<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"parametr-uzatish\">Parametr uzatish<a class=\"anchor\" href=\"#\" data-anchor=\"parametr-uzatish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async def add_to_cart(ctx, id: int, qty: int):\n    await ctx.answer(f\"{id} dan {qty} ta qo'shildi\")\n\nButton(\"➕ Savatga\", on_click=add_to_cart, id=15, qty=2)<\/code><\/pre><\/figure><h2 id=\"callback-shablonlari\">Callback shablonlari<a class=\"anchor\" href=\"#\" data-anchor=\"callback-shablonlari\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.callback(\"product:{id:int}\")\nasync def product(ctx, id: int):\n    p = await Product.get(id=id)\n    await ctx.edit(f\"{p.title} — {p.price} so'm\")\n\n# tugma shu shablonni o'zi to'ldiradi:\nButton(\"Ko'rish\", on_click=product, id=5)      # callback_data = \"product:5\"<\/code><\/pre><\/figure><p>Turlar: <code>int<\/code>, <code>float<\/code>, <code>bool<\/code>, <code>str<\/code> (standart) va <code>any<\/code>. Qiymatlar handlerga to'g'ri turda keladi.<\/p><h2 id=\"avtomatik-joylashuv\">Avtomatik joylashuv<a class=\"anchor\" href=\"#\" data-anchor=\"avtomatik-joylashuv\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># ro'yxat berilsa — qisqa tugmalar bir qatorga o'zi joylashadi\nawait ctx.reply(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\", \"XL\"])\n\n# ustunlar sonini o'zingiz bering\nawait ctx.reply(\"Tanlang\", buttons=items, columns=2)\n\n# dict: matn -&gt; amal (funksiya, URL yoki data)\nawait ctx.reply(\"Menyu\", buttons={\"Profil\": profile, \"Sayt\": \"https://tezbaraka.uz\"})<\/code><\/pre><\/figure><h2 id=\"xavfsiz-tugmalar\">Xavfsiz tugmalar<a class=\"anchor\" href=\"#\" data-anchor=\"xavfsiz-tugmalar\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Button(\"🎁 Bonus olish\", on_click=bonus, once=True)          # faqat bir marta\nButton(\"⏳ Taklif\", on_click=offer, ttl=\"10m\")              # 10 daqiqadan keyin eskiradi\nButton(\"👤 Faqat siz\", on_click=mine, only=ctx.user_id)     # boshqalar bosolmaydi<\/code><\/pre><\/figure><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Telegram callback_data'ni 64 bayt bilan cheklaydi. nicebot uzun ma'lumotni bazada saqlab, tugmaga qisqa kalit qo'yadi, buni siz sezmaysiz ham. Bosilgan tugmalarga javob ham avtomatik yuboriladi, shuning uchun \"soat\" belgisi qotib qolmaydi.<\/p><\/aside>", "toc": [["tugma-va-uning-amali", "Tugma va uning amali"], ["parametr-uzatish", "Parametr uzatish"], ["callback-shablonlari", "Callback shablonlari"], ["avtomatik-joylashuv", "Avtomatik joylashuv"], ["xavfsiz-tugmalar", "Xavfsiz tugmalar"]], "text": "Tugma va uning amali Button matn va bitta amalni oladi. Eng qulayi on_click : tugma bosilganda oddiy funksiya chaqiriladi. Callback data o'ylab topish va uni alohida handlerda tutib olish shart emas. bot.py Turi Yozilishi Funksiya Button(\"OK\", on_click=func) Havola Button(\"Sayt\", url=\"https://...\") Mini App Button(\"Ilova\", webapp=\"https://...\") Nusxa olish Button(\"Kod\", copy=\"PROMO\") Ulashish Button(\"Ulashish\", share=\"matn\") Oddiy data Button(\"Ha\", data=\"yes\") To'lov Button(\"To'lash\", pay=True) Parametr uzatish Python Callback shablonlari Python Turlar: int , float , bool , str (standart) va any . Qiymatlar handlerga to'g'ri turda keladi. Avtomatik joylashuv Python Xavfsiz tugmalar Python Telegram callback_data'ni 64 bayt bilan cheklaydi. nicebot uzun ma'lumotni bazada saqlab, tugmaga qisqa kalit qo'yadi, buni siz sezmaysiz ham. Bosilgan tugmalarga javob ham avtomatik yuboriladi, shuning uchun \"soat\" belgisi qotib qolmaydi.", "min": 1}, "keyboards": {"title": "Klaviatura va toggle", "desc": "Pastki klaviatura, kontakt va joylashuv tugmalari, Toggle sozlamalar.", "html": "<h2 id=\"pastki-reply-klaviatura\">Pastki (reply) klaviatura<a class=\"anchor\" href=\"#\" data-anchor=\"pastki-reply-klaviatura\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Raqamingizni yuboring\", keyboard=[\"📞 Raqam yuborish:contact\"])\nawait ctx.reply(\"Qayerdasiz?\", keyboard=[\"📍 Joylashuv:location\"])\nawait ctx.reply(\"Menyu\", keyboard=[\"🛍 Do'kon\", \"📞 Aloqa\", \"ℹ️ Haqida\"], columns=2)\nawait ctx.reply(\"Yopildi\", remove_keyboard=True)<\/code><\/pre><\/figure><p>Matn oxiridagi <code>:contact<\/code> raqam so'raydigan, <code>:location<\/code> esa joylashuv so'raydigan tugma yasaydi. Murakkabroq holatlar uchun <code>ReplyButton(\"...\", webapp=...)<\/code> bor.<\/p><h2 id=\"toggle-yoqish-va-ochirish\">Toggle: yoqish va o'chirish<a class=\"anchor\" href=\"#\" data-anchor=\"toggle-yoqish-va-ochirish\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Sozlamalar menyusi uchun. Tugma bosilganda ✅ va ⬜️ o'zi almashadi, qiymat esa har bir foydalanuvchi uchun saqlanadi.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Toggle\n\n@bot.command(\"sozlamalar\")\nasync def settings_menu(ctx):\n    await ctx.reply(\"⚙️ Sozlamalar\", buttons=[\n        [Toggle(\"Bildirishnomalar\", key=\"notify\", default=True)],\n        [Toggle(\"Kechki rejim\", key=\"night\")],\n    ])\n\n# istalgan joyda qiymatni o'qing:\nif await ctx.setting(\"notify\"):\n    ...<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/sozlamalar<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>⚙️ Sozlamalar<\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Bildirishnomalar<\/span><\/div><div class=\"kb-row\"><span>⬜️ Kechki rejim<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 ⬜️ Kechki rejim<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>⚙️ Sozlamalar <i class=\"edited\" data-t=\"edited\"><\/i><\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Bildirishnomalar<\/span><\/div><div class=\"kb-row\"><span>✅ Kechki rejim<\/span><\/div><\/div><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>O'zgarishni darhol ushlash uchun <code>Toggle(..., on_change=func)<\/code> yozing, <code>func(ctx, value)<\/code> chaqiriladi.<\/p>", "toc": [["pastki-reply-klaviatura", "Pastki (reply) klaviatura"], ["toggle-yoqish-va-ochirish", "Toggle: yoqish va o'chirish"]], "text": "Pastki (reply) klaviatura Python Matn oxiridagi :contact raqam so'raydigan, :location esa joylashuv so'raydigan tugma yasaydi. Murakkabroq holatlar uchun ReplyButton(\"...\", webapp=...) bor. Toggle: yoqish va o'chirish Sozlamalar menyusi uchun. Tugma bosilganda ✅ va ⬜️ o'zi almashadi, qiymat esa har bir foydalanuvchi uchun saqlanadi. bot.py O'zgarishni darhol ushlash uchun Toggle(..., on_change=func) yozing, func(ctx, value) chaqiriladi.", "min": 1}, "conversations": {"title": "Suhbatlar", "desc": "ask, confirm, choose va form — FSM klasslarisiz savol-javob.", "html": "<p>nicebot'ning eng katta qulayligi shu. Savol berasiz va javobni o'sha funksiya ichida kutasiz.<\/p><h2 id=\"ask\">ask<a class=\"anchor\" href=\"#\" data-anchor=\"ask\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date\n\n@
