l-tizimi\">Referal tizimi<\/h2><p><code>ctx.ref_link<\/code> havolasi orqali kirgan yangi foydalanuvchiga <code>referrer_id<\/code> o'zi yoziladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"taklif\")\nasync def invite(ctx):\n    n = await ctx.user.referrals_count()\n    await ctx.reply(f\"Havolangiz: {ctx.ref_link}\\nTaklif qilganlaringiz: {n}\")\n\n@bot.on_referral\nasync def rewarded(ctx, referrer):\n    await referrer.update(balance=Col(\"balance\") + 5000)\n    await bot.send_message(referrer.id, \"🎉 Do'stingiz qo'shildi, +5000!\")<\/code><\/pre><\/figure><h2 id=\"hayot-sikli-hodisalari\">Hayot sikli hodisalari<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on_startup\nasync def ready(bot):\n    await bot.notify_admins(\"✅ Bot ishga tushdi\")\n\n@bot.on_new_user\nasync def welcome(ctx, user):\n    await bot.notify_admins(f\"🆕 Yangi foydalanuvchi: {user.mention}\")<\/code><\/pre><\/figure>", "toc": [["oz-maydonlaringizni-qoshish", "O'z maydonlaringizni qo'shish"], ["referal-tizimi", "Referal tizimi"], ["hayot-sikli-hodisalari", "Hayot sikli hodisalari"]], "text": "Botga yozgan har bir odam nb_users jadvaliga avtomatik saqlanadi va ctx.user orqali keladi. Ism, username va oxirgi faollik vaqti ham o'zi yangilanib turadi. Maydon id Telegram id first_name , last_name , username lang Tanlangan til phone Telefon is_blocked Botni bloklaganmi (avtomatik) is_premium Telegram Premium referrer_id Kim taklif qilgan data Istalgan JSON created_at , last_seen O'z maydonlaringizni qo'shish python Referal tizimi ctx.ref_link havolasi orqali kirgan yangi foydalanuvchiga referrer_id o'zi yoziladi. python Hayot sikli hodisalari python"}, "i18n": {"title": "Ko'p tillilik", "html": "<p><code>locales/<\/code> papkasiga har bir til uchun JSON fayl qo'ying:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">json<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-json\">// locales/uz.json\n{ \"hello\": \"Assalomu alaykum, {name}!\", \"menu\": { \"shop\": \"🛍 Do'kon\" } }\n\n// locales/ru.json\n{ \"hello\": \"Здравствуйте, {name}!\", \"menu\": { \"shop\": \"🛍 Магазин\" } }<\/code><\/pre><\/figure><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(ctx.t(\"hello\", name=ctx.name))\nawait ctx.reply(ctx.t(\"menu.shop\"))\nawait ctx.set_lang(\"ru\")        # foydalanuvchi tilini saqlaydi<\/code><\/pre><\/figure><p>Foydalanuvchi tili quyidagi tartibda aniqlanadi: avval <code>ctx.set_lang()<\/code> bilan saqlangan til, keyin Telegram ilovasidagi til, oxirida <code>Nicebot(lang=\"uz\")<\/code>. Kalit topilmasa, standart tildagi matn olinadi. Kutubxonaning o'z matnlari (\"Ha\", \"Bekor qilindi\" va boshqalar) uz, ru va en tillarida tayyor turadi. Ularni ham o'z faylingizda qayta yozishingiz mumkin, masalan: <code>\"nb.yes\": \"Albatta\"<\/code>.<\/p>", "toc": [], "text": "locales/ papkasiga har bir til uchun JSON fayl qo'ying: json python Foydalanuvchi tili quyidagi tartibda aniqlanadi: avval ctx.set_lang() bilan saqlangan til, keyin Telegram ilovasidagi til, oxirida Nicebot(lang=\"uz\") . Kalit topilmasa, standart tildagi matn olinadi. Kutubxonaning o'z matnlari (\"Ha\", \"Bekor qilindi\" va boshqalar) uz, ru va en tillarida tayyor turadi. Ularni ham o'z faylingizda qayta yozishingiz mumkin, masalan: \"nb.yes\": \"Albatta\" ."}, "admin": {"title": "Admin panel va statistika", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", admins=[123456789])\n# adminlar menyusida avtomatik paydo bo'ladi:\n# /stats        — statistika\n# /broadcast    — xabarga reply qilib hammaga yuborish\n# /maintenance  — texnik ishlar rejimi (on / off)\n# /backup       — SQLite bazaning nusxasi<\/code><\/pre><\/figure><p>Admin buyruqlari faqat adminlarning menyusida ko'rinadi. Oddiy foydalanuvchilar ularni ko'rmaydi va ishlata olmaydi.<\/p><h2 id=\"statistika\">Statistika<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">s = await bot.stats()\n# {\"users\": 1520, \"dau\": 310, \"mau\": 1104, \"new_today\": 42, \"blocked\": 37,\n#  \"retention_d7\": 34.5, \"top_commands\": [(\"start\", 900), ...], ...}<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Ko'rsatkich<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td>DAU / WAU / MAU<\/td><td>1, 7 va 30 kunda faol bo'lganlar<\/td><\/tr><tr><td><code>retention_d7<\/code><\/td><td>7–14 kun oldin kelganlarning qanchasi so'nggi haftada qaytgan (%)<\/td><\/tr><tr><td><code>top_commands<\/code><\/td><td>30 kundagi eng ko'p ishlatilgan buyruqlar<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"texnik-ishlar-rejimi\">Texnik ishlar rejimi<\/h2><p><code>await bot.maintenance(True)<\/code> yoqilganda adminlardan boshqa hamma \"🛠 texnik ishlar\" xabarini oladi. Rejim restartdan keyin ham saqlanadi.<\/p><h2 id=\"xatolar-haqida-hisobot\">Xatolar haqida hisobot<\/h2><p>Handlerda xato bo'lsa, foydalanuvchi muloyim xabar oladi, adminlar esa traceback'li hisobot oladi. Bir xil xato 10 daqiqada faqat bir marta yuboriladi.<\/p>", "toc": [["statistika", "Statistika"], ["texnik-ishlar-rejimi", "Texnik ishlar rejimi"], ["xatolar-haqida-hisobot", "Xatolar haqida hisobot"]], "text": "python Admin buyruqlari faqat adminlarning menyusida ko'rinadi. Oddiy foydalanuvchilar ularni ko'rmaydi va ishlata olmaydi. Statistika python Ko'rsatkich Ma'nosi DAU / WAU / MAU 1, 7 va 30 kunda faol bo'lganlar retention_d7 7–14 kun oldin kelganlarning qanchasi so'nggi haftada qaytgan (%) top_commands 30 kundagi eng ko'p ishlatilgan buyruqlar Texnik ishlar rejimi await bot.maintenance(True) yoqilganda adminlardan boshqa hamma \"🛠 texnik ishlar\" xabarini oladi. Rejim restartdan keyin ham saqlanadi. Xatolar haqida hisobot Handlerda xato bo'lsa, foydalanuvchi muloyim xabar oladi, adminlar esa traceback'li hisobot oladi. Bir xil xato 10 daqiqada faqat bir marta yuboriladi."}, "broadcast": {"title": "Broadcast (hammaga xabar)", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">result = await bot.broadcast(\n    \"🎉 Yangi aksiya boshlandi!\",\n    buttons=[Button(\"Ko'rish\", url=\"https://tezbaraka.uz\")],\n    id=\"aksiya-noyabr\",     # to'xtab qolsa, shu id bilan davom etadi\n)\n# {\"total\": 1500, \"sent\": 1462, \"failed\": 38, \"blocked\": 35}\n\nawait bot.broadcast(lambda uid: f\"Salom! Sizning id: {uid}\")\nawait bot.broadcast(None, copy_from=(chat_id, message_id))   # istalgan xabarni nusxalash<\/code><\/pre><\/figure><ul><li>Telegram chegarasi hisobga olinadi: standart tezlik soniyasiga 25 ta. <code>rate=<\/code> bilan o'zgartirish mumkin<\/li><li>429 flood xatosida kerakli vaqt kutib, davom etadi<\/li><li>Botni bloklaganlar <code>is_blocked=True<\/code> deb belgilanadi va keyingi safar o'tkazib yuboriladi<\/li><li><code>id=<\/code> berilsa, jarayon har 20 ta xabarda saqlanadi. Bot to'xtab qolsa, o'sha <code>id<\/code> bilan qayta chaqiring, u qolgan joyidan davom etadi<\/li><li><code>on_progress=<\/code> funksiyasi har 3 soniyada joriy holatni oladi<\/li><\/ul>", "toc": [], "text": "python Telegram chegarasi hisobga olinadi: standart tezlik soniyasiga 25 ta. rate= bilan o'zgartirish mumkin 429 flood xatosida kerakli vaqt kutib, davom etadi Botni bloklaganlar is_blocked=True deb belgilanadi va keyingi safar o'tkazib yuboriladi id= berilsa, jarayon har 20 ta xabarda saqlanadi. Bot to'xtab qolsa, o'sha id bilan qayta chaqiring, u qolgan joyidan davom etadi on_progress= funksiyasi har 3 soniyada joriy holatni oladi"}, "payments": {"title": "To'lovlar (Telegram Stars)", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"premium\")\nasync def premium(ctx):\n    await ctx.invoice(\"Premium\", \"30 kunlik obuna\", amount=100, payload=\"premium30\")\n\n@bot.paid()\nasync def paid(ctx):\n    sp = ctx.message.successful_payment\n    await ctx.user.update(data={**ctx.user.data, \"premium\": True})\n    await ctx.reply(f\"⭐️ {sp.total_amount} Stars uchun rahmat!\")<\/code><\/pre><\/figure><p><code>pre_checkout_query<\/code> avtomatik tasdiqlanadi. O'zingiz tekshirmoqchi bo'lsangiz, <code>@bot.pre_checkout()<\/code> handlerini yozing. Pulni qaytarish: <code>await ctx.refund()<\/code>.<\/p>", "toc": [], "text": "python pre_checkout_query avtomatik tasdiqlanadi. O'zingiz tekshirmoqchi bo'lsangiz, @bot.pre_checkout() handlerini yozing. Pulni qaytarish: await ctx.refund() ."}, "groups": {"title": "Guruhlar, obuna va support", "html": "<h2 id=\"guruhni-boshqarish\">Guruhni boshqarish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"warn\")\nasync def warn(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.warn(\"Reklama taqiqlangan\", limit=3)   # 3 tadan keyin ban\n\n@bot.command(\"mute\")\nasync def mute(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.mute(\"1h\")       # reply qilingan odamni 1 soatga\n\nawait ctx.ban(for_=\"7d\")\nawait ctx.unban()\nawait ctx.kick()<\/code><\/pre><\/figure><p>Bu metodlar reply qilingan odam ustida ishlaydi yoki <code>user_id=<\/code> qabul qiladi. Bot guruhda admin bo'lishi kerak.<\/p><h2 id=\"captcha\">Captcha<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", captcha=\"2m\")\n# guruhga kirgan odam 2 daqiqada \"🤖 Men robot emasman\" ni bosmasa — chiqariladi<\/code><\/pre><\/figure><h2 id=\"majburiy-obuna\">Majburiy obuna<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", required_channels=[\"@kanalim\", \"@yangiliklar\"])\n# obuna bo'lmagan foydalanuvchi kanallar ro'yxati va \"✅ Tekshirish\" tugmasini ko'radi<\/code><\/pre><\/figure><p>Bot kanalda admin bo'lishi kerak, aks holda a'zolikni tekshira olmaydi. Natija bir daqiqa keshlanadi, shuning uchun Telegram'ga ortiqcha so'rov ketmaydi.<\/p><h2 id=\"support-rejimi\">Support rejimi<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", support_chat=-1001234567890)\n# hech bir handlerga tushmagan shaxsiy xabarlar guruhga boradi;\n# guruhda o'sha xabarga reply qilsangiz — javob foydalanuvchiga ketadi<\/code><\/pre><\/figure>", "toc": [["guruhni-boshqarish", "Guruhni boshqarish"], ["captcha", "Captcha"], ["majburiy-obuna", "Majburiy obuna"], ["support-rejimi", "Support rejimi"]], "text": "Guruhni boshqarish python Bu metodlar reply qilingan odam ustida ishlaydi yoki user_id= qabul qiladi. Bot guruhda admin bo'lishi kerak. Captcha python Majburiy obuna python Bot kanalda admin bo'lishi kerak, aks holda a'zolikni tekshira olmaydi. Natija bir daqiqa keshlanadi, shuning uchun Telegram'ga ortiqcha so'rov ketmaydi. Support rejimi python"}, "middleware": {"title": "Middleware, DI va xatolar", "html": "<h2 id=\"middleware\">Middleware<\/h2><p>Middleware har bir update atrofida ishlaydi va handlerdan oldin ham, keyin ham kod bajarishi mumkin.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import time\n\n@bot.middleware\nasync def timing(ctx, next):\n    start = time.perf_counter()\n    await next()                                  # keyingi qadam / handler\n    print(f\"{ctx.text!r}: {time.perf_counter() - start:.3f}s\")\n\n@bot.middleware\nasync def ban_check(ctx, next):\n    if ctx.user and ctx.user.data.get(\"banned\"):\n        return                                    # next() chaqirilmasa — to'xtaydi\n    await next()<\/code><\/pre><\/figure><h2 id=\"bogliqlik-kiritish-di\">Bog'liqlik kiritish (DI)<\/h2><p>Handler o'ziga kerakli narsani parametr nomi yoki turi orqali so'raydi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from dataclasses import dataclass\n\n@dataclass\nclass Settings:\n    price: int = 50_000\n\nbot.provide(Settings, Settings())\n\n@bot.callback(\"buy:{id:int}\")\nasync def buy(ctx, id: int, user: Customer, cfg: Settings, text, args):\n    ...   # kerakli narsani nomi yoki turi bilan so'raysiz<\/code><\/pre><\/figure><p>Nom bo'yicha keladiganlar: <code>bot<\/code>, <code>message<\/code>, <code>callback<\/code>, <code>user<\/code>, <code>chat<\/code>, <code>text<\/code>, <code>args<\/code>, <code>arg<\/code>, <code>payload<\/code>, <code>data<\/code>, <code>value<\/code>, <code>album<\/code>, <code>lang<\/code>, <code>state<\/code>, <code>config<\/code>, <code>db<\/code> va <code>storage<\/code>, shuningdek callback va regex parametrlari.<\/p><h2 id=\"xatolar\">Xatolar<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.error(ValueError)\nasync def bad_value(ctx, error):\n    await ctx.reply(f\"Xato qiymat: {error}\")\n\n# qolgan xatolar: foydalanuvchiga muloyim xabar,\n# adminlarga esa traceback bilan hisobot avtomatik yuboriladi<\/code><\/pre><\/figure>", "toc": [["middleware", "Middleware"], ["bogliqlik-kiritish-di", "Bog'liqlik kiritish (DI)"], ["xatolar", "Xatolar"]], "text": "Middleware Middleware har bir update atrofida ishlaydi va handlerdan oldin ham, keyin ham kod bajarishi mumkin. python Bog'liqlik kiritish (DI) Handler o'ziga kerakli narsani parametr nomi yoki turi orqali so'raydi: python Nom bo'yicha keladiganlar: bot , message , callback , user , chat , text , args , arg , payload , data , value , album , lang , state , config , db va storage , shuningdek callback va regex parametrlari. Xatolar python"}, "miniapp": {"title": "Mini App", "html": "<p>nicebot'da bot bilan bitta jarayonda ishlaydigan veb-server bor. U Mini App fayllarini beradi va API endpoint'larni yaratadi. Telegram <code>initData<\/code> imzosi HMAC orqali avtomatik tekshiriladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.webapp(\"webapp\")                # webapp/index.html ni beradi\n\n@bot.api(\"/api/score\")\nasync def score(req):\n    user = await req.db_user()          # initData tekshirilgan, foydalanuvchi aniq\n    points = int(req.json[\"points\"])\n    await user.update(data={**user.data, \"score\": points})\n    return {\"ok\": True, \"score\": points}\n\n@bot.command(\"play\")\nasync def play(ctx):\n    await ctx.reply(\"O'ynash\", buttons=[Button(\"🎮 Boshlash\", webapp=\"https://game.tezbaraka.uz\")])\n\nbot.start(port=8080)<\/code><\/pre><\/figure><p>Brauzer tomonida tayyor <code>nicebot.js<\/code> ulanadi. U <code>initData<\/code>'ni o'zi qo'shib yuboradi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">html<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-xml\">&lt;script src=\"https://telegram.org/js/telegram-web-app.js\"&gt;&lt;/script&gt;\n&lt;script src=\"/nicebot.js\"&gt;&lt;/script&gt;\n&lt;script&gt;\n  nicebot.post(\"/api/score\", { points: 120 }).then(r =&gt; console.log(r.score));\n  console.log(nicebot.user.first_name);\n&lt;/script&gt;<\/code><\/pre><\/figure><p><code>initData<\/code> noto'g'ri yoki eskirgan bo'lsa, so'rov <code>401<\/code> bilan rad etiladi. <code>@bot.api(..., auth=False)<\/code> ochiq endpoint yaratadi. <code>WebAppRequest<\/code> obyektida <code>user<\/code>, <code>json<\/code>, <code>query<\/code>, <code>params<\/code> va <code>db_user()<\/code> bor.<\/p>", "toc": [], "text": "nicebot'da bot bilan bitta jarayonda ishlaydigan veb-server bor. U Mini App fayllarini beradi va API endpoint'larni yaratadi. Telegram initData imzosi HMAC orqali avtomatik tekshiriladi. python Brauzer tomonida tayyor nicebot.js ulanadi. U initData 'ni o'zi qo'shib yuboradi: html initData noto'g'ri yoki eskirgan bo'lsa, so'rov 401 bilan rad etiladi. @bot.api(..., auth=False) ochiq endpoint yaratadi. WebAppRequest obyektida user , json , query , params va db_user() bor."}, "scheduler": {"title": "Rejalashtirish, fon va kesh", "html": "<h2 id=\"rejalashtirilgan-vazifalar\">Rejalashtirilgan vazifalar<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.every(\"1h\")\nasync def sync_prices(bot):\n    ...\n\n@bot.at(\"09:00\", tz=\"Asia/Tashkent\")\nasync def morning(bot):\n    await bot.broadcast(\"☀️ Xayrli tong!\")\n\n@bot.at(\"18:00\", days=[\"mon\", \"fri\"])\nasync def weekly_report(bot):\n    await bot.notify_admins(str(await bot.stats()))<\/code><\/pre><\/figure><p>Kunlar inglizcha (<code>mon<\/code>…<code>sun<\/code>) yoki o'zbekcha (<code>du<\/code>, <code>se<\/code>, <code>chor<\/code>, <code>pay<\/code>, <code>ju<\/code>, <code>shan<\/code>, <code>yak<\/code>) yoziladi.<\/p><h2 id=\"fon-vazifalari\">Fon vazifalari<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"report\")\nasync def report(ctx):\n    ctx.background(build_heavy_report, ctx.user_id, retries=3)   # handler darhol tugaydi\n    await ctx.reply(\"Hisobot tayyorlanmoqda, tayyor bo'lgach yuboraman\")\n\nbot.later(\"10m\", bot.send_message(admin_id, \"10 daqiqa o'tdi\"))<\/code><\/pre><\/figure><p>Fon vazifasi xato bersa, eksponensial kutish bilan qayta uriniladi. Bot to'xtatilganda tugallanmagan vazifalar kutib olinadi.<\/p><h2 id=\"kesh\">Kesh<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import cache\n\n@cache(\"10m\")\nasync def dollar_rate():\n    ...   # 10 daqiqada bir marta haqiqiy so'rov<\/code><\/pre><\/figure><h2 id=\"fayllar\">Fayllar<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on(\"document\")\nasync def doc(ctx):\n    data = await ctx.download()               # bytes\n    await ctx.save(f\"uploads/{ctx.message.document.file_name}\")\n\nawait ctx.photo(\"logo.png\")   # birinchi marta yuklanadi,\nawait ctx.photo(\"logo.png\")   # keyingi safar file_id bilan — bir zumda<\/code><\/pre><\/figure>", "toc": [["rejalashtirilgan-vazifalar", "Rejalashtirilgan vazifalar"], ["fon-vazifalari", "Fon vazifalari"], ["kesh", "Kesh"], ["fayllar", "Fayllar"]], "text": "Rejalashtirilgan vazifalar python Kunlar inglizcha ( mon … sun ) yoki o'zbekcha ( du , se , chor , pay , ju , shan , yak ) yoziladi. Fon vazifalari python Fon vazifasi xato bersa, eksponensial kutish bilan qayta uriniladi. Bot to'xtatilganda tugallanmagan vazifalar kutib olinadi. Kesh python Fayllar python"}, "deploy": {"title": "Ishga tushirish va deploy", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.start()                                   # polling\nbot.start(reload=True)                        # kod o'zgarsa o'zi qayta ishga tushadi\nbot.start(webhook=\"https://bot.tezbaraka.uz/hook\", port=8080)\nNicebot.run_all(shop_bot, support_bot)        # bitta jarayonda bir nechta bot<\/code><\/pre><\/figure><h2 id=\"polling-yoki-webhook\">Polling yoki webhook<\/h2><p>Polling sozlash talab qilmaydi va kichik hamda o'rta botlar uchun yetarli. Webhook uchun HTTPS domen kerak. nicebot <code>setWebhook<\/code>'ni maxfiy token bilan o'zi chaqiradi va kelgan so'rovlarni tekshiradi. Server sog'lig'ini <code>/nicebot/health<\/code> manzilida tekshirish mumkin.<\/p><h2 id=\"togri-toxtash\">To'g'ri to'xtash<\/h2><p>Ctrl+C yoki SIGTERM kelganda bot yangi update olishni to'xtatadi va ishlayotgan handlerlar tugashini kutadi. Keyin offset'ni Telegram'ga tasdiqlaydi, shuning uchun restartda birorta update yo'qolmaydi va ikki marta ham ishlanmaydi.<\/p><h2 id=\"docker\">Docker<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">docker<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-dockerfile\">FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install --no-cache-dir \"nicebot[postgres]\"\nCMD [\"python\", \"bot.py\"]<\/code><\/pre><\/figure><h2 id=\"ishonchlilik\">Ishonchlilik<\/h2><ul><li>Flood control (429): kerakli soniya kutiladi va so'rov qayta yuboriladi<\/li><li>Tarmoq va 5xx xatolari: eksponensial kutish bilan 3 marta qayta urinadi<\/li><li>Noma'lum yangi update turlari bot ishini to'xtatmaydi, ular logga yozilib, o'tkazib yuboriladi<\/li><li>Bir vaqtdagi handlerlar soni <code>max_concurrency=256<\/code> bilan cheklangan<\/li><\/ul>", "toc": [["polling-yoki-webhook", "Polling yoki webhook"], ["togri-toxtash", "To'g'ri to'xtash"], ["docker", "Docker"], ["ishonchlilik", "Ishonchlilik"]], "text": "python Polling yoki webhook Polling sozlash talab qilmaydi va kichik hamda o'rta botlar uchun yetarli. Webhook uchun HTTPS domen kerak. nicebot setWebhook 'ni maxfiy token bilan o'zi chaqiradi va kelgan so'rovlarni tekshiradi. Server sog'lig'ini /nicebot/health manzilida tekshirish mumkin. To'g'ri to'xtash Ctrl+C yoki SIGTERM kelganda bot yangi update olishni to'xtatadi va ishlayotgan handlerlar tugashini kutadi. Keyin offset'ni Telegram'ga tasdiqlaydi, shuning uchun restartda birorta update yo'qolmaydi va ikki marta ham ishlanmaydi. Docker docker Ishonchlilik Flood control (429): kerakli soniya kutiladi va so'rov qayta yuboriladi Tarmoq va 5xx xatolari: eksponensial kutish bilan 3 marta qayta urinadi Noma'lum yangi update turlari bot ishini to'xtatmaydi, ular logga yozilib, o'tkazib yuboriladi Bir vaqtdagi handlerlar soni max_concurrency=256 bilan cheklangan"}, "testing": {"title": "Testlash", "html": "<p>Botni Telegram'siz, haqiqiy foydalanuvchidek sinab ko'rish mumkin. Soxta API barcha chaqiruvlarni yozib boradi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from bot import bot\n\nasync def test_register():\n    async with bot.test() as t:\n        ali = t.user(first_name=\"Ali\")\n        await ali.send(\"/register\")\n        assert t.last.text == \"Ismingiz?\"\n        await ali.send(\"Ali\")\n        await ali.send(\"25\")\n        await ali.click(\"M\")\n        assert \"Rahmat\" in t.last.text<\/code><\/pre><\/figure><div class=\"table\"><table><tbody><tr><td><code>t.user(...)<\/code><\/td><td>Soxta foydalanuvchi<\/td><\/tr><tr><td><code>user.send(text)<\/code><\/td><td>Xabar yuborish<\/td><\/tr><tr><td><code>user.click(\"matn\")<\/code><\/td><td>Tugmani bosish<\/td><\/tr><tr><td><code>user.send_photo()<\/code> / <code>send_contact()<\/code> / <code>send_location()<\/code> / <code>send_album()<\/code><\/td><td>Media yuborish<\/td><\/tr><tr><td><code>t.last<\/code><\/td><td>Oxirgi xabar: <code>.text<\/code>, <code>.buttons<\/code>, <code>.keyboard<\/code><\/td><\/tr><tr><td><code>t.messages<\/code> / <code>t.texts<\/code><\/td><td>Barcha xabarlar<\/td><\/tr><tr><td><code>t.calls_of(\"sendPhoto\")<\/code><\/td><td>API chaqiruvlari<\/td><\/tr><tr><td><code>t.blocked = {id}<\/code><\/td><td>Botni bloklagan foydalanuvchi<\/td><\/tr><\/tbody><\/table><\/div><p><code>pytest<\/code> va <code>pytest-asyncio<\/code> bilan ishlaydi.<\/p>", "toc": [], "text": "Botni Telegram'siz, haqiqiy foydalanuvchidek sinab ko'rish mumkin. Soxta API barcha chaqiruvlarni yozib boradi. python t.user(...) Soxta foydalanuvchi user.send(text) Xabar yuborish user.click(\"matn\") Tugmani bosish user.send_photo() / send_contact() / send_location() / send_album() Media yuborish t.last Oxirgi xabar: .text , .buttons , .keyboard t.messages / t.texts Barcha xabarlar t.calls_of(\"sendPhoto\") API chaqiruvlari t.blocked = {id} Botni bloklagan foydalanuvchi pytest va pytest-asyncio bilan ishlaydi."}, "features": {"title": "50 ta imkoniyat", "html": "<section class=\"fgroup\"><h2 id=\"suhbat\">Suhbat <span class=\"fcount\">5<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">01<\/span><div><code>await ctx.ask()<\/code><p>FSM klasslarisiz savol-javob<\/p><\/div><\/li><li><span class=\"fnum\">02<\/span><div><code>ctx.confirm()<\/code><p>Ha/Yo'q savol, True/False qaytaradi<\/p><\/div><\/li><li><span class=\"fnum\">03<\/span><div><code>ctx.choose(multiple=True)<\/code><p>✅/⬜️ bilan bir nechta variant tanlash<\/p><\/div><\/li><li><span class=\"fnum\">04<\/span><div><code>ctx.form()<\/code><p>Bir nechta savol, validatsiya va qayta so'rash<\/p><\/div><\/li><li><span class=\"fnum\">05<\/span><div><code>Validatorlar<\/code><p>Telefon (+998), email, sana, son, URL, rasm va boshqalar<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"tugmalar\">Tugmalar <span class=\"fcount\">12<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">06<\/span><div><code>Button(on_click=)<\/code><p>Tugma to'g'ridan-to'g'ri funksiyaga bog'lanadi<\/p><\/div><\/li><li><span class=\"fnum\">07<\/span><div><code>Callback shablonlari<\/code><p>\"buy:{id:int}\" avtomatik parse qilinadi<\/p><\/div><\/li><li><span class=\"fnum\">08<\/span><div><code>Avto-joylashuv<\/code><p>Qisqa tugmalar bir qatorga o'zi joylashadi<\/p><\/div><\/li><li><span class=\"fnum\">09<\/span><div><code>Toggle<\/code><p>✅/⬜️ sozlamalar, qiymat saqlanadi<\/p><\/div><\/li><li><span class=\"fnum\">10<\/span><div><code>ttl= va only=<\/code><p>Muddatli va faqat bir kishi bosa oladigan tugmalar<\/p><\/div><\/li><li><span class=\"fnum\">11<\/span><div><code>once=True<\/code><p>Bir martalik tugma<\/p><\/div><\/li><li><span class=\"fnum\">12<\/span><div><code>64 bayt chegarasi yo'q<\/code><p>Uzun callback ma'lumoti bazada saqlanadi<\/p><\/div><\/li><li><span class=\"fnum\">13<\/span><div><code>Avto-javob<\/code><p>Tugmadagi soat belgisi qotib qolmaydi<\/p><\/div><\/li><li><span class=\"fnum\">14<\/span><div><code>Reply qisqartmalari<\/code><p>\"📞 Raqam:contact\", \":location\"<\/p><\/div><\/li><li><span class=\"fnum\">15<\/span><div><code>ctx.respond()<\/code><p>Tugmadan bo'lsa tahrirlaydi, aks holda yuboradi<\/p><\/div><\/li><li><span class=\"fnum\">16<\/span><div><code>Ko'p darajali Menu<\/code><p>\"Orqaga\" tugmasi avtomatik<\/p><\/div><\/li><li><span class=\"fnum\">17<\/span><div><code>ctx.paginate()<\/code><p>◀️ 2/5 ▶️ sahifalash<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"malumotlar\">Ma'lumotlar <span class=\"fcount\">4<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">18<\/span><div><code>Ichki ORM<\/code><p>SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan<\/p><\/div><\/li><li><span class=\"fnum\">19<\/span><div><code>ctx.user<\/code><p>Foydalanuvchi bazaga avtomatik yoziladi<\/p><\/div><\/li><li><span class=\"fnum\">20<\/span><div><code>i18n<\/code><p>ctx.t(), uz/ru/en tayyor matnlar<\/p><\/div><\/li><li><span class=\"fnum\">21<\/span><div><code>file_id keshi<\/code><p>Lokal fayl bir marta yuklanadi<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"biznes\">Biznes <span class=\"fcount\">10<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">22<\/span><div><code>Referal tizimi<\/code><p>ctx.ref_link, referrer_id va @bot.on_referral<\/p><\/div><\/li><li><span class=\"fnum\">23<\/span><div><code>Broadcast<\/code><p>Tezlik chegarasi, bloklanganlarni belgilash va davom ettirish<\/p><\/div><\/li><li><span class=\"fnum\">24<\/span><div><code>Admin panel<\/code><p>/stats, /broadcast, /maintenance va /backup<\/p><\/div><\/li><li><span class=\"fnum\">25<\/span><div><code>Analitika<\/code><p>DAU/MAU, retention va top buyruqlar<\/p><\/div><\/li><li><span class=\"fnum\">26<\/span><div><code>Majburiy obuna<\/code><p>required_channels=[…]<\/p><\/div><\/li><li><span class=\"fnum\">27<\/span><div><code>Support rejimi<\/code><p>Xabar guruhga boradi, javob foydalanuvchiga qaytadi<\/p><\/div><\/li><li><span class=\"fnum\">28<\/span><div><code>Texnik ishlar rejimi<\/code><p>Adminlar baribir ishlata oladi<\/p><\/div><\/li><li><span class=\"fnum\">29<\/span><div><code>Telegram Stars<\/code><p>ctx.invoice() va @bot.paid<\/p><\/div><\/li><li><span class=\"fnum\">30<\/span><div><code>Guruh va captcha<\/code><p>ban, mute, warn (3 → ban), yangi a'zolarga captcha<\/p><\/div><\/li><li><span class=\"fnum\">31<\/span><div><code>Xato hisoboti<\/code><p>Adminlarga traceback avtomatik yuboriladi<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"arxitektura\">Arxitektura <span class=\"fcount\">11<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">32<\/span><div><code>Type hint orqali DI<\/code><p>async def h(ctx, user: Customer, cfg: Settings)<\/p><\/div><\/li><li><span class=\"fnum\">33<\/span><div><code>Nicebot.from_env()<\/code><p>.env faylidan sozlash<\/p><\/div><\/li><li><span class=\"fnum\">34<\/span><div><code>bot.include(\"handlers\")<\/code><p>Router'larni avtomatik topish<\/p><\/div><\/li><li><span class=\"fnum\">35<\/span><div><code>@cache(\"5m\")<\/code><p>Async funksiyalar uchun kesh<\/p><\/div><\/li><li><span class=\"fnum\">36<\/span><div><code>ctx.background()<\/code><p>Retry bilan fon vazifalari<\/p><\/div><\/li><li><span class=\"fnum\">37<\/span><div><code>@bot.every / @bot.at<\/code><p>Rejalashtiruvchi, vaqt zonasi bilan<\/p><\/div><\/li><li><span class=\"fnum\">38<\/span><div><code>Albomlar<\/code><p>Media group bitta handlerga ro'yxat bo'lib keladi<\/p><\/div><\/li><li><span class=\"fnum\">39<\/span><div><code>Mini App server<\/code><p>Fayllar va initData HMAC tekshiruvi bot jarayonida<\/p><\/div><\/li><li><span class=\"fnum\">40<\/span><div><code>Mini App RPC<\/code><p>@bot.api endpointlari va tayyor nicebot.js<\/p><\/div><\/li><li><span class=\"fnum\">41<\/span><div><code>Bir nechta bot<\/code><p>Nicebot.run_all(bot1, bot2)<\/p><\/div><\/li><li><span class=\"fnum\">42<\/span><div><code>typing=True<\/code><p>Handler ishlayotganda \"yozmoqda…\" ko'rinadi<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"ishonchlilik\">Ishonchlilik <span class=\"fcount\">8<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">43<\/span><div><code>Flood himoyasi<\/code><p>429 xatosida kutib, qayta yuboradi<\/p><\/div><\/li><li><span class=\"fnum\">44<\/span><div><code>throttle=<\/code><p>Spamga qarshi tezlik chegarasi<\/p><\/div><\/li><li><span class=\"fnum\">45<\/span><div><code>To'g'ri to'xtash<\/code><p>Restartda update yo'qolmaydi<\/p><\/div><\/li><li><span class=\"fnum\">46<\/span><div><code>Xavfsiz formatlash<\/code><p>html() va formatlash xatosida qayta yuborish<\/p><\/div><\/li><li><span class=\"fnum\">47<\/span><div><code>delete_after=<\/code><p>Xabarni avtomatik o'chirish<\/p><\/div><\/li><li><span class=\"fnum\">48<\/span><div><code>Hot reload<\/code><p>bot.start(reload=True)<\/p><\/div><\/li><li><span class=\"fnum\">49<\/span><div><code>Test to'plami<\/code><p>bot.test(): Telegram'siz test<\/p><\/div><\/li><li><span class=\"fnum\">50<\/span><div><code>CLI<\/code><p>nicebot new mybot<\/p><\/div><\/li><\/ol><\/section>", "toc": [], "text": "Suhbat 5 01 await ctx.ask() FSM klasslarisiz savol-javob 02 ctx.confirm() Ha/Yo'q savol, True/False qaytaradi 03 ctx.choose(multiple=True) ✅/⬜️ bilan bir nechta variant tanlash 04 ctx.form() Bir nechta savol, validatsiya va qayta so'rash 05 Validatorlar Telefon (+998), email, sana, son, URL, rasm va boshqalar Tugmalar 12 06 Button(on_click=) Tugma to'g'ridan-to'g'ri funksiyaga bog'lanadi 07 Callback shablonlari \"buy:{id:int}\" avtomatik parse qilinadi 08 Avto-joylashuv Qisqa tugmalar bir qatorga o'zi joylashadi 09 Toggle ✅/⬜️ sozlamalar, qiymat saqlanadi 10 ttl= va only= Muddatli va faqat bir kishi bosa oladigan tugmalar 11 once=True Bir martalik tugma 12 64 bayt chegarasi yo'q Uzun callback ma'lumoti bazada saqlanadi 13 Avto-javob Tugmadagi soat belgisi qotib qolmaydi 14 Reply qisqartmalari \"📞 Raqam:contact\", \":location\" 15 ctx.respond() Tugmadan bo'lsa tahrirlaydi, aks holda yuboradi 16 Ko'p darajali Menu \"Orqaga\" tugmasi avtomatik 17 ctx.paginate() ◀️ 2/5 ▶️ sahifalash Ma'lumotlar 4 18 Ichki ORM SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan 19 ctx.user Foydalanuvchi bazaga avtomatik yoziladi 20 i18n ctx.t(), uz/ru/en tayyor matnlar 21 file_id keshi Lokal fayl bir marta yuklanadi Biznes 10 22 Referal tizimi ctx.ref_link, referrer_id va @bot.on_referral 23 Broadcast Tezlik chegarasi, bloklanganlarni belgilash va davom ettirish 24 Admin panel /stats, /broadcast, /maintenance va /backup 25 Analitika DAU/MAU, retention va top buyruqlar 26 Majburiy obuna required_channels=[…] 27 Support rejimi Xabar guruhga boradi, javob foydalanuvchiga qaytadi 28 Texnik ishlar rejimi Adminlar baribir ishlata oladi 29 Telegram Stars ctx.invoice() va @bot.paid 30 Guruh va captcha ban, mute, warn (3 → ban), yangi a'zolarga captcha 31 Xato hisoboti Adminlarga traceback avtomatik yuboriladi Arxitektura 11 32 Type hint orqali DI async def h(ctx, user: Customer, cfg: Settings) 33 Nicebot.from_env() .env faylidan sozlash 34 bot.include(\"handlers\") Router'larni avtomatik topish 35 @cache(\"5m\") Async funksiyalar uchun kesh 36 ctx.background() Retry bilan fon vazifalari 37 @bot.every / @bot.at Rejalashtiruvchi, vaqt zonasi bilan 38 Albomlar Media group bitta handlerga ro'yxat bo'lib keladi 39 Mini App server Fayllar va initData HMAC tekshiruvi bot jarayonida 40 Mini App RPC @bot.api endpointlari va tayyor nicebot.js 41 Bir nechta bot Nicebot.run_all(bot1, bot2) 42 typing=True Handler ishlayotganda \"yozmoqda…\" ko'rinadi Ishonchlilik 8 43 Flood himoyasi 429 xatosida kutib, qayta yuboradi 44 throttle= Spamga qarshi tezlik chegarasi 45 To'g'ri to'xtash Restartda update yo'qolmaydi 46 Xavfsiz formatlash html() va formatlash xatosida qayta yuborish 47 delete_after= Xabarni avtomatik o'chirish 48 Hot reload bot.start(reload=True) 49 Test to'plami bot.test(): Telegram'siz test 50 CLI nicebot new mybot"}, "api": {"title": "Bot API", "html": "<p><code>Nicebot<\/code> Bot API'ning barcha metodlarini to'g'ridan-to'g'ri beradi. Ular rasmiy spetsifikatsiyadan avtomatik yaratilgan va to'liq turlangan, shuning uchun muharriringiz har bir parametrni taklif qiladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># Bot API'ning barcha 185 metodi — snake_case nomlar bilan\nawait bot.send_message(chat_id, \"Salom\")\nawait bot.set_chat_title(chat_id, \"Yangi nom\")\nmember = await bot.get_chat_member(chat_id, user_id)\nprint(member.status)      # \"member\", \"administrator\", ...<\/code><\/pre><\/figure><p>Turlar <code>from nicebot import types<\/code> orqali olinadi, masalan <code>types.Message<\/code> yoki <code>types.InlineKeyboardButton<\/code>. Ular msgspec asosida qurilgan, shuning uchun JSON'ni juda tez o'qiydi. Telegram yangi maydon qo'shsa ham kod buzilmaydi.<\/p><h2 id=\"versiyalar\">Versiyalar<\/h2><div class=\"table\"><table><tbody><tr><td>nicebot<\/td><td>0.1.0<\/td><\/tr><tr><td>Bot API<\/td><td>10.3<\/td><\/tr><tr><td>Python<\/td><td>3.10+<\/td><\/tr><tr><td>Litsenziya<\/td><td>MIT<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["versiyalar", "Versiyalar"]], "text": "Nicebot Bot API'ning barcha metodlarini to'g'ridan-to'g'ri beradi. Ular rasmiy spetsifikatsiyadan avtomatik yaratilgan va to'liq turlangan, shuning uchun muharriringiz har bir parametrni taklif qiladi. python Turlar from nicebot import types orqali olinadi, masalan types.Message yoki types.InlineKeyboardButton . Ular msgspec asosida qurilgan, shuning uchun JSON'ni juda tez o'qiydi. Telegram yangi maydon qo'shsa ham kod buzilmaydi. Versiyalar nicebot 0.1.0 Bot API 10.3 Python 3.10+ Litsenziya MIT"}}, "home": {"title": "Kam kod. Hamma narsa ichida.", "lead": "nicebot — Telegram botlar uchun Python kutubxonasi. Baza, tugmalar, suhbatlar, tarjimalar va admin panel bitta importda tayyor turadi.", "cta": "Boshlash", "cta2": "50 ta imkoniyat", "stat1": "Bot API metodlari", "stat2": "ma'lumotlar bazasi", "stat3": "tayyor imkoniyat"}}, "ru": {"ui": {"search": "Поиск…", "on_this_page": "На этой странице", "copy": "Копировать", "copied": "Скопировано", "prev": "Назад", "next": "Далее", "menu": "Разделы", "no_results": "Ничего не найдено", "theme": "Тема", "edit_hint": "Bot API", "tagline": "Python-библиотека для Telegram-ботов"}, "groups": {"start": "Начало", "basics": "Основы", "ui": "Кнопки и диалоги", "data": "Данные", "business": "Для бизнеса", "advanced": "Продвинутое", "reference": "Справочник"}, "pages": {"intro": {"title": "Введение", "html": "<p>nicebot — Python-библиотека, которая делает разработку Telegram-ботов максимально простой. Один импорт, один объект и обычные функции. База данных, кнопки, диалоги, переводы, статистика и админ-панель уже встроены.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><p>Это полностью рабочий бот. В нём нет <code>Dispatcher<\/code>, <code>Router<\/code> и классов состояний, а пользователь автоматически сохраняется в базу.<\/p><h2 id=\"почему-nicebot\">Почему nicebot?<\/h2><p>Сравним простой бот регистрации. Сначала aiogram:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import asyncio\nfrom aiogram import Bot, Dispatcher, F, Router\nfrom aiogram.filters import Command, CommandStart\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.fsm.state import State, StatesGroup\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import Message\n\nrouter = Router()\n\nclass Reg(StatesGroup):\n    name = State()\n    age = State()\n\n@router.message(CommandStart())\nasync def start(message: Message, state: FSMContext):\n    await state.set_state(Reg.name)\n    await message.answer(\"Ismingiz?\")\n\n@router.message(Reg.name)\nasync def got_name(message: Message, state: FSMContext):\n    await state.update_data(name=message.text)\n    await state.set_state(Reg.age)\n    await message.answer(\"Yoshingiz?\")\n\n@router.message(Reg.age)\nasync def got_age(message: Message, state: FSMContext):\n    if not message.text.isdigit():\n        await message.answer(\"Butun son kiriting.\")\n        return\n    data = await state.get_data()\n    await state.clear()\n    await message.answer(f\"{data['name']}, {message.text} yosh\")\n\nasync def main():\n    bot = Bot(\"TOKEN\")\n    dp = Dispatcher(storage=MemoryStorage())\n    dp.include_router(router)\n    await dp.start_polling(bot)\n\nasyncio.run(main())<\/code><\/pre><\/figure><p>Тот же бот на nicebot:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"TOKEN\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    name = await ctx.ask(\"Ismingiz?\")\n    age = await ctx.ask(\"Yoshingiz?\", int)\n    await ctx.reply(f\"{name}, {age} yosh\")\n\nbot.start()<\/code><\/pre><\/figure><p><code>ctx.ask()<\/code> задаёт вопрос и ждёт ответ. Если передать <code>int<\/code>, бот вежливо переспросит, пока не получит число. Не нужно писать <code>StatesGroup<\/code>, сохранять и очищать состояние.<\/p><h2 id=\"что-внутри\">Что внутри<\/h2><ul><li><strong>Полный Bot API 10.3:<\/strong> 403 типа и 185 методов сгенерированы из официальной спецификации<\/li><li><strong>Встроенная ORM:<\/strong> один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями<\/li><li><strong>Диалоги:<\/strong> <code>ask<\/code>, <code>confirm<\/code>, <code>choose<\/code>, <code>form<\/code> и готовые валидаторы<\/li><li><strong>Кнопки:<\/strong> <code>on_click<\/code>, шаблоны, переключатели, кнопки с таймером и одноразовые, авто-раскладка<\/li><li><strong>Бизнес:<\/strong> рефералы, рассылки, статистика, админ-панель, обязательная подписка, поддержка, Telegram Stars<\/li><li><strong>Надёжность:<\/strong> сам ждёт flood-wait, повторяет запрос при сетевой ошибке, не теряет апдейты при перезапуске<\/li><li><strong>Скорость:<\/strong> типы на msgspec и один пул соединений<\/li><\/ul><p>Полный список на странице <a href=\"#features\" data-nav>50 возможностей<\/a>.<\/p><aside class=\"note\"><p>nicebot построен на <code>async<\/code>. Каждый обработчик объявляется через <code>async def<\/code>, а каждый запрос к Telegram пишется с <code>await<\/code>.<\/p><\/aside>", "toc": [["почему-nicebot", "Почему nicebot?"], ["что-внутри", "Что внутри"]], "text": "nicebot — Python-библиотека, которая делает разработку Telegram-ботов максимально простой. Один импорт, один объект и обычные функции. База данных, кнопки, диалоги, переводы, статистика и админ-панель уже встроены. python Это полностью рабочий бот. В нём нет Dispatcher , Router и классов состояний, а пользователь автоматически сохраняется в базу. Почему nicebot? Сравним простой бот регистрации. Сначала aiogram: python Тот же бот на nicebot: python ctx.ask() задаёт вопрос и ждёт ответ. Если передать int , бот вежливо переспросит, пока не получит число. Не нужно писать StatesGroup , сохранять и очищать состояние. Что внутри Полный Bot API 10.3: 403 типа и 185 методов сгенерированы из официальной спецификации Встроенная ORM: один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями Диалоги: ask , confirm , choose , form и готовые валидаторы Кнопки: on_click , шаблоны, переключатели, кнопки с таймером и одноразовые, авто-раскладка Бизнес: рефералы, рассылки, статистика, админ-панель, обязательная подписка, поддержка, Telegram Stars Надёжность: сам ждёт flood-wait, повторяет запрос при сетевой ошибке, не теряет апдейты при перезапуске Скорость: типы на msgspec и один пул соединений Полный список на странице 50 возможностей . nicebot построен на async . Каждый обработчик объявляется через async def , а каждый запрос к Telegram пишется с await ."}, "install": {"title": "Установка", "html": "<p>Нужен Python 3.10 или новее.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">pip install nicebot                 # с SQLite\npip install \"nicebot[postgres]\"     # + PostgreSQL\npip install \"nicebot[mysql]\"        # + MySQL / MariaDB\npip install \"nicebot[mongo]\"        # + MongoDB\npip install \"nicebot[redis]\"        # + Redis\npip install \"nicebot[all]\"          # всё сразу<\/code><\/pre><\/figure><p>Часть в квадратных скобках устанавливает драйвер нужной базы. SQLite работает без дополнений.<\/p><h2 id=\"создать-готовый-проект\">Создать готовый проект<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">nicebot new mybot\ncd mybot\npython bot.py<\/code><\/pre><\/figure><p>Команда создаёт такую структуру:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">text<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-plaintext\">mybot/\n├── bot.py            # главный файл\n├── .env              # BOT_TOKEN, DATABASE_URL, ADMINS\n├── handlers/\n│   └── basic.py      # обработчики с Router\n└── locales/\n    ├── uz.json\n    ├── ru.json\n    └── en.json<\/code><\/pre><\/figure><p>Откройте <code>.env<\/code> и вместо <code>BOT_TOKEN<\/code> впишите токен, который выдал @BotFather.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">BOT_TOKEN=123456:ABC-your-token\nDATABASE_URL=sqlite:///bot.db\nADMINS=123456789,987654321\nTZ=Asia/Tashkent<\/code><\/pre><\/figure><h2 id=\"проверить-версию\">Проверить версию<\/h2><p>Команда <code>nicebot version<\/code> показывает версии библиотеки, Bot API и Python.<\/p>", "toc": [["создать-готовый-проект", "Создать готовый проект"], ["проверить-версию", "Проверить версию"]], "text": "Нужен Python 3.10 или новее. bash Часть в квадратных скобках устанавливает драйвер нужной базы. SQLite работает без дополнений. Создать готовый проект bash Команда создаёт такую структуру: text Откройте .env и вместо BOT_TOKEN впишите токен, который выдал @BotFather. bash Проверить версию Команда nicebot version показывает версии библиотеки, Bot API и Python."}, "first-bot": {"title": "Первый бот", "html": "<h2 id=\"1-получите-токен\">1. Получите токен<\/h2><p>Откройте @BotFather в Telegram, отправьте <code>/newbot<\/code>, задайте имя и username. Вы получите токен вида <code>123456:ABC-DEF...<\/code>. Никому его не показывайте.<\/p><h2 id=\"2-напишите-код\">2. Напишите код<\/h2><p>Создайте файл <code>bot.py<\/code>:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><h2 id=\"3-запустите\">3. Запустите<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">python bot.py<\/code><\/pre><\/figure><p>В терминале появится <code>✅ @ваш_бот ishga tushdi<\/code>. Напишите боту <code>/start<\/code>, и он поздоровается с вами по имени.<\/p><h2 id=\"что-произошло\">Что произошло?<\/h2><div class=\"table\"><table><thead><tr><th>Строка<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>Nicebot(token=...)<\/code><\/td><td>Создаёт бота. Без параметра <code>db<\/code> используется SQLite в памяти<\/td><\/tr><tr><td><code>@bot.command(\"start\")<\/code><\/td><td>При команде <code>/start<\/code> вызывает функцию ниже<\/td><\/tr><tr><td><code>async def start(ctx)<\/code><\/td><td><code>ctx<\/code> знает всё о текущем сообщении<\/td><\/tr><tr><td><code>await ctx.reply(...)<\/code><\/td><td>Отправляет ответ в этот чат<\/td><\/tr><tr><td><code>bot.start()<\/code><\/td><td>Начинает получать сообщения. Остановка — Ctrl+C<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><p>Чтобы данные сохранялись после перезапуска, укажите <code>Nicebot(token=..., db=\"sqlite:///bot.db\")<\/code>.<\/p><\/aside><h2 id=\"автоперезапуск-при-изменении-кода\">Автоперезапуск при изменении кода<\/h2><p>С <code>bot.start(reload=True)<\/code> бот сам перезапускается после каждого сохранения файла. Это очень удобно во время разработки.<\/p>", "toc": [["1-получите-токен", "1. Получите токен"], ["2-напишите-код", "2. Напишите код"], ["3-запустите", "3. Запустите"], ["что-произошло", "Что произошло?"], ["автоперезапуск-при-изменении-кода", "Автоперезапуск при изменении кода"]], "text": "1. Получите токен Откройте @BotFather в Telegram, отправьте /newbot , задайте имя и username. Вы получите токен вида 123456:ABC-DEF... . Никому его не показывайте. 2. Напишите код Создайте файл bot.py : python 3. Запустите bash В терминале появится ✅ @ваш_бот ishga tushdi . Напишите боту /start , и он поздоровается с вами по имени. Что произошло? Строка Значение Nicebot(token=...) Создаёт бота. Без параметра db используется SQLite в памяти @bot.command(\"start\") При команде /start вызывает функцию ниже async def start(ctx) ctx знает всё о текущем сообщении await ctx.reply(...) Отправляет ответ в этот чат bot.start() Начинает получать сообщения. Остановка — Ctrl+C Чтобы данные сохранялись после перезапуска, укажите Nicebot(token=..., db=\"sqlite:///bot.db\") . Автоперезапуск при изменении кода С bot.start(reload=True) бот сам перезапускается после каждого сохранения файла. Это очень удобно во время разработки."}, "concepts": {"title": "Основные понятия", "html": "<p>В nicebot всего три понятия.<\/p><h2 id=\"бот\">Бот<\/h2><p><code>Nicebot<\/code> — это всё ваше приложение. Здесь задаются токен, база, админы, язык и другие настройки.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(\n    token=\"...\",\n    db=\"postgres://user:pass@localhost/mybot\",\n    admins=[123456789],\n    lang=\"uz\",                       # язык по умолчанию\n    required_channels=[\"@mykanal\"],  # обязательная подписка\n    support_chat=-1001234567890,     # группа поддержки\n    captcha=\"2m\",                    # для новых участников группы\n    tz=\"Asia/Tashkent\",\n)<\/code><\/pre><\/figure><h2 id=\"обработчик\">Обработчик<\/h2><p>Обработчик — это <code>async<\/code>-функция, которая вызывается при событии. Декоратор говорит, когда её вызывать: <code>@bot.command(\"start\")<\/code>, <code>@bot.text(\"salom\")<\/code>, <code>@bot.callback(\"buy:{id:int}\")<\/code> и так далее. Обработчики проверяются в порядке объявления, и срабатывает первый подходящий.<\/p><h2 id=\"ctx-контекст\">ctx (контекст)<\/h2><p>Для каждого сообщения создаётся новый <code>ctx<\/code>, который приходит в обработчик первым аргументом. У него две задачи:<\/p><ul><li><strong>даёт данные:<\/strong> <code>ctx.text<\/code>, <code>ctx.user<\/code>, <code>ctx.chat_id<\/code>, <code>ctx.args<\/code>…<\/li><li><strong>выполняет действия:<\/strong> <code>ctx.reply()<\/code>, <code>ctx.edit()<\/code>, <code>ctx.ask()<\/code>, <code>ctx.photo()<\/code>…<\/li><\/ul><h2 id=\"жизненный-цикл\">Жизненный цикл<\/h2><p>Когда приходит сообщение, происходит следующее:<\/p><ol><li>Если пользователь отвечает на <code>ctx.ask()<\/code>, сообщение передаётся туда<\/li><li>Работают встроенные middleware: пользователь сохраняется в базу, проверяются режим техработ и обязательная подписка<\/li><li>Работают ваши middleware<\/li><li>Вызывается первый подходящий обработчик<\/li><li>Если ничего не подошло, срабатывает <code>@bot.fallback()<\/code> или режим поддержки<\/li><li>Если была нажата кнопка и вы на неё не ответили, <code>answerCallbackQuery<\/code> отправляется автоматически<\/li><\/ol>", "toc": [["бот", "Бот"], ["обработчик", "Обработчик"], ["ctx-контекст", "ctx (контекст)"], ["жизненный-цикл", "Жизненный цикл"]], "text": "В nicebot всего три понятия. Бот Nicebot — это всё ваше приложение. Здесь задаются токен, база, админы, язык и другие настройки. python Обработчик Обработчик — это async -функция, которая вызывается при событии. Декоратор говорит, когда её вызывать: @bot.command(\"start\") , @bot.text(\"salom\") , @bot.callback(\"buy:{id:int}\") и так далее. Обработчики проверяются в порядке объявления, и срабатывает первый подходящий. ctx (контекст) Для каждого сообщения создаётся новый ctx , который приходит в обработчик первым аргументом. У него две задачи: даёт данные: ctx.text , ctx.user , ctx.chat_id , ctx.args … выполняет действия: ctx.reply() , ctx.edit() , ctx.ask() , ctx.photo() … Жизненный цикл Когда приходит сообщение, происходит следующее: Если пользователь отвечает на ctx.ask() , сообщение передаётся туда Работают встроенные middleware: пользователь сохраняется в базу, проверяются режим техработ и обязательная подписка Работают ваши middleware Вызывается первый подходящий обработчик Если ничего не подошло, срабатывает @bot.fallback() или режим поддержки Если была нажата кнопка и вы на неё не ответили, answerCallbackQuery отправляется автоматически"}, "handlers": {"title": "Обработчики", "html": "<h2 id=\"виды\">Виды<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"help\", description=\"Yordam\")\nasync def help_(ctx):\n    await ctx.reply(\"Men nima qila olaman...\")\n\n@bot.text(\"salom\")                       # точный текст (без учёта регистра)\nasync def salom(ctx):\n    await ctx.reply(\"Va alaykum assalom!\")\n\n@bot.text(contains=\"narx\")               # если содержит \"narx\"\nasync def narx(ctx):\n    await ctx.reply(\"Narxlar: ...\")\n\n@bot.text(regex=r\"^buy (?P&lt;qty&gt;\\d+)$\")  # группы regex становятся параметрами\nasync def buy(ctx, qty: int):\n    await ctx.reply(f\"{qty} dona\")\n\n@bot.on(\"photo\")                          # пришло фото\nasync def photo(ctx):\n    await ctx.reply(\"Chiroyli rasm!\")\n\n@bot.text()                               # любой обычный текст\nasync def echo(ctx):\n    await ctx.reply(ctx.text)\n\n@bot.fallback()                           # если ничего не подошло\nasync def unknown(ctx):\n    await ctx.reply(\"Tushunmadim 🤔\")<\/code><\/pre><\/figure><h2 id=\"параметры-обработчиков\">Параметры обработчиков<\/h2><p>Эти параметры можно добавить к любому декоратору:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"admin\", admin=True)              # только админы\n@bot.command(\"bonus\", throttle=\"1d\")           # раз в день\n@bot.command(\"report\", typing=True)            # показывает \"печатает...\"\n@bot.text(\"salom\", chat=\"private\")             # только в личном чате\n@bot.text(state=\"waiting_phone\")               # только в этом состоянии\n@bot.command(\"vip\", users=[111, 222])          # только эти люди\n@bot.message(F.photo &amp; F.private)              # фильтры\n@bot.deep_link(r\"promo_(?P&lt;code&gt;\\w+)\")         # t.me/bot?start=promo_X\nasync def handler(ctx): ...<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Параметр<\/th><th>Что делает<\/th><\/tr><\/thead><tbody><tr><td><code>admin=True<\/code><\/td><td>Только для <code>Nicebot(admins=[...])<\/code><\/td><\/tr><tr><td><code>chat=\"private\"<\/code><\/td><td><code>private<\/code>, <code>group<\/code>, <code>supergroup<\/code>, <code>channel<\/code><\/td><\/tr><tr><td><code>throttle=\"3s\"<\/code><\/td><td>Ограничение частоты для одного пользователя. При превышении показывает «⏳ Подождите»<\/td><\/tr><tr><td><code>typing=True<\/code><\/td><td>Пока работает обработчик, показывается «печатает…». Можно и <code>\"upload_photo\"<\/code><\/td><\/tr><tr><td><code>state=\"x\"<\/code><\/td><td>Только если пользователь в этом состоянии<\/td><\/tr><tr><td><code>users=[...]<\/code><\/td><td>Только для этих id<\/td><\/tr><tr><td><code>description=\"...\"<\/code><\/td><td>Команда появится в меню Telegram. Можно <code>{\"uz\": ..., \"ru\": ...}<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"фильтры\">Фильтры<\/h2><p><code>F<\/code> даёт готовые фильтры. Их можно объединять через <code>&amp;<\/code> (и), <code>|<\/code> (или) и <code>~<\/code> (не).<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import F\n\n@bot.message(F.photo | F.document)\n@bot.message(F.text &amp; ~F.command)\n@bot.message(F.regex(r\"\\d{4}\"))\n@bot.message(F.contains(\"chegirma\", \"aksiya\"))\n@bot.message(F.user(123, 456))\n@bot.message(lambda ctx: len(ctx.text or \"\") &gt; 100)   # свой фильтр\nasync def h(ctx): ...<\/code><\/pre><\/figure><h2 id=\"router-разделить-код-на-файлы\">Router: разделить код на файлы<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># handlers/shop.py\nfrom nicebot import Router\n\nrouter = Router(chat=\"private\")   # применяется ко всем обработчикам\n\n@router.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Do'kon\")\n\n# bot.py\nbot.include(\"handlers\")           # все Router'ы из папки\n# или: from handlers.shop import router; bot.include(router)<\/code><\/pre><\/figure><h2 id=\"все-типы-событий\">Все типы событий<\/h2><p><code>@bot.callback<\/code>, <code>@bot.inline<\/code>, <code>@bot.chosen_inline<\/code>, <code>@bot.edited<\/code>, <code>@bot.channel<\/code>, <code>@bot.join<\/code>, <code>@bot.leave<\/code>, <code>@bot.album<\/code>, <code>@bot.paid<\/code>, <code>@bot.pre_checkout<\/code>, <code>@bot.webapp_data<\/code>, <code>@bot.my_chat_member<\/code>, <code>@bot.chat_member<\/code>, <code>@bot.join_request<\/code>, <code>@bot.reaction<\/code>, <code>@bot.poll_answer<\/code>. Для любого другого апдейта: <code>@bot.event(\"chat_boost\")<\/code>.<\/p><aside class=\"note\"><p>Если в обработчике написать <code>raise SkipHandler<\/code>, сработает следующий подходящий.<\/p><\/aside>", "toc": [["виды", "Виды"], ["параметры-обработчиков", "Параметры обработчиков"], ["фильтры", "Фильтры"], ["router-разделить-код-на-файлы", "Router: разделить код на файлы"], ["все-типы-событий", "Все типы событий"]], "text": "Виды python Параметры обработчиков Эти параметры можно добавить к любому декоратору: python Параметр Что делает admin=True Только для Nicebot(admins=[...]) chat=\"private\" private , group , supergroup , channel throttle=\"3s\" Ограничение частоты для одного пользователя. При превышении показывает «⏳ Подождите» typing=True Пока работает обработчик, показывается «печатает…». Можно и \"upload_photo\" state=\"x\" Только если пользователь в этом состоянии users=[...] Только для этих id description=\"...\" Команда появится в меню Telegram. Можно {\"uz\": ..., \"ru\": ...} Фильтры F даёт готовые фильтры. Их можно объединять через & (и), | (или) и ~ (не). python Router: разделить код на файлы python Все типы событий @bot.callback , @bot.inline , @bot.chosen_inline , @bot.edited , @bot.channel , @bot.join , @bot.leave , @bot.album , @bot.paid , @bot.pre_checkout , @bot.webapp_data , @bot.my_chat_member , @bot.chat_member , @bot.join_request , @bot.reaction , @bot.poll_answer . Для любого другого апдейта: @bot.event(\"chat_boost\") . Если в обработчике написать raise SkipHandler , сработает следующий подходящий."}, "ctx": {"title": "ctx — контекст", "html": "<h2 id=\"данные\">Данные<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.message()\nasync def info(ctx):\n    ctx.text        # текст сообщения (или подпись)\n    ctx.name        # имя пользователя\n    ctx.user        # пользователь из базы (сохраняется сам)\n    ctx.user_id     # Telegram id\n    ctx.chat_id     # chat id\n    ctx.command     # \"/start ref_5\" -&gt; \"start\"\n    ctx.args        # \"/give 10 ali\" -&gt; [\"10\", \"ali\"]\n    ctx.payload     # deep link: \"ref_5\"\n    ctx.lang        # \"uz\", \"ru\", \"en\"\n    ctx.is_private  # личный чат?\n    ctx.is_admin    # админ бота?\n    ctx.message     # полный объект Message\n    ctx.mention     # кликабельное имя (HTML)<\/code><\/pre><\/figure><h2 id=\"отправка\">Отправка<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Salom!\")                          # текст\nawait ctx.reply(\"Tanlang\", buttons=[\"A\", \"B\"])    # с inline-кнопками\nawait ctx.reply(\"Yozing\", keyboard=[\"Menyu\"])     # нижняя клавиатура\nawait ctx.reply(\"30 soniyada o'chadi\", delete_after=\"30s\")\nawait ctx.reply(\"Ovozsiz\", silent=True, protect=True)\n\nawait ctx.photo(\"rasm.jpg\", caption=\"Mana\")       # файл, URL или file_id\nawait ctx.video(\"https://site.uz/v.mp4\")\nawait ctx.document(\"hisobot.pdf\")\nawait ctx.media_group([\"1.jpg\", \"2.jpg\", \"3.jpg\"], caption=\"Albom\")\nawait ctx.location(40.10, 65.37)\nawait ctx.poll(\"Qaysi biri?\", [\"Python\", \"Go\"])\nawait ctx.dice(\"🎯\")<\/code><\/pre><\/figure><p>Все методы отправки принимают одинаковые дополнительные параметры:<\/p><div class=\"table\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>buttons=<\/code><\/td><td>Inline-кнопки (<a href=\"#buttons\" data-nav>Кнопки<\/a>)<\/td><\/tr><tr><td><code>keyboard=<\/code><\/td><td>Нижняя клавиатура. <code>False<\/code> закрывает её<\/td><\/tr><tr><td><code>columns=<\/code><\/td><td>Число столбцов кнопок<\/td><\/tr><tr><td><code>delete_after=\"1m\"<\/code><\/td><td>Удалить сообщение автоматически<\/td><\/tr><tr><td><code>silent=True<\/code><\/td><td>Без звука<\/td><\/tr><tr><td><code>protect=True<\/code><\/td><td>Запрет пересылки и сохранения<\/td><\/tr><tr><td><code>quote=True<\/code><\/td><td>Ответить реплаем на входящее сообщение<\/td><\/tr><tr><td><code>preview=False<\/code><\/td><td>Отключить превью ссылок<\/td><\/tr><tr><td><code>chat_id=<\/code><\/td><td>Отправить в другой чат<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"редактирование-и-ответы\">Редактирование и ответы<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.edit(\"Yangi matn\")               # изменить сообщение с нажатой кнопкой\nawait ctx.edit_buttons([Button(\"OK\", data=\"ok\")])\nawait ctx.respond(\"Javob\")                 # после кнопки редактирует, иначе отправляет\nawait ctx.answer(\"Saqlandi ✅\")             # всплывающее сообщение над кнопкой\nawait ctx.answer(\"Diqqat!\", alert=True)    # в виде окна\nawait ctx.delete()                          # удалить сообщение\nawait ctx.react(\"🔥\")                       # реакция\nawait ctx.pin()<\/code><\/pre><\/figure><p><code>ctx.edit()<\/code> сам выбирает, что редактировать: подпись, если в сообщении есть медиа, иначе текст. Ошибку «message is not modified» он молча пропускает.<\/p><h2 id=\"другие-полезные-методы\">Другие полезные методы<\/h2><div class=\"table\"><table><thead><tr><th>Метод<\/th><th>Что делает<\/th><\/tr><\/thead><tbody><tr><td><code>ctx.forward(chat)<\/code> / <code>ctx.copy(chat)<\/code><\/td><td>Переслать сообщение в другой чат<\/td><\/tr><tr><td><code>ctx.download()<\/code> / <code>ctx.save(path)<\/code><\/td><td>Скачать файл<\/td><\/tr><tr><td><code>ctx.action(\"upload_photo\")<\/code><\/td><td>Показать статус<\/td><\/tr><tr><td><code>ctx.is_member(\"@kanal\")<\/code><\/td><td>Проверить подписку<\/td><\/tr><tr><td><code>ctx.notify_admins(text)<\/code><\/td><td>Сообщение админам<\/td><\/tr><tr><td><code>ctx.background(func)<\/code><\/td><td>Фоновая задача<\/td><\/tr><tr><td><code>ctx.t(\"key\")<\/code><\/td><td>Перевод<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["данные", "Данные"], ["отправка", "Отправка"], ["редактирование-и-ответы", "Редактирование и ответы"], ["другие-полезные-методы", "Другие полезные методы"]], "text": "Данные python Отправка python Все методы отправки принимают одинаковые дополнительные параметры: Параметр Значение buttons= Inline-кнопки ( Кнопки ) keyboard= Нижняя клавиатура. False закрывает её columns= Число столбцов кнопок delete_after=\"1m\" Удалить сообщение автоматически silent=True Без звука protect=True Запрет пересылки и сохранения quote=True Ответить реплаем на входящее сообщение preview=False Отключить превью ссылок chat_id= Отправить в другой чат Редактирование и ответы python ctx.edit() сам выбирает, что редактировать: подпись, если в сообщении есть медиа, иначе текст. Ошибку «message is not modified» он молча пропускает. Другие полезные методы Метод Что делает ctx.forward(chat) / ctx.copy(chat) Переслать сообщение в другой чат ctx.download() / ctx.save(path) Скачать файл ctx.action(\"upload_photo\") Показать статус ctx.is_member(\"@kanal\") Проверить подписку ctx.notify_admins(text) Сообщение админам ctx.background(func) Фоновая задача ctx.t(\"key\") Перевод"}, "formatting": {"title": "Форматирование", "html": "<p>По умолчанию nicebot использует HTML parse mode, поэтому теги <code>&lt;b&gt;<\/code>, <code>&lt;i&gt;<\/code>, <code>&lt;code&gt;<\/code> и <code>&lt;a href&gt;<\/code> работают сразу.<\/p><h2 id=\"безопасная-работа-с-текстом-пользователя\">Безопасная работа с текстом пользователя<\/h2><p>В тексте пользователя могут быть символы <code>&lt;<\/code> или <code>&amp;<\/code>. Если вставить его напрямую, Telegram вернёт ошибку. <code>html()<\/code> экранирует значения, а шаблон оставляет как есть:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import html, bold, link, mention\n\nname = ctx.text                                 # текст от пользователя\nawait ctx.reply(html(\"&lt;b&gt;Salom, {}!&lt;/b&gt;\", name))  # name безопасно экранируется\nawait ctx.reply(bold(\"Muhim\") + \" xabar\")\nawait ctx.reply(link(\"Saytimiz\", \"https://tezbaraka.uz\"))<\/code><\/pre><\/figure><p>Готовые помощники: <code>bold<\/code>, <code>italic<\/code>, <code>underline<\/code>, <code>strike<\/code>, <code>spoiler<\/code>, <code>code<\/code>, <code>pre<\/code>, <code>link<\/code>, <code>mention<\/code>, <code>quote<\/code>, <code>escape<\/code>.<\/p><aside class=\"note\"><p>Даже при ошибке форматирования бот не упадёт. nicebot отправит сообщение без форматирования и запишет предупреждение в лог.<\/p><\/aside><h2 id=\"другие-режимы\">Другие режимы<\/h2><p><code>Nicebot(parse_mode=\"MarkdownV2\")<\/code> или <code>parse_mode=None<\/code>, чтобы работать без форматирования.<\/p>", "toc": [["безопасная-работа-с-текстом-пользователя", "Безопасная работа с текстом пользователя"], ["другие-режимы", "Другие режимы"]], "text": "По умолчанию nicebot использует HTML parse mode, поэтому теги <b> , <i> , <code> и <a href> работают сразу. Безопасная работа с текстом пользователя В тексте пользователя могут быть символы < или & . Если вставить его напрямую, Telegram вернёт ошибку. html() экранирует значения, а шаблон оставляет как есть: python Готовые помощники: bold , italic , underline , strike , spoiler , code , pre , link , mention , quote , escape . Даже при ошибке форматирования бот не упадёт. nicebot отправит сообщение без форматирования и запишет предупреждение в лог. Другие режимы Nicebot(parse_mode=\"MarkdownV2\") или parse_mode=None , чтобы работать без форматирования."}, "buttons": {"title": "Inline-кнопки", "html": "<h2 id=\"кнопка-и-её-действие\">Кнопка и её действие<\/h2><p><code>Button<\/code> принимает текст и одно действие. Удобнее всего <code>on_click<\/code>: при нажатии вызывается обычная функция. Не нужно придумывать callback data и ловить её отдельным обработчиком.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Button\n\nasync def buy(ctx):\n    await ctx.edit(\"✅ Sotib olindi\")\n\n@bot.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Mahsulot: Kitob — 50 000 so'm\", buttons=[\n        [Button(\"🛒 Sotib olish\", on_click=buy)],\n        [Button(\"🌐 Sayt\", url=\"https://tezbaraka.uz\"),\n         Button(\"📋 Promo\", copy=\"NICE2026\")],\n        [Button(\"📱 Ilova\", webapp=\"https://app.tezbaraka.uz\")],\n    ])<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Тип<\/th><th>Запись<\/th><\/tr><\/thead><tbody><tr><td>Функция<\/td><td><code>Button(\"OK\", on_click=func)<\/code><\/td><\/tr><tr><td>Ссылка<\/td><td><code>Button(\"Сайт\", url=\"https://...\")<\/code><\/td><\/tr><tr><td>Mini App<\/td><td><code>Button(\"App\", webapp=\"https://...\")<\/code><\/td><\/tr><tr><td>Копирование<\/td><td><code>Button(\"Код\", copy=\"PROMO\")<\/code><\/td><\/tr><tr><td>Поделиться<\/td><td><code>Button(\"Поделиться\", share=\"текст\")<\/code><\/td><\/tr><tr><td>Обычная data<\/td><td><code>Button(\"Да\", data=\"yes\")<\/code><\/td><\/tr><tr><td>Оплата<\/td><td><code>Button(\"Оплатить\", pay=True)<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"передача-параметров\">Передача параметров<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async def add_to_cart(ctx, id: int, qty: int):\n    await ctx.answer(f\"{id} dan {qty} ta qo'shildi\")\n\nButton(\"➕ Savatga\", on_click=add_to_cart, id=15, qty=2)<\/code><\/pre><\/figure><h2 id=\"шаблоны-callback\">Шаблоны callback<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.callback(\"product:{id:int}\")\nasync def product(ctx, id: int):\n    p = await Product.get(id=id)\n    await ctx.edit(f\"{p.title} — {p.price} so'm\")\n\n# кнопка сама заполняет шаблон:\nButton(\"Ko'rish\", on_click=product, id=5)      # callback_data = \"product:5\"<\/code><\/pre><\/figure><p>Типы: <code>int<\/code>, <code>float<\/code>, <code>bool<\/code>, <code>str<\/code> (по умолчанию) и <code>any<\/code>. Значения приходят в обработчик с правильным типом.<\/p><h2 id=\"автоматическая-раскладка\">Автоматическая раскладка<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># список: короткие кнопки сами встают в ряд\nawait ctx.reply(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\", \"XL\"])\n\n# или задайте число столбцов\nawait ctx.reply(\"Tanlang\", buttons=items, columns=2)\n\n# dict: текст -&gt; действие (функция, URL или data)\nawait ctx.reply(\"Menyu\", buttons={\"Profil\": profile, \"Sayt\": \"https://tezbaraka.uz\"})<\/code><\/pre><\/figure><h2 id=\"защищённые-кнопки\">Защищённые кнопки<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Button(\"🎁 Bonus olish\", on_click=bonus, once=True)          # только один раз\nButton(\"⏳ Taklif\", on_click=offer, ttl=\"10m\")              # истекает через 10 минут\nButton(\"👤 Faqat siz\", on_click=mine, only=ctx.user_id)     # другие не смогут нажать<\/code><\/pre><\/figure><aside class=\"note\"><p>Telegram ограничивает callback_data 64 байтами. nicebot хранит длинные данные в базе и кладёт в кнопку короткий ключ, вы этого даже не заметите. На нажатия тоже отвечается автоматически, поэтому «часики» на кнопке не зависают.<\/p><\/aside>", "toc": [["кнопка-и-её-действие", "Кнопка и её действие"], ["передача-параметров", "Передача параметров"], ["шаблоны-callback", "Шаблоны callback"], ["автоматическая-раскладка", "Автоматическая раскладка"], ["защищённые-кнопки", "Защищённые кнопки"]], "text": "Кнопка и её действие Button принимает текст и одно действие. Удобнее всего on_click : при нажатии вызывается обычная функция. Не нужно придумывать callback data и ловить её отдельным обработчиком. python Тип Запись Функция Button(\"OK\", on_click=func) Ссылка Button(\"Сайт\", url=\"https://...\") Mini App Button(\"App\", webapp=\"https://...\") Копирование Button(\"Код\", copy=\"PROMO\") Поделиться Button(\"Поделиться\", share=\"текст\") Обычная data Button(\"Да\", data=\"yes\") Оплата Button(\"Оплатить\", pay=True) Передача параметров python Шаблоны callback python Типы: int , float , bool , str (по умолчанию) и any . Значения приходят в обработчик с правильным типом. Автоматическая раскладка python Защищённые кнопки python Telegram ограничивает callback_data 64 байтами. nicebot хранит длинные данные в базе и кладёт в кнопку короткий ключ, вы этого даже не заметите. На нажатия тоже отвечается автоматически, поэтому «часики» на кнопке не зависают."}, "keyboards": {"title": "Клавиатура и переключатели", "html": "<h2 id=\"нижняя-reply-клавиатура\">Нижняя (reply) клавиатура<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Raqamingizni yuboring\", keyboard=[\"📞 Raqam yuborish:contact\"])\nawait ctx.reply(\"Qayerdasiz?\", keyboard=[\"📍 Joylashuv:location\"])\nawait ctx.reply(\"Menyu\", keyboard=[\"🛍 Do'kon\", \"📞 Aloqa\", \"ℹ️ Haqida\"], columns=2)\nawait ctx.reply(\"Yopildi\", remove_keyboard=True)<\/code><\/pre><\/figure><p>Суффикс <code>:contact<\/code> создаёт кнопку запроса номера, а <code>:location<\/code> — кнопку запроса геолокации. Для сложных случаев есть <code>ReplyButton(\"...\", webapp=...)<\/code>.<\/p><h2 id=\"toggle-включить-и-выключить\">Toggle: включить и выключить<\/h2><p>Для меню настроек. При нажатии ✅ и ⬜️ меняются сами, а значение сохраняется для каждого пользователя.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Toggle\n\n@bot.command(\"sozlamalar\")\nasync def settings_menu(ctx):\n    await ctx.reply(\"⚙️ Sozlamalar\", buttons=[\n        [Toggle(\"Bildirishnomalar\", key=\"notify\", default=True)],\n        [Toggle(\"Kechki rejim\", key=\"night\")],\n    ])\n\n# читайте значение где угодно:\nif await ctx.setting(\"notify\"):\n    ...<\/code><\/pre><\/figure><p>Чтобы сразу реагировать на изменение, укажите <code>Toggle(..., on_change=func)<\/code>: будет вызвана <code>func(ctx, value)<\/code>.<\/p>", "toc": [["нижняя-reply-клавиатура", "Нижняя (reply) клавиатура"], ["toggle-включить-и-выключить", "Toggle: включить и выключить"]], "text": "Нижняя (reply) клавиатура python Суффикс :contact создаёт кнопку запроса номера, а :location — кнопку запроса геолокации. Для сложных случаев есть ReplyButton(\"...\", webapp=...) . Toggle: включить и выключить Для меню настроек. При нажатии ✅ и ⬜️ меняются сами, а значение сохраняется для каждого пользователя. python Чтобы сразу реагировать на изменение, укажите Toggle(..., on_change=func) : будет вызвана func(ctx, value) ."}, "conversations": {"title": "Диалоги", "html": "<p>Это главное удобство nicebot. Вы задаёте вопрос и ждёте ответ прямо внутри той же функции.<\/p><h2 id=\"ask\">ask<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date\n\n@bot.command(\"register\")\nasync def register(ctx):\n    name  = await ctx.ask(\"Ismingiz?\")\n    age   = await ctx.ask(\"Yoshingiz?\", int)        # переспрашивает, если не число\n    phone = await ctx.ask(\"Raqamingiz?\", Phone)     # с кнопкой \"Отправить номер\"\n    size  = await ctx.ask(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\"])\n    await ctx.reply(f\"Rahmat, {name}!\")<\/code><\/pre><\/figure><ul><li>Если пользователь напишет <code>/cancel<\/code> или нажмёт «🚫 Отмена», диалог тихо завершится<\/li><li>Если 10 минут нет ответа, появится «⌛️ Время ожидания истекло». Это меняется через <code>timeout=\"5m\"<\/code><\/li><li>При неверном значении показывается понятная ошибка и вопрос задаётся снова. Число попыток задаётся через <code>retries=<\/code><\/li><\/ul><h2 id=\"confirm\">confirm<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">if await ctx.confirm(\"Buyurtmani tasdiqlaysizmi?\"):\n    await ctx.reply(\"✅ Qabul qilindi\")\nelse:\n    await ctx.reply(\"Bekor qilindi\")<\/code><\/pre><\/figure><h2 id=\"choose\">choose<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">city = await ctx.choose(\"Shahringiz?\", [\"Toshkent\", \"Navoiy\", \"Buxoro\"])\n\ntags = await ctx.choose(\n    \"Qiziqishlaringiz?\",\n    {\"⚽️ Sport\": \"sport\", \"🎵 Musiqa\": \"music\", \"💻 IT\": \"it\"},\n    multiple=True,       # отметить ✅/⬜️ и нажать \"Готово\"\n)                        # -&gt; [\"sport\", \"it\"]<\/code><\/pre><\/figure><h2 id=\"form-несколько-вопросов-подряд\">form: несколько вопросов подряд<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button
