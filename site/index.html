/span><div><code>Safe formatting<\/code><p>html() and a plain-text resend on markup errors<\/p><\/div><\/li><li><span class=\"fnum\">47<\/span><div><code>delete_after=<\/code><p>Delete messages automatically<\/p><\/div><\/li><li><span class=\"fnum\">48<\/span><div><code>Hot reload<\/code><p>bot.start(reload=True)<\/p><\/div><\/li><li><span class=\"fnum\">49<\/span><div><code>Test kit<\/code><p>bot.test(): tests without Telegram<\/p><\/div><\/li><li><span class=\"fnum\">50<\/span><div><code>CLI<\/code><p>nicebot new mybot<\/p><\/div><\/li><\/ol><\/section>", "toc": [["dialogs", "Dialogs"], ["buttons", "Buttons"], ["data", "Data"], ["business", "Business"], ["architecture", "Architecture"], ["reliability", "Reliability"]], "text": "Dialogs 5 01 await ctx.ask() Question and answer without FSM classes 02 ctx.confirm() Yes/No question that returns True/False 03 ctx.choose(multiple=True) Pick several options with ✅/⬜️ 04 ctx.form() Several questions, validation and re-asking 05 Validators Phone (+998), email, date, number, URL, photo and more Buttons 12 06 Button(on_click=) A button is bound straight to a function 07 Callback templates \"buy:{id:int}\" is parsed automatically 08 Automatic layout Short buttons share a row by themselves 09 Toggle ✅/⬜️ settings with the value saved 10 ttl= and only= Expiring buttons and buttons for one person 11 once=True One-time button 12 No 64-byte limit Long callback data is kept in the database 13 Auto-answer The loading clock never hangs 14 Reply shortcuts \"📞 Phone:contact\", \":location\" 15 ctx.respond() Edits after a button press, sends otherwise 16 Multi-level Menu The Back button is automatic 17 ctx.paginate() ◀️ 2/5 ▶️ pagination Data 4 18 Built-in ORM One API for SQLite, PostgreSQL, MySQL and MongoDB, with migrations 19 ctx.user Users are saved to the database automatically 20 i18n ctx.t(), built-in uz/ru/en texts 21 file_id cache A local file is uploaded only once Business 10 22 Referral system ctx.ref_link, referrer_id and @bot.on_referral 23 Broadcasts Rate limits, blocked-user marking and resuming 24 Admin panel /stats, /broadcast, /maintenance and /backup 25 Analytics DAU/MAU, retention and top commands 26 Required subscription required_channels=[…] 27 Support mode Messages go to a group, replies go back to the user 28 Maintenance mode Admins can still use the bot 29 Telegram Stars ctx.invoice() and @bot.paid 30 Groups and captcha ban, mute, warn (3 → ban), captcha for newcomers 31 Error reports Tracebacks are sent to admins automatically Architecture 11 32 DI via type hints async def h(ctx, user: Customer, cfg: Settings) 33 Nicebot.from_env() Configuration from a .env file 34 bot.include(\"handlers\") Routers are discovered automatically 35 @cache(\"5m\") Cache for async functions 36 ctx.background() Background tasks with retries 37 @bot.every / @bot.at Scheduler with time zones 38 Albums A media group arrives as one list in one handler 39 Mini App server Files and initData (HMAC) checks inside the bot process 40 Mini App RPC @bot.api endpoints and a ready nicebot.js 41 Several bots Nicebot.run_all(bot1, bot2) 42 typing=True Shows \"typing…\" while the handler runs Reliability 8 43 Flood protection Waits and resends on a 429 error 44 throttle= Rate limiting against spam 45 Graceful shutdown No updates are lost on restart 46 Safe formatting html() and a plain-text resend on markup errors 47 delete_after= Delete messages automatically 48 Hot reload bot.start(reload=True) 49 Test kit bot.test(): tests without Telegram 50 CLI nicebot new mybot", "min": 2}, "api": {"title": "Bot API", "desc": "185 methods and 403 types of the Bot API, fully typed.", "html": "<p><code>Nicebot<\/code> exposes every Bot API method directly. They are generated from the official specification and fully typed, so your editor suggests every parameter.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\ d", "cta2": "Read the docs", "install_tabs": ["pip", "uv", "New project"], "stats": ["Bot API methods", "typed objects", "databases", "built-in features"], "steps_kicker": "Quickstart", "steps_title": "Your first bot in three steps", "steps_sub": "No setup, templates or state classes.", "steps": [["Install", "One command. SQLite works with no extra packages."], ["Write", "6 lines in bot.py. @BotFather gives you the token."], ["Run", "Send /start to your bot in Telegram — it answers."]], "compare_kicker": "Comparison", "compare_title": "One bot, two ways", "compare_sub": "A sign-up bot that asks for a name and an age. aiogram needs a state class, FSMContext and a Dispatcher. nicebot needs a plain function.", "lines": "lines", "less": "{n}× less code", "show_code": "Show code", "features_kicker": "Features", "features_title": "Everything a bot needs", "features_sub": "No extra packages. Every topic has its own page in the docs.", "features": {"conversations": ["Dialogs", "Ask a question and await the answer right inside the function. Validation and re-asking are automatic."], "buttons": ["Buttons", "Bind a button straight to a function. No callback_data to invent."], "database": ["Database", "One ORM for SQLite, PostgreSQL, MySQL and MongoDB, with auto-migration."], "admin": ["Admin panel", "/stats, /broadcast, /maintenance and /backup are ready to use."], "miniapp": ["Mini Apps", "A web server and initData checks in the same process as the bot."], "testing": ["Testing", "Test without Telegram: send a message, tap a button, check the reply."]}, "all_features": "All 50 features", "path_kicker": "Learning path", "path_title": "Where should I start?", "path_sub": "Pick the path that fits you. Each page explains one topic.", "path": [["Beginner", "You know Python but haven't built a bot yet."], ["Built bots before", "You're coming from aiogram or another library."], ["Production", "You're shipping a bot to real users."]], "faq_kicker": "Questions", "faq_title": "Frequently asked questions", "faq": [["How is nicebot different from aiogram?", "aiogram is a powerful but low-level framework: you assemble states, Routers and a Dispatcher yourself. nicebot does that for you: ctx.ask() replaces state classes, users are saved to the database automatically, and an admin panel and broadcasts are built in."], ["Does it cover the whole Bot API?", "Yes. All 185 methods and 403 types of Bot API 10.3 are generated from the official specification. Where the short helpers aren't enough, call any method directly, e.g. await bot.set_chat_title(...)."], ["Which databases are supported?", "SQLite, PostgreSQL, MySQL/MariaDB and MongoDB. Your code stays the same; only the db= URL changes. SQLite works with no extra packages."], ["Is it ready for large bots?", "nicebot is async: it waits out flood limits, retries on network errors and never loses updates on shutdown. Webhooks and Docker are supported too."], ["Is it free?", "Yes. nicebot is open source under the MIT license, so you can use it in commercial projects too."]], "final_title": "Write your first bot now", "final_sub": "Installing takes a minute; your first bot takes five.", "docs_title": "nicebot documentation", "docs_lead": "From installation to production — everything you need to build a Telegram bot. Read it in order or jump to the section you need.", "start_here": "Start here", "sections": "Sections"}}}, "groupIcon": {"start": "rocket", "basics": "code", "ui": "tap", "data": "db", "business": "chart", "advanced": "layers", "reference": "book"}, "featureIcon": {"conversations": "chat", "buttons": "tap", "database": "db", "admin": "chart", "miniapp": "app", "testing": "check"}, "featureCode": {"conversations": "age = await ctx.ask(\"Yoshingiz?\", int)", "buttons": "Button(\"🛒 Sotib olish\", on_click=buy)", "database": "await Order.create(user_id=ctx.user_id)", "admin": "Nicebot(token=\"...\", admins=[123456789])", "miniapp": "@bot.api(\"/api/score\")", "testing": "await ali.click(\"M\")"}, "pa   function play(chat) { chat.classList.remove("play"); void chat.offsetWidth; chat.classList.add("play"); }
  function observe() {
    if (io) io.disconnect();
    if (spy) spy.disconnect();
    var chats = $$("[data-chat]"), bars = $("#bars");
    if (!reduce && "IntersectionObserver" in window) {
      io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) {
          if (!en.isIntersecting) return;
          if (en.target.hasAttribute("data-chat")) play(en.target); else en.target.classList.add("seen");
          io.unobserve(en.target);
        });
      }, { threshold: 0.35 });
      chats.forEach(function (c) { c.classList.add("anim"); io.observe(c); });
      if (bars) io.observe(bars);
    } else if (bars) bars.classList.add("seen");
    var links = $$("#toc a[data-toc]");
    if (links.length && "IntersectionObserver" in window) {
      var heads = links.map(function (a) { return document.getElementById(a.getAttribute("data-toc")); }).filter(Boolean);
      var visible = {};
      spy = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { visible[en.target.id] = en.isIntersecting; });
        var cur = null;
        for (var i = 0; i < heads.length; i++) { if (visible[heads[i].id]) { cur = heads[i].id; break; } }
        if (!cur) { for (var j = heads.length - 1; j >= 0; j--) { if (heads[j].getBoundingClientRect().top < 120) { cur = heads[j].id; break; } } }
        if (cur) links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-toc") === cur); });
      }, { rootMargin: "-70px 0px -60% 0px" });
      heads.forEach(function (h) { spy.observe(h); });
    }
  }
  function scrollToId(hid, smooth) {
    var el = document.getElementById(hid);
    if (el) el.scrollIntoView({ behavior: smooth && !reduce ? "smooth" : "auto", block: "start" });
  }

  // ---------- router: "" landing · docs · <group> · <page> · <page>/<heading>
  var current = null;
  function parse() {
    var raw = decodeURIComponent((location.hash || "").slice(1)), cut = raw.indexOf("/");
    return { id: cut < 0 ? raw : raw.slice(0, cut), anchor: cut < 0 ? "" : raw.slice(cut + 1) };
  }
  function route(keep) {
    var r = parse(), l = L(), id = r.id, kind;
    if (l.pages[id]) kind = "page"; else if (groupIds.indexOf(id) >= 0) kind = "group"; else if (id === "docs") kind = "docs"; else { kind = "home"; id = ""; }
    var same = current === kind + ":" + id + ":" + lang;
    if (!same) {
      document.body.classList.toggle("is-landing", kind === "home");
      if (kind === "page") renderPage(id); else if (kind === "group") renderGroup(id); else if (kind === "docs") renderOverview(); else renderLanding();
      renderTabs(id);
      labels(document);
      highlight(app);
      observe();
      current = kind + ":" + id + ":" + lang;
      document.title = kind === "page" ? l.pages[id].title + " · nicebot" : kind === "group" ? l.groups[id] + " · nicebot" : kind === "docs" ? U("docs") + " · nicebot" : "nicebot — " + U("tagline");
    }
    closeNav();
    if (r.anchor) { requestAnimationFrame(function () { scrollToId(r.anchor, same); }); }
    else if (!keep && !same) window.scrollTo(0, 0);
  }
  function closeNav() { document.body.classList.remove("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "false"); }

  function setLang(next) {
    lang = next;
    store("nb-lang", next);
    document.documentElement.lang = next;
    $("#lang").value = next;
    q.placeholder = U("search");
    renderFooter();
    route(true);
    if (!palette.hidden) search();
  }

  // ---------- search palette
  var active = 0, hits = [];
  function openSearch() { palette.hidden = false; q.value = ""; search(); setTimeout(function () { q.focus(); }, 0); document.body.style.overflow = "hidden"; }
  function closeSearch() { palette.hidden = true; document.body.style.overflow = ""; }
  function snippet(text, term) {
    var at = text.toLowerCase().indexOf(term);
    if (at < 0) return "";
    var s = Math.max(0, at - 50), raw = text.slice(s, at + term.length + 90), k = raw.toLowerCase().indexOf(term);
    return (s > 0 ? "…" : "") + e(raw.slice(0, k)) + "<mark>" + e(raw.slice(k, k + term.length)) + "</mark>" + e(raw.slice(k + term.length)) + "…";
  }
  function search() {
    var term = q.value.trim().toLowerCase(), l = L();
    hits = [];
    if (!term) {
      ["intro", "install", "first-bot", "conversations", "buttons", "database"].forEach(function (id) { hits.push({ href: "#" + id, g: l.groups[groupOf[id]], t: title(id), s: e(l.pages[id].desc), icon: "doc" }); });
    } else {
      order.forEach(function (id) {
        var p = l.pages[id], score = 0, t = p.title.toLowerCase();
        if (t.indexOf(term) === 0) score += 20; else if (t.indexOf(term) >= 0) score += 12;
        if (p.desc.toLowerCase().indexOf(term) >= 0) score += 5;
        if (p.text.toLowerCase().indexOf(term) >= 0) score += 2;
        if (score) hits.push({ score: score, href: "#" + id, g: l.groups[groupOf[id]], t: p.title, s: snippet(p.desc + " " + p.text, term) || e(p.desc), icon: "doc" });
        p.toc.forEach(function (h) {
          if (h[1].toLowerCase().indexOf(term) >= 0) hits.push({ score: 9, href: "#" + id + "/" + h[0], g: p.title, t: h[1], s: "", icon: "hash" });
        });
      });
      hits.sort(function (a, b) { return b.score - a.score; });
      hits = hits.slice(0, 12);
    }
    active = 0;
    results.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<a href="' + h.href + '" role="option" data-i="' + i + '" class="' + (i === 0 ? "on" : "") + '">' + ico(h.icon) + '<div class="r"><small>' + e(h.g) + "</small><b>" + e(h.t) + "</b>" + (h.s ? '<span class="s">' + h.s + "</span>" : "") + "</div></a>";
    }).join("") : '<div class="empty">' + e(U("no_results")) + "</div>";
  }
  function moveActive(d) {
    var links = $$("a", results);
    if (!links.length) return;
    active = (active + d + links.length) % links.length;
    links.forEach(function (a, i) { a.classList.toggle("on", i === active); });
    links[active].scrollIntoView({ block: "nearest" });
  }
  q.addEventListener("input", search);
  q.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); moveActive(1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); moveActive(-1); }
    else if (ev.key === "Enter") { var a = $$("a", results)[active]; if (a) { ev.preventDefault(); closeSearch(); location.hash = a.getAttribute("href"); } }
  });
  results.addEventListener("mousemove", function (ev) {
    var a = ev.target.closest("a[data-i]");
    if (a && +a.dataset.i !== active) { active = +a.dataset.i; $$("a", results).forEach(function (x, i) { x.classList.toggle("on", i === active); }); }
  });
  palette.addEventListener("click", function (ev) { if (ev.target === palette) closeSearch(); else if (ev.target.closest("a")) closeSearch(); });
  $("#search-btn").addEventListener("click", openSearch);
  document.addEventListener("keydown", function (ev) {
    var tag = ((document.activeElement || {}).tagName || "").toLowerCase();
    if ((ev.key === "k" || ev.key === "K") && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); palette.hidden ? openSearch() : closeSearch(); }
    else if (ev.key === "/" && palette.hidden && tag !== "input" && tag !== "textarea" && tag !== "select") { ev.preventDefault(); openSearch(); }
    else if (ev.key === "Escape") { if (!palette.hidden) closeSearch(); else closeNav(); }
  });

  // ---------- clicks
  function copyText(btn, text, target) {
    var done = function () {
      var label = btn.querySelector("[data-t]");
      btn.classList.add("done");
      if (label) label.textContent = U("copied");
      setTimeout(function () { btn.classList.remove("done"); if (label) label.textContent = U("copy"); }, 1400);
    };
    var fallback = function () { var r = document.createRange(); r.selectNodeContents(target); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t.closest) return;
    var c = t.closest("[data-copy], [data-copy-text]");
    if (c) {
      var text = c.getAttribute("data-copy-text"), target = c.parentElement;
      if (text === null) { target = c.closest("figure").querySelector("pre"); text = target.innerText.replace(/\n$/, ""); }
      copyText(c, text, target);
      return;
    }
    var it = t.closest("[data-itab]");
    if (it) {
      installTab = +it.getAttribute("data-itab");
      $$(".install").forEach(function (box) {
        $$("[data-itab]", box).forEach(function (b) { b.setAttribute("aria-selected", String(+b.getAttribute("data-itab") === installTab)); });
        $("[data-icmd]", box).textContent = INSTALL[installTab];
        $("[data-copy-text]", box).setAttribute("data-copy-text", INSTALL[installTab]);
      });
      return;
    }
    var ct = t.closest("[data-ctab]");
    if (ct) {
      var n = ct.getAttribute("data-ctab"), box2 = ct.closest(".code-tabs");
      $$("[data-ctab]", box2).forEach(function (b) { b.setAttribute("aria-selected", String(b === ct)); });
      $$("[data-cpane]", box2).forEach(function (p) { p.hidden = p.getAttribute("data-cpane") !== n; });
      return;
    }
    var rp = t.closest("[data-replay]");
    if (rp) { var ch = rp.closest("[data-chat]"); ch.classList.add("anim"); play(ch); return; }
    var an = t.closest("[data-anchor]");
    if (an) {
      ev.preventDefault();
      var id = parse().id + "/" + an.getAttribute("data-anchor");
      history.replaceState(null, "", "#" + id);
      scrollToId(an.getAttribute("data-anchor"), true);
      try { navigator.clipboard.writeText(location.href); } catch (err) {}
      return;
    }
    var a = t.closest("a[href^='#']");
    if (a && a.getAttribute("href") === location.hash) { ev.preventDefault(); route(); return; }
    if (a && a.getAttribute("href") === "#") { ev.preventDefault(); history.pushState(null, "", location.pathname + location.search); route(); return; }
    if (t.closest("#scrim")) closeNav();
  });
  $("#menu-btn").addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    this.setAttribute("aria-expanded", String(open));
  });
  $("#theme-btn").addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store("nb-theme", next);
  });
  $("#lang").addEventListener("change", function () { setLang(this.value); });
  window.addEventListener("hashchange", function () { route(); });
  window.addEventListener("popstate", function () { route(); });
  setLang(lang);
})();
</script>
