<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="nicebot — Telegram botlar uchun Python kutubxonasi. Hujjatlar: o'zbek, rus, ingliz tillarida.">
<title>nicebot hujjatlari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar · left contents rail · reading column (~70ch) · right "on this page" rail on wide screens.
   A calm, paper-like reading room: warm paper, ink type, one clay accent. */
:root {
  --paper: #f4efe6;
  --paper-2: #fbf8f2;
  --ink: #201d19;
  --ink-2: #5f584e;
  --rule: #e2d9c9;
  --clay: #b9552f;
  --clay-soft: #f0dccf;
  --code-bg: #ece5d8;
  --code-ink: #2b2620;
  --c-key: #9b3f1e;
  --c-str: #3f6b3a;
  --c-com: #8b8274;
  --c-num: #8a5a00;
  --c-fn: #2f5a7a;
  --c-attr: #7a4b8c;
  --shadow: 0 1px 0 rgba(32, 29, 25, 0.04), 0 8px 24px -16px rgba(32, 29, 25, 0.25);
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1916; --paper-2: #23201c; --ink: #ece6dc; --ink-2: #a89f92; --rule: #37312a;
    --clay: #e08a62; --clay-soft: #3a2a21; --code-bg: #15130f; --code-ink: #e6dfd3;
    --c-key: #f0a37f; --c-str: #a9cf8f; --c-com: #857c70; --c-num: #e7c07a; --c-fn: #8fbfe0; --c-attr: #d2a6e3;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1916; --paper-2: #23201c; --ink: #ece6dc; --ink-2: #a89f92; --rule: #37312a;
  --clay: #e08a62; --clay-soft: #3a2a21; --code-bg: #15130f; --code-ink: #e6dfd3;
  --c-key: #f0a37f; --c-str: #a9cf8f; --c-com: #857c70; --c-num: #e7c07a; --c-fn: #8fbfe0; --c-attr: #d2a6e3;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 24px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16.5px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--clay); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--clay-soft); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(8px); -webkit-backdrop-filter: saturate(1.2) blur(8px);
  border-bottom: 1px solid var(--rule);
}
.top-inner {
  height: var(--top-h); max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; margin-right: auto; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand b { font: 500 23px/1 var(--serif); letter-spacing: -0.01em; }
.brand .ver { font: 500 11px/1 var(--mono); color: var(--ink-2); border: 1px solid var(--rule); padding: 3px 6px; border-radius: 99px; }
.menu-btn, .icon-btn {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--paper-2); color: var(--ink); cursor: pointer;
}
.menu-btn { display: none; }
.langs, .icon-btn, .menu-btn { flex: none; }
.icon-btn svg, .menu-btn svg { width: 18px; height: 18px; }
.search { position: relative; width: min(320px, 34vw); }
.search input {
  width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper-2);
  color: var(--ink); font: 400 14.5px var(--sans); padding: 0 38px 0 36px;
}
.search input::placeholder { color: var(--ink-2); }
.search .glass { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--ink-2); pointer-events: none; }
.search kbd { position: absolute; right: 9px; top: 9px; font: 500 11px/18px var(--mono); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 5px; padding: 0 6px; }
.results {
  position: absolute; top: 46px; left: 0; right: 0; min-width: 300px; max-height: 70vh; overflow: auto;
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
}
.results a { display: block; padding: 9px 11px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.results a:hover, .results a.on { background: var(--clay-soft); }
.results b { display: block; font-weight: 600; font-size: 14.5px; }
.results span { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.45; }
.results mark { background: none; color: var(--clay); font-weight: 600; }
.results .empty { padding: 12px; color: var(--ink-2); font-size: 14px; }
.langs { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--paper-2); }
.langs button {
  border: 0; background: none; color: var(--ink-2); font: 600 12.5px/36px var(--sans); letter-spacing: 0.06em;
  padding: 0 11px; cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- shell ---------- */
.shell {
  max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr) 210px; gap: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell.is-home { grid-template-columns: 250px minmax(0, 1fr); }
.shell.is-home .toc { display: none; }
.side {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); overflow: auto; padding-block: 28px 40px;
  scrollbar-width: thin;
}
.side h4 { margin: 22px 0 6px; font: 600 11.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.side h4:first-child { margin-top: 0; }
.side a {
  display: block; padding: 5px 10px; margin-left: -10px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 15px;
}
.side a:hover { background: var(--paper-2); }
.side a[aria-current="page"] { background: var(--clay-soft); color: var(--clay); font-weight: 600; }
.toc { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start; padding-block: 34px; }
.toc h4 { margin: 0 0 10px; font: 600 11.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.toc a { display: block; padding: 4px 0 4px 12px; border-left: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; font-size: 13.5px; line-height: 1.4; }
.toc a:hover { color: var(--ink); border-left-color: var(--clay); }

main { min-width: 0; padding-block: 34px 80px; }
.doc { max-width: 70ch; }
.crumb { font: 600 11.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--clay); margin-bottom: 14px; }
.doc h1 { font: 500 clamp(34px, 4.6vw, 48px)/1.08 var(--serif); letter-spacing: -0.02em; margin: 0 0 22px; text-wrap: balance; }
.doc h2 { font: 500 29px/1.2 var(--serif); letter-spacing: -0.01em; margin: 46px 0 12px; text-wrap: balance; }
.doc h3 { font: 600 18px/1.3 var(--sans); margin: 30px 0 8px; }
.doc p, .doc li { color: var(--ink); }
.doc p { margin: 0 0 16px; }
.doc ul, .doc ol { padding-left: 22px; margin: 0 0 18px; }
.doc li { margin: 5px 0; }
.doc li::marker { color: var(--clay); }
.doc :not(pre) > code {
  font: 500 0.86em/1 var(--mono); font-variant-ligatures: none; background: var(--code-bg); color: var(--code-ink);
  padding: 0.16em 0.4em; border-radius: 5px; overflow-wrap: anywhere;
}
.doc strong { font-weight: 600; }
.note {
  margin: 22px 0; padding: 14px 18px; border-radius: 12px; background: var(--clay-soft);
  border: 1px solid color-mix(in srgb, var(--clay) 24%, transparent);
}
.note p { margin: 0; }
.table { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper-2); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 600 12px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); background: color-mix(in srgb, var(--rule) 30%, transparent); }
td:first-child { white-space: nowrap; }

/* ---------- code ---------- */
figure.code { margin: 18px 0 24px; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
figure.code figcaption { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px 7px 14px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.code-lang { font: 500 11.5px/1 var(--mono); color: var(--ink-2); letter-spacing: 0.04em; }
.copy {
  font: 600 12px/1 var(--sans); color: var(--ink-2); background: transparent; border: 1px solid transparent;
  border-radius: 7px; padding: 6px 9px; cursor: pointer;
}
.copy:hover { color: var(--ink); border-color: var(--rule); background: var(--paper-2); }
.copy.done { color: var(--clay); }
pre { font-variant-ligatures: none; margin: 0; padding: 16px 18px; overflow-x: auto; font: 400 13.6px/1.65 var(--mono); color: var(--code-ink); tab-size: 4; }
pre code { font: inherit; background: none; padding: 0; }
.hljs-keyword, .hljs-built_in.hljs-keyword, .hljs-selector-tag, .hljs-literal { color: var(--c-key); }
.hljs-string, .hljs-regexp, .hljs-template-string { color: var(--c-str); }
.hljs-comment, .hljs-quote { color: var(--c-com); font-style: italic; }
.hljs-number { color: var(--c-num); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: var(--c-fn); }
.hljs-built_in, .hljs-type { color: var(--c-fn); }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-params, .hljs-meta, .hljs-name, .hljs-tag, .hljs-symbol { color: var(--c-attr); }
.hljs-subst { color: var(--code-ink); }

/* ---------- pager ---------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 56px; max-width: 70ch; }
.pager a {
  display: block; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 12px; text-decoration: none; color: var(--ink); background: var(--paper-2);
}
.pager a { transition: border-color .15s, transform .15s; }
.pager a:hover { border-color: var(--clay); transform: translateY(-1px); }
.pager small { display: block; font: 600 11px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.pager span { font: 500 18px/1.25 var(--serif); }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- features page ---------- */
.fgroup h2 { display: flex; align-items: baseline; gap: 10px; }
.fcount { font: 500 13px/1 var(--mono); color: var(--ink-2); }
.flist { list-style: none; padding: 0; margin: 0 0 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.flist li { display: flex; gap: 14px; padding: 13px 0; border-top: 1px solid var(--rule); margin: 0; }
.flist code { font-size: 0.84em; }
.flist p { margin: 4px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }
.fnum { font: 500 13px/1.6 var(--mono); color: var(--clay); font-variant-numeric: tabular-nums; flex: none; width: 22px; }

/* ---------- home ---------- */
.home { max-width: 1000px; }
.hero { padding-block: 26px 10px; position: relative; isolation: isolate; }
.hero::before {
  content: ""; position: absolute; z-index: -1; top: -40px; left: 0; width: min(640px, 100%); height: 420px; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--clay) 16%, transparent), transparent);
}
.eyebrow { display: inline-flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.eyebrow span { font: 500 12px/1 var(--mono); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 99px; padding: 6px 10px; background: var(--paper-2); }
.hero h1 { font: 400 clamp(42px, 7vw, 76px)/1.02 var(--serif); letter-spacing: -0.03em; margin: 0 0 22px; text-wrap: balance; max-width: 14ch; }
.hero h1 em { font-style: italic; color: var(--clay); }
.hero .lead { font: 400 clamp(18px, 2vw, 21px)/1.55 var(--sans); color: var(--ink-2); max-width: 56ch; margin: 0 0 30px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { transition: background-color .15s, border-color .15s, color .15s, transform .15s; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 12px; font: 600 15.5px/1 var(--sans); text-decoration: none; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--clay); color: #fff; text-decoration: none; transform: translateY(-1px); }
.btn.ghost { color: var(--ink); border: 1px solid var(--rule); background: var(--paper-2); }
.btn.ghost:hover { border-color: var(--clay); text-decoration: none; }
.pip {
  display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 8px 0 16px; border-radius: 12px;
  background: var(--code-bg); font: 500 14.5px/1 var(--mono); color: var(--code-ink); border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent);
}
.pip .dollar { color: var(--clay); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 56px 0 8px; border-top: 1px solid var(--ink); }
.facts div { padding: 18px 18px 6px 0; }
.facts div + div { padding-left: 18px; border-left: 1px solid var(--rule); }
.facts b { display: block; font: 400 clamp(40px, 5vw, 56px)/1 var(--serif); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.facts span { display: block; margin-top: 8px; color: var(--ink-2); font-size: 14.5px; }
.home h2 { font: 500 clamp(28px, 3.4vw, 36px)/1.15 var(--serif); letter-spacing: -0.015em; margin: 64px 0 10px; text-wrap: balance; }
.home .sub { color: var(--ink-2); margin: 0 0 22px; max-width: 60ch; }
.compare { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.compare figure.code { margin: 0; }
.compare .aio pre { max-height: 420px; font-size: 12.5px; opacity: 0.82; }
.compare .aio figure.code { position: relative; }
.compare .aio figure.code::after { content: ""; position: absolute; inset: auto 0 0; height: 90px; pointer-events: none; background: linear-gradient(transparent, var(--code-bg)); }
.compare .nb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--clay) 10%, transparent), var(--shadow); }
.compare .nb { border-color: color-mix(in srgb, var(--clay) 45%, transparent); }
.ratio { margin-top: 14px; font-size: 14.5px; color: var(--ink-2); }
.ratio b { color: var(--clay); font-weight: 600; }
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; }
.groups a { transition: border-color .15s; display: block; padding: 16px 0; border-top: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.groups a:hover { border-top-color: var(--clay); }
.groups a:hover strong { color: var(--clay); }
.groups strong { display: flex; justify-content: space-between; font: 500 20px/1.2 var(--serif); }
.groups strong small { font: 500 13px/1.6 var(--mono); color: var(--ink-2); }
.groups p { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
footer { border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 13.5px; }
footer div { max-width: 1400px; margin: 0 auto; padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: space-between; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) { .shell { grid-template-columns: 230px minmax(0, 1fr); gap: 40px; } .toc { display: none; } }
@media (max-width: 860px) {
  .menu-btn { display: inline-grid; }
  .shell, .shell.is-home { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side {
    position: fixed; z-index: 25; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: min(300px, 86vw); height: auto;
    background: var(--paper); border-right: 1px solid var(--rule); padding: 22px 18px 40px max(18px, env(safe-area-inset-left, 0px));
    transform: translateX(-102%); transition: transform 0.22s ease; box-shadow: var(--shadow);
  }
  body.nav-open .side { transform: none; }
  .search { width: auto; flex: 1; min-width: 0; }
  .search kbd { display: none; }
  .brand { margin-right: 0; }
  .brand .ver { display: none; }
  .compare { grid-template-columns: minmax(0, 1fr); }
  .groups { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .flist { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .brand b { display: none; }
  .icon-btn[aria-label="GitHub"] { display: none; }
  .langs button { padding: 0 8px; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .facts div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); }
  .groups { grid-template-columns: minmax(0, 1fr); }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  td:first-child { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <a class="brand" href="#" data-nav aria-label="nicebot">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6.5h20a3.5 3.5 0 0 1 3.5 3.5v10a3.5 3.5 0 0 1-3.5 3.5H14l-6.5 5v-5H6A3.5 3.5 0 0 1 2.5 20V10A3.5 3.5 0 0 1 6 6.5z" fill="var(--clay)"/><path d="M10.5 19v-7.2M10.5 14c.8-1.6 2-2.4 3.6-2.4 2.1 0 3.1 1.3 3.1 3.6V19" fill="none" stroke="var(--paper)" stroke-width="2.1" stroke-linecap="round"/><circle cx="22.2" cy="17.6" r="1.6" fill="var(--paper)"/></svg>
      <b>nicebot</b><span class="ver">0.1 · API 10.3</span>
    </a>
    <div class="search">
      <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search">
      <kbd>/</kbd>
      <div class="results" id="results" hidden></div>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="uz">UZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button>

<script>
window.NB_DATA = {"nav": [["start", ["intro", "install", "first-bot", "concepts"]], ["basics", ["handlers", "ctx", "formatting"]], ["ui", ["buttons", "keyboards", "conversations", "validators", "state", "menus"]], ["data", ["database", "users", "i18n"]], ["business", ["admin", "broadcast", "payments", "groups"]], ["advanced", ["middleware", "miniapp", "scheduler", "deploy", "testing"]], ["reference", ["features", "api"]]], "langs": {"uz": {"ui": {"search": "Qidirish…", "on_this_page": "Shu sahifada", "copy": "Nusxa", "copied": "Olindi", "prev": "Oldingi", "next": "Keyingi", "menu": "Bo'limlar", "no_results": "Hech narsa topilmadi", "theme": "Mavzu", "edit_hint": "Bot API", "tagline": "Telegram botlar uchun Python kutubxonasi"}, "groups": {"start": "Boshlash", "basics": "Asoslar", "ui": "Tugmalar va suhbat", "data": "Ma'lumotlar", "business": "Biznes vositalari", "advanced": "Ilg'or", "reference": "Ma'lumotnoma"}, "pages": {"intro": {"title": "Kirish", "html": "<p>nicebot — Telegram bot yozishni iloji boricha sodda qiladigan Python kutubxonasi. Bitta import, bitta obyekt va oddiy funksiyalar. Baza, tugmalar, suhbatlar, tarjimalar, statistika va admin panel ichida tayyor turadi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><p>Bu to'liq ishlaydigan bot. Unda <code>Dispatcher<\/code>, <code>Router<\/code> yoki holatlar klassi yo'q. Foydalanuvchi esa avtomatik bazaga saqlanadi.<\/p><h2 id=\"nega-nicebot\">Nega nicebot?<\/h2><p>Oddiy ro'yxatdan o'tish botini ikki usulda solishtiramiz. Avval aiogram:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import asyncio\nfrom aiogram import Bot, Dispatcher, F, Router\nfrom aiogram.filters import Command, CommandStart\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.fsm.state import State, StatesGroup\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import Message\n\nrouter = Router()\n\nclass Reg(StatesGroup):\n    name = State()\n    age = State()\n\n@router.message(CommandStart())\nasync def start(message: Message, state: FSMContext):\n    await state.set_state(Reg.name)\n    await message.answer(\"Ismingiz?\")\n\n@router.message(Reg.name)\nasync def got_name(message: Message, state: FSMContext):\n    await state.update_data(name=message.text)\n    await state.set_state(Reg.age)\n    await message.answer(\"Yoshingiz?\")\n\n@router.message(Reg.age)\nasync def got_age(message: Message, state: FSMContext):\n    if not message.text.isdigit():\n        await message.answer(\"Butun son kiriting.\")\n        return\n    data = await state.get_data()\n    await state.clear()\n    await message.answer(f\"{data['name']}, {message.text} yosh\")\n\nasync def main():\n    bot = Bot(\"TOKEN\")\n    dp = Dispatcher(storage=MemoryStorage())\n    dp.include_router(router)\n    await dp.start_polling(bot)\n\nasyncio.run(main())<\/code><\/pre><\/figure><p>Endi xuddi shu bot nicebot'da:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"TOKEN\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    name = await ctx.ask(\"Ismingiz?\")\n    age = await ctx.ask(\"Yoshingiz?\", int)\n    await ctx.reply(f\"{name}, {age} yosh\")\n\nbot.start()<\/code><\/pre><\/figure><p><code>ctx.ask()<\/code> savol beradi va javobni kutadi. <code>int<\/code> bersangiz, son kiritilmaguncha muloyim qayta so'raydi. <code>StatesGroup<\/code> yozish, holatni saqlash va tozalash kerak emas.<\/p><h2 id=\"ichida-nimalar-bor\">Ichida nimalar bor<\/h2><ul><li><strong>Bot API 10.3 to'liq:<\/strong> 403 ta tur va 185 ta metod rasmiy spetsifikatsiyadan generatsiya qilingan<\/li><li><strong>Ichki ORM:<\/strong> SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan<\/li><li><strong>Suhbatlar:<\/strong> <code>ask<\/code>, <code>confirm<\/code>, <code>choose<\/code>, <code>form<\/code> va tayyor validatorlar<\/li><li><strong>Tugmalar:<\/strong> <code>on_click<\/code>, shablonlar, toggle, muddatli va bir martalik tugmalar, avto-joylashuv<\/li><li><strong>Biznes:<\/strong> referal, broadcast, statistika, admin panel, majburiy obuna, support, Telegram Stars<\/li><li><strong>Ishonchlilik:<\/strong> flood-wait'ni o'zi kutadi, tarmoq xatosida qayta uradi, restartda update yo'qolmaydi<\/li><li><strong>Tezlik:<\/strong> msgspec turlari va bitta ulanish pooli<\/li><\/ul><p>To'liq ro'yxat <a href=\"#features\" data-nav>50 ta imkoniyat<\/a> sahifasida.<\/p><aside class=\"note\"><p>nicebot <code>async<\/code> asosida ishlaydi. Har bir handler <code>async def<\/code> bo'ladi, Telegram'ga har bir murojaat esa <code>await<\/code> bilan yoziladi.<\/p><\/aside>", "toc": [["nega-nicebot", "Nega nicebot?"], ["ichida-nimalar-bor", "Ichida nimalar bor"]], "text": "nicebot — Telegram bot yozishni iloji boricha sodda qiladigan Python kutubxonasi. Bitta import, bitta obyekt va oddiy funksiyalar. Baza, tugmalar, suhbatlar, tarjimalar, statistika va admin panel ichida tayyor turadi. python Bu to'liq ishlaydigan bot. Unda Dispatcher , Router yoki holatlar klassi yo'q. Foydalanuvchi esa avtomatik bazaga saqlanadi. Nega nicebot? Oddiy ro'yxatdan o'tish botini ikki usulda solishtiramiz. Avval aiogram: python Endi xuddi shu bot nicebot'da: python ctx.ask() savol beradi va javobni kutadi. int bersangiz, son kiritilmaguncha muloyim qayta so'raydi. StatesGroup yozish, holatni saqlash va tozalash kerak emas. Ichida nimalar bor Bot API 10.3 to'liq: 403 ta tur va 185 ta metod rasmiy spetsifikatsiyadan generatsiya qilingan Ichki ORM: SQLite, PostgreSQL, MySQL va MongoDB uchun bitta API, avto-migratsiya bilan Suhbatlar: ask , confirm , choose , form va tayyor validatorlar Tugmalar: on_click , shablonlar, toggle, muddatli va bir martalik tugmalar, avto-joylashuv Biznes: referal, broadcast, statistika, admin panel, majburiy obuna, support, Telegram Stars Ishonchlilik: flood-wait'ni o'zi kutadi, tarmoq xatosida qayta uradi, restartda update yo'qolmaydi Tezlik: msgspec turlari va bitta ulanish pooli To'liq ro'yxat 50 ta imkoniyat sahifasida. nicebot async asosida ishlaydi. Har bir handler async def bo'ladi, Telegram'ga har bir murojaat esa await bilan yoziladi."}, "install": {"title": "O'rnatish", "html": "<p>Python 3.10 yoki undan yangi versiya kerak.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">pip install nicebot                 # SQLite bilan\npip install \"nicebot[postgres]\"     # + PostgreSQL\npip install \"nicebot[mysql]\"        # + MySQL / MariaDB\npip install \"nicebot[mongo]\"        # + MongoDB\npip install \"nicebot[redis]\"        # + Redis\npip install \"nicebot[all]\"          # hammasi<\/code><\/pre><\/figure><p>Kvadrat qavs ichidagi qism kerakli baza drayverini qo'shib o'rnatadi. SQLite qo'shimchasiz ishlaydi.<\/p><h2 id=\"tayyor-loyiha-yaratish\">Tayyor loyiha yaratish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">nicebot new mybot\ncd mybot\npython bot.py<\/code><\/pre><\/figure><p>Buyruq quyidagi tuzilmani yaratadi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">text<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-plaintext\">mybot/\n├── bot.py            # asosiy fayl\n├── .env              # BOT_TOKEN, DATABASE_URL, ADMINS\n├── handlers/\n│   └── basic.py      # Router bilan handlerlar\n└── locales/\n    ├── uz.json\n    ├── ru.json\n    └── en.json<\/code><\/pre><\/figure><p><code>.env<\/code> faylini ochib, <code>BOT_TOKEN<\/code> o'rniga @BotFather bergan tokenni yozing.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">BOT_TOKEN=123456:ABC-your-token\nDATABASE_URL=sqlite:///bot.db\nADMINS=123456789,987654321\nTZ=Asia/Tashkent<\/code><\/pre><\/figure><h2 id=\"versiyani-tekshirish\">Versiyani tekshirish<\/h2><p><code>nicebot version<\/code> buyrug'i kutubxona, Bot API va Python versiyalarini ko'rsatadi.<\/p>", "toc": [["tayyor-loyiha-yaratish", "Tayyor loyiha yaratish"], ["versiyani-tekshirish", "Versiyani tekshirish"]], "text": "Python 3.10 yoki undan yangi versiya kerak. bash Kvadrat qavs ichidagi qism kerakli baza drayverini qo'shib o'rnatadi. SQLite qo'shimchasiz ishlaydi. Tayyor loyiha yaratish bash Buyruq quyidagi tuzilmani yaratadi: text .env faylini ochib, BOT_TOKEN o'rniga @BotFather bergan tokenni yozing. bash Versiyani tekshirish nicebot version buyrug'i kutubxona, Bot API va Python versiyalarini ko'rsatadi."}, "first-bot": {"title": "Birinchi bot", "html": "<h2 id=\"1-token-oling\">1. Token oling<\/h2><p>Telegram'da @BotFather'ni oching, <code>/newbot<\/code> yozing, botga nom va username bering. U <code>123456:ABC-DEF...<\/code> ko'rinishidagi token beradi. Tokenni hech kimga ko'rsatmang.<\/p><h2 id=\"2-kod-yozing\">2. Kod yozing<\/h2><p><code>bot.py<\/code> faylini yarating:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><h2 id=\"3-ishga-tushiring\">3. Ishga tushiring<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">python bot.py<\/code><\/pre><\/figure><p>Terminalda <code>✅ @sizning_bot ishga tushdi<\/code> yozuvi chiqadi. Telegram'da botingizga <code>/start<\/code> yozing, u ismingiz bilan salomlashadi.<\/p><h2 id=\"nima-boldi\">Nima bo'ldi?<\/h2><div class=\"table\"><table><thead><tr><th>Qator<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>Nicebot(token=...)<\/code><\/td><td>Botni yaratadi. Baza berilmasa, xotiradagi SQLite ishlatiladi<\/td><\/tr><tr><td><code>@bot.command(\"start\")<\/code><\/td><td><code>/start<\/code> buyrug'i kelganda pastdagi funksiyani chaqiradi<\/td><\/tr><tr><td><code>async def start(ctx)<\/code><\/td><td><code>ctx<\/code> joriy xabar haqidagi hamma narsani biladi<\/td><\/tr><tr><td><code>await ctx.reply(...)<\/code><\/td><td>Shu chatga javob yuboradi<\/td><\/tr><tr><td><code>bot.start()<\/code><\/td><td>Telegram'dan xabarlarni olishni boshlaydi. To'xtatish uchun Ctrl+C<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><p>Ma'lumotlar restartdan keyin ham saqlansin desangiz, <code>Nicebot(token=..., db=\"sqlite:///bot.db\")<\/code> deb yozing.<\/p><\/aside><h2 id=\"kod-ozgarganda-avtomatik-qayta-yuklash\">Kod o'zgarganda avtomatik qayta yuklash<\/h2><p><code>bot.start(reload=True)<\/code> bilan har safar faylni saqlaganingizda bot o'zi qayta ishga tushadi. Ishlab chiqish paytida bu juda qulay.<\/p>", "toc": [["1-token-oling", "1. Token oling"], ["2-kod-yozing", "2. Kod yozing"], ["3-ishga-tushiring", "3. Ishga tushiring"], ["nima-boldi", "Nima bo'ldi?"], ["kod-ozgarganda-avtomatik-qayta-yuklash", "Kod o'zgarganda avtomatik qayta yuklash"]], "text": "1. Token oling Telegram'da @BotFather'ni oching, /newbot yozing, botga nom va username bering. U 123456:ABC-DEF... ko'rinishidagi token beradi. Tokenni hech kimga ko'rsatmang. 2. Kod yozing bot.py faylini yarating: python 3. Ishga tushiring bash Terminalda ✅ @sizning_bot ishga tushdi yozuvi chiqadi. Telegram'da botingizga /start yozing, u ismingiz bilan salomlashadi. Nima bo'ldi? Qator Ma'nosi Nicebot(token=...) Botni yaratadi. Baza berilmasa, xotiradagi SQLite ishlatiladi @bot.command(\"start\") /start buyrug'i kelganda pastdagi funksiyani chaqiradi async def start(ctx) ctx joriy xabar haqidagi hamma narsani biladi await ctx.reply(...) Shu chatga javob yuboradi bot.start() Telegram'dan xabarlarni olishni boshlaydi. To'xtatish uchun Ctrl+C Ma'lumotlar restartdan keyin ham saqlansin desangiz, Nicebot(token=..., db=\"sqlite:///bot.db\") deb yozing. Kod o'zgarganda avtomatik qayta yuklash bot.start(reload=True) bilan har safar faylni saqlaganingizda bot o'zi qayta ishga tushadi. Ishlab chiqish paytida bu juda qulay."}, "concepts": {"title": "Asosiy tushunchalar", "html": "<p>nicebot'da faqat uchta tushuncha bor.<\/p><h2 id=\"bot\">Bot<\/h2><p><code>Nicebot<\/code> — butun ilovangiz. Token, baza, adminlar va til kabi sozlamalar shu yerda beriladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(\n    token=\"...\",\n    db=\"postgres://user:pass@localhost/mybot\",\n    admins=[123456789],\n    lang=\"uz\",                       # standart til\n    required_channels=[\"@mykanal\"],  # majburiy obuna\n    support_chat=-1001234567890,     # yordam guruhi\n    captcha=\"2m\",                    # guruhga yangi kirganlarga\n    tz=\"Asia/Tashkent\",\n)<\/code><\/pre><\/figure><h2 id=\"handler\">Handler<\/h2><p>Handler — biror hodisa bo'lganda chaqiriladigan <code>async<\/code> funksiya. Dekorator qachon chaqirilishini aytadi: <code>@bot.command(\"start\")<\/code>, <code>@bot.text(\"salom\")<\/code>, <code>@bot.callback(\"buy:{id:int}\")<\/code> va hokazo. Handlerlar yozilgan tartibda tekshiriladi va birinchi mos kelgani ishlaydi.<\/p><h2 id=\"ctx-kontekst\">ctx (kontekst)<\/h2><p>Har bir xabar uchun yangi <code>ctx<\/code> yaratiladi va handlerga birinchi argument bo'lib keladi. U ikki xil ish qiladi:<\/p><ul><li><strong>ma'lumot beradi:<\/strong> <code>ctx.text<\/code>, <code>ctx.user<\/code>, <code>ctx.chat_id<\/code>, <code>ctx.args<\/code>…<\/li><li><strong>amal bajaradi:<\/strong> <code>ctx.reply()<\/code>, <code>ctx.edit()<\/code>, <code>ctx.ask()<\/code>, <code>ctx.photo()<\/code>…<\/li><\/ul><h2 id=\"hayot-sikli\">Hayot sikli<\/h2><p>Xabar kelgach quyidagilar sodir bo'ladi:<\/p><ol><li>Agar foydalanuvchi <code>ctx.ask()<\/code> javobini kutayotgan bo'lsa, xabar o'sha yerga uzatiladi<\/li><li>Ichki middleware'lar ishlaydi: foydalanuvchi bazaga saqlanadi, texnik ishlar rejimi va majburiy obuna tekshiriladi<\/li><li>Sizning middleware'laringiz ishlaydi<\/li><li>Birinchi mos handler chaqiriladi<\/li><li>Hech biri mos kelmasa, <code>@bot.fallback()<\/code> yoki support rejimi ishlaydi<\/li><li>Tugma bosilgan bo'lsa va siz javob bermagan bo'lsangiz, <code>answerCallbackQuery<\/code> avtomatik yuboriladi<\/li><\/ol>", "toc": [["bot", "Bot"], ["handler", "Handler"], ["ctx-kontekst", "ctx (kontekst)"], ["hayot-sikli", "Hayot sikli"]], "text": "nicebot'da faqat uchta tushuncha bor. Bot Nicebot — butun ilovangiz. Token, baza, adminlar va til kabi sozlamalar shu yerda beriladi. python Handler Handler — biror hodisa bo'lganda chaqiriladigan async funksiya. Dekorator qachon chaqirilishini aytadi: @bot.command(\"start\") , @bot.text(\"salom\") , @bot.callback(\"buy:{id:int}\") va hokazo. Handlerlar yozilgan tartibda tekshiriladi va birinchi mos kelgani ishlaydi. ctx (kontekst) Har bir xabar uchun yangi ctx yaratiladi va handlerga birinchi argument bo'lib keladi. U ikki xil ish qiladi: ma'lumot beradi: ctx.text , ctx.user , ctx.chat_id , ctx.args … amal bajaradi: ctx.reply() , ctx.edit() , ctx.ask() , ctx.photo() … Hayot sikli Xabar kelgach quyidagilar sodir bo'ladi: Agar foydalanuvchi ctx.ask() javobini kutayotgan bo'lsa, xabar o'sha yerga uzatiladi Ichki middleware'lar ishlaydi: foydalanuvchi bazaga saqlanadi, texnik ishlar rejimi va majburiy obuna tekshiriladi Sizning middleware'laringiz ishlaydi Birinchi mos handler chaqiriladi Hech biri mos kelmasa, @bot.fallback() yoki support rejimi ishlaydi Tugma bosilgan bo'lsa va siz javob bermagan bo'lsangiz, answerCallbackQuery avtomatik yuboriladi"}, "handlers": {"title": "Handlerlar", "html": "<h2 id=\"turlari\">Turlari<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"help\", description=\"Yordam\")\nasync def help_(ctx):\n    await ctx.reply(\"Men nima qila olaman...\")\n\n@bot.text(\"salom\")                       # aniq matn (katta-kichik harf farqsiz)\nasync def salom(ctx):\n    await ctx.reply(\"Va alaykum assalom!\")\n\n@bot.text(contains=\"narx\")               # ichida \"narx\" bo'lsa\nasync def narx(ctx):\n    await ctx.reply(\"Narxlar: ...\")\n\n@bot.text(regex=r\"^buy (?P&lt;qty&gt;\\d+)$\")  # regex guruhlari parametr bo'ladi\nasync def buy(ctx, qty: int):\n    await ctx.reply(f\"{qty} dona\")\n\n@bot.on(\"photo\")                          # rasm kelsa\nasync def photo(ctx):\n    await ctx.reply(\"Chiroyli rasm!\")\n\n@bot.text()                               # istalgan oddiy matn\nasync def echo(ctx):\n    await ctx.reply(ctx.text)\n\n@bot.fallback()                           # hech narsa mos kelmasa\nasync def unknown(ctx):\n    await ctx.reply(\"Tushunmadim 🤔\")<\/code><\/pre><\/figure><h2 id=\"handler-parametrlari\">Handler parametrlari<\/h2><p>Har qanday dekoratorga quyidagi parametrlarni qo'shish mumkin:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"admin\", admin=True)              # faqat adminlar\n@bot.command(\"bonus\", throttle=\"1d\")           # kuniga 1 marta\n@bot.command(\"report\", typing=True)            # \"yozmoqda...\" ko'rsatadi\n@bot.text(\"salom\", chat=\"private\")             # faqat shaxsiy chatda\n@bot.text(state=\"waiting_phone\")               # faqat shu holatda\n@bot.command(\"vip\", users=[111, 222])          # faqat shu odamlar\n@bot.message(F.photo &amp; F.private)              # filtrlar\n@bot.deep_link(r\"promo_(?P&lt;code&gt;\\w+)\")         # t.me/bot?start=promo_X\nasync def handler(ctx): ...<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Parametr<\/th><th>Nima qiladi<\/th><\/tr><\/thead><tbody><tr><td><code>admin=True<\/code><\/td><td>Faqat <code>Nicebot(admins=[...])<\/code> dagilar uchun<\/td><\/tr><tr><td><code>chat=\"private\"<\/code><\/td><td><code>private<\/code>, <code>group<\/code>, <code>supergroup<\/code>, <code>channel<\/code><\/td><\/tr><tr><td><code>throttle=\"3s\"<\/code><\/td><td>Bir foydalanuvchi uchun tezlik chegarasi. Oshib ketsa, \"⏳ Biroz kuting\" chiqadi<\/td><\/tr><tr><td><code>typing=True<\/code><\/td><td>Handler ishlayotgan paytda \"yozmoqda…\" ko'rinadi. <code>\"upload_photo\"<\/code> ham bo'ladi<\/td><\/tr><tr><td><code>state=\"x\"<\/code><\/td><td>Faqat foydalanuvchi shu holatda bo'lsa ishlaydi<\/td><\/tr><tr><td><code>users=[...]<\/code><\/td><td>Faqat shu id'lar uchun<\/td><\/tr><tr><td><code>description=\"...\"<\/code><\/td><td>Buyruq Telegram menyusida paydo bo'ladi. <code>{\"uz\": ..., \"ru\": ...}<\/code> ham bo'ladi<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"filtrlar\">Filtrlar<\/h2><p><code>F<\/code> tayyor filtrlarni beradi. Ularni <code>&amp;<\/code> (va), <code>|<\/code> (yoki) va <code>~<\/code> (emas) bilan birlashtirish mumkin.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import F\n\n@bot.message(F.photo | F.document)\n@bot.message(F.text &amp; ~F.command)\n@bot.message(F.regex(r\"\\d{4}\"))\n@bot.message(F.contains(\"chegirma\", \"aksiya\"))\n@bot.message(F.user(123, 456))\n@bot.message(lambda ctx: len(ctx.text or \"\") &gt; 100)   # o'z filtringiz\nasync def h(ctx): ...<\/code><\/pre><\/figure><h2 id=\"router-kodni-fayllarga-bolish\">Router: kodni fayllarga bo'lish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># handlers/shop.py\nfrom nicebot import Router\n\nrouter = Router(chat=\"private\")   # barcha handlerlarga qo'llanadi\n\n@router.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Do'kon\")\n\n# bot.py\nbot.include(\"handlers\")           # papkadagi barcha Router'lar\n# yoki: from handlers.shop import router; bot.include(router)<\/code><\/pre><\/figure><h2 id=\"barcha-hodisa-turlari\">Barcha hodisa turlari<\/h2><p><code>@bot.callback<\/code>, <code>@bot.inline<\/code>, <code>@bot.chosen_inline<\/code>, <code>@bot.edited<\/code>, <code>@bot.channel<\/code>, <code>@bot.join<\/code>, <code>@bot.leave<\/code>, <code>@bot.album<\/code>, <code>@bot.paid<\/code>, <code>@bot.pre_checkout<\/code>, <code>@bot.webapp_data<\/code>, <code>@bot.my_chat_member<\/code>, <code>@bot.chat_member<\/code>, <code>@bot.join_request<\/code>, <code>@bot.reaction<\/code>, <code>@bot.poll_answer<\/code>. Qolgan har qanday update uchun: <code>@bot.event(\"chat_boost\")<\/code>.<\/p><aside class=\"note\"><p>Handlerda <code>raise SkipHandler<\/code> desangiz, keyingi mos handler ishlaydi.<\/p><\/aside>", "toc": [["turlari", "Turlari"], ["handler-parametrlari", "Handler parametrlari"], ["filtrlar", "Filtrlar"], ["router-kodni-fayllarga-bolish", "Router: kodni fayllarga bo'lish"], ["barcha-hodisa-turlari", "Barcha hodisa turlari"]], "text": "Turlari python Handler parametrlari Har qanday dekoratorga quyidagi parametrlarni qo'shish mumkin: python Parametr Nima qiladi admin=True Faqat Nicebot(admins=[...]) dagilar uchun chat=\"private\" private , group , supergroup , channel throttle=\"3s\" Bir foydalanuvchi uchun tezlik chegarasi. Oshib ketsa, \"⏳ Biroz kuting\" chiqadi typing=True Handler ishlayotgan paytda \"yozmoqda…\" ko'rinadi. \"upload_photo\" ham bo'ladi state=\"x\" Faqat foydalanuvchi shu holatda bo'lsa ishlaydi users=[...] Faqat shu id'lar uchun description=\"...\" Buyruq Telegram menyusida paydo bo'ladi. {\"uz\": ..., \"ru\": ...} ham bo'ladi Filtrlar F tayyor filtrlarni beradi. Ularni & (va), | (yoki) va ~ (emas) bilan birlashtirish mumkin. python Router: kodni fayllarga bo'lish python Barcha hodisa turlari @bot.callback , @bot.inline , @bot.chosen_inline , @bot.edited , @bot.channel , @bot.join , @bot.leave , @bot.album , @bot.paid , @bot.pre_checkout , @bot.webapp_data , @bot.my_chat_member , @bot.chat_member , @bot.join_request , @bot.reaction , @bot.poll_answer . Qolgan har qanday update uchun: @bot.event(\"chat_boost\") . Handlerda raise SkipHandler desangiz, keyingi mos handler ishlaydi."}, "ctx": {"title": "ctx — kontekst", "html": "<h2 id=\"malumotlar\">Ma'lumotlar<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.message()\nasync def info(ctx):\n    ctx.text        # xabar matni (yoki rasm izohi)\n    ctx.name        # foydalanuvchi ismi\n    ctx.user        # bazadagi foydalanuvchi (avtomatik saqlanadi)\n    ctx.user_id     # Telegram id\n    ctx.chat_id     # chat id\n    ctx.command     # \"/start ref_5\" -&gt; \"start\"\n    ctx.args        # \"/give 10 ali\" -&gt; [\"10\", \"ali\"]\n    ctx.payload     # deep link: \"ref_5\"\n    ctx.lang        # \"uz\", \"ru\", \"en\"\n    ctx.is_private  # shaxsiy chatmi\n    ctx.is_admin    # bot adminimi\n    ctx.message     # to'liq Message obyekti\n    ctx.mention     # bosiladigan ism (HTML)<\/code><\/pre><\/figure><h2 id=\"yuborish\">Yuborish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Salom!\")                          # matn\nawait ctx.reply(\"Tanlang\", buttons=[\"A\", \"B\"])    # inline tugmalar bilan\nawait ctx.reply(\"Yozing\", keyboard=[\"Menyu\"])     # pastki klaviatura\nawait ctx.reply(\"30 soniyada o'chadi\", delete_after=\"30s\")\nawait ctx.reply(\"Ovozsiz\", silent=True, protect=True)\n\nawait ctx.photo(\"rasm.jpg\", caption=\"Mana\")       # fayl, URL yoki file_id\nawait ctx.video(\"https://site.uz/v.mp4\")\nawait ctx.document(\"hisobot.pdf\")\nawait ctx.media_group([\"1.jpg\", \"2.jpg\", \"3.jpg\"], caption=\"Albom\")\nawait ctx.location(40.10, 65.37)\nawait ctx.poll(\"Qaysi biri?\", [\"Python\", \"Go\"])\nawait ctx.dice(\"🎯\")<\/code><\/pre><\/figure><p>Yuborish metodlarining hammasi bir xil qo'shimcha parametrlarni qabul qiladi:<\/p><div class=\"table\"><table><thead><tr><th>Parametr<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>buttons=<\/code><\/td><td>Inline tugmalar (<a href=\"#buttons\" data-nav>Tugmalar<\/a>)<\/td><\/tr><tr><td><code>keyboard=<\/code><\/td><td>Pastki klaviatura. <code>False<\/code> bo'lsa yopadi<\/td><\/tr><tr><td><code>columns=<\/code><\/td><td>Tugmalar ustunlari soni<\/td><\/tr><tr><td><code>delete_after=\"1m\"<\/code><\/td><td>Xabarni avtomatik o'chirish<\/td><\/tr><tr><td><code>silent=True<\/code><\/td><td>Ovozsiz bildirishnoma<\/td><\/tr><tr><td><code>protect=True<\/code><\/td><td>Forward va saqlashni taqiqlash<\/td><\/tr><tr><td><code>quote=True<\/code><\/td><td>Kelgan xabarga reply qilib yuborish<\/td><\/tr><tr><td><code>preview=False<\/code><\/td><td>Havola preview'sini o'chirish<\/td><\/tr><tr><td><code>chat_id=<\/code><\/td><td>Boshqa chatga yuborish<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"tahrirlash-va-javob\">Tahrirlash va javob<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.edit(\"Yangi matn\")               # tugma bosilgan xabarni tahrirlash\nawait ctx.edit_buttons([Button(\"OK\", data=\"ok\")])\nawait ctx.respond(\"Javob\")                 # tugmadan bo'lsa tahrirlaydi, aks holda yuboradi\nawait ctx.answer(\"Saqlandi ✅\")             # tugma ustida kichik xabar\nawait ctx.answer(\"Diqqat!\", alert=True)    # oyna ko'rinishida\nawait ctx.delete()                          # xabarni o'chirish\nawait ctx.react(\"🔥\")                       # reaksiya\nawait ctx.pin()<\/code><\/pre><\/figure><p><code>ctx.edit()<\/code> xabarda rasm bo'lsa izohni, bo'lmasa matnni o'zi tanlab tahrirlaydi. \"message is not modified\" xatosini esa jimgina o'tkazib yuboradi.<\/p><h2 id=\"yana-foydali-metodlar\">Yana foydali metodlar<\/h2><div class=\"table\"><table><thead><tr><th>Metod<\/th><th>Nima qiladi<\/th><\/tr><\/thead><tbody><tr><td><code>ctx.forward(chat)<\/code> / <code>ctx.copy(chat)<\/code><\/td><td>Xabarni boshqa chatga yuborish<\/td><\/tr><tr><td><code>ctx.download()<\/code> / <code>ctx.save(path)<\/code><\/td><td>Faylni yuklab olish<\/td><\/tr><tr><td><code>ctx.action(\"upload_photo\")<\/code><\/td><td>Status ko'rsatish<\/td><\/tr><tr><td><code>ctx.is_member(\"@kanal\")<\/code><\/td><td>Obunani tekshirish<\/td><\/tr><tr><td><code>ctx.notify_admins(text)<\/code><\/td><td>Adminlarga xabar<\/td><\/tr><tr><td><code>ctx.background(func)<\/code><\/td><td>Fon vazifasi<\/td><\/tr><tr><td><code>ctx.t(\"key\")<\/code><\/td><td>Tarjima<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["malumotlar", "Ma'lumotlar"], ["yuborish", "Yuborish"], ["tahrirlash-va-javob", "Tahrirlash va javob"], ["yana-foydali-metodlar", "Yana foydali metodlar"]], "text": "Ma'lumotlar python Yuborish python Yuborish metodlarining hammasi bir xil qo'shimcha parametrlarni qabul qiladi: Parametr Ma'nosi buttons= Inline tugmalar ( Tugmalar ) keyboard= Pastki klaviatura. False bo'lsa yopadi columns= Tugmalar ustunlari soni delete_after=\"1m\" Xabarni avtomatik o'chirish silent=True Ovozsiz bildirishnoma protect=True Forward va saqlashni taqiqlash quote=True Kelgan xabarga reply qilib yuborish preview=False Havola preview'sini o'chirish chat_id= Boshqa chatga yuborish Tahrirlash va javob python ctx.edit() xabarda rasm bo'lsa izohni, bo'lmasa matnni o'zi tanlab tahrirlaydi. \"message is not modified\" xatosini esa jimgina o'tkazib yuboradi. Yana foydali metodlar Metod Nima qiladi ctx.forward(chat) / ctx.copy(chat) Xabarni boshqa chatga yuborish ctx.download() / ctx.save(path) Faylni yuklab olish ctx.action(\"upload_photo\") Status ko'rsatish ctx.is_member(\"@kanal\") Obunani tekshirish ctx.notify_admins(text) Adminlarga xabar ctx.background(func) Fon vazifasi ctx.t(\"key\") Tarjima"}, "formatting": {"title": "Matn formatlash", "html": "<p>nicebot standart holatda HTML parse mode'dan foydalanadi, shuning uchun <code>&lt;b&gt;<\/code>, <code>&lt;i&gt;<\/code>, <code>&lt;code&gt;<\/code> va <code>&lt;a href&gt;<\/code> teglari darhol ishlaydi.<\/p><h2 id=\"foydalanuvchi-matni-bilan-xavfsiz-ishlash\">Foydalanuvchi matni bilan xavfsiz ishlash<\/h2><p>Foydalanuvchi yozgan matnda <code>&lt;<\/code> yoki <code>&amp;<\/code> belgilari bo'lishi mumkin. To'g'ridan-to'g'ri qo'shilsa, Telegram xato beradi. <code>html()<\/code> qiymatlarni xavfsiz qiladi, shablon esa o'zgarmaydi:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import html, bold, link, mention\n\nname = ctx.text                                 # foydalanuvchi yozgan matn\nawait ctx.reply(html(\"&lt;b&gt;Salom, {}!&lt;/b&gt;\", name))  # name xavfsiz escape qilinadi\nawait ctx.reply(bold(\"Muhim\") + \" xabar\")\nawait ctx.reply(link(\"Saytimiz\", \"https://tezbaraka.uz\"))<\/code><\/pre><\/figure><p>Tayyor yordamchilar: <code>bold<\/code>, <code>italic<\/code>, <code>underline<\/code>, <code>strike<\/code>, <code>spoiler<\/code>, <code>code<\/code>, <code>pre<\/code>, <code>link<\/code>, <code>mention<\/code>, <code>quote<\/code>, <code>escape<\/code>.<\/p><aside class=\"note\"><p>Agar formatlashda xato bo'lsa ham bot yiqilmaydi. nicebot xabarni formatlashsiz qayta yuboradi va logga ogohlantirish yozadi.<\/p><\/aside><h2 id=\"boshqa-rejimlar\">Boshqa rejimlar<\/h2><p><code>Nicebot(parse_mode=\"MarkdownV2\")<\/code> yoki formatlashsiz ishlash uchun <code>parse_mode=None<\/code>.<\/p>", "toc": [["foydalanuvchi-matni-bilan-xavfsiz-ishlash", "Foydalanuvchi matni bilan xavfsiz ishlash"], ["boshqa-rejimlar", "Boshqa rejimlar"]], "text": "nicebot standart holatda HTML parse mode'dan foydalanadi, shuning uchun <b> , <i> , <code> va <a href> teglari darhol ishlaydi. Foydalanuvchi matni bilan xavfsiz ishlash Foydalanuvchi yozgan matnda < yoki & belgilari bo'lishi mumkin. To'g'ridan-to'g'ri qo'shilsa, Telegram xato beradi. html() qiymatlarni xavfsiz qiladi, shablon esa o'zgarmaydi: python Tayyor yordamchilar: bold , italic , underline , strike , spoiler , code , pre , link , mention , quote , escape . Agar formatlashda xato bo'lsa ham bot yiqilmaydi. nicebot xabarni formatlashsiz qayta yuboradi va logga ogohlantirish yozadi. Boshqa rejimlar Nicebot(parse_mode=\"MarkdownV2\") yoki formatlashsiz ishlash uchun parse_mode=None ."}, "buttons": {"title": "Inline tugmalar", "html": "<h2 id=\"tugma-va-uning-amali\">Tugma va uning amali<\/h2><p><code>Button<\/code> matn va bitta amalni oladi. Eng qulayi <code>on_click<\/code>: tugma bosilganda oddiy funksiya chaqiriladi. Callback data o'ylab topish va uni alohida handlerda tutib olish shart emas.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Button\n\nasync def buy(ctx):\n    await ctx.edit(\"✅ Sotib olindi\")\n\n@bot.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Mahsulot: Kitob — 50 000 so'm\", buttons=[\n        [Button(\"🛒 Sotib olish\", on_click=buy)],\n        [Button(\"🌐 Sayt\", url=\"https://tezbaraka.uz\"),\n         Button(\"📋 Promo\", copy=\"NICE2026\")],\n        [Button(\"📱 Ilova\", webapp=\"https://app.tezbaraka.uz\")],\n    ])<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Turi<\/th><th>Yozilishi<\/th><\/tr><\/thead><tbody><tr><td>Funksiya<\/td><td><code>Button(\"OK\", on_click=func)<\/code><\/td><\/tr><tr><td>Havola<\/td><td><code>Button(\"Sayt\", url=\"https://...\")<\/code><\/td><\/tr><tr><td>Mini App<\/td><td><code>Button(\"Ilova\", webapp=\"https://...\")<\/code><\/td><\/tr><tr><td>Nusxa olish<\/td><td><code>Button(\"Kod\", copy=\"PROMO\")<\/code><\/td><\/tr><tr><td>Ulashish<\/td><td><code>Button(\"Ulashish\", share=\"matn\")<\/code><\/td><\/tr><tr><td>Oddiy data<\/td><td><code>Button(\"Ha\", data=\"yes\")<\/code><\/td><\/tr><tr><td>To'lov<\/td><td><code>Button(\"To'lash\", pay=True)<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"parametr-uzatish\">Parametr uzatish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async def add_to_cart(ctx, id: int, qty: int):\n    await ctx.answer(f\"{id} dan {qty} ta qo'shildi\")\n\nButton(\"➕ Savatga\", on_click=add_to_cart, id=15, qty=2)<\/code><\/pre><\/figure><h2 id=\"callback-shablonlari\">Callback shablonlari<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.callback(\"product:{id:int}\")\nasync def product(ctx, id: int):\n    p = await Product.get(id=id)\n    await ctx.edit(f\"{p.title} — {p.price} so'm\")\n\n# tugma shu shablonni o'zi to'ldiradi:\nButton(\"Ko'rish\", on_click=product, id=5)      # callback_data = \"product:5\"<\/code><\/pre><\/figure><p>Turlar: <code>int<\/code>, <code>float<\/code>, <code>bool<\/code>, <code>str<\/code> (standart) va <code>any<\/code>. Qiymatlar handlerga to'g'ri turda keladi.<\/p><h2 id=\"avtomatik-joylashuv\">Avtomatik joylashuv<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># ro'yxat berilsa — qisqa tugmalar bir qatorga o'zi joylashadi\nawait ctx.reply(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\", \"XL\"])\n\n# ustunlar sonini o'zingiz bering\nawait ctx.reply(\"Tanlang\", buttons=items, columns=2)\n\n# dict: matn -&gt; amal (funksiya, URL yoki data)\nawait ctx.reply(\"Menyu\", buttons={\"Profil\": profile, \"Sayt\": \"https://tezbaraka.uz\"})<\/code><\/pre><\/figure><h2 id=\"xavfsiz-tugmalar\">Xavfsiz tugmalar<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Button(\"🎁 Bonus olish\", on_click=bonus, once=True)          # faqat bir marta\nButton(\"⏳ Taklif\", on_click=offer, ttl=\"10m\")              # 10 daqiqadan keyin eskiradi\nButton(\"👤 Faqat siz\", on_click=mine, only=ctx.user_id)     # boshqalar bosolmaydi<\/code><\/pre><\/figure><aside class=\"note\"><p>Telegram callback_data'ni 64 bayt bilan cheklaydi. nicebot uzun ma'lumotni bazada saqlab, tugmaga qisqa kalit qo'yadi, buni siz sezmaysiz ham. Bosilgan tugmalarga javob ham avtomatik yuboriladi, shuning uchun \"soat\" belgisi qotib qolmaydi.<\/p><\/aside>", "toc": [["tugma-va-uning-amali", "Tugma va uning amali"], ["parametr-uzatish", "Parametr uzatish"], ["callback-shablonlari", "Callback shablonlari"], ["avtomatik-joylashuv", "Avtomatik joylashuv"], ["xavfsiz-tugmalar", "Xavfsiz tugmalar"]], "text": "Tugma va uning amali Button matn va bitta amalni oladi. Eng qulayi on_click : tugma bosilganda oddiy funksiya chaqiriladi. Callback data o'ylab topish va uni alohida handlerda tutib olish shart emas. python Turi Yozilishi Funksiya Button(\"OK\", on_click=func) Havola Button(\"Sayt\", url=\"https://...\") Mini App Button(\"Ilova\", webapp=\"https://...\") Nusxa olish Button(\"Kod\", copy=\"PROMO\") Ulashish Button(\"Ulashish\", share=\"matn\") Oddiy data Button(\"Ha\", data=\"yes\") To'lov Button(\"To'lash\", pay=True) Parametr uzatish python Callback shablonlari python Turlar: int , float , bool , str (standart) va any . Qiymatlar handlerga to'g'ri turda keladi. Avtomatik joylashuv python Xavfsiz tugmalar python Telegram callback_data'ni 64 bayt bilan cheklaydi. nicebot uzun ma'lumotni bazada saqlab, tugmaga qisqa kalit qo'yadi, buni siz sezmaysiz ham. Bosilgan tugmalarga javob ham avtomatik yuboriladi, shuning uchun \"soat\" belgisi qotib qolmaydi."}, "keyboards": {"title": "Klaviatura va toggle", "html": "<h2 id=\"pastki-reply-klaviatura\">Pastki (reply) klaviatura<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Raqamingizni yuboring\", keyboard=[\"📞 Raqam yuborish:contact\"])\nawait ctx.reply(\"Qayerdasiz?\", keyboard=[\"📍 Joylashuv:location\"])\nawait ctx.reply(\"Menyu\", keyboard=[\"🛍 Do'kon\", \"📞 Aloqa\", \"ℹ️ Haqida\"], columns=2)\nawait ctx.reply(\"Yopildi\", remove_keyboard=True)<\/code><\/pre><\/figure><p>Matn oxiridagi <code>:contact<\/code> raqam so'raydigan, <code>:location<\/code> esa joylashuv so'raydigan tugma yasaydi. Murakkabroq holatlar uchun <code>ReplyButton(\"...\", webapp=...)<\/code> bor.<\/p><h2 id=\"toggle-yoqish-va-ochirish\">Toggle: yoqish va o'chirish<\/h2><p>Sozlamalar menyusi uchun. Tugma bosilganda ✅ va ⬜️ o'zi almashadi, qiymat esa har bir foydalanuvchi uchun saqlanadi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Toggle\n\n@bot.command(\"sozlamalar\")\nasync def settings_menu(ctx):\n    await ctx.reply(\"⚙️ Sozlamalar\", buttons=[\n        [Toggle(\"Bildirishnomalar\", key=\"notify\", default=True)],\n        [Toggle(\"Kechki rejim\", key=\"night\")],\n    ])\n\n# istalgan joyda qiymatni o'qing:\nif await ctx.setting(\"notify\"):\n    ...<\/code><\/pre><\/figure><p>O'zgarishni darhol ushlash uchun <code>Toggle(..., on_change=func)<\/code> yozing, <code>func(ctx, value)<\/code> chaqiriladi.<\/p>", "toc": [["pastki-reply-klaviatura", "Pastki (reply) klaviatura"], ["toggle-yoqish-va-ochirish", "Toggle: yoqish va o'chirish"]], "text": "Pastki (reply) klaviatura python Matn oxiridagi :contact raqam so'raydigan, :location esa joylashuv so'raydigan tugma yasaydi. Murakkabroq holatlar uchun ReplyButton(\"...\", webapp=...) bor. Toggle: yoqish va o'chirish Sozlamalar menyusi uchun. Tugma bosilganda ✅ va ⬜️ o'zi almashadi, qiymat esa har bir foydalanuvchi uchun saqlanadi. python O'zgarishni darhol ushlash uchun Toggle(..., on_change=func) yozing, func(ctx, value) chaqiriladi."}, "conversations": {"title": "Suhbatlar", "html": "<p>nicebot'ning eng katta qulayligi shu. Savol berasiz va javobni o'sha funksiya ichida kutasiz.<\/p><h2 id=\"ask\">ask<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date\n\n@bot.command(\"register\")\nasync def register(ctx):\n    name  = await ctx.ask(\"Ismingiz?\")\n    age   = await ctx.ask(\"Yoshingiz?\", int)        # son bo'lmasa qayta so'raydi\n    phone = await ctx.ask(\"Raqamingiz?\", Phone)     # \"Raqam yuborish\" tugmasi bilan\n    size  = await ctx.ask(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\"])\n    await ctx.reply(f\"Rahmat, {name}!\")<\/code><\/pre><\/figure><ul><li>Foydalanuvchi <code>/cancel<\/code> yozsa yoki \"🚫 Bekor qilish\" tugmasini bossa, suhbat jimgina tugaydi<\/li><li>10 daqiqa javob bo'lmasa, \"⌛️ Javob kutish vaqti tugadi\" chiqadi. Buni <code>timeout=\"5m\"<\/code> bilan o'zgartirish mumkin<\/li><li>Noto'g'ri qiymat kiritilsa, tushunarli xato ko'rsatiladi va savol qayta so'raladi. Urinishlar soni <code>retries=<\/code> bilan beriladi<\/li><\/ul><h2 id=\"confirm\">confirm<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">if await ctx.confirm(\"Buyurtmani tasdiqlaysizmi?\"):\n    await ctx.reply(\"✅ Qabul qilindi\")\nelse:\n    await ctx.reply(\"Bekor qilindi\")<\/code><\/pre><\/figure><h2 id=\"choose\">choose<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">city = await ctx.choose(\"Shahringiz?\", [\"Toshkent\", \"Navoiy\", \"Buxoro\"])\n\ntags = await ctx.choose(\n    \"Qiziqishlaringiz?\",\n    {\"⚽️ Sport\": \"sport\", \"🎵 Musiqa\": \"music\", \"💻 IT\": \"it\"},\n    multiple=True,       # ✅/⬜️ belgilab, \"Tayyor\" bosiladi\n)                        # -&gt; [\"sport\", \"it\"]<\/code><\/pre><\/figure><h2 id=\"form-bir-nechta-savol-ketma-ket\">form: bir nechta savol ketma-ket<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date, Integer\n\ndata = await ctx.form(\n    name=\"Ismingiz?\",\n    age=Integer(\"Yoshingiz?\", min=14, max=99),\n    phone=Phone(\"Telefon raqamingiz?\"),\n    email=Email(\"Email manzilingiz?\"),\n    birthday=Date(\"Tug'ilgan kuningiz? (KK.OO.YYYY)\"),\n)\nawait ctx.reply(f\"{data.name}, {data.phone}\")<\/code><\/pre><\/figure><p><code>form<\/code> natijasi <code>dict<\/code> bo'ladi, lekin maydonlarga nuqta orqali ham murojaat qilish mumkin: <code>data.name<\/code>.<\/p><aside class=\"note\"><p>Bir vaqtda minglab foydalanuvchi bilan suhbat qilish mumkin. Har biri o'z handlerida kutadi va bir-biriga xalaqit bermaydi.<\/p><\/aside>", "toc": [["ask", "ask"], ["confirm", "confirm"], ["choose", "choose"], ["form-bir-nechta-savol-ketma-ket", "form: bir nechta savol ketma-ket"]], "text": "nicebot'ning eng katta qulayligi shu. Savol berasiz va javobni o'sha funksiya ichida kutasiz. ask python Foydalanuvchi /cancel yozsa yoki \"🚫 Bekor qilish\" tugmasini bossa, suhbat jimgina tugaydi 10 daqiqa javob bo'lmasa, \"⌛️ Javob kutish vaqti tugadi\" chiqadi. Buni timeout=\"5m\" bilan o'zgartirish mumkin Noto'g'ri qiymat kiritilsa, tushunarli xato ko'rsatiladi va savol qayta so'raladi. Urinishlar soni retries= bilan beriladi confirm python choose python form: bir nechta savol ketma-ket python form natijasi dict bo'ladi, lekin maydonlarga nuqta orqali ham murojaat qilish mumkin: data.name . Bir vaqtda minglab foydalanuvchi bilan suhbat qilish mumkin. Har biri o'z handlerida kutadi va bir-biriga xalaqit bermaydi."}, "validators": {"title": "Validatorlar", "html": "<p>Validator foydalanuvchi javobini tekshiradi va toza qiymatga aylantiradi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Text, Integer, Number, Phone, Email, Url, Date, Choice, Regex, Photo, File, Location\n\nawait ctx.ask(\"Izoh?\", Text(min=10, max=500))\nawait ctx.ask(\"Summa?\", Number(min=1000))\nawait ctx.ask(\"Rasm yuboring\", Photo)              # -&gt; PhotoSize (file_id bor)\nawait ctx.ask(\"Pasport seriyasi?\", Regex(r\"[A-Z]{2}\\d{7}\"))\nawait ctx.ask(\"Kod?\", lambda t: t.upper())         # o'z funksiyangiz<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Validator<\/th><th>Qaytaradi<\/th><th>Qo'shimcha<\/th><\/tr><\/thead><tbody><tr><td><code>Text(min=, max=)<\/code><\/td><td><code>str<\/code><\/td><td>Uzunlik chegarasi<\/td><\/tr><tr><td><code>Integer(min=, max=)<\/code> / <code>int<\/code><\/td><td><code>int<\/code><\/td><td><code>1 000 000<\/code> kabi bo'shliqlarni tushunadi<\/td><\/tr><tr><td><code>Number<\/code> / <code>float<\/code><\/td><td><code>float<\/code><\/td><td>Vergulni ham qabul qiladi: <code>12,5<\/code><\/td><\/tr><tr><td><code>Phone<\/code><\/td><td><code>\"+998901234567\"<\/code><\/td><td>Kontakt tugmasi. O'zbek operator kodlarini tekshiradi<\/td><\/tr><tr><td><code>Email<\/code><\/td><td><code>str<\/code><\/td><td>Kichik harfga o'tkazadi<\/td><\/tr><tr><td><code>Url<\/code><\/td><td><code>str<\/code><\/td><td><code>https://<\/code> bilan boshlanishi kerak<\/td><\/tr><tr><td><code>Date(format=)<\/code><\/td><td><code>date<\/code><\/td><td>Standart format: <code>KK.OO.YYYY<\/code><\/td><\/tr><tr><td><code>Choice(choices=)<\/code><\/td><td><code>str<\/code><\/td><td>Variantlarni tugma qilib ko'rsatadi<\/td><\/tr><tr><td><code>Regex(pattern)<\/code><\/td><td><code>str<\/code><\/td><td><\/td><\/tr><tr><td><code>Photo<\/code> / <code>File<\/code><\/td><td>media obyekti<\/td><td><code>.file_id<\/code> bor<\/td><\/tr><tr><td><code>Location<\/code><\/td><td><code>Location<\/code><\/td><td>Joylashuv tugmasi<\/td><\/tr><\/tbody><\/table><\/div><p>Telefon raqami har qanday ko'rinishda kiritilishi mumkin: <code>90 123 45 67<\/code>, <code>+998 (90) 123-45-67<\/code> yoki <code>8 90 1234567<\/code>. Natija har doim <code>+998901234567<\/code> bo'ladi.<\/p>", "toc": [], "text": "Validator foydalanuvchi javobini tekshiradi va toza qiymatga aylantiradi. python Validator Qaytaradi Qo'shimcha Text(min=, max=) str Uzunlik chegarasi Integer(min=, max=) / int int 1 000 000 kabi bo'shliqlarni tushunadi Number / float float Vergulni ham qabul qiladi: 12,5 Phone \"+998901234567\" Kontakt tugmasi. O'zbek operator kodlarini tekshiradi Email str Kichik harfga o'tkazadi Url str https:// bilan boshlanishi kerak Date(format=) date Standart format: KK.OO.YYYY Choice(choices=) str Variantlarni tugma qilib ko'rsatadi Regex(pattern) str Photo / File media obyekti .file_id bor Location Location Joylashuv tugmasi Telefon raqami har qanday ko'rinishda kiritilishi mumkin: 90 123 45 67 , +998 (90) 123-45-67 yoki 8 90 1234567 . Natija har doim +998901234567 bo'ladi."}, "state": {"title": "Holat (state)", "html": "<p>Ko'p hollarda <code>ctx.ask()<\/code> yetarli. Ammo foydalanuvchi bot bilan uzoq vaqt, masalan bir necha kun davomida bir qadamda tursa, holatdan foydalaning. Holat bazada saqlanadi va restartdan keyin ham yo'qolmaydi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"feedback\")\nasync def feedback(ctx):\n    await ctx.set_state(\"feedback\", step=1)\n    await ctx.reply(\"Fikringizni yozing:\")\n\n@bot.text(state=\"feedback\")\nasync def got_feedback(ctx, text):\n    data = await ctx.state_data()      # {\"step\": 1}\n    await ctx.clear_state()\n    await ctx.reply(\"Rahmat!\")<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Metod<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>await ctx.set_state(\"nom\", **data)<\/code><\/td><td>Holatni o'rnatish<\/td><\/tr><tr><td><code>await ctx.get_state()<\/code><\/td><td>Joriy holat yoki <code>None<\/code><\/td><\/tr><tr><td><code>await ctx.state_data()<\/code><\/td><td>Saqlangan ma'lumotlar<\/td><\/tr><tr><td><code>await ctx.update_data(**data)<\/code><\/td><td>Ma'lumot qo'shish<\/td><\/tr><tr><td><code>await ctx.clear_state()<\/code><\/td><td>Tozalash<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [], "text": "Ko'p hollarda ctx.ask() yetarli. Ammo foydalanuvchi bot bilan uzoq vaqt, masalan bir necha kun davomida bir qadamda tursa, holatdan foydalaning. Holat bazada saqlanadi va restartdan keyin ham yo'qolmaydi. python Metod Ma'nosi await ctx.set_state(\"nom\", **data) Holatni o'rnatish await ctx.get_state() Joriy holat yoki None await ctx.state_data() Saqlangan ma'lumotlar await ctx.update_data(**data) Ma'lumot qo'shish await ctx.clear_state() Tozalash"}, "menus": {"title": "Menyu va sahifalash", "html": "<h2 id=\"kop-darajali-menyu\">Ko'p darajali menyu<\/h2><p>Menyuni lug'at ko'rinishida yozasiz. Navigatsiya va \"⬅️ Orqaga\" tugmasi avtomatik ishlaydi, xabar esa yangisi yuborilmasdan joyida tahrirlanadi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Menu\n\nmain = Menu(\"🏠 Bosh menyu\", {\n    \"🛍 Do'kon\": Menu(\"Bo'limni tanlang\", {\n        \"👕 Kiyim\": \"Kiyimlar tez orada qo'shiladi\",\n        \"📚 Kitoblar\": show_books,        # funksiya chaqiriladi\n    }),\n    \"📞 Aloqa\": \"+998 90 123 45 67\",\n    \"🌐 Sayt\": \"https://tezbaraka.uz\",\n})\n\n@bot.command(\"menu\")\nasync def menu(ctx):\n    await ctx.menu(main)    # \"⬅️ Orqaga\" o'zi qo'shiladi<\/code><\/pre><\/figure><p>Qiymat turlari: matn (ko'rsatiladi), <code>Menu<\/code> yoki <code>dict<\/code> (ichki menyu), funksiya (chaqiriladi), URL (havola tugmasi) yoki <code>Button<\/code>.<\/p><h2 id=\"sahifalash\">Sahifalash<\/h2><p>Uzun ro'yxatni ◀️ 2/5 ▶️ tugmalari bilan sahifalarga bo'ladi.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">products = await Product.all().order_by(\"title\")\nawait ctx.paginate(\n    products,\n    per_page=10,\n    title=\"📦 Mahsulotlar\",\n    render=lambda p, i: f\"{i + 1}. {p.title} — {p.price} so'm\",\n)\n# tugmalarni ham sahifalash mumkin:\nawait ctx.paginate([Button(p.title, on_click=open_product, id=p.id) for p in products], columns=2)<\/code><\/pre><\/figure>", "toc": [["kop-darajali-menyu", "Ko'p darajali menyu"], ["sahifalash", "Sahifalash"]], "text": "Ko'p darajali menyu Menyuni lug'at ko'rinishida yozasiz. Navigatsiya va \"⬅️ Orqaga\" tugmasi avtomatik ishlaydi, xabar esa yangisi yuborilmasdan joyida tahrirlanadi. python Qiymat turlari: matn (ko'rsatiladi), Menu yoki dict (ichki menyu), funksiya (chaqiriladi), URL (havola tugmasi) yoki Button . Sahifalash Uzun ro'yxatni ◀️ 2/5 ▶️ tugmalari bilan sahifalarga bo'ladi. python"}, "database": {"title": "Baza (ORM)", "html": "<p>nicebot'da o'z ORM'i bor. Bitta kod SQLite, PostgreSQL, MySQL/MariaDB va MongoDB'da bir xil ishlaydi. To'rttalasi ham avtomatik testlar bilan tekshirilgan.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Nicebot(db=\"sqlite:///bot.db\")\nNicebot(db=\"postgres://user:pass@localhost:5432/mybot\")\nNicebot(db=\"mysql://user:pass@localhost:3306/mybot\")\nNicebot(db=\"mongodb://localhost:27017/mybot\")<\/code><\/pre><\/figure><h2 id=\"model\">Model<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Model, fields\n\nclass Product(Model):\n    title = fields.Str(120)\n    price = fields.Int(default=0)\n    active = fields.Bool(default=True)\n    tags = fields.JSON(default=list)\n    created = fields.DateTime(auto_now_add=True)\n\nclass Order(Model):\n    user = fields.ForeignKey(\"User\")\n    product = fields.ForeignKey(Product)\n    qty = fields.Int(default=1)<\/code><\/pre><\/figure><p>Maydonlar: <code>Int<\/code>, <code>BigInt<\/code>, <code>Float<\/code>, <code>Str(max_length)<\/code>, <code>Text<\/code>, <code>Bool<\/code>, <code>DateTime(auto_now_add=, auto_now=)<\/code>, <code>Date<\/code>, <code>JSON<\/code> va <code>ForeignKey<\/code>. Umumiy parametrlar: <code>default=<\/code>, <code>null=<\/code>, <code>unique=<\/code>, <code>index=<\/code> va <code>choices=<\/code>.<\/p><aside class=\"note\"><p><strong>Avto-migratsiya:<\/strong> bot ishga tushganda jadvallar yaratiladi. Modelga yangi maydon qo'shsangiz, ustun ham o'zi qo'shiladi. Ma'lumotlaringiz hech qachon o'chirilmaydi.<\/p><\/aside><h2 id=\"yaratish-oqish-yangilash-ochirish\">Yaratish, o'qish, yangilash, o'chirish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">p = await Product.create(title=\"Kitob\", price=50_000)\n\np = await Product.get(id=1)              # topilmasa DoesNotExist\np = await Product.get_or_none(title=\"X\") # topilmasa None\nuser, created = await User.get_or_create(id=5, defaults={\"first_name\": \"Ali\"})\n\np.price = 45_000\nawait p.save()\nawait p.update(price=40_000)            # faqat shu maydon\nawait p.increment(\"price\", 1000)\nawait p.delete()<\/code><\/pre><\/figure><h2 id=\"sorovlar\">So'rovlar<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">cheap = await Product.filter(price__lt=100_000, active=True).order_by(\"price\")\ncount = await Product.filter(title__icontains=\"kitob\").count()\nlast5 = await Product.all().order_by(\"-created\").limit(5)\npage2 = await Product.all().page(2, 10)\ntitles = await Product.all().values_list(\"title\")\ntotal = await Order.filter(user=ctx.user).sum(\"qty\")\n\nfrom nicebot import Q, Col\nawait Product.filter(Q(price__gt=1_000_000) | Q(active=False))\nawait User.filter(id=5).update(balance=Col(\"balance\") + 1000)<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Lookup<\/th><th>Ma'nosi<\/th><\/tr><\/thead><tbody><tr><td><code>price=5<\/code><\/td><td>teng<\/td><\/tr><tr><td><code>price__ne=5<\/code><\/td><td>teng emas<\/td><\/tr><tr><td><code>__gt<\/code> <code>__gte<\/code> <code>__lt<\/code> <code>__lte<\/code><\/td><td>katta yoki kichik<\/td><\/tr><tr><td><code>__in=[...]<\/code> / <code>__not_in<\/code><\/td><td>ro'yxat ichida yoki tashqarisida<\/td><\/tr><tr><td><code>__contains<\/code> / <code>__icontains<\/code><\/td><td>ichida bor (<code>i<\/code> — harf katta-kichikligiga qaramaydi)<\/td><\/tr><tr><td><code>__startswith<\/code> / <code>__endswith<\/code><\/td><td>bilan boshlanadi yoki tugaydi<\/td><\/tr><tr><td><code>__isnull=True<\/code><\/td><td>bo'sh<\/td><\/tr><tr><td><code>__between=(a, b)<\/code><\/td><td>oraliqda<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"foreignkey\">ForeignKey<\/h2><p><code>await order.product<\/code> bog'langan obyektni yuklaydi va keshlaydi. <code>order.product_id<\/code> esa raqamning o'zi.<\/p><h2 id=\"tranzaksiya\">Tranzaksiya<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async with bot.db.transaction():\n    await Order.create(user=ctx.user, product=p)\n    await p.update(stock=Col(\"stock\") - 1)\n# xato bo'lsa — ikkalasi ham bekor bo'ladi<\/code><\/pre><\/figure><p>MongoDB'da tranzaksiya faqat replica set'da ishlaydi, shuning uchun u yerda <code>transaction()<\/code> hech narsa qilmaydi.<\/p>", "toc": [["model", "Model"], ["yaratish-oqish-yangilash-ochirish", "Yaratish, o'qish, yangilash, o'chirish"], ["sorovlar", "So'rovlar"], ["foreignkey", "ForeignKey"], ["tranzaksiya", "Tranzaksiya"]], "text": "nicebot'da o'z ORM'i bor. Bitta kod SQLite, PostgreSQL, MySQL/MariaDB va MongoDB'da bir xil ishlaydi. To'rttalasi ham avtomatik testlar bilan tekshirilgan. python Model python Maydonlar: Int , BigInt , Float , Str(max_length) , Text , Bool , DateTime(auto_now_add=, auto_now=) , Date , JSON va ForeignKey . Umumiy parametrlar: default= , null= , unique= , index= va choices= . Avto-migratsiya: bot ishga tushganda jadvallar yaratiladi. Modelga yangi maydon qo'shsangiz, ustun ham o'zi qo'shiladi. Ma'lumotlaringiz hech qachon o'chirilmaydi. Yaratish, o'qish, yangilash, o'chirish python So'rovlar python Lookup Ma'nosi price=5 teng price__ne=5 teng emas __gt __gte __lt __lte katta yoki kichik __in=[...] / __not_in ro'yxat ichida yoki tashqarisida __contains / __icontains ichida bor ( i — harf katta-kichikligiga qaramaydi) __startswith / __endswith bilan boshlanadi yoki tugaydi __isnull=True bo'sh __between=(a, b) oraliqda ForeignKey await order.product bog'langan obyektni yuklaydi va keshlaydi. order.product_id esa raqamning o'zi. Tranzaksiya python MongoDB'da tranzaksiya faqat replica set'da ishlaydi, shuning uchun u yerda transaction() hech narsa qilmaydi."}, "users": {"title": "Foydalanuvchilar va referal", "html": "<p>Botga yozgan har bir odam <code>nb_users<\/code> jadvaliga avtomatik saqlanadi va <code>ctx.user<\/code> orqali keladi. Ism, username va oxirgi faollik vaqti ham o'zi yangilanib turadi.<\/p><div class=\"table\"><table><thead><tr><th>Maydon<\/th><th><\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>Telegram id<\/td><\/tr><tr><td><code>first_name<\/code>, <code>last_name<\/code>, <code>username<\/code><\/td><td><\/td><\/tr><tr><td><code>lang<\/code><\/td><td>Tanlangan til<\/td><\/tr><tr><td><code>phone<\/code><\/td><td>Telefon<\/td><\/tr><tr><td><code>is_blocked<\/code><\/td><td>Botni bloklaganmi (avtomatik)<\/td><\/tr><tr><td><code>is_premium<\/code><\/td><td>Telegram Premium<\/td><\/tr><tr><td><code>referrer_id<\/code><\/td><td>Kim taklif qilgan<\/td><\/tr><tr><td><code>data<\/code><\/td><td>Istalgan JSON<\/td><\/tr><tr><td><code>created_at<\/code>, <code>last_seen<\/code><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"oz-maydonlaringizni-qoshish\">O'z maydonlaringizni qo'shish<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot, User, fields\n\nclass Customer(User):              # o'sha \"nb_users\" jadvali, yangi ustunlar\n    balance = fields.Int(default=0)\n    city = fields.Str(64, null=True)\n\nbot = Nicebot(token=\"...\", user_model=Customer)\n\n@bot.command(\"balans\")\nasync def balans(ctx, user: Customer):\n    await ctx.reply(f\"Balans: {user.balance} so'm\")<\/code><\/pre><\/figure><h2 id=\"refera
