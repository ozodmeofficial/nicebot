>user_id=<\/code>. Бот должен быть админом группы.<\/p><h2 id=\"капча\">Капча<a class=\"anchor\" href=\"#\" data-anchor=\"капча\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", captcha=\"2m\")\n# новичок, не нажавший \"🤖 Я не робот\" за 2 минуты, удаляется<\/code><\/pre><\/figure><h2 id=\"обязательная-подписка\">Обязательная подписка<a class=\"anchor\" href=\"#\" data-anchor=\"обязательная-подписка\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", required_channels=[\"@kanalim\", \"@yangiliklar\"])\n# неподписанный пользователь видит каналы и кнопку \"✅ Проверить\"<\/code><\/pre><\/figure><p>Бот должен быть админом канала, иначе он не сможет проверить подписку. Результат кэшируется на минуту, поэтому лишних запросов к Telegram нет.<\/p><h2 id=\"режим-поддержки\">Режим поддержки<a class=\"anchor\" href=\"#\" data-anchor=\"режим-поддержки\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", support_chat=-1001234567890)\n# личные сообщения без обработчика уходят в группу;\n# реплай в группе отправляется пользователю<\/code><\/pre><\/figure>", "toc": [["управление-группой", "Управление группой"], ["капча", "Капча"], ["обязательная-подписка", "Обязательная подписка"], ["режим-поддержки", "Режим поддержки"]], "text": "Управление группой Python Эти методы работают с пользователем, на чьё сообщение сделан реплай, или принимают user_id= . Бот должен быть админом группы. Капча Python Обязательная подписка Python Бот должен быть админом канала, иначе он не сможет проверить подписку. Результат кэшируется на минуту, поэтому лишних запросов к Telegram нет. Режим поддержки Python", "min": 1}, "middleware": {"title": "Middleware, DI и ошибки", "desc": "Код вокруг каждого апдейта, внедрение зависимостей и ошибки.", "html": "<h2 id=\"middleware\">Middleware<a class=\"anchor\" href=\"#\" data-anchor=\"middleware\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Middleware оборачивает каждый апдейт и может выполнять код до и после обработчика.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import time\n\n@bot.middleware\nasync def timing(ctx, next):\n    start = time.perf_counter()\n    await next()                                  # следующий шаг / обработчик\n    print(f\"{ctx.text!r}: {time.perf_counter() - start:.3f}s\")\n\n@bot.middleware\nasync def ban_check(ctx, next):\n    if ctx.user and ctx.user.data.get(\"banned\"):\n        return                                    # без next() обработка останавливается\n    await next()<\/code><\/pre><\/figure><h2 id=\"внедрение-зависимостей-di\">Внедрение зависимостей (DI)<a class=\"anchor\" href=\"#\" data-anchor=\"внедрение-зависимостей-di\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Обработчик запрашивает нужное по имени или типу параметра:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from dataclasses import dataclass\n\n@dataclass\nclass Settings:\n    price: int = 50_000\n\nbot.provide(Settings, Settings())\n\n@bot.callback(\"buy:{id:int}\")\nasync def buy(ctx, id: int, user: Customer, cfg: Settings, text, args):\n    ...   # просите нужное по имени или типу<\/code><\/pre><\/figure><p>По имени доступны: <code>bot<\/code>, <code>message<\/code>, <code>callback<\/code>, <code>user<\/code>, <code>chat<\/code>, <code>text<\/code>, <code>args<\/code>, <code>arg<\/code>, <code>payload<\/code>, <code>data<\/code>, <code>value<\/code>, <code>album<\/code>, <code>lang<\/code>, <code>state<\/code>, <code>config<\/code>, <code>db<\/code> и <code>storage<\/code>, а также параметры callback и regex.<\/p><h2 id=\"ошибки\">Ошибки<a class=\"anchor\" href=\"#\" data-anchor=\"ошибки\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.error(ValueError)\nasync def bad_value(ctx, error):\n    await ctx.reply(f\"Xato qiymat: {error}\")\n\n# остальные ошибки: вежливое сообщение пользователю,\n# а админам — отчёт с traceback<\/code><\/pre><\/figure>", "toc": [["middleware", "Middleware"], ["внедрение-зависимостей-di", "Внедрение зависимостей (DI)"], ["ошибки", "Ошибки"]], "text": "Middleware Middleware оборачивает каждый апдейт и может выполнять код до и после обработчика. Python Внедрение зависимостей (DI) Обработчик запрашивает нужное по имени или типу параметра: Python По имени доступны: bot , message , callback , user , chat , text , args , arg , payload , data , value , album , lang , state , config , db и storage , а также параметры callback и regex. Ошибки Python", "min": 1}, "miniapp": {"title": "Mini App", "desc": "Сервер Mini App и API в одном процессе с ботом.", "html": "<p>В nicebot есть веб-сервер, который работает в одном процессе с ботом. Он отдаёт файлы Mini App и создаёт API-эндпоинты. Подпись <code>initData<\/code> Telegram проверяется через HMAC автоматически.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.webapp(\"webapp\")                # отдаёт webapp/index.html\n\n@bot.api(\"/api/score\")\nasync def score(req):\n    user = await req.db_user()          # initData проверен, пользователь известен\n    points = int(req.json[\"points\"])\n    await user.update(data={**user.data, \"score\": points})\n    return {\"ok\": True, \"score\": points}\n\n@bot.command(\"play\")\nasync def play(ctx):\n    await ctx.reply(\"O'ynash\", buttons=[Button(\"🎮 Boshlash\", webapp=\"https://game.tezbaraka.uz\")])\n\nbot.start(port=8080)<\/code><\/pre><\/figure><p>На стороне браузера подключается готовый <code>nicebot.js<\/code>. Он сам добавляет <code>initData<\/code> к запросам:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">HTML<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-xml\">&lt;script src=\"https://telegram.org/js/telegram-web-app.js\"&gt;&lt;/script&gt;\n&lt;script src=\"/nicebot.js\"&gt;&lt;/script&gt;\n&lt;script&gt;\n  nicebot.post(\"/api/score\", { points: 120 }).then(r =&gt; console.log(r.score));\n  console.log(nicebot.user.first_name);\n&lt;/script&gt;<\/code><\/pre><\/figure><p>Если <code>initData<\/code> неверный или устарел, запрос отклоняется с кодом <code>401<\/code>. <code>@bot.api(..., auth=False)<\/code> создаёт открытый эндпоинт. В объекте <code>WebAppRequest<\/code> есть <code>user<\/code>, <code>json<\/code>, <code>query<\/code>, <code>params<\/code> и <code>db_user()<\/code>.<\/p>", "toc": [], "text": "В nicebot есть веб-сервер, который работает в одном процессе с ботом. Он отдаёт файлы Mini App и создаёт API-эндпоинты. Подпись initData Telegram проверяется через HMAC автоматически. Python На стороне браузера подключается готовый nicebot.js . Он сам добавляет initData к запросам: HTML Если initData неверный или устарел, запрос отклоняется с кодом 401 . @bot.api(..., auth=False) создаёт открытый эндпоинт. В объекте WebAppRequest есть user , json , query , params и db_user() .", "min": 1}, "scheduler": {"title": "Планировщик, фон и кэш", "desc": "Задачи по расписанию, фоновая работа, кэш и файлы.", "html": "<h2 id=\"задачи-по-расписанию\">Задачи по расписанию<a class=\"anchor\" href=\"#\" data-anchor=\"задачи-по-расписанию\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.every(\"1h\")\nasync def sync_prices(bot):\n    ...\n\n@bot.at(\"09:00\", tz=\"Asia/Tashkent\")\nasync def morning(bot):\n    await bot.broadcast(\"☀️ Xayrli tong!\")\n\n@bot.at(\"18:00\", days=[\"mon\", \"fri\"])\nasync def weekly_report(bot):\n    await bot.notify_admins(str(await bot.stats()))<\/code><\/pre><\/figure><p>Дни пишутся по-английски (<code>mon<\/code>…<code>sun<\/code>) или по-узбекски (<code>du<\/code>, <code>se<\/code>, <code>chor<\/code>, <code>pay<\/code>, <code>ju<\/code>, <code>shan<\/code>, <code>yak<\/code>).<\/p><h2 id=\"фоновые-задачи\">Фоновые задачи<a class=\"anchor\" href=\"#\" data-anchor=\"фоновые-задачи\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"report\")\nasync def report(ctx):\n    ctx.background(build_heavy_report, ctx.user_id, retries=3)   # обработчик завершается сразу\n    await ctx.reply(\"Hisobot tayyorlanmoqda, tayyor bo'lgach yuboraman\")\n\nbot.later(\"10m\", bot.send_message(admin_id, \"10 daqiqa o'tdi\"))<\/code><\/pre><\/figure><p>Если фоновая задача падает, она повторяется с экспоненциальной паузой. При остановке бота незавершённые задачи дожидаются.<\/p><h2 id=\"кэш\">Кэш<a class=\"anchor\" href=\"#\" data-anchor=\"кэш\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import cache\n\n@cache(\"10m\")\nasync def dollar_rate():\n    ...   # реальный запрос раз в 10 минут<\/code><\/pre><\/figure><h2 id=\"файлы\">Файлы<a class=\"anchor\" href=\"#\" data-anchor=\"файлы\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on(\"document\")\nasync def doc(ctx):\n    data = await ctx.download()               # bytes\n    await ctx.save(f\"uploads/{ctx.message.document.file_name}\")\n\nawait ctx.photo(\"logo.png\")   # в первый раз загружается,\nawait ctx.photo(\"logo.png\")   # дальше мгновенно по file_id<\/code><\/pre><\/figure>", "toc": [["задачи-по-расписанию", "Задачи по расписанию"], ["фоновые-задачи", "Фоновые задачи"], ["кэш", "Кэш"], ["файлы", "Файлы"]], "text": "Задачи по расписанию Python Дни пишутся по-английски ( mon … sun ) или по-узбекски ( du , se , chor , pay , ju , shan , yak ). Фоновые задачи Python Если фоновая задача падает, она повторяется с экспоненциальной паузой. При остановке бота незавершённые задачи дожидаются. Кэш Python Файлы Python", "min": 1}, "deploy": {"title": "Запуск и деплой", "desc": "Polling или webhook, корректная остановка и Docker.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.start()                                   # polling\nbot.start(reload=True)                        # перезапуск при изменении кода\nbot.start(webhook=\"https://bot.tezbaraka.uz/hook\", port=8080)\nNicebot.run_all(shop_bot, support_bot)        # несколько ботов в одном процессе<\/code><\/pre><\/figure><h2 id=\"polling-или-webhook\">Polling или webhook<a class=\"anchor\" href=\"#\" data-anchor=\"polling-или-webhook\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Polling не требует настройки и подходит для небольших и средних ботов. Для webhook нужен домен с HTTPS. nicebot сам вызывает <code>setWebhook<\/code> с секретным токеном и проверяет входящие запросы. Состояние сервера можно проверить по адресу <code>/nicebot/health<\/code>.<\/p><h2 id=\"корректная-остановка\">Корректная остановка<a class=\"anchor\" href=\"#\" data-anchor=\"корректная-остановка\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>При Ctrl+C или SIGTERM бот перестаёт получать новые апдейты и ждёт завершения работающих обработчиков. Затем он подтверждает offset в Telegram, поэтому при перезапуске ни один апдейт не теряется и не обрабатывается дважды.<\/p><h2 id=\"docker\">Docker<a class=\"anchor\" href=\"#\" data-anchor=\"docker\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Dockerfile<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-dockerfile\">FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install --no-cache-dir \"nicebot[postgres]\"\nCMD [\"python\", \"bot.py\"]<\/code><\/pre><\/figure><h2 id=\"надёжность\">Надёжность<a class=\"anchor\" href=\"#\" data-anchor=\"надёжность\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><ul><li>Flood control (429): библиотека ждёт нужное число секунд и повторяет запрос<\/li><li>Сетевые ошибки и 5xx: до 3 повторов с экспоненциальной паузой<\/li><li>Неизвестные новые типы апдейтов не ломают бота: они записываются в лог и пропускаются<\/li><li>Число одновременных обработчиков ограничено параметром <code>max_concurrency=256<\/code><\/li><\/ul>", "toc": [["polling-или-webhook", "Polling или webhook"], ["корректная-остановка", "Корректная остановка"], ["docker", "Docker"], ["надёжность", "Надёжность"]], "text": "Python Polling или webhook Polling не требует настройки и подходит для небольших и средних ботов. Для webhook нужен домен с HTTPS. nicebot сам вызывает setWebhook с секретным токеном и проверяет входящие запросы. Состояние сервера можно проверить по адресу /nicebot/health . Корректная остановка При Ctrl+C или SIGTERM бот перестаёт получать новые апдейты и ждёт завершения работающих обработчиков. Затем он подтверждает offset в Telegram, поэтому при перезапуске ни один апдейт не теряется и не обрабатывается дважды. Docker Dockerfile Надёжность Flood control (429): библиотека ждёт нужное число секунд и повторяет запрос Сетевые ошибки и 5xx: до 3 повторов с экспоненциальной паузой Неизвестные новые типы апдейтов не ломают бота: они записываются в лог и пропускаются Число одновременных обработчиков ограничено параметром max_concurrency=256", "min": 1}, "testing": {"title": "Тестирование", "desc": "Проверяйте бота без Telegram, как настоящий пользователь.", "html": "<p>Бота можно проверить без Telegram, как настоящий пользователь. Фальшивый API записывает все вызовы.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">test_bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from bot import bot\n\nasync def test_register():\n    async with bot.test() as t:\n        ali = t.user(first_name=\"Ali\")\n        await ali.send(\"/register\")\n        assert t.last.text == \"Ismingiz?\"\n        await ali.send(\"Ali\")\n        await ali.send(\"25\")\n        await ali.click(\"M\")\n        assert \"Rahmat\" in t.last.text<\/code><\/pre><\/figure><div class=\"table\"><table><tbody><tr><td><code>t.user(...)<\/code><\/td><td>Тестовый пользователь<\/td><\/tr><tr><td><code>user.send(text)<\/code><\/td><td>Отправить сообщение<\/td><\/tr><tr><td><code>user.click(\"текст\")<\/code><\/td><td>Нажать кнопку<\/td><\/tr><tr><td><code>user.send_photo()<\/code> / <code>send_contact()<\/code> / <code>send_location()<\/code> / <code>send_album()<\/code><\/td><td>Отправить медиа<\/td><\/tr><tr><td><code>t.last<\/code><\/td><td>Последнее сообщение: <code>.text<\/code>, <code>.buttons<\/code>, <code>.keyboard<\/code><\/td><\/tr><tr><td><code>t.messages<\/code> / <code>t.texts<\/code><\/td><td>Все сообщения<\/td><\/tr><tr><td><code>t.calls_of(\"sendPhoto\")<\/code><\/td><td>Вызовы API<\/td><\/tr><tr><td><code>t.blocked = {id}<\/code><\/td><td>Пользователь, заблокировавший бота<\/td><\/tr><\/tbody><\/table><\/div><p>Работает с <code>pytest<\/code> и <code>pytest-asyncio<\/code>.<\/p>", "toc": [], "text": "Бота можно проверить без Telegram, как настоящий пользователь. Фальшивый API записывает все вызовы. test_bot.py t.user(...) Тестовый пользователь user.send(text) Отправить сообщение user.click(\"текст\") Нажать кнопку user.send_photo() / send_contact() / send_location() / send_album() Отправить медиа t.last Последнее сообщение: .text , .buttons , .keyboard t.messages / t.texts Все сообщения t.calls_of(\"sendPhoto\") Вызовы API t.blocked = {id} Пользователь, заблокировавший бота Работает с pytest и pytest-asyncio .", "min": 1}, "features": {"title": "50 возможностей", "desc": "Все 50 готовых возможностей nicebot на одной странице.", "html": "<section class=\"fgroup\"><h2 id=\"диалоги\">Диалоги <span class=\"fcount\">5<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">01<\/span><div><code>await ctx.ask()<\/code><p>Вопрос-ответ без классов FSM<\/p><\/div><\/li><li><span class=\"fnum\">02<\/span><div><code>ctx.confirm()<\/code><p>Вопрос «Да/Нет», возвращает True/False<\/p><\/div><\/li><li><span class=\"fnum\">03<\/span><div><code>ctx.choose(multiple=True)<\/code><p>Выбор нескольких вариантов с ✅/⬜️<\/p><\/div><\/li><li><span class=\"fnum\">04<\/span><div><code>ctx.form()<\/code><p>Несколько вопросов, валидация и переспрос<\/p><\/div><\/li><li><span class=\"fnum\">05<\/span><div><code>Валидаторы<\/code><p>Телефон (+998), email, дата, число, URL, фото и другие<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"кнопки\">Кнопки <span class=\"fcount\">12<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">06<\/span><div><code>Button(on_click=)<\/code><p>Кнопка привязывается прямо к функции<\/p><\/div><\/li><li><span class=\"fnum\">07<\/span><div><code>Шаблоны callback<\/code><p>\"buy:{id:int}\" разбирается автоматически<\/p><\/div><\/li><li><span class=\"fnum\">08<\/span><div><code>Авто-раскладка<\/code><p>Короткие кнопки сами встают в один ряд<\/p><\/div><\/li><li><span class=\"fnum\">09<\/span><div><code>Toggle<\/code><p>Настройки ✅/⬜️, значение сохраняется<\/p><\/div><\/li><li><span class=\"fnum\">10<\/span><div><code>ttl= и only=<\/code><p>Кнопки с таймером и только для одного человека<\/p><\/div><\/li><li><span class=\"fnum\">11<\/span><div><code>once=True<\/code><p>Одноразовая кнопка<\/p><\/div><\/li><li><span class=\"fnum\">12<\/span><div><code>Без лимита 64 байта<\/code><p>Длинные данные callback хранятся в базе<\/p><\/div><\/li><li><span class=\"fnum\">13<\/span><div><code>Автоответ<\/code><p>«Часики» на кнопке не зависают<\/p><\/div><\/li><li><span class=\"fnum\">14<\/span><div><code>Сокращения reply<\/code><p>\"📞 Номер:contact\", \":location\"<\/p><\/div><\/li><li><span class=\"fnum\">15<\/span><div><code>ctx.respond()<\/code><p>Редактирует, если нажата кнопка, иначе отправляет<\/p><\/div><\/li><li><span class=\"fnum\">16<\/span><div><code>Многоуровневое Menu<\/code><p>Кнопка «Назад» автоматически<\/p><\/div><\/li><li><span class=\"fnum\">17<\/span><div><code>ctx.paginate()<\/code><p>Пагинация ◀️ 2/5 ▶️<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"данные\">Данные <span class=\"fcount\">4<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">18<\/span><div><code>Встроенная ORM<\/code><p>Один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями<\/p><\/div><\/li><li><span class=\"fnum\">19<\/span><div><code>ctx.user<\/code><p>Пользователь сохраняется в базу автоматически<\/p><\/div><\/li><li><span class=\"fnum\">20<\/span><div><code>i18n<\/code><p>ctx.t(), готовые тексты uz/ru/en<\/p><\/div><\/li><li><span class=\"fnum\">21<\/span><div><code>Кэш file_id<\/code><p>Локальный файл загружается один раз<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"бизнес\">Бизнес <span class=\"fcount\">10<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">22<\/span><div><code>Реферальная система<\/code><p>ctx.ref_link, referrer_id и @bot.on_referral<\/p><\/div><\/li><li><span class=\"fnum\">23<\/span><div><code>Рассылка<\/code><p>Лимиты, пометка заблокировавших, продолжение после остановки<\/p><\/div><\/li><li><span class=\"fnum\">24<\/span><div><code>Админ-панель<\/code><p>/stats, /broadcast, /maintenance и /backup<\/p><\/div><\/li><li><span class=\"fnum\">25<\/span><div><code>Аналитика<\/code><p>DAU/MAU, retention и топ команд<\/p><\/div><\/li><li><span class=\"fnum\">26<\/span><div><code>Обязательная подписка<\/code><p>required_channels=[…]<\/p><\/div><\/li><li><span class=\"fnum\">27<\/span><div><code>Режим поддержки<\/code><p>Сообщение уходит в группу, ответ возвращается пользователю<\/p><\/div><\/li><li><span class=\"fnum\">28<\/span><div><code>Режим техработ<\/code><p>Админы продолжают пользоваться ботом<\/p><\/div><\/li><li><span class=\"fnum\">29<\/span><div><code>Telegram Stars<\/code><p>ctx.invoice() и @bot.paid<\/p><\/div><\/li><li><span class=\"fnum\">30<\/span><div><code>Группы и капча<\/code><p>ban, mute, warn (3 → бан), капча для новых участников<\/p><\/div><\/li><li><span class=\"fnum\">31<\/span><div><code>Отчёты об ошибках<\/code><p>Traceback автоматически отправляется админам<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"архитектура\">Архитектура <span class=\"fcount\">11<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">32<\/span><div><code>DI через type hints<\/code><p>async def h(ctx, user: Customer, cfg: Settings)<\/p><\/div><\/li><li><span class=\"fnum\">33<\/span><div><code>Nicebot.from_env()<\/code><p>Настройка из файла .env<\/p><\/div><\/li><li><span class=\"fnum\">34<\/span><div><code>bot.include(\"handlers\")<\/code><p>Автоматический поиск Router'ов<\/p><\/div><\/li><li><span class=\"fnum\">35<\/span><div><code>@cache(\"5m\")<\/code><p>Кэш для async-функций<\/p><\/div><\/li><li><span class=\"fnum\">36<\/span><div><code>ctx.background()<\/code><p>Фоновые задачи с повторами<\/p><\/div><\/li><li><span class=\"fnum\">37<\/span><div><code>@bot.every / @bot.at<\/code><p>Планировщик с часовыми поясами<\/p><\/div><\/li><li><span class=\"fnum\">38<\/span><div><code>Альбомы<\/code><p>Media group приходит списком в один обработчик<\/p><\/div><\/li><li><span class=\"fnum\">39<\/span><div><code>Сервер Mini App<\/code><p>Файлы и проверка initData (HMAC) в процессе бота<\/p><\/div><\/li><li><span class=\"fnum\">40<\/span><div><code>Mini App RPC<\/code><p>Эндпоинты @bot.api и готовый nicebot.js<\/p><\/div><\/li><li><span class=\"fnum\">41<\/span><div><code>Несколько ботов<\/code><p>Nicebot.run_all(bot1, bot2)<\/p><\/div><\/li><li><span class=\"fnum\">42<\/span><div><code>typing=True<\/code><p>Пока работает обработчик, видно «печатает…»<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"надёжность\">Надёжность <span class=\"fcount\">8<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">43<\/span><div><code>Защита от флуда<\/code><p>При ошибке 429 ждёт и повторяет<\/p><\/div><\/li><li><span class=\"fnum\">44<\/span><div><code>throttle=<\/code><p>Ограничение частоты против спама<\/p><\/div><\/li><li><span class=\"fnum\">45<\/span><div><code>Корректная остановка<\/code><p>При перезапуске апдейты не теряются<\/p><\/div><\/li><li><span class=\"fnum\">46<\/span><div><code>Безопасное форматирование<\/code><p>html() и повторная отправка при ошибке разметки<\/p><\/div><\/li><li><span class=\"fnum\">47<\/span><div><code>delete_after=<\/code><p>Автоудаление сообщений<\/p><\/div><\/li><li><span class=\"fnum\">48<\/span><div><code>Hot reload<\/code><p>bot.start(reload=True)<\/p><\/div><\/li><li><span class=\"fnum\">49<\/span><div><code>Набор для тестов<\/code><p>bot.test(): тесты без Telegram<\/p><\/div><\/li><li><span class=\"fnum\">50<\/span><div><code>CLI<\/code><p>nicebot new mybot<\/p><\/div><\/li><\/ol><\/section>", "toc": [["диалоги", "Диалоги"], ["кнопки", "Кнопки"], ["данные", "Данные"], ["бизнес", "Бизнес"], ["архитектура", "Архитектура"], ["надёжность", "Надёжность"]], "text": "Диалоги 5 01 await ctx.ask() Вопрос-ответ без классов FSM 02 ctx.confirm() Вопрос «Да/Нет», возвращает True/False 03 ctx.choose(multiple=True) Выбор нескольких вариантов с ✅/⬜️ 04 ctx.form() Несколько вопросов, валидация и переспрос 05 Валидаторы Телефон (+998), email, дата, число, URL, фото и другие Кнопки 12 06 Button(on_click=) Кнопка привязывается прямо к функции 07 Шаблоны callback \"buy:{id:int}\" разбирается автоматически 08 Авто-раскладка Короткие кнопки сами встают в один ряд 09 Toggle Настройки ✅/⬜️, значение сохраняется 10 ttl= и only= Кнопки с таймером и только для одного человека 11 once=True Одноразовая кнопка 12 Без лимита 64 байта Длинные данные callback хранятся в базе 13 Автоответ «Часики» на кнопке не зависают 14 Сокращения reply \"📞 Номер:contact\", \":location\" 15 ctx.respond() Редактирует, если нажата кнопка, иначе отправляет 16 Многоуровневое Menu Кнопка «Назад» автоматически 17 ctx.paginate() Пагинация ◀️ 2/5 ▶️ Данные 4 18 Встроенная ORM Один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями 19 ctx.user Пользователь сохраняется в базу автоматически 20 i18n ctx.t(), готовые тексты uz/ru/en 21 Кэш file_id Локальный файл загружается один раз Бизнес 10 22 Реферальная система ctx.ref_link, referrer_id и @bot.on_referral 23 Рассылка Лимиты, пометка заблокировавших, продолжение после остановки 24 Админ-панель /stats, /broadcast, /maintenance и /backup 25 Аналитика DAU/MAU, retention и топ команд 26 Обязательная подписка required_channels=[…] 27 Режим поддержки Сообщение уходит в группу, ответ возвращается пользователю 28 Режим техработ Админы продолжают пользоваться ботом 29 Telegram Stars ctx.invoice() и @bot.paid 30 Группы и капча ban, mute, warn (3 → бан), капча для новых участников 31 Отчёты об ошибках Traceback автоматически отправляется админам Архитектура 11 32 DI через type hints async def h(ctx, user: Customer, cfg: Settings) 33 Nicebot.from_env() Настройка из файла .env 34 bot.include(\"handlers\") Автоматический поиск Router'ов 35 @cache(\"5m\") Кэш для async-функций 36 ctx.background() Фоновые задачи с повторами 37 @bot.every / @bot.at Планировщик с часовыми поясами 38 Альбомы Media group приходит списком в один обработчик 39 Сервер Mini App Файлы и проверка initData (HMAC) в процессе бота 40 Mini App RPC Эндпоинты @bot.api и готовый nicebot.js 41 Несколько ботов Nicebot.run_all(bot1, bot2) 42 typing=True Пока работает обработчик, видно «печатает…» Надёжность 8 43 Защита от флуда При ошибке 429 ждёт и повторяет 44 throttle= Ограничение частоты против спама 45 Корректная остановка При перезапуске апдейты не теряются 46 Безопасное форматирование html() и повторная отправка при ошибке разметки 47 delete_after= Автоудаление сообщений 48 Hot reload bot.start(reload=True) 49 Набор для тестов bot.test(): тесты без Telegram 50 CLI nicebot new mybot", "min": 2}, "api": {"title": "Bot API", "desc": "185 методов и 403 типа Bot API с полной типизацией.", "html": "<p><code>Nicebot<\/code> напрямую даёт все методы Bot API. Они сгенерированы автоматически из официальной спецификации и полностью типизированы, поэтому редактор подсказывает каждый параметр.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># все 185 методов Bot API в snake_case\nawait bot.send_message(chat_id, \"Salom\")\nawait bot.set_chat_title(chat_id, \"Yangi nom\")\nmember = await bot.get_chat_member(chat_id, user_id)\nprint(member.status)      # \"member\", \"administrator\", ...<\/code><\/pre><\/figure><p>Типы доступны через <code>from nicebot import types<\/code>, например <code>types.Message<\/code> или <code>types.InlineKeyboardButton<\/code>. Они построены на msgspec и очень быстро читают JSON. Код не сломается, даже если Telegram добавит новое поле.<\/p><h2 id=\"версии\">Версии<a class=\"anchor\" href=\"#\" data-anchor=\"версии\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><tbody><tr><td>nicebot<\/td><td>0.1.2<\/td><\/tr><tr><td>Bot API<\/td><td>10.3<\/td><\/tr><tr><td>Python<\/td><td>3.10+<\/td><\/tr><tr><td>Лицензия<\/td><td>MIT<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["версии", "Версии"]], "text": "Nicebot напрямую даёт все методы Bot API. Они сгенерированы автоматически из официальной спецификации и полностью типизированы, поэтому редактор подсказывает каждый параметр. Python Типы доступны через from nicebot import types , например types.Message или types.InlineKeyboardButton . Они построены на msgspec и очень быстро читают JSON. Код не сломается, даже если Telegram добавит новое поле. Версии nicebot 0.1.2 Bot API 10.3 Python 3.10+ Лицензия MIT", "min": 1}}, "home": {"badge": "Новое · полная поддержка Bot API 10.3", "title": "Пишите Telegram-ботов.", "title2": "С минимумом кода.", "lead": "nicebot — Python-библиотека для Telegram-ботов. Диалоги, кнопки, база данных и админ-панель уже в одном импорте. Вы пишете только то, что должен делать бот.", "cta": "Начать", "cta2": "Открыть документацию", "install_tabs": ["pip", "uv", "Новый проект"], "stats": ["методов Bot API", "готовых типа", "базы данных", "готовых возможностей"], "steps_kicker": "Быстрый старт", "steps_title": "Первый бот в три шага", "steps_sub": "Без настройки, шаблонов и классов состояний.", "steps": [["Установите", "Одна команда. SQLite работает без дополнительных пакетов."], ["Напишите", "6 строк в файле bot.py. Токен выдаёт @BotFather."], ["Запустите", "Напишите боту /start в Telegram — он ответит."]], "compare_kicker": "Сравнение", "compare_title": "Один бот, два подхода", "compare_sub": "Бот регистрации, который спрашивает имя и возраст. В aiogram нужны класс состояний, FSMContext и Dispatcher. В nicebot — обычная функция.", "lines": "строк", "less": "в {n} раза меньше кода", "show_code": "Показать код", "features_kicker": "Возможности", "features_title": "Всё, что нужно боту", "features_sub": "Без дополнительных пакетов. Каждая тема подробно разобрана в документации.", "features": {"conversations": ["Диалоги", "Задайте вопрос и дождитесь ответа прямо в функции. Проверка и повторный вопрос — автоматически."], "buttons": ["Кнопки", "Привяжите кнопку прямо к функции. Придумывать callback_data не нужно."], "database": ["База данных", "Один ORM для SQLite, PostgreSQL, MySQL и MongoDB с авто-миграцией."], "admin": ["Админ-панель", "Команды /stats, /broadcast, /maintenance и /backup уже готовы."], "miniapp": ["Mini App", "Веб-сервер и проверка initData в одном процессе с ботом."], "testing": ["Тесты", "Проверяйте бота без Telegram: отправьте сообщение, нажмите кнопку, сверьте ответ."]}, "all_features": "Все 50 возможностей", "path_kicker": "Путь обучения", "path_title": "С чего начать?", "path_sub": "Выберите свой путь. Каждая страница объясняет одну тему.", "path": [["Новичок", "Вы знаете Python, но ещё не писали ботов."], ["Уже писали ботов", "Переходите с aiogram или другой библиотеки."], ["Продакшн", "Запускаете бота для реальных пользователей."]], "faq_kicker": "Вопросы", "faq_title": "Частые вопросы", "faq": [["Чем nicebot отличается от aiogram?", "aiogram — мощный, но низкоуровневый фреймворк: состояния, Router и Dispatcher вы собираете сами. nicebot берёт это на себя: ctx.ask() заменяет класс состояний, пользователи сохраняются в базу сами, админ-панель и рассылка уже готовы."], ["Доступны ли все возможности Bot API?", "Да. 185 методов и 403 типа Bot API 10.3 сгенерированы из официальной спецификации. Там, где коротких помощников не хватает, вызывайте любой метод напрямую, например await bot.set_chat_title(...)."], ["Какие базы данных поддерживаются?", "SQLite, PostgreSQL, MySQL/MariaDB и MongoDB. Код остаётся тем же, меняется только адрес db=. SQLite работает без установки дополнительных пакетов."], ["Подходит ли для больших ботов?", "nicebot асинхронный: сам ждёт flood-wait, повторяет запросы при сетевых ошибках и не теряет апдейты при остановке. Поддерживаются webhook и Docker."], ["Это бесплатно?", "Да. nicebot — открытый код под лицензией MIT, его можно использовать и в коммерческих проектах."]], "final_title": "Напишите первого бота прямо сейчас", "final_sub": "Установка займёт минуту, первый бот — пять минут.", "docs_title": "Документация nicebot", "docs_lead": "От установки до продакшна — всё, что нужно, чтобы написать Telegram-бота. Читайте по порядку или сразу переходите к нужному разделу.", "start_here": "Начните здесь", "sections": "Разделы"}}, "en": {"ui": {"search": "Search…", "on_this_page": "On this page", "copy": "Copy", "copied": "Copied", "prev": "Previous", "next": "Next", "menu": "Contents", "no_results": "No results", "theme": "Theme", "edit_hint": "Bot API", "tagline": "A Python library for Telegram bots", "home": "Home", "docs": "Docs", "features_tab": "Features", "api_tab": "Bot API", "result": "Result", "code": "Code", "overview": "Overview", "pages_n": "{n} pages", "read_min": "{n} min read", "edit": "Edit on GitHub", "search_btn": "Search", "search_hint_nav": "select", "search_hint_open": "open", "search_hint_close": "close", "replay": "Replay", "edited": "edited", "start_reading": "Start reading", "copy_link": "Copy link", "lang": "Language", "bot": "bot", "online": "online", "footer_docs": "Docs", "footer_res": "Resources", "footer_note": "Open source under the MIT license.", "changelog": "Changelog"}, "groups": {"start": "Getting started", "basics": "Basics", "ui": "Buttons and dialogs", "data": "Data", "business": "Business tools", "advanced": "Advanced", "reference": "Reference"}, "groupDesc": {"start": "From installing to your first working bot. New here? Start with this section.", "basics": "Handlers, the ctx object and formatting — the foundation of every bot.", "ui": "Buttons, keyboards, dialogs and menus: everything your users see.", "data": "Database, users and translations.", "business": "Admin panel, broadcasts, payments and group management.", "advanced": "Middleware, Mini Apps, scheduling, deployment and tests.", "reference": "The full feature list and the Bot API reference."}, "pages": {"intro": {"title": "Introduction", "desc": "What nicebot is, what it makes easier and how it differs from aiogram.", "html": "<p>nicebot is a Python library that makes writing Telegram bots as simple as possible. One import, one object and plain functions. A database, buttons, dialogs, translations, statistics and an admin panel are built in.<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Salom, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>This is a complete, working bot. There is no <code>Dispatcher<\/code>, no <code>Router<\/code> and no state classes, and the user is saved to the database automatically.<\/p><h2 id=\"why-nicebot\">Why nicebot?<a class=\"anchor\" href=\"#\" data-anchor=\"why-nicebot\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Let's compare a simple sign-up bot. First, aiogram:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import asyncio\nfrom aiogram import Bot, Dispatcher, F, Router\nfrom aiogram.filters import Command, CommandStart\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.fsm.state import State, StatesGroup\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import Message\n\nrouter = Router()\n\nclass Reg(StatesGroup):\n    name = State()\n    age = State()\n\n@router.message(CommandStart())\nasync def start(message: Message, state: FSMContext):\n    await state.set_state(Reg.name)\n    await message.answer(\"Ismingiz?\")\n\n@router.message(Reg.name)\nasync def got_name(message: Message, state: FSMContext):\n    await state.update_data(name=message.text)\n    await state.set_state(Reg.age)\n    await message.answer(\"Yoshingiz?\")\n\n@router.message(Reg.age)\nasync def got_age(message: Message, state: FSMContext):\n    if not message.text.isdigit():\n        await message.answer(\"Butun son kiriting.\")\n        return\n    data = await state.get_data()\n    await state.clear()\n    await message.answer(f\"{data['name']}, {message.text} yosh\")\n\nasync def main():\n    bot = Bot(\"TOKEN\")\n    dp = Dispatcher(storage=MemoryStorage())\n    dp.include_router(router)\n    await dp.start_polling(bot)\n\nasyncio.run(main())<\/code><\/pre><\/figure><p>The same bot in nicebot:<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"TOKEN\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    name = await ctx.ask(\"Ismingiz?\")\n    age = await ctx.ask(\"Yoshingiz?\", int)\n    await ctx.reply(f\"{name}, {age} yosh\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Ismingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:2\"><p>Ali<\/p><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Yoshingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:4\"><p>yigirma<\/p><\/div><div class=\"msg bot\" style=\"--i:5\"><p>Butun son kiriting.<\/p><\/div><div class=\"msg me\" style=\"--i:6\"><p>20<\/p><\/div><div class=\"msg bot\" style=\"--i:7\"><p>Ali, 20 yosh<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><p><code>ctx.ask()<\/code> asks a question and waits for the answer. Pass <code>int<\/code> and the bot politely asks again until it gets a number. You don't write a <code>StatesGroup<\/code>, and you don't store or clear any state.<\/p><h2 id=\"whats-inside\">What's inside<a class=\"anchor\" href=\"#\" data-anchor=\"whats-inside\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><ul><li><strong>Full Bot API 10.3:<\/strong> 403 types and 185 methods generated from the official specification<\/li><li><strong>Built-in ORM:<\/strong> one API for SQLite, PostgreSQL, MySQL and MongoDB, with automatic migrations<\/li><li><strong>Dialogs:<\/strong> <code>ask<\/code>, <code>confirm<\/code>, <code>choose<\/code>, <code>form<\/code> and ready-made validators<\/li><li><strong>Buttons:<\/strong> <code>on_click<\/code>, templates, toggles, expiring and one-time buttons, automatic layout<\/li><li><strong>Business:<\/strong> referrals, broadcasts, statistics, admin panel, required subscription, support, Telegram Stars<\/li><li><strong>Reliability:<\/strong> waits out flood limits, retries on network errors, loses no updates on restart<\/li><li><strong>Speed:<\/strong> msgspec types and a single connection pool<\/li><\/ul><p>The full list is on the <a href=\"#features\">50 features<\/a> page.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>nicebot is built on <code>async<\/code>. Every handler is an <code>async def<\/code>, and every call to Telegram is written with <code>await<\/code>.<\/p><\/aside>", "toc": [["why-nicebot", "Why nicebot?"], ["whats-inside", "What's inside"]], "text": "nicebot is a Python library that makes writing Telegram bots as simple as possible. One import, one object and plain functions. A database, buttons, dialogs, translations, statistics and an admin panel are built in. bot.py This is a complete, working bot. There is no Dispatcher , no Router and no state classes, and the user is saved to the database automatically. Why nicebot? Let's compare a simple sign-up bot. First, aiogram: bot.py The same bot in nicebot: bot.py ctx.ask() asks a question and waits for the answer. Pass int and the bot politely asks again until it gets a number. You don't write a StatesGroup , and you don't store or clear any state. What's inside Full Bot API 10.3: 403 types and 185 methods generated from the official specification Built-in ORM: one API for SQLite, PostgreSQL, MySQL and MongoDB, with automatic migrations Dialogs: ask , confirm , choose , form and ready-made validators Buttons: on_click , templates, toggles, expiring and one-time buttons, automatic layout Business: referrals, broadcasts, statistics, admin panel, required subscription, support, Telegram Stars Reliability: waits out flood limits, retries on network errors, loses no updates on restart Speed: msgspec types and a single connection pool The full list is on the 50 features page. nicebot is built on async . Every handler is an async def , and every call to Telegram is written with await .", "min": 2}, "install": {"title": "Installation", "desc": "Install the library and create a ready-made project with one command.", "html": "<p>You need Python 3.10 or newer.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">pip install nicebot                 # with SQLite\npip install \"nicebot[postgres]\"     # + PostgreSQL\npip install \"nicebot[mysql]\"        # + MySQL / MariaDB\npip install \"nicebot[mongo]\"        # + MongoDB\npip install \"nicebot[redis]\"        # + Redis\npip install \"nicebot[all]\"          # everything<\/code><\/pre><\/figure><p>The part in square brackets installs the driver for that database. SQLite works without extras.<\/p><h2 id=\"create-a-ready-made-project\">Create a ready-made project<a class=\"anchor\" href=\"#\" data-anchor=\"create-a-ready-made-project\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">nicebot new mybot\ncd mybot\npython bot.py<\/code><\/pre><\/figure><p>The command creates this layout:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">mybot/<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-plaintext\">mybot/\n├── bot.py            # main file\n├── .env              # BOT_TOKEN, DATABASE_URL, ADMINS\n├── handlers/\n│   └── basic.py      # handlers with a Router\n└── locales/\n    ├── uz.json\n    ├── ru.json\n    └── en.json<\/code><\/pre><\/figure><p>Open <code>.env<\/code> and replace <code>BOT_TOKEN<\/code> with the token @BotFather gave you.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">.env<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">BOT_TOKEN=123456:ABC-your-token\nDATABASE_URL=sqlite:///bot.db\nADMINS=123456789,987654321\nTZ=Asia/Tashkent<\/code><\/pre><\/figure><h2 id=\"check-the-version\">Check the version<a class=\"anchor\" href=\"#\" data-anchor=\"check-the-version\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>nicebot version<\/code> prints the library, Bot API and Python versions.<\/p>", "toc": [["create-a-ready-made-project", "Create a ready-made project"], ["check-the-version", "Check the version"]], "text": "You need Python 3.10 or newer. Terminal The part in square brackets installs the driver for that database. SQLite works without extras. Create a ready-made project Terminal The command creates this layout: mybot/ Open .env and replace BOT_TOKEN with the token @BotFather gave you. .env Check the version nicebot version prints the library, Bot API and Python versions.", "min": 1}, "first-bot": {"title": "Your first bot", "desc": "Get a token, write 6 lines and run them — about five minutes.", "html": "<h2 id=\"1-get-a-token\">1. Get a token<a class=\"anchor\" href=\"#\" data-anchor=\"1-get-a-token\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Open @BotFather in Telegram, send <code>/newbot<\/code>, then choose a name and a username. You'll get a token like <code>123456:ABC-DEF...<\/code>. Never share it.<\/p><h2 id=\"2-write-the-code\">2. Write the code<a class=\"anchor\" href=\"#\" data-anchor=\"2-write-the-code\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Create <code>bot.py<\/code>:<\/p><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/start<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Salom, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><h2 id=\"3-run-it\">3. Run it<a class=\"anchor\" href=\"#\" data-anchor=\"3-run-it\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Terminal<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">python bot.py<\/code><\/pre><\/figure><p>The terminal shows <code>✅ @your_bot ishga tushdi<\/code>. Send <code>/start<\/code> to your bot and it greets you by name.<\/p><h2 id=\"what-happened\">What happened?<a class=\"anchor\" href=\"#\" data-anchor=\"what-happened\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>Nicebot(token=...)<\/code><\/td><td>Creates the bot. Without <code>db<\/code>, an in-memory SQLite is used<\/td><\/tr><tr><td><code>@bot.command(\"start\")<\/code><\/td><td>Calls the function below when <code>/start<\/code> arrives<\/td><\/tr><tr><td><code>async def start(ctx)<\/code><\/td><td><code>ctx<\/code> knows everything about the current message<\/td><\/tr><tr><td><code>await ctx.reply(...)<\/code><\/td><td>Sends a reply to this chat<\/td><\/tr><tr><td><code>bot.start()<\/code><\/td><td>Starts receiving messages. Stop it with Ctrl+C<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>To keep data after a restart, write <code>Nicebot(token=..., db=\"sqlite:///bot.db\")<\/code>.<\/p><\/aside><h2 id=\"reload-on-code-changes\">Reload on code changes<a class=\"anchor\" href=\"#\" data-anchor=\"reload-on-code-changes\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>With <code>bot.start(reload=True)<\/code> the bot restarts itself every time you save a file, which is very handy during development.<\/p>", "toc": [["1-get-a-token", "1. Get a token"], ["2-write-the-code", "2. Write the code"], ["3-run-it", "3. Run it"], ["what-happened", "What happened?"], ["reload-on-code-changes", "Reload on code changes"]], "text": "1. Get a token Open @BotFather in Telegram, send /newbot , then choose a name and a username. You'll get a token like 123456:ABC-DEF... . Never share it. 2. Write the code Create bot.py : bot.py 3. Run it Terminal The terminal shows ✅ @your_bot ishga tushdi . Send /start to your bot and it greets you by name. What happened? Line Meaning Nicebot(token=...) Creates the bot. Without db , an in-memory SQLite is used @bot.command(\"start\") Calls the function below when /start arrives async def start(ctx) ctx knows everything about the current message await ctx.reply(...) Sends a reply to this chat bot.start() Starts receiving messages. Stop it with Ctrl+C To keep data after a restart, write Nicebot(token=..., db=\"sqlite:///bot.db\") . Reload on code changes With bot.start(reload=True) the bot restarts itself every time you save a file, which is very handy during development.", "min": 1}, "concepts": {"title": "Core concepts", "desc": "Bot, handler and ctx: the three core ideas of nicebot.", "html": "<p>nicebot has only three concepts.<\/p><h2 id=\"bot\">Bot<a class=\"anchor\" href=\"#\" data-anchor=\"bot\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Nicebot<\/code> is your whole application. The token, database, admins, language and other settings go here.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(\n    token=\"...\",\n    db=\"postgres://user:pass@localhost/mybot\",\n    admins=[123456789],\n    lang=\"uz\",                       # default language\n    required_channels=[\"@mykanal\"],  # required subscription\n    support_chat=-1001234567890,     # support group\n    captcha=\"2m\",                    # for new group members\n    tz=\"Asia/Tashkent\",\n)<\/code><\/pre><\/figure><h2 id=\"handler\">Handler<a class=\"anchor\" href=\"#\" data-anchor=\"handler\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>A handler is an <code>async<\/code> function that runs when something happens. The decorator says when: <code>@bot.command(\"start\")<\/code>, <code>@bot.text(\"salom\")<\/code>, <code>@bot.callback(\"buy:{id:int}\")<\/code> and so on. Handlers are checked in the order you declare them, and the first match runs.<\/p><h2 id=\"ctx-context\">ctx (context)<a class=\"anchor\" href=\"#\" data-anchor=\"ctx-context\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>A new <code>ctx<\/code> is created for every message and passed to the handler as the first argument. It does two jobs:<\/p><ul><li><strong>it gives you data:<\/strong> <code>ctx.text<\/code>, <code>ctx.user<\/code>, <code>ctx.chat_id<\/code>, <code>ctx.args<\/code>…<\/li><li><strong>it acts:<\/strong> <code>ctx.reply()<\/code>, <code>ctx.edit()<\/code>, <code>ctx.ask()<\/code>, <code>ctx.photo()<\/code>…<\/li><\/ul><h2 id=\"lifecycle\">Lifecycle<a class=\"anchor\" href=\"#\" data-anchor=\"lifecycle\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>When a message arrives, this happens:<\/p><ol><li>If the user is answering a <code>ctx.ask()<\/code>, the message goes there<\/li><li>Built-in middleware runs: the user is saved, maintenance mode and required subscription are checked<\/li><li>Your middleware runs<\/li><li>The first matching handler is called<\/li><li>If nothing matched, <code>@bot.fallback()<\/code> or support mode handles it<\/li><li>If a button was pressed and you didn't answer it, <code>answerCallbackQuery<\/code> is sent automatically<\/li><\/ol>", "toc": [["bot", "Bot"], ["handler", "Handler"], ["ctx-context", "ctx (context)"], ["lifecycle", "Lifecycle"]], "text": "nicebot has only three concepts. Bot Nicebot is your whole application. The token, database, admins, language and other settings go here. Python Handler A handler is an async function that runs when something happens. The decorator says when: @bot.command(\"start\") , @bot.text(\"salom\") , @bot.callback(\"buy:{id:int}\") and so on. Handlers are checked in the order you declare them, and the first match runs. ctx (context) A new ctx is created for every message and passed to the handler as the first argument. It does two jobs: it gives you data: ctx.text , ctx.user , ctx.chat_id , ctx.args … it acts: ctx.reply() , ctx.edit() , ctx.ask() , ctx.photo() … Lifecycle When a message arrives, this happens: If the user is answering a ctx.ask() , the message goes there Built-in middleware runs: the user is saved, maintenance mode and required subscription are checked Your middleware runs The first matching handler is called If nothing matched, @bot.fallback() or support mode handles it If a button was pressed and you didn't answer it, answerCallbackQuery is sent automatically", "min": 1}, "handlers": {"title": "Handlers", "desc": "Catch commands, text and other events; filters and Routers.", "html": "<h2 id=\"kinds\">Kinds<a class=\"anchor\" href=\"#\" data-anchor=\"kinds\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"help\", description=\"Yordam\")\nasync def help_(ctx):\n    await ctx.reply(\"Men nima qila olaman...\")\n\n@bot.text(\"salom\")                       # exact text (case-insensitive)\nasync def salom(ctx):\n    await ctx.reply(\"Va alaykum assalom!\")\n\n@bot.text(contains=\"narx\")               # if it contains \"narx\"\nasync def narx(ctx):\n    await ctx.reply(\"Narxlar: ...\")\n\n@bot.text(regex=r\"^buy (?P&lt;qty&gt;\\d+)$\")  # regex groups become parameters\nasync def buy(ctx, qty: int):\n    await ctx.reply(f\"{qty} dona\")\n\n@bot.on(\"photo\")                          # a photo arrived\nasync def photo(ctx):\n    await ctx.reply(\"Chiroyli rasm!\")\n\n@bot.text()                               # any plain text\nasync def echo(ctx):\n    await ctx.reply(ctx.text)\n\n@bot.fallback()                           # when nothing else matched\nasync def unknown(ctx):\n    await ctx.reply(\"Tushunmadim 🤔\")<\/code><\/pre><\/figure><h2 id=\"handler-options\">Handler options<a class=\"anchor\" href=\"#\" data-anchor=\"handler-options\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>You can add these options to any decorator:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"admin\", admin=True)              # admins only\n@bot.command(\"bonus\", throttle=\"1d\")           # once a day\n@bot.command(\"report\", typing=True)            # shows \"typing...\"\n@bot.text(\"salom\", chat=\"private\")             # private chats only\n@bot.text(state=\"waiting_phone\")               # only in this state\n@bot.command(\"vip\", users=[111, 222])          # only these people\n@bot.message(F.photo &amp; F.private)              # filters\n@bot.deep_link(r\"promo_(?P&lt;code&gt;\\w+)\")         # t.me/bot?start=promo_X\nasync def handler(ctx): ...<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Option<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td><code>admin=True<\/code><\/td><td>Only for <code>Nicebot(admins=[...])<\/code><\/td><\/tr><tr><td><code>chat=\"private\"<\/code><\/td><td><code>private<\/code>, <code>group<\/code>, <code>supergroup<\/code>, <code>channel<\/code><\/td><\/tr><tr><td><code>throttle=\"3s\"<\/code><\/td><td>Rate limit per user. When exceeded, shows \"⏳ Please wait\"<\/td><\/tr><tr><td><code>typing=True<\/code><\/td><td>Shows \"typing…\" while the handler runs. <code>\"upload_photo\"<\/code> works too<\/td><\/tr><tr><td><code>state=\"x\"<\/code><\/td><td>Only when the user is in this state<\/td><\/tr><tr><td><code>users=[...]<\/code><\/td><td>Only for these ids<\/td><\/tr><tr><td><code>description=\"...\"<\/code><\/td><td>The command appears in Telegram's menu. <code>{\"uz\": ..., \"ru\": ...}<\/code> also works<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"filters\">Filters<a class=\"anchor\" href=\"#\" data-anchor=\"filters\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>F<\/code> provides ready-made filters. Combine them with <code>&amp;<\/code> (and), <code>|<\/code> (or) and <code>~<\/code> (not).<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import F\n\n@bot.message(F.photo | F.document)\n@bot.message(F.text &amp; ~F.command)\n@bot.message(F.regex(r\"\\d{4}\"))\n@bot.message(F.contains(\"chegirma\", \"aksiya\"))\n@bot.message(F.user(123, 456))\n@bot.message(lambda ctx: len(ctx.text or \"\") &gt; 100)   # your own filter\nasync def h(ctx): ...<\/code><\/pre><\/figure><h2 id=\"router-split-code-into-files\">Router: split code into files<a class=\"anchor\" href=\"#\" data-anchor=\"router-split-code-into-files\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># handlers/shop.py\nfrom nicebot import Router\n\nrouter = Router(chat=\"private\")   # applies to every handler\n\n@router.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Do'kon\")\n\n# bot.py\nbot.include(\"handlers\")           # every Router in the folder\n# or: from handlers.shop import router; bot.include(router)<\/code><\/pre><\/figure><h2 id=\"all-event-kinds\">All event kinds<a class=\"anchor\" href=\"#\" data-anchor=\"all-event-kinds\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>@bot.callback<\/code>, <code>@bot.inline<\/code>, <code>@bot.chosen_inline<\/code>, <code>@bot.edited<\/code>, <code>@bot.channel<\/code>, <code>@bot.join<\/code>, <code>@bot.leave<\/code>, <code>@bot.album<\/code>, <code>@bot.paid<\/code>, <code>@bot.pre_checkout<\/code>, <code>@bot.webapp_data<\/code>, <code>@bot.my_chat_member<\/code>, <code>@bot.chat_member<\/code>, <code>@bot.join_request<\/code>, <code>@bot.reaction<\/code>, <code>@bot.poll_answer<\/code>. For any other update: <code>@bot.event(\"chat_boost\")<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p><code>raise SkipHandler<\/code> inside a handler lets the next matching handler run.<\/p><\/aside>", "toc": [["kinds", "Kinds"], ["handler-options", "Handler options"], ["filters", "Filters"], ["router-split-code-into-files", "Router: split code into files"], ["all-event-kinds", "All event kinds"]], "text": "Kinds Python Handler options You can add these options to any decorator: Python Option What it does admin=True Only for Nicebot(admins=[...]) chat=\"private\" private , group , supergroup , channel throttle=\"3s\" Rate limit per user. When exceeded, shows \"⏳ Please wait\" typing=True Shows \"typing…\" while the handler runs. \"upload_photo\" works too state=\"x\" Only when the user is in this state users=[...] Only for these ids description=\"...\" The command appears in Telegram's menu. {\"uz\": ..., \"ru\": ...} also works Filters F provides ready-made filters. Combine them with & (and), | (or) and ~ (not). Python Router: split code into files Python All event kinds @bot.callback , @bot.inline , @bot.chosen_inline , @bot.edited , @bot.channel , @bot.join , @bot.leave , @bot.album , @bot.paid , @bot.pre_checkout , @bot.webapp_data , @bot.my_chat_member , @bot.chat_member , @bot.join_request , @bot.reaction , @bot.poll_answer . For any other update: @bot.event(\"chat_boost\") . raise SkipHandler inside a handler lets the next matching handler run.", "min": 2}, "ctx": {"title": "ctx: the context", "desc": "Data about the incoming message, sending replies and editing.", "html": "<h2 id=\"data\">Data<a class=\"anchor\" href=\"#\" data-anchor=\"data\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.message()\nasync def info(ctx):\n    ctx.text        # message text (or caption)\n    ctx.name        # user's first name\n    ctx.user        # user row from the database (saved automatically)\n    ctx.user_id     # Telegram id\n    ctx.chat_id     # chat id\n    ctx.command     # \"/start ref_5\" -&gt; \"start\"\n    ctx.args        # \"/give 10 ali\" -&gt; [\"10\", \"ali\"]\n    ctx.payload     # deep link: \"ref_5\"\n    ctx.lang        # \"uz\", \"ru\", \"en\"\n    ctx.is_private  # private chat?\n    ctx.is_admin    # bot admin?\n    ctx.message     # the full Message object\n    ctx.mention     # clickable name (HTML)<\/code><\/pre><\/figure><h2 id=\"sending\">Sending<a class=\"anchor\" href=\"#\" data-anchor=\"sending\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Salom!\")                          # text\nawait ctx.reply(\"Tanlang\", buttons=[\"A\", \"B\"])    # with inline buttons\nawait ctx.reply(\"Yozing\", keyboard=[\"Menyu\"])     # bottom keyboard\nawait ctx.reply(\"30 soniyada o'chadi\", delete_after=\"30s\")\nawait ctx.reply(\"Ovozsiz\", silent=True, protect=True)\n\nawait ctx.photo(\"rasm.jpg\", caption=\"Mana\")       # file, URL or file_id\nawait ctx.video(\"https://site.uz/v.mp4\")\nawait ctx.document(\"hisobot.pdf\")\nawait ctx.media_group([\"1.jpg\", \"2.jpg\", \"3.jpg\"], caption=\"Albom\")\nawait ctx.location(40.10, 65.37)\nawait ctx.poll(\"Qaysi biri?\", [\"Python\", \"Go\"])\nawait ctx.dice(\"🎯\")<\/code><\/pre><\/figure><p>Every send method accepts the same extra options:<\/p><div class=\"table\"><table><thead><tr><th>Option<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>buttons=<\/code><\/td><td>Inline buttons (<a href=\"#buttons\">Buttons<\/a>)<\/td><\/tr><tr><td><code>keyboard=<\/code><\/td><td>Bottom keyboard. <code>False<\/code> closes it<\/td><\/tr><tr><td><code>columns=<\/code><\/td><td>Number of button columns<\/td><\/tr><tr><td><code>delete_after=\"1m\"<\/code><\/td><td>Delete the message automatically<\/td><\/tr><tr><td><code>silent=True<\/code><\/td><td>No notification sound<\/td><\/tr><tr><td><code>protect=True<\/code><\/td><td>Disallow forwarding and saving<\/td><\/tr><tr><td><code>quote=True<\/code><\/td><td>Reply to the incoming message<\/td><\/tr><tr><td><code>preview=False<\/code><\/td><td>Disable link previews<\/td><\/tr><tr><td><code>chat_id=<\/code><\/td><td>Send to another chat<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"editing-and-answering\">Editing and answering<a class=\"anchor\" href=\"#\" data-anchor=\"editing-and-answering\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.edit(\"Yangi matn\")               # edit the message whose button was pressed\nawait ctx.edit_buttons([Button(\"OK\", data=\"ok\")])\nawait ctx.respond(\"Javob\")                 # edits after a button press, sends otherwise\nawait ctx.answer(\"Saqlandi ✅\")             # small toast above the button\nawait ctx.answer(\"Diqqat!\", alert=True)    # as a dialog\nawait ctx.delete()                          # delete the message\nawait ctx.react(\"🔥\")                       # reaction\nawait ctx.pin()<\/code><\/pre><\/figure><p><code>ctx.edit()<\/code> picks what to edit by itself: the caption when the message has media, otherwise the text. It quietly ignores \"message is not modified\".<\/p><h2 id=\"more-useful-methods\">More useful methods<a class=\"anchor\" href=\"#\" data-anchor=\"more-useful-methods\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><thead><tr><th>Method<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td><code>ctx.forward(chat)<\/code> / <code>ctx.copy(chat)<\/code><\/td><td>Send the message to another chat<\/td><\/tr><tr><td><code>ctx.download()<\/code> / <code>ctx.save(path)<\/code><\/td><td>Download a file<\/td><\/tr><tr><td><code>ctx.action(\"upload_photo\")<\/code><\/td><td>Show a status<\/td><\/tr><tr><td><code>ctx.is_member(\"@kanal\")<\/code><\/td><td>Check a subscription<\/td><\/tr><tr><td><code>ctx.notify_admins(text)<\/code><\/td><td>Message the admins<\/td><\/tr><tr><td><code>ctx.background(func)<\/code><\/td><td>Background task<\/td><\/tr><tr><td><code>ctx.t(\"key\")<\/code><\/td><td>Translation<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["data", "Data"], ["sending", "Sending"], ["editing-and-answering", "Editing and answering"], ["more-useful-methods", "More useful methods"]], "text": "Data Python Sending Python Every send method accepts the same extra options: Option Meaning buttons= Inline buttons ( Buttons ) keyboard= Bottom keyboard. False closes it columns= Number of button columns delete_after=\"1m\" Delete the message automatically silent=True No notification sound protect=True Disallow forwarding and saving quote=True Reply to the incoming message preview=False Disable link previews chat_id= Send to another chat Editing and answering Python ctx.edit() picks what to edit by itself: the caption when the message has media, otherwise the text. It quietly ignores \"message is not modified\". More useful methods Method What it does ctx.forward(chat) / ctx.copy(chat) Send the message to another chat ctx.download() / ctx.save(path) Download a file ctx.action(\"upload_photo\") Show a status ctx.is_member(\"@kanal\") Check a subscription ctx.notify_admins(text) Message the admins ctx.background(func) Background task ctx.t(\"key\") Translation", "min": 1}, "formatting": {"title": "Text formatting", "desc": "HTML formatting and inserting user text safely.", "html": "<p>By default nicebot uses HTML parse mode, so <code>&lt;b&gt;<\/code>, <code>&lt;i&gt;<\/code>, <code>&lt;code&gt;<\/code> and <code>&lt;a href&gt;<\/code> tags work right away.<\/p><h2 id=\"handling-user-text-safely\">Handling user text safely<a class=\"anchor\" href=\"#\" data-anchor=\"handling-user-text-safely\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>User text may contain <code>&lt;<\/code> or <code>&amp;<\/code>. If you insert it directly, Telegram returns an error. <code>html()<\/code> escapes the values and leaves the template untouched:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import html, bold, link, mention\n\nname = ctx.text                                 # text typed by the user\nawait ctx.reply(html(\"&lt;b&gt;Salom, {}!&lt;/b&gt;\", name))  # name is safely escaped\nawait ctx.reply(bold(\"Muhim\") + \" xabar\")\nawait ctx.reply(link(\"Saytimiz\", \"https://tezbaraka.uz\"))<\/code><\/pre><\/figure><p>Ready helpers: <code>bold<\/code>, <code>italic<\/code>, <code>underline<\/code>, <code>strike<\/code>, <code>spoiler<\/code>, <code>code<\/code>, <code>pre<\/code>, <code>link<\/code>, <code>mention<\/code>, <code>quote<\/code>, <code>escape<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Even if the markup is broken, the bot doesn't crash. nicebot resends the message without formatting and logs a warning.<\/p><\/aside><h2 id=\"other-modes\">Other modes<a class=\"anchor\" href=\"#\" data-anchor=\"other-modes\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Nicebot(parse_mode=\"MarkdownV2\")<\/code>, or <code>parse_mode=None<\/code> to send plain text.<\/p>", "toc": [["handling-user-text-safely", "Handling user text safely"], ["other-modes", "Other modes"]], "text": "By default nicebot uses HTML parse mode, so <b> , <i> , <code> and <a href> tags work right away. Handling user text safely User text may contain < or & . If you insert it directly, Telegram returns an error. html() escapes the values and leaves the template untouched: Python Ready helpers: bold , italic , underline , strike , spoiler , code , pre , link , mention , quote , escape . Even if the markup is broken, the bot doesn't crash. nicebot resends the message without formatting and logs a warning. Other modes Nicebot(parse_mode=\"MarkdownV2\") , or parse_mode=None to send plain text.", "min": 1}, "buttons": {"title": "Inline buttons", "desc": "Inline buttons: on_click, parameters, templates and auto layout.", "html": "<h2 id=\"a-button-and-its-action\">A button and its action<a class=\"anchor\" href=\"#\" data-anchor=\"a-button-and-its-action\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Button<\/code> takes a label and one action. The most convenient is <code>on_click<\/code>: pressing the button calls a plain function. You don't invent callback data or catch it in a separate handler.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from
