nicebot import Button\n\nasync def buy(ctx):\n    await ctx.edit(\"✅ Sotib olindi\")\n\n@bot.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Mahsulot: Kitob — 50 000 so'm\", buttons=[\n        [Button(\"🛒 Sotib olish\", on_click=buy)],\n        [Button(\"🌐 Sayt\", url=\"https://tezbaraka.uz\"),\n         Button(\"📋 Promo\", copy=\"NICE2026\")],\n        [Button(\"📱 Ilova\", webapp=\"https://app.tezbaraka.uz\")],\n    ])<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/shop<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Mahsulot: Kitob — 50 000 so'm<\/p><div class=\"kb\"><div class=\"kb-row\"><span>🛒 Sotib olish<\/span><\/div><div class=\"kb-row\"><span>🌐 Sayt ↗<\/span><span>📋 Promo<\/span><\/div><div class=\"kb-row\"><span>📱 Ilova<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 🛒 Sotib olish<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>✅ Sotib olindi <i class=\"edited\" data-t=\"edited\"><\/i><\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><div class=\"table\"><table><thead><tr><th>Kind<\/th><th>Syntax<\/th><\/tr><\/thead><tbody><tr><td>Function<\/td><td><code>Button(\"OK\", on_click=func)<\/code><\/td><\/tr><tr><td>Link<\/td><td><code>Button(\"Site\", url=\"https://...\")<\/code><\/td><\/tr><tr><td>Mini App<\/td><td><code>Button(\"App\", webapp=\"https://...\")<\/code><\/td><\/tr><tr><td>Copy<\/td><td><code>Button(\"Code\", copy=\"PROMO\")<\/code><\/td><\/tr><tr><td>Share<\/td><td><code>Button(\"Share\", share=\"text\")<\/code><\/td><\/tr><tr><td>Plain data<\/td><td><code>Button(\"Yes\", data=\"yes\")<\/code><\/td><\/tr><tr><td>Payment<\/td><td><code>Button(\"Pay\", pay=True)<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"passing-parameters\">Passing parameters<a class=\"anchor\" href=\"#\" data-anchor=\"passing-parameters\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async def add_to_cart(ctx, id: int, qty: int):\n    await ctx.answer(f\"{id} dan {qty} ta qo'shildi\")\n\nButton(\"➕ Savatga\", on_click=add_to_cart, id=15, qty=2)<\/code><\/pre><\/figure><h2 id=\"callback-templates\">Callback templates<a class=\"anchor\" href=\"#\" data-anchor=\"callback-templates\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.callback(\"product:{id:int}\")\nasync def product(ctx, id: int):\n    p = await Product.get(id=id)\n    await ctx.edit(f\"{p.title} — {p.price} so'm\")\n\n# the button fills the template itself:\nButton(\"Ko'rish\", on_click=product, id=5)      # callback_data = \"product:5\"<\/code><\/pre><\/figure><p>Types: <code>int<\/code>, <code>float<\/code>, <code>bool<\/code>, <code>str<\/code> (default) and <code>any<\/code>. Values reach the handler with the right type.<\/p><h2 id=\"automatic-layout\">Automatic layout<a class=\"anchor\" href=\"#\" data-anchor=\"automatic-layout\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># a list: short buttons share a row by themselves\nawait ctx.reply(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\", \"XL\"])\n\n# or set the number of columns\nawait ctx.reply(\"Tanlang\", buttons=items, columns=2)\n\n# dict: label -&gt; action (function, URL or data)\nawait ctx.reply(\"Menyu\", buttons={\"Profil\": profile, \"Sayt\": \"https://tezbaraka.uz\"})<\/code><\/pre><\/figure><h2 id=\"protected-buttons\">Protected buttons<a class=\"anchor\" href=\"#\" data-anchor=\"protected-buttons\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Button(\"🎁 Bonus olish\", on_click=bonus, once=True)          # only once\nButton(\"⏳ Taklif\", on_click=offer, ttl=\"10m\")              # expires after 10 minutes\nButton(\"👤 Faqat siz\", on_click=mine, only=ctx.user_id)     # nobody else can press it<\/code><\/pre><\/figure><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Telegram limits callback_data to 64 bytes. nicebot stores longer data in the database and puts a short key on the button, so you never notice the limit. Button presses are also answered automatically, so the loading clock never hangs.<\/p><\/aside>", "toc": [["a-button-and-its-action", "A button and its action"], ["passing-parameters", "Passing parameters"], ["callback-templates", "Callback templates"], ["automatic-layout", "Automatic layout"], ["protected-buttons", "Protected buttons"]], "text": "A button and its action Button takes a label and one action. The most convenient is on_click : pressing the button calls a plain function. You don't invent callback data or catch it in a separate handler. bot.py Kind Syntax Function Button(\"OK\", on_click=func) Link Button(\"Site\", url=\"https://...\") Mini App Button(\"App\", webapp=\"https://...\") Copy Button(\"Code\", copy=\"PROMO\") Share Button(\"Share\", share=\"text\") Plain data Button(\"Yes\", data=\"yes\") Payment Button(\"Pay\", pay=True) Passing parameters Python Callback templates Python Types: int , float , bool , str (default) and any . Values reach the handler with the right type. Automatic layout Python Protected buttons Python Telegram limits callback_data to 64 bytes. nicebot stores longer data in the database and puts a short key on the button, so you never notice the limit. Button presses are also answered automatically, so the loading clock never hangs.", "min": 1}, "keyboards": {"title": "Keyboards and toggles", "desc": "Reply keyboards, contact and location buttons, Toggle settings.", "html": "<h2 id=\"bottom-reply-keyboard\">Bottom (reply) keyboard<a class=\"anchor\" href=\"#\" data-anchor=\"bottom-reply-keyboard\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Raqamingizni yuboring\", keyboard=[\"📞 Raqam yuborish:contact\"])\nawait ctx.reply(\"Qayerdasiz?\", keyboard=[\"📍 Joylashuv:location\"])\nawait ctx.reply(\"Menyu\", keyboard=[\"🛍 Do'kon\", \"📞 Aloqa\", \"ℹ️ Haqida\"], columns=2)\nawait ctx.reply(\"Yopildi\", remove_keyboard=True)<\/code><\/pre><\/figure><p>The <code>:contact<\/code> suffix makes a button that asks for the phone number, and <code>:location<\/code> asks for the location. For more complex cases there is <code>ReplyButton(\"...\", webapp=...)<\/code>.<\/p><h2 id=\"toggle-switch-on-and-off\">Toggle: switch on and off<a class=\"anchor\" href=\"#\" data-anchor=\"toggle-switch-on-and-off\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>For settings menus. Pressing the button swaps ✅ and ⬜️ by itself, and the value is saved for each user.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Toggle\n\n@bot.command(\"sozlamalar\")\nasync def settings_menu(ctx):\n    await ctx.reply(\"⚙️ Sozlamalar\", buttons=[\n        [Toggle(\"Bildirishnomalar\", key=\"notify\", default=True)],\n        [Toggle(\"Kechki rejim\", key=\"night\")],\n    ])\n\n# read the value anywhere:\nif await ctx.setting(\"notify\"):\n    ...<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/sozlamalar<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>⚙️ Sozlamalar<\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Bildirishnomalar<\/span><\/div><div class=\"kb-row\"><span>⬜️ Kechki rejim<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 ⬜️ Kechki rejim<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>⚙️ Sozlamalar <i class=\"edited\" data-t=\"edited\"><\/i><\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Bildirishnomalar<\/span><\/div><div class=\"kb-row\"><span>✅ Kechki rejim<\/span><\/div><\/div><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>To react to a change right away, write <code>Toggle(..., on_change=func)<\/code>, and <code>func(ctx, value)<\/code> is called.<\/p>", "toc": [["bottom-reply-keyboard", "Bottom (reply) keyboard"], ["toggle-switch-on-and-off", "Toggle: switch on and off"]], "text": "Bottom (reply) keyboard Python The :contact suffix makes a button that asks for the phone number, and :location asks for the location. For more complex cases there is ReplyButton(\"...\", webapp=...) . Toggle: switch on and off For settings menus. Pressing the button swaps ✅ and ⬜️ by itself, and the value is saved for each user. bot.py To react to a change right away, write Toggle(..., on_change=func) , and func(ctx, value) is called.", "min": 1}, "conversations": {"title": "Dialogs", "desc": "ask, confirm, choose and form — dialogs without FSM classes.", "html": "<p>This is the biggest convenience in nicebot. You ask a question and wait for the answer inside the same function.<\/p><h2 id=\"ask\">ask<a class=\"anchor\" href=\"#\" data-anchor=\"ask\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date\n\n@bot.command(\"register\")\nasync def register(ctx):\n    name  = await ctx.ask(\"Ismingiz?\")\n    age   = await ctx.ask(\"Yoshingiz?\", int)        # asks again until it's a number\n    phone = await ctx.ask(\"Raqamingiz?\", Phone)     # with a \"Share phone\" button\n    size  = await ctx.ask(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\"])\n    await ctx.reply(f\"Rahmat, {name}!\")<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/register<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Ismingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:2\"><p>Ali<\/p><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Yoshingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:4\"><p>20<\/p><\/div><div class=\"msg bot\" style=\"--i:5\"><p>Raqamingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:6\"><p>90 123 45 67<\/p><\/div><div class=\"msg bot\" style=\"--i:7\"><p>O'lcham?<\/p><div class=\"kb\"><div class=\"kb-row\"><span>S<\/span><span>M<\/span><span>L<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:8\"><span>👆 M<\/span><\/div><div class=\"msg bot\" style=\"--i:9\"><p>Rahmat, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><ul><li>If the user sends <code>/cancel<\/code> or presses \"🚫 Cancel\", the dialog ends quietly<\/li><li>After 10 minutes without an answer, \"⌛️ Time is up\" is shown. Change it with <code>timeout=\"5m\"<\/code><\/li><li>A wrong value shows a clear error and the question is asked again. Set the number of attempts with <code>retries=<\/code><\/li><\/ul><h2 id=\"confirm\">confirm<a class=\"anchor\" href=\"#\" data-anchor=\"confirm\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">if await ctx.confirm(\"Buyurtmani tasdiqlaysizmi?\"):\n    await ctx.reply(\"✅ Qabul qilindi\")\nelse:\n    await ctx.reply(\"Bekor qilindi\")<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg bot\" style=\"--i:0\"><p>Buyurtmani tasdiqlaysizmi?<\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Ha<\/span><span>❌ Yo'q<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:1\"><span>👆 ✅ Ha<\/span><\/div><div class=\"msg bot\" style=\"--i:2\"><p>✅ Qabul qilindi<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><h2 id=\"choose\">choose<a class=\"anchor\" href=\"#\" data-anchor=\"choose\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">city = await ctx.choose(\"Shahringiz?\", [\"Toshkent\", \"Navoiy\", \"Buxoro\"])\n\ntags = await ctx.choose(\n    \"Qiziqishlaringiz?\",\n    {\"⚽️ Sport\": \"sport\", \"🎵 Musiqa\": \"music\", \"💻 IT\": \"it\"},\n    multiple=True,       # tick ✅/⬜️ and press \"Done\"\n)                        # -&gt; [\"sport\", \"it\"]<\/code><\/pre><\/figure><h2 id=\"form-several-questions-in-a-row\">form: several questions in a row<a class=\"anchor\" href=\"#\" data-anchor=\"form-several-questions-in-a-row\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date, Integer\n\ndata = await ctx.form(\n    name=\"Ismingiz?\",\n    age=Integer(\"Yoshingiz?\", min=14, max=99),\n    phone=Phone(\"Telefon raqamingiz?\"),\n    email=Email(\"Email manzilingiz?\"),\n    birthday=Date(\"Tug'ilgan kuningiz? (KK.OO.YYYY)\"),\n)\nawait ctx.reply(f\"{data.name}, {data.phone}\")<\/code><\/pre><\/figure><p>The result of <code>form<\/code> is a <code>dict<\/code>, and you can also read fields with a dot: <code>data.name<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>You can run dialogs with thousands of users at once. Each one waits in its own handler and doesn't block the others.<\/p><\/aside>", "toc": [["ask", "ask"], ["confirm", "confirm"], ["choose", "choose"], ["form-several-questions-in-a-row", "form: several questions in a row"]], "text": "This is the biggest convenience in nicebot. You ask a question and wait for the answer inside the same function. ask bot.py If the user sends /cancel or presses \"🚫 Cancel\", the dialog ends quietly After 10 minutes without an answer, \"⌛️ Time is up\" is shown. Change it with timeout=\"5m\" A wrong value shows a clear error and the question is asked again. Set the number of attempts with retries= confirm bot.py choose Python form: several questions in a row Python The result of form is a dict , and you can also read fields with a dot: data.name . You can run dialogs with thousands of users at once. Each one waits in its own handler and doesn't block the others.", "min": 1}, "validators": {"title": "Validators", "desc": "Validate phone numbers, emails, dates, numbers and more.", "html": "<p>A validator checks the user's answer and turns it into a clean value.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Text, Integer, Number, Phone, Email, Url, Date, Choice, Regex, Photo, File, Location\n\nawait ctx.ask(\"Izoh?\", Text(min=10, max=500))\nawait ctx.ask(\"Summa?\", Number(min=1000))\nawait ctx.ask(\"Rasm yuboring\", Photo)              # -&gt; PhotoSize (has file_id)\nawait ctx.ask(\"Pasport seriyasi?\", Regex(r\"[A-Z]{2}\\d{7}\"))\nawait ctx.ask(\"Kod?\", lambda t: t.upper())         # your own function<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Validator<\/th><th>Returns<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td><code>Text(min=, max=)<\/code><\/td><td><code>str<\/code><\/td><td>Length limits<\/td><\/tr><tr><td><code>Integer(min=, max=)<\/code> / <code>int<\/code><\/td><td><code>int<\/code><\/td><td>Understands spaces: <code>1 000 000<\/code><\/td><\/tr><tr><td><code>Number<\/code> / <code>float<\/code><\/td><td><code>float<\/code><\/td><td>Accepts a comma: <code>12,5<\/code><\/td><\/tr><tr><td><code>Phone<\/code><\/td><td><code>\"+998901234567\"<\/code><\/td><td>Contact button. Checks Uzbek operator codes<\/td><\/tr><tr><td><code>Email<\/code><\/td><td><code>str<\/code><\/td><td>Lowercased<\/td><\/tr><tr><td><code>Url<\/code><\/td><td><code>str<\/code><\/td><td>Must start with <code>https://<\/code><\/td><\/tr><tr><td><code>Date(format=)<\/code><\/td><td><code>date<\/code><\/td><td>Default format: <code>DD.MM.YYYY<\/code><\/td><\/tr><tr><td><code>Choice(choices=)<\/code><\/td><td><code>str<\/code><\/td><td>Shows the options as buttons<\/td><\/tr><tr><td><code>Regex(pattern)<\/code><\/td><td><code>str<\/code><\/td><td><\/td><\/tr><tr><td><code>Photo<\/code> / <code>File<\/code><\/td><td>media object<\/td><td>Has <code>.file_id<\/code><\/td><\/tr><tr><td><code>Location<\/code><\/td><td><code>Location<\/code><\/td><td>Location button<\/td><\/tr><\/tbody><\/table><\/div><p>Phone numbers can be typed in any form: <code>90 123 45 67<\/code>, <code>+998 (90) 123-45-67<\/code> or <code>8 90 1234567<\/code>. The result is always <code>+998901234567<\/code>.<\/p>", "toc": [], "text": "A validator checks the user's answer and turns it into a clean value. Python Validator Returns Notes Text(min=, max=) str Length limits Integer(min=, max=) / int int Understands spaces: 1 000 000 Number / float float Accepts a comma: 12,5 Phone \"+998901234567\" Contact button. Checks Uzbek operator codes Email str Lowercased Url str Must start with https:// Date(format=) date Default format: DD.MM.YYYY Choice(choices=) str Shows the options as buttons Regex(pattern) str Photo / File media object Has .file_id Location Location Location button Phone numbers can be typed in any form: 90 123 45 67 , +998 (90) 123-45-67 or 8 90 1234567 . The result is always +998901234567 .", "min": 1}, "state": {"title": "State", "desc": "State stored in the database for flows that last for days.", "html": "<p>Most of the time <code>ctx.ask()<\/code> is enough. Use state when a user stays on one step for a long time, for example several days. State is stored in the database and survives restarts.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"feedback\")\nasync def feedback(ctx):\n    await ctx.set_state(\"feedback\", step=1)\n    await ctx.reply(\"Fikringizni yozing:\")\n\n@bot.text(state=\"feedback\")\nasync def got_feedback(ctx, text):\n    data = await ctx.state_data()      # {\"step\": 1}\n    await ctx.clear_state()\n    await ctx.reply(\"Rahmat!\")<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Method<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>await ctx.set_state(\"name\", **data)<\/code><\/td><td>Set the state<\/td><\/tr><tr><td><code>await ctx.get_state()<\/code><\/td><td>Current state or <code>None<\/code><\/td><\/tr><tr><td><code>await ctx.state_data()<\/code><\/td><td>Saved data<\/td><\/tr><tr><td><code>await ctx.update_data(**data)<\/code><\/td><td>Add data<\/td><\/tr><tr><td><code>await ctx.clear_state()<\/code><\/td><td>Clear<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [], "text": "Most of the time ctx.ask() is enough. Use state when a user stays on one step for a long time, for example several days. State is stored in the database and survives restarts. Python Method Meaning await ctx.set_state(\"name\", **data) Set the state await ctx.get_state() Current state or None await ctx.state_data() Saved data await ctx.update_data(**data) Add data await ctx.clear_state() Clear", "min": 1}, "menus": {"title": "Menus and pagination", "desc": "Multi-level menus and paginating long lists.", "html": "<h2 id=\"multi-level-menu\">Multi-level menu<a class=\"anchor\" href=\"#\" data-anchor=\"multi-level-menu\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>You describe the menu as a dictionary. Navigation and the \"⬅️ Back\" button work automatically, and the message is edited in place instead of sending a new one.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Menu\n\nmain = Menu(\"🏠 Bosh menyu\", {\n    \"🛍 Do'kon\": Menu(\"Bo'limni tanlang\", {\n        \"👕 Kiyim\": \"Kiyimlar tez orada qo'shiladi\",\n        \"📚 Kitoblar\": show_books,        # a function is called\n    }),\n    \"📞 Aloqa\": \"+998 90 123 45 67\",\n    \"🌐 Sayt\": \"https://tezbaraka.uz\",\n})\n\n@bot.command(\"menu\")\nasync def menu(ctx):\n    await ctx.menu(main)    # \"⬅️ Back\" is added for you<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/menu<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>🏠 Bosh menyu<\/p><div class=\"kb\"><div class=\"kb-row\"><span>🛍 Do'kon<\/span><span>📞 Aloqa<\/span><span>🌐 Sayt ↗<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 🛍 Do'kon<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Bo'limni tanlang <i class=\"edited\" data-t=\"edited\"><\/i><\/p><div class=\"kb\"><div class=\"kb-row\"><span>👕 Kiyim<\/span><span>📚 Kitoblar<\/span><\/div><div class=\"kb-row\"><span>⬅️ Orqaga<\/span><\/div><\/div><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>Value types: text (shown), <code>Menu<\/code> or <code>dict<\/code> (a submenu), a function (called), a URL (a link button) or a <code>Button<\/code>.<\/p><h2 id=\"pagination\">Pagination<a class=\"anchor\" href=\"#\" data-anchor=\"pagination\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Splits a long list into pages with ◀️ 2/5 ▶️ buttons.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">products = await Product.all().order_by(\"title\")\nawait ctx.paginate(\n    products,\n    per_page=10,\n    title=\"📦 Mahsulotlar\",\n    render=lambda p, i: f\"{i + 1}. {p.title} — {p.price} so'm\",\n)\n# buttons can be paginated too:\nawait ctx.paginate([Button(p.title, on_click=open_product, id=p.id) for p in products], columns=2)<\/code><\/pre><\/figure>", "toc": [["multi-level-menu", "Multi-level menu"], ["pagination", "Pagination"]], "text": "Multi-level menu You describe the menu as a dictionary. Navigation and the \"⬅️ Back\" button work automatically, and the message is edited in place instead of sending a new one. bot.py Value types: text (shown), Menu or dict (a submenu), a function (called), a URL (a link button) or a Button . Pagination Splits a long list into pages with ◀️ 2/5 ▶️ buttons. Python", "min": 1}, "database": {"title": "Database (ORM)", "desc": "One ORM for SQLite, PostgreSQL, MySQL and MongoDB.", "html": "<p>nicebot has its own ORM. The same code runs on SQLite, PostgreSQL, MySQL/MariaDB and MongoDB, and all four are covered by automated tests.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Nicebot(db=\"sqlite:///bot.db\")\nNicebot(db=\"postgres://user:pass@localhost:5432/mybot\")\nNicebot(db=\"mysql://user:pass@localhost:3306/mybot\")\nNicebot(db=\"mongodb://localhost:27017/mybot\")<\/code><\/pre><\/figure><h2 id=\"model\">Model<a class=\"anchor\" href=\"#\" data-anchor=\"model\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Model, fields\n\nclass Product(Model):\n    title = fields.Str(120)\n    price = fields.Int(default=0)\n    active = fields.Bool(default=True)\n    tags = fields.JSON(default=list)\n    created = fields.DateTime(auto_now_add=True)\n\nclass Order(Model):\n    user = fields.ForeignKey(\"User\")\n    product = fields.ForeignKey(Product)\n    qty = fields.Int(default=1)<\/code><\/pre><\/figure><p>Fields: <code>Int<\/code>, <code>BigInt<\/code>, <code>Float<\/code>, <code>Str(max_length)<\/code>, <code>Text<\/code>, <code>Bool<\/code>, <code>DateTime(auto_now_add=, auto_now=)<\/code>, <code>Date<\/code>, <code>JSON<\/code> and <code>ForeignKey<\/code>. Common options: <code>default=<\/code>, <code>null=<\/code>, <code>unique=<\/code>, <code>index=<\/code> and <code>choices=<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p><strong>Automatic migrations:<\/strong> tables are created when the bot starts. Add a new field to a model and the column is added by itself. Your data is never dropped.<\/p><\/aside><h2 id=\"create-read-update-delete\">Create, read, update, delete<a class=\"anchor\" href=\"#\" data-anchor=\"create-read-update-delete\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">p = await Product.create(title=\"Kitob\", price=50_000)\n\np = await Product.get(id=1)              # DoesNotExist if missing\np = await Product.get_or_none(title=\"X\") # None if missing\nuser, created = await User.get_or_create(id=5, defaults={\"first_name\": \"Ali\"})\n\np.price = 45_000\nawait p.save()\nawait p.update(price=40_000)            # only this field\nawait p.increment(\"price\", 1000)\nawait p.delete()<\/code><\/pre><\/figure><h2 id=\"queries\">Queries<a class=\"anchor\" href=\"#\" data-anchor=\"queries\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">cheap = await Product.filter(price__lt=100_000, active=True).order_by(\"price\")\ncount = await Product.filter(title__icontains=\"kitob\").count()\nlast5 = await Product.all().order_by(\"-created\").limit(5)\npage2 = await Product.all().page(2, 10)\ntitles = await Product.all().values_list(\"title\")\ntotal = await Order.filter(user=ctx.user).sum(\"qty\")\n\nfrom nicebot import Q, Col\nawait Product.filter(Q(price__gt=1_000_000) | Q(active=False))\nawait User.filter(id=5).update(balance=Col(\"balance\") + 1000)<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Lookup<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>price=5<\/code><\/td><td>equals<\/td><\/tr><tr><td><code>price__ne=5<\/code><\/td><td>not equal<\/td><\/tr><tr><td><code>__gt<\/code> <code>__gte<\/code> <code>__lt<\/code> <code>__lte<\/code><\/td><td>greater or less than<\/td><\/tr><tr><td><code>__in=[...]<\/code> / <code>__not_in<\/code><\/td><td>in or not in a list<\/td><\/tr><tr><td><code>__contains<\/code> / <code>__icontains<\/code><\/td><td>contains (<code>i<\/code> ignores case)<\/td><\/tr><tr><td><code>__startswith<\/code> / <code>__endswith<\/code><\/td><td>starts or ends with<\/td><\/tr><tr><td><code>__isnull=True<\/code><\/td><td>empty<\/td><\/tr><tr><td><code>__between=(a, b)<\/code><\/td><td>in a range<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"foreignkey\">ForeignKey<a class=\"anchor\" href=\"#\" data-anchor=\"foreignkey\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>await order.product<\/code> loads the related object and caches it. <code>order.product_id<\/code> is the plain number.<\/p><h2 id=\"transactions\">Transactions<a class=\"anchor\" href=\"#\" data-anchor=\"transactions\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async with bot.db.transaction():\n    await Order.create(user=ctx.user, product=p)\n    await p.update(stock=Col(\"stock\") - 1)\n# on error both are rolled back<\/code><\/pre><\/figure><p>MongoDB supports transactions only on a replica set, so there <code>transaction()<\/code> does nothing.<\/p>", "toc": [["model", "Model"], ["create-read-update-delete", "Create, read, update, delete"], ["queries", "Queries"], ["foreignkey", "ForeignKey"], ["transactions", "Transactions"]], "text": "nicebot has its own ORM. The same code runs on SQLite, PostgreSQL, MySQL/MariaDB and MongoDB, and all four are covered by automated tests. Python Model Python Fields: Int , BigInt , Float , Str(max_length) , Text , Bool , DateTime(auto_now_add=, auto_now=) , Date , JSON and ForeignKey . Common options: default= , null= , unique= , index= and choices= . Automatic migrations: tables are created when the bot starts. Add a new field to a model and the column is added by itself. Your data is never dropped. Create, read, update, delete Python Queries Python Lookup Meaning price=5 equals price__ne=5 not equal __gt __gte __lt __lte greater or less than __in=[...] / __not_in in or not in a list __contains / __icontains contains ( i ignores case) __startswith / __endswith starts or ends with __isnull=True empty __between=(a, b) in a range ForeignKey await order.product loads the related object and caches it. order.product_id is the plain number. Transactions Python MongoDB supports transactions only on a replica set, so there transaction() does nothing.", "min": 2}, "users": {"title": "Users and referrals", "desc": "Users are saved for you; add your own fields and referrals.", "html": "<p>Everyone who writes to the bot is saved to the <code>nb_users<\/code> table automatically and is available as <code>ctx.user<\/code>. Name, username and last activity are kept up to date too.<\/p><div class=\"table\"><table><thead><tr><th>Field<\/th><th><\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>Telegram id<\/td><\/tr><tr><td><code>first_name<\/code>, <code>last_name<\/code>, <code>username<\/code><\/td><td><\/td><\/tr><tr><td><code>lang<\/code><\/td><td>Chosen language<\/td><\/tr><tr><td><code>phone<\/code><\/td><td>Phone<\/td><\/tr><tr><td><code>is_blocked<\/code><\/td><td>Blocked the bot (set automatically)<\/td><\/tr><tr><td><code>is_premium<\/code><\/td><td>Telegram Premium<\/td><\/tr><tr><td><code>referrer_id<\/code><\/td><td>Who invited them<\/td><\/tr><tr><td><code>data<\/code><\/td><td>Any JSON<\/td><\/tr><tr><td><code>created_at<\/code>, <code>last_seen<\/code><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"add-your-own-fields\">Add your own fields<a class=\"anchor\" href=\"#\" data-anchor=\"add-your-own-fields\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot, User, fields\n\nclass Customer(User):              # same \"nb_users\" table, new columns\n    balance = fields.Int(default=0)\n    city = fields.Str(64, null=True)\n\nbot = Nicebot(token=\"...\", user_model=Customer)\n\n@bot.command(\"balans\")\nasync def balans(ctx, user: Customer):\n    await ctx.reply(f\"Balans: {user.balance} so'm\")<\/code><\/pre><\/figure><h2 id=\"referral-system\">Referral system<a class=\"anchor\" href=\"#\" data-anchor=\"referral-system\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>A new user who comes through <code>ctx.ref_link<\/code> gets <code>referrer_id<\/code> set automatically.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"taklif\")\nasync def invite(ctx):\n    n = await ctx.user.referrals_count()\n    await ctx.reply(f\"Havolangiz: {ctx.ref_link}\\nTaklif qilganlaringiz: {n}\")\n\n@bot.on_referral\nasync def rewarded(ctx, referrer):\n    await referrer.update(balance=Col(\"balance\") + 5000)\n    await bot.send_message(referrer.id, \"🎉 Do'stingiz qo'shildi, +5000!\")<\/code><\/pre><\/figure><h2 id=\"lifecycle-events\">Lifecycle events<a class=\"anchor\" href=\"#\" data-anchor=\"lifecycle-events\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on_startup\nasync def ready(bot):\n    await bot.notify_admins(\"✅ Bot ishga tushdi\")\n\n@bot.on_new_user\nasync def welcome(ctx, user):\n    await bot.notify_admins(f\"🆕 Yangi foydalanuvchi: {user.mention}\")<\/code><\/pre><\/figure>", "toc": [["add-your-own-fields", "Add your own fields"], ["referral-system", "Referral system"], ["lifecycle-events", "Lifecycle events"]], "text": "Everyone who writes to the bot is saved to the nb_users table automatically and is available as ctx.user . Name, username and last activity are kept up to date too. Field id Telegram id first_name , last_name , username lang Chosen language phone Phone is_blocked Blocked the bot (set automatically) is_premium Telegram Premium referrer_id Who invited them data Any JSON created_at , last_seen Add your own fields Python Referral system A new user who comes through ctx.ref_link gets referrer_id set automatically. Python Lifecycle events Python", "min": 1}, "i18n": {"title": "Translations", "desc": "JSON translation files so your bot speaks several languages.", "html": "<p>Put one JSON file per language in the <code>locales/<\/code> folder:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">JSON<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-json\">// locales/uz.json\n{ \"hello\": \"Assalomu alaykum, {name}!\", \"menu\": { \"shop\": \"🛍 Do'kon\" } }\n\n// locales/ru.json\n{ \"hello\": \"Здравствуйте, {name}!\", \"menu\": { \"shop\": \"🛍 Магазин\" } }<\/code><\/pre><\/figure><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(ctx.t(\"hello\", name=ctx.name))\nawait ctx.reply(ctx.t(\"menu.shop\"))\nawait ctx.set_lang(\"ru\")        # saves the user's language<\/code><\/pre><\/figure><p>The user's language is chosen in this order: the language saved with <code>ctx.set_lang()<\/code>, then the Telegram app language, then <code>Nicebot(lang=\"uz\")<\/code>. If a key is missing, the default language text is used. The library's own texts (\"Yes\", \"Cancelled\" and others) ship in uz, ru and en. You can override them in your own file too, for example <code>\"nb.yes\": \"Sure\"<\/code>.<\/p>", "toc": [], "text": "Put one JSON file per language in the locales/ folder: JSON Python The user's language is chosen in this order: the language saved with ctx.set_lang() , then the Telegram app language, then Nicebot(lang=\"uz\") . If a key is missing, the default language text is used. The library's own texts (\"Yes\", \"Cancelled\" and others) ship in uz, ru and en. You can override them in your own file too, for example \"nb.yes\": \"Sure\" .", "min": 1}, "admin": {"title": "Admin panel and stats", "desc": "Built-in admin commands, stats and error reports.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", admins=[123456789])\n# appear in the admins' menu automatically:\n# /stats        — statistics\n# /broadcast    — reply to a message to send it to everyone\n# /maintenance  — maintenance mode (on / off)\n# /backup       — a copy of the SQLite database<\/code><\/pre><\/figure><p>Admin commands appear only in the admins' menu. Regular users don't see them and can't run them.<\/p><h2 id=\"statistics\">Statistics<a class=\"anchor\" href=\"#\" data-anchor=\"statistics\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">s = await bot.stats()\n# {\"users\": 1520, \"dau\": 310, \"mau\": 1104, \"new_today\": 42, \"blocked\": 37,\n#  \"retention_d7\": 34.5, \"top_commands\": [(\"start\", 900), ...], ...}<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Metric<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>DAU / WAU / MAU<\/td><td>Active in the last 1, 7 and 30 days<\/td><\/tr><tr><td><code>retention_d7<\/code><\/td><td>Share of users who joined 7–14 days ago and came back last week (%)<\/td><\/tr><tr><td><code>top_commands<\/code><\/td><td>Most used commands in 30 days<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"maintenance-mode\">Maintenance mode<a class=\"anchor\" href=\"#\" data-anchor=\"maintenance-mode\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>While <code>await bot.maintenance(True)<\/code> is on, everyone except admins gets a \"🛠 maintenance\" message. The mode survives restarts.<\/p><h2 id=\"error-reports\">Error reports<a class=\"anchor\" href=\"#\" data-anchor=\"error-reports\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>When a handler fails, the user gets a polite message and the admins get a report with the traceback. The same error is reported at most once every 10 minutes.<\/p>", "toc": [["statistics", "Statistics"], ["maintenance-mode", "Maintenance mode"], ["error-reports", "Error reports"]], "text": "Python Admin commands appear only in the admins' menu. Regular users don't see them and can't run them. Statistics Python Metric Meaning DAU / WAU / MAU Active in the last 1, 7 and 30 days retention_d7 Share of users who joined 7–14 days ago and came back last week (%) top_commands Most used commands in 30 days Maintenance mode While await bot.maintenance(True) is on, everyone except admins gets a \"🛠 maintenance\" message. The mode survives restarts. Error reports When a handler fails, the user gets a polite message and the admins get a report with the traceback. The same error is reported at most once every 10 minutes.", "min": 1}, "broadcast": {"title": "Broadcasts", "desc": "Message every user, with rate limits and resume support.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">result = await bot.broadcast(\n    \"🎉 Yangi aksiya boshlandi!\",\n    buttons=[Button(\"Ko'rish\", url=\"https://tezbaraka.uz\")],\n    id=\"aksiya-noyabr\",     # resumes with the same id if it stops\n)\n# {\"total\": 1500, \"sent\": 1462, \"failed\": 38, \"blocked\": 35}\n\nawait bot.broadcast(lambda uid: f\"Salom! Sizning id: {uid}\")\nawait bot.broadcast(None, copy_from=(chat_id, message_id))   # copy any message<\/code><\/pre><\/figure><ul><li>Telegram limits are respected: the default speed is 25 messages per second, changed with <code>rate=<\/code><\/li><li>On a 429 error it waits the required time and continues<\/li><li>Users who blocked the bot are marked <code>is_blocked=True<\/code> and skipped next time<\/li><li>With <code>id=<\/code>, progress is saved every 20 messages. If the bot stops, call it again with the same <code>id<\/code> and it continues where it left off<\/li><li>An <code>on_progress=<\/code> function receives the current state every 3 seconds<\/li><\/ul>", "toc": [], "text": "Python Telegram limits are respected: the default speed is 25 messages per second, changed with rate= On a 429 error it waits the required time and continues Users who blocked the bot are marked is_blocked=True and skipped next time With id= , progress is saved every 20 messages. If the bot stops, call it again with the same id and it continues where it left off An on_progress= function receives the current state every 3 seconds", "min": 1}, "payments": {"title": "Payments (Telegram Stars)", "desc": "Accept payments with Telegram Stars.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"premium\")\nasync def premium(ctx):\n    await ctx.invoice(\"Premium\", \"30 kunlik obuna\", amount=100, payload=\"premium30\")\n\n@bot.paid()\nasync def paid(ctx):\n    sp = ctx.message.successful_payment\n    await ctx.user.update(data={**ctx.user.data, \"premium\": True})\n    await ctx.reply(f\"⭐️ {sp.total_amount} Stars uchun rahmat!\")<\/code><\/pre><\/figure><p><code>pre_checkout_query<\/code> is approved automatically. To check it yourself, write a <code>@bot.pre_checkout()<\/code> handler. Refunds: <code>await ctx.refund()<\/code>.<\/p>", "toc": [], "text": "Python pre_checkout_query is approved automatically. To check it yourself, write a @bot.pre_checkout() handler. Refunds: await ctx.refund() .", "min": 1}, "groups": {"title": "Groups, subscription and support", "desc": "Group moderation, captcha, required subscription and support mode.", "html": "<h2 id=\"moderating-groups\">Moderating groups<a class=\"anchor\" href=\"#\" data-anchor=\"moderating-groups\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"warn\")\nasync def warn(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.warn(\"Reklama taqiqlangan\", limit=3)   # ban after 3\n\n@bot.command(\"mute\")\nasync def mute(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.mute(\"1h\")       # the replied user for 1 hour\n\nawait ctx.ban(for_=\"7d\")\nawait ctx.unban()\nawait ctx.kick()<\/code><\/pre><\/figure><p>These methods act on the user whose message you replied to, or take <code>user_id=<\/code>. The bot must be a group admin.<\/p><h2 id=\"captcha\">Captcha<a class=\"anchor\" href=\"#\" data-anchor=\"captcha\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", captcha=\"2m\")\n# a newcomer who doesn't press \"🤖 I'm not a robot\" in 2 minutes is removed<\/code><\/pre><\/figure><h2 id=\"required-subscription\">Required subscription<a class=\"anchor\" href=\"#\" data-anchor=\"required-subscription\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", required_channels=[\"@kanalim\", \"@yangiliklar\"])\n# a non-subscriber sees the channels and a \"✅ Check\" button<\/code><\/pre><\/figure><p>The bot must be an admin of the channel, otherwise it can't check membership. The result is cached for a minute, so Telegram isn't asked more than needed.<\/p><h2 id=\"support-mode\">Support mode<a class=\"anchor\" href=\"#\" data-anchor=\"support-mode\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", support_chat=-1001234567890)\n# private messages no handler matched go to the group;\n# a reply in the group goes back to the user<\/code><\/pre><\/figure>", "toc": [["moderating-groups", "Moderating groups"], ["captcha", "Captcha"], ["required-subscription", "Required subscription"], ["support-mode", "Support mode"]], "text": "Moderating groups Python These methods act on the user whose message you replied to, or take user_id= . The bot must be a group admin. Captcha Python Required subscription Python The bot must be an admin of the channel, otherwise it can't check membership. The result is cached for a minute, so Telegram isn't asked more than needed. Support mode Python", "min": 1}, "middleware": {"title": "Middleware, DI and errors", "desc": "Code around every update, dependency injection and errors.", "html": "<h2 id=\"middleware\">Middleware<a class=\"anchor\" href=\"#\" data-anchor=\"middleware\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Middleware wraps every update and can run code before and after the handler.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import time\n\n@bot.middleware\nasync def timing(ctx, next):\n    start = time.perf_counter()\n    await next()                                  # next step / the handler\n    print(f\"{ctx.text!r}: {time.perf_counter() - start:.3f}s\")\n\n@bot.middleware\nasync def ban_check(ctx, next):\n    if ctx.user and ctx.user.data.get(\"banned\"):\n        return                                    # without next() processing stops\n    await next()<\/code><\/pre><\/figure><h2 id=\"dependency-injection-di\">Dependency injection (DI)<a class=\"anchor\" href=\"#\" data-anchor=\"dependency-injection-di\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>A handler asks for what it needs by parameter name or type:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from dataclasses import dataclass\n\n@dataclass\nclass Settings:\n    price: int = 50_000\n\nbot.provide(Settings, Settings())\n\n@bot.callback(\"buy:{id:int}\")\nasync def buy(ctx, id: int, user: Customer, cfg: Settings, text, args):\n    ...   # ask for what you need by name or type<\/code><\/pre><\/figure><p>Available by name: <code>bot<\/code>, <code>message<\/code>, <code>callback<\/code>, <code>user<\/code>, <code>chat<\/code>, <code>text<\/code>, <code>args<\/code>, <code>arg<\/code>, <code>payload<\/code>, <code>data<\/code>, <code>value<\/code>, <code>album<\/code>, <code>lang<\/code>, <code>state<\/code>, <code>config<\/code>, <code>db<\/code> and <code>storage<\/code>, plus callback and regex parameters.<\/p><h2 id=\"errors\">Errors<a class=\"anchor\" href=\"#\" data-anchor=\"errors\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.error(ValueError)\nasync def bad_value(ctx, error):\n    await ctx.reply(f\"Xato qiymat: {error}\")\n\n# other errors: a polite message to the user,\n# and a traceback report to the admins<\/code><\/pre><\/figure>", "toc": [["middleware", "Middleware"], ["dependency-injection-di", "Dependency injection (DI)"], ["errors", "Errors"]], "text": "Middleware Middleware wraps every update and can run code before and after the handler. Python Dependency injection (DI) A handler asks for what it needs by parameter name or type: Python Available by name: bot , message , callback , user , chat , text , args , arg , payload , data , value , album , lang , state , config , db and storage , plus callback and regex parameters. Errors Python", "min": 1}, "miniapp": {"title": "Mini Apps", "desc": "A Mini App server and API in the same process as the bot.", "html": "<p>nicebot includes a web server that runs in the same process as the bot. It serves Mini App files and creates API endpoints. Telegram's <code>initData<\/code> signature is verified with HMAC automatically.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.webapp(\"webapp\")                # serves webapp/index.html\n\n@bot.api(\"/api/score\")\nasync def score(req):\n    user = await req.db_user()          # initData is verified, the user is known\n    points = int(req.json[\"points\"])\n    await user.update(data={**user.data, \"score\": points})\n    return {\"ok\": True, \"score\": points}\n\n@bot.command(\"play\")\nasync def play(ctx):\n    await ctx.reply(\"O'ynash\", buttons=[Button(\"🎮 Boshlash\", webapp=\"https://game.tezbaraka.uz\")])\n\nbot.start(port=8080)<\/code><\/pre><\/figure><p>In the browser, include the ready-made <code>nicebot.js<\/code>. It adds <code>initData<\/code> to every request:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">HTML<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-xml\">&lt;script src=\"https://telegram.org/js/telegram-web-app.js\"&gt;&lt;/script&gt;\n&lt;script src=\"/nicebot.js\"&gt;&lt;/script&gt;\n&lt;script&gt;\n  nicebot.post(\"/api/score\", { points: 120 }).then(r =&gt; console.log(r.score));\n  console.log(nicebot.user.first_name);\n&lt;/script&gt;<\/code><\/pre><\/figure><p>A missing, wrong or expired <code>initData<\/code> is rejected with <code>401<\/code>. <code>@bot.api(..., auth=False)<\/code> creates a public endpoint. The <code>WebAppRequest<\/code> object has <code>user<\/code>, <code>json<\/code>, <code>query<\/code>, <code>params<\/code> and <code>db_user()<\/code>.<\/p>", "toc": [], "text": "nicebot includes a web server that runs in the same process as the bot. It serves Mini App files and creates API endpoints. Telegram's initData signature is verified with HMAC automatically. Python In the browser, include the ready-made nicebot.js . It adds initData to every request: HTML A missing, wrong or expired initData is rejected with 401 . @bot.api(..., auth=False) creates a public endpoint. The WebAppRequest object has user , json , query , params and db_user() .", "min": 1}, "scheduler": {"title": "Scheduling, background and cache", "desc": "Scheduled jobs, background work, caching and files.", "html": "<h2 id=\"scheduled-jobs\">Scheduled jobs<a class=\"anchor\" href=\"#\" data-anchor=\"scheduled-jobs\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.every(\"1h\")\nasync def sync_prices(bot):\n    ...\n\n@bot.at(\"09:00\", tz=\"Asia/Tashkent\")\nasync def morning(bot):\n    await bot.broadcast(\"☀️ Xayrli tong!\")\n\n@bot.at(\"18:00\", days=[\"mon\", \"fri\"])\nasync def weekly_report(bot):\n    await bot.notify_admins(str(await bot.stats()))<\/code><\/pre><\/figure><p>Days can be written in English (<code>mon<\/code>…<code>sun<\/code>) or Uzbek (<code>du<\/code>, <code>se<\/code>, <code>chor<\/code>, <code>pay<\/code>, <code>ju<\/code>, <code>shan<\/code>, <code>yak<\/code>).<\/p><h2 id=\"background-tasks\">Background tasks<a class=\"anchor\" href=\"#\" data-anchor=\"background-tasks\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"report\")\nasync def report(ctx):\n    ctx.background(build_heavy_report, ctx.user_id, retries=3)   # the handler returns at once\n    await ctx.reply(\"Hisobot tayyorlanmoqda, tayyor bo'lgach yuboraman\")\n\nbot.later(\"10m\", bot.send_message(admin_id, \"10 daqiqa o'tdi\"))<\/code><\/pre><\/figure><p>A failing background task is retried with exponential backoff. When the bot stops, unfinished tasks are awaited.<\/p><h2 id=\"cache\">Cache<a class=\"anchor\" href=\"#\" data-anchor=\"cache\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import cache\n\n@cache(\"10m\")\nasync def dollar_rate():\n    ...   # a real request once every 10 minutes<\/code><\/pre><\/figure><h2 id=\"files\">Files<a class=\"anchor\" href=\"#\" data-anchor=\"files\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on(\"document\")\nasync def doc(ctx):\n    data = await ctx.download()               # bytes\n    await ctx.save(f\"uploads/{ctx.message.document.file_name}\")\n\nawait ctx.photo(\"logo.png\")   # uploaded the first time,\nawait ctx.photo(\"logo.png\")   # instant via file_id afterwards<\/code><\/pre><\/figure>", "toc": [["scheduled-jobs", "Scheduled jobs"], ["background-tasks", "Background tasks"], ["cache", "Cache"], ["files", "Files"]], "text": "Scheduled jobs Python Days can be written in English ( mon … sun ) or Uzbek ( du , se , chor , pay , ju , shan , yak ). Background tasks Python A failing background task is retried with exponential backoff. When the bot stops, unfinished tasks are awaited. Cache Python Files Python", "min": 1}, "deploy": {"title": "Running and deploying", "desc": "Polling or webhooks, graceful shutdown and Docker.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.start()                                   # polling\nbot.start(reload=True)                        # restarts when the code changes\nbot.start(webhook=\"https://bot.tezbaraka.uz/hook\", port=8080)\nNicebot.run_all(shop_bot, support_bot)        # several bots in one process<\/code><\/pre><\/figure><h2 id=\"polling-or-webhook\">Polling or webhook<a class=\"anchor\" href=\"#\" data-anchor=\"polling-or-webhook\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Polling needs no setup and is enough for small and medium bots. A webhook needs an HTTPS domain. nicebot calls <code>setWebhook<\/code> with a secret token and checks incoming requests. Server health is available at <code>/nicebot/health<\/code>.<\/p><h2 id=\"graceful-shutdown\">Graceful shutdown<a class=\"anchor\" href=\"#\" data-anchor=\"graceful-shutdown\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>On Ctrl+C or SIGTERM the bot stops fetching new updates and waits for running handlers to finish. Then it confirms the offset with Telegram, so no update is lost or handled twice after a restart.<\/p><h2 id=\"docker\">Docker<a class=\"anchor\" href=\"#\" data-anchor=\"docker\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Dockerfile<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-dockerfile\">FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install --no-cache-dir \"nicebot[postgres]\"\nCMD [\"python\", \"bot.py\"]<\/code><\/pre><\/figure><h2 id=\"reliability\">Reliability<a class=\"anchor\" href=\"#\" data-anchor=\"reliability\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><ul><li>Flood control (429): waits the required seconds and resends the request<\/li><li>Network and 5xx errors: up to 3 retries with exponential backoff<\/li><li>Unknown new update kinds don't break the bot: they are logged and skipped<\/li><li>Concurrent handlers are capped by <code>max_concurrency=256<\/code><\/li><\/ul>", "toc": [["polling-or-webhook", "Polling or webhook"], ["graceful-shutdown", "Graceful shutdown"], ["docker", "Docker"], ["reliability", "Reliability"]], "text": "Python Polling or webhook Polling needs no setup and is enough for small and medium bots. A webhook needs an HTTPS domain. nicebot calls setWebhook with a secret token and checks incoming requests. Server health is available at /nicebot/health . Graceful shutdown On Ctrl+C or SIGTERM the bot stops fetching new updates and waits for running handlers to finish. Then it confirms the offset with Telegram, so no update is lost or handled twice after a restart. Docker Dockerfile Reliability Flood control (429): waits the required seconds and resends the request Network and 5xx errors: up to 3 retries with exponential backoff Unknown new update kinds don't break the bot: they are logged and skipped Concurrent handlers are capped by max_concurrency=256", "min": 1}, "testing": {"title": "Testing", "desc": "Test your bot without Telegram, like a real user would.", "html": "<p>You can test the bot without Telegram, the way a real user would use it. A fake API records every call.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">test_bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from bot import bot\n\nasync def test_register():\n    async with bot.test() as t:\n        ali = t.user(first_name=\"Ali\")\n        await ali.send(\"/register\")\n        assert t.last.text == \"Ismingiz?\"\n        await ali.send(\"Ali\")\n        await ali.send(\"25\")\n        await ali.click(\"M\")\n        assert \"Rahmat\" in t.last.text<\/code><\/pre><\/figure><div class=\"table\"><table><tbody><tr><td><code>t.user(...)<\/code><\/td><td>A test user<\/td><\/tr><tr><td><code>user.send(text)<\/code><\/td><td>Send a message<\/td><\/tr><tr><td><code>user.click(\"label\")<\/code><\/td><td>Press a button<\/td><\/tr><tr><td><code>user.send_photo()<\/code> / <code>send_contact()<\/code> / <code>send_location()<\/code> / <code>send_album()<\/code><\/td><td>Send media<\/td><\/tr><tr><td><code>t.last<\/code><\/td><td>The latest message: <code>.text<\/code>, <code>.buttons<\/code>, <code>.keyboard<\/code><\/td><\/tr><tr><td><code>t.messages<\/code> / <code>t.texts<\/code><\/td><td>All messages<\/td><\/tr><tr><td><code>t.calls_of(\"sendPhoto\")<\/code><\/td><td>API calls<\/td><\/tr><tr><td><code>t.blocked = {id}<\/code><\/td><td>A user who blocked the bot<\/td><\/tr><\/tbody><\/table><\/div><p>Works with <code>pytest<\/code> and <code>pytest-asyncio<\/code>.<\/p>", "toc": [], "text": "You can test the bot without Telegram, the way a real user would use it. A fake API records every call. test_bot.py t.user(...) A test user user.send(text) Send a message user.click(\"label\") Press a button user.send_photo() / send_contact() / send_location() / send_album() Send media t.last The latest message: .text , .buttons , .keyboard t.messages / t.texts All messages t.calls_of(\"sendPhoto\") API calls t.blocked = {id} A user who blocked the bot Works with pytest and pytest-asyncio .", "min": 1}, "features": {"title": "50 features", "desc": "All 50 built-in features of nicebot on one page.", "html": "<section class=\"fgroup\"><h2 id=\"dialogs\">Dialogs <span class=\"fcount\">5<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">01<\/span><div><code>await ctx.ask()<\/code><p>Question and answer without FSM classes<\/p><\/div><\/li><li><span class=\"fnum\">02<\/span><div><code>ctx.confirm()<\/code><p>Yes/No question that returns True/False<\/p><\/div><\/li><li><span class=\"fnum\">03<\/span><div><code>ctx.choose(multiple=True)<\/code><p>Pick several options with ✅/⬜️<\/p><\/div><\/li><li><span class=\"fnum\">04<\/span><div><code>ctx.form()<\/code><p>Several questions, validation and re-asking<\/p><\/div><\/li><li><span class=\"fnum\">05<\/span><div><code>Validators<\/code><p>Phone (+998), email, date, number, URL, photo and more<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"buttons\">Buttons <span class=\"fcount\">12<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">06<\/span><div><code>Button(on_click=)<\/code><p>A button is bound straight to a function<\/p><\/div><\/li><li><span class=\"fnum\">07<\/span><div><code>Callback templates<\/code><p>\"buy:{id:int}\" is parsed automatically<\/p><\/div><\/li><li><span class=\"fnum\">08<\/span><div><code>Automatic layout<\/code><p>Short buttons share a row by themselves<\/p><\/div><\/li><li><span class=\"fnum\">09<\/span><div><code>Toggle<\/code><p>✅/⬜️ settings with the value saved<\/p><\/div><\/li><li><span class=\"fnum\">10<\/span><div><code>ttl= and only=<\/code><p>Expiring buttons and buttons for one person<\/p><\/div><\/li><li><span class=\"fnum\">11<\/span><div><code>once=True<\/code><p>One-time button<\/p><\/div><\/li><li><span class=\"fnum\">12<\/span><div><code>No 64-byte limit<\/code><p>Long callback data is kept in the database<\/p><\/div><\/li><li><span class=\"fnum\">13<\/span><div><code>Auto-answer<\/code><p>The loading clock never hangs<\/p><\/div><\/li><li><span class=\"fnum\">14<\/span><div><code>Reply shortcuts<\/code><p>\"📞 Phone:contact\", \":location\"<\/p><\/div><\/li><li><span class=\"fnum\">15<\/span><div><code>ctx.respond()<\/code><p>Edits after a button press, sends otherwise<\/p><\/div><\/li><li><span class=\"fnum\">16<\/span><div><code>Multi-level Menu<\/code><p>The Back button is automatic<\/p><\/div><\/li><li><span class=\"fnum\">17<\/span><div><code>ctx.paginate()<\/code><p>◀️ 2/5 ▶️ pagination<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"data\">Data <span class=\"fcount\">4<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">18<\/span><div><code>Built-in ORM<\/code><p>One API for SQLite, PostgreSQL, MySQL and MongoDB, with migrations<\/p><\/div><\/li><li><span class=\"fnum\">19<\/span><div><code>ctx.user<\/code><p>Users are saved to the database automatically<\/p><\/div><\/li><li><span class=\"fnum\">20<\/span><div><code>i18n<\/code><p>ctx.t(), built-in uz/ru/en texts<\/p><\/div><\/li><li><span class=\"fnum\">21<\/span><div><code>file_id cache<\/code><p>A local file is uploaded only once<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"business\">Business <span class=\"fcount\">10<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">22<\/span><div><code>Referral system<\/code><p>ctx.ref_link, referrer_id and @bot.on_referral<\/p><\/div><\/li><li><span class=\"fnum\">23<\/span><div><code>Broadcasts<\/code><p>Rate limits, blocked-user marking and resuming<\/p><\/div><\/li><li><span class=\"fnum\">24<\/span><div><code>Admin panel<\/code><p>/stats, /broadcast, /maintenance and /backup<\/p><\/div><\/li><li><span class=\"fnum\">25<\/span><div><code>Analytics<\/code><p>DAU/MAU, retention and top commands<\/p><\/div><\/li><li><span class=\"fnum\">26<\/span><div><code>Required subscription<\/code><p>required_channels=[…]<\/p><\/div><\/li><li><span class=\"fnum\">27<\/span><div><code>Support mode<\/code><p>Messages go to a group, replies go back to the user<\/p><\/div><\/li><li><span class=\"fnum\">28<\/span><div><code>Maintenance mode<\/code><p>Admins can still use the bot<\/p><\/div><\/li><li><span class=\"fnum\">29<\/span><div><code>Telegram Stars<\/code><p>ctx.invoice() and @bot.paid<\/p><\/div><\/li><li><span class=\"fnum\">30<\/span><div><code>Groups and captcha<\/code><p>ban, mute, warn (3 → ban), captcha for newcomers<\/p><\/div><\/li><li><span class=\"fnum\">31<\/span><div><code>Error reports<\/code><p>Tracebacks are sent to admins automatically<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"architecture\">Architecture <span class=\"fcount\">11<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">32<\/span><div><code>DI via type hints<\/code><p>async def h(ctx, user: Customer, cfg: Settings)<\/p><\/div><\/li><li><span class=\"fnum\">33<\/span><div><code>Nicebot.from_env()<\/code><p>Configuration from a .env file<\/p><\/div><\/li><li><span class=\"fnum\">34<\/span><div><code>bot.include(\"handlers\")<\/code><p>Routers are discovered automatically<\/p><\/div><\/li><li><span class=\"fnum\">35<\/span><div><code>@cache(\"5m\")<\/code><p>Cache for async functions<\/p><\/div><\/li><li><span class=\"fnum\">36<\/span><div><code>ctx.background()<\/code><p>Background tasks with retries<\/p><\/div><\/li><li><span class=\"fnum\">37<\/span><div><code>@bot.every / @bot.at<\/code><p>Scheduler with time zones<\/p><\/div><\/li><li><span class=\"fnum\">38<\/span><div><code>Albums<\/code><p>A media group arrives as one list in one handler<\/p><\/div><\/li><li><span class=\"fnum\">39<\/span><div><code>Mini App server<\/code><p>Files and initData (HMAC) checks inside the bot process<\/p><\/div><\/li><li><span class=\"fnum\">40<\/span><div><code>Mini App RPC<\/code><p>@bot.api endpoints and a ready nicebot.js<\/p><\/div><\/li><li><span class=\"fnum\">41<\/span><div><code>Several bots<\/code><p>Nicebot.run_all(bot1, bot2)<\/p><\/div><\/li><li><span class=\"fnum\">42<\/span><div><code>typing=True<\/code><p>Shows \"typing…\" while the handler runs<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"reliability\">Reliability <span class=\"fcount\">8<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">43<\/span><div><code>Flood protection<\/code><p>Waits and resends on a 429 error<\/p><\/div><\/li><li><span class=\"fnum\">44<\/span><div><code>throttle=<\/code><p>Rate limiting against spam<\/p><\/div><\/li><li><span class=\"fnum\">45<\/span><div><code>Graceful shutdown<\/code><p>No updates are lost on restart<\/p><\/div><\/li><li><span class=\"fnum\">46<\
