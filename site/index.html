art<\/code>, и он поздоровается с вами по имени.<\/p><h2 id=\"что-произошло\">Что произошло?<a class=\"anchor\" href=\"#\" data-anchor=\"что-произошло\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><thead><tr><th>Строка<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>Nicebot(token=...)<\/code><\/td><td>Создаёт бота. Без параметра <code>db<\/code> используется SQLite в памяти<\/td><\/tr><tr><td><code>@bot.command(\"start\")<\/code><\/td><td>При команде <code>/start<\/code> вызывает функцию ниже<\/td><\/tr><tr><td><code>async def start(ctx)<\/code><\/td><td><code>ctx<\/code> знает всё о текущем сообщении<\/td><\/tr><tr><td><code>await ctx.reply(...)<\/code><\/td><td>Отправляет ответ в этот чат<\/td><\/tr><tr><td><code>bot.start()<\/code><\/td><td>Начинает получать сообщения. Остановка — Ctrl+C<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Чтобы данные сохранялись после перезапуска, укажите <code>Nicebot(token=..., db=\"sqlite:///bot.db\")<\/code>.<\/p><\/aside><h2 id=\"автоперезапуск-при-изменении-кода\">Автоперезапуск при изменении кода<a class=\"anchor\" href=\"#\" data-anchor=\"автоперезапуск-при-изменении-кода\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>С <code>bot.start(reload=True)<\/code> бот сам перезапускается после каждого сохранения файла. Это очень удобно во время разработки.<\/p>", "toc": [["1-получите-токен", "1. Получите токен"], ["2-напишите-код", "2. Напишите код"], ["3-запустите", "3. Запустите"], ["что-произошло", "Что произошло?"], ["автоперезапуск-при-изменении-кода", "Автоперезапуск при изменении кода"]], "text": "1. Получите токен Откройте @BotFather в Telegram, отправьте /newbot , задайте имя и username. Вы получите токен вида 123456:ABC-DEF... . Никому его не показывайте. 2. Напишите код Создайте файл bot.py : bot.py 3. Запустите Terminal В терминале появится ✅ @ваш_бот ishga tushdi . Напишите боту /start , и он поздоровается с вами по имени. Что произошло? Строка Значение Nicebot(token=...) Создаёт бота. Без параметра db используется SQLite в памяти @bot.command(\"start\") При команде /start вызывает функцию ниже async def start(ctx) ctx знает всё о текущем сообщении await ctx.reply(...) Отправляет ответ в этот чат bot.start() Начинает получать сообщения. Остановка — Ctrl+C Чтобы данные сохранялись после перезапуска, укажите Nicebot(token=..., db=\"sqlite:///bot.db\") . Автоперезапуск при изменении кода С bot.start(reload=True) бот сам перезапускается после каждого сохранения файла. Это очень удобно во время разработки.", "min": 1}, "concepts": {"title": "Основные понятия", "desc": "Бот, обработчик и ctx: три главных понятия nicebot.", "html": "<p>В nicebot всего три понятия.<\/p><h2 id=\"бот\">Бот<a class=\"anchor\" href=\"#\" data-anchor=\"бот\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Nicebot<\/code> — это всё ваше приложение. Здесь задаются токен, база, админы, язык и другие настройки.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(\n    token=\"...\",\n    db=\"postgres://user:pass@localhost/mybot\",\n    admins=[123456789],\n    lang=\"uz\",                       # язык по умолчанию\n    required_channels=[\"@mykanal\"],  # обязательная подписка\n    support_chat=-1001234567890,     # группа поддержки\n    captcha=\"2m\",                    # для новых участников группы\n    tz=\"Asia/Tashkent\",\n)<\/code><\/pre><\/figure><h2 id=\"обработчик\">Обработчик<a class=\"anchor\" href=\"#\" data-anchor=\"обработчик\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Обработчик — это <code>async<\/code>-функция, которая вызывается при событии. Декоратор говорит, когда её вызывать: <code>@bot.command(\"start\")<\/code>, <code>@bot.text(\"salom\")<\/code>, <code>@bot.callback(\"buy:{id:int}\")<\/code> и так далее. Обработчики проверяются в порядке объявления, и срабатывает первый подходящий.<\/p><h2 id=\"ctx-контекст\">ctx (контекст)<a class=\"anchor\" href=\"#\" data-anchor=\"ctx-контекст\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Для каждого сообщения создаётся новый <code>ctx<\/code>, который приходит в обработчик первым аргументом. У него две задачи:<\/p><ul><li><strong>даёт данные:<\/strong> <code>ctx.text<\/code>, <code>ctx.user<\/code>, <code>ctx.chat_id<\/code>, <code>ctx.args<\/code>…<\/li><li><strong>выполняет действия:<\/strong> <code>ctx.reply()<\/code>, <code>ctx.edit()<\/code>, <code>ctx.ask()<\/code>, <code>ctx.photo()<\/code>…<\/li><\/ul><h2 id=\"жизненный-цикл\">Жизненный цикл<a class=\"anchor\" href=\"#\" data-anchor=\"жизненный-цикл\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Когда приходит сообщение, происходит следующее:<\/p><ol><li>Если пользователь отвечает на <code>ctx.ask()<\/code>, сообщение передаётся туда<\/li><li>Работают встроенные middleware: пользователь сохраняется в базу, проверяются режим техработ и обязательная подписка<\/li><li>Работают ваши middleware<\/li><li>Вызывается первый подходящий обработчик<\/li><li>Если ничего не подошло, срабатывает <code>@bot.fallback()<\/code> или режим поддержки<\/li><li>Если была нажата кнопка и вы на неё не ответили, <code>answerCallbackQuery<\/code> отправляется автоматически<\/li><\/ol>", "toc": [["бот", "Бот"], ["обработчик", "Обработчик"], ["ctx-контекст", "ctx (контекст)"], ["жизненный-цикл", "Жизненный цикл"]], "text": "В nicebot всего три понятия. Бот Nicebot — это всё ваше приложение. Здесь задаются токен, база, админы, язык и другие настройки. Python Обработчик Обработчик — это async -функция, которая вызывается при событии. Декоратор говорит, когда её вызывать: @bot.command(\"start\") , @bot.text(\"salom\") , @bot.callback(\"buy:{id:int}\") и так далее. Обработчики проверяются в порядке объявления, и срабатывает первый подходящий. ctx (контекст) Для каждого сообщения создаётся новый ctx , который приходит в обработчик первым аргументом. У него две задачи: даёт данные: ctx.text , ctx.user , ctx.chat_id , ctx.args … выполняет действия: ctx.reply() , ctx.edit() , ctx.ask() , ctx.photo() … Жизненный цикл Когда приходит сообщение, происходит следующее: Если пользователь отвечает на ctx.ask() , сообщение передаётся туда Работают встроенные middleware: пользователь сохраняется в базу, проверяются режим техработ и обязательная подписка Работают ваши middleware Вызывается первый подходящий обработчик Если ничего не подошло, срабатывает @bot.fallback() или режим поддержки Если была нажата кнопка и вы на неё не ответили, answerCallbackQuery отправляется автоматически", "min": 1}, "handlers": {"title": "Обработчики", "desc": "Команды, текст и другие события, фильтры и Router.", "html": "<h2 id=\"виды\">Виды<a class=\"anchor\" href=\"#\" data-anchor=\"виды\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"help\", description=\"Yordam\")\nasync def help_(ctx):\n    await ctx.reply(\"Men nima qila olaman...\")\n\n@bot.text(\"salom\")                       # точный текст (без учёта регистра)\nasync def salom(ctx):\n    await ctx.reply(\"Va alaykum assalom!\")\n\n@bot.text(contains=\"narx\")               # если содержит \"narx\"\nasync def narx(ctx):\n    await ctx.reply(\"Narxlar: ...\")\n\n@bot.text(regex=r\"^buy (?P&lt;qty&gt;\\d+)$\")  # группы regex становятся параметрами\nasync def buy(ctx, qty: int):\n    await ctx.reply(f\"{qty} dona\")\n\n@bot.on(\"photo\")                          # пришло фото\nasync def photo(ctx):\n    await ctx.reply(\"Chiroyli rasm!\")\n\n@bot.text()                               # любой обычный текст\nasync def echo(ctx):\n    await ctx.reply(ctx.text)\n\n@bot.fallback()                           # если ничего не подошло\nasync def unknown(ctx):\n    await ctx.reply(\"Tushunmadim 🤔\")<\/code><\/pre><\/figure><h2 id=\"параметры-обработчиков\">Параметры обработчиков<a class=\"anchor\" href=\"#\" data-anchor=\"параметры-обработчиков\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Эти параметры можно добавить к любому декоратору:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"admin\", admin=True)              # только админы\n@bot.command(\"bonus\", throttle=\"1d\")           # раз в день\n@bot.command(\"report\", typing=True)            # показывает \"печатает...\"\n@bot.text(\"salom\", chat=\"private\")             # только в личном чате\n@bot.text(state=\"waiting_phone\")               # только в этом состоянии\n@bot.command(\"vip\", users=[111, 222])          # только эти люди\n@bot.message(F.photo &amp; F.private)              # фильтры\n@bot.deep_link(r\"promo_(?P&lt;code&gt;\\w+)\")         # t.me/bot?start=promo_X\nasync def handler(ctx): ...<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Параметр<\/th><th>Что делает<\/th><\/tr><\/thead><tbody><tr><td><code>admin=True<\/code><\/td><td>Только для <code>Nicebot(admins=[...])<\/code><\/td><\/tr><tr><td><code>chat=\"private\"<\/code><\/td><td><code>private<\/code>, <code>group<\/code>, <code>supergroup<\/code>, <code>channel<\/code><\/td><\/tr><tr><td><code>throttle=\"3s\"<\/code><\/td><td>Ограничение частоты для одного пользователя. При превышении показывает «⏳ Подождите»<\/td><\/tr><tr><td><code>typing=True<\/code><\/td><td>Пока работает обработчик, показывается «печатает…». Можно и <code>\"upload_photo\"<\/code><\/td><\/tr><tr><td><code>state=\"x\"<\/code><\/td><td>Только если пользователь в этом состоянии<\/td><\/tr><tr><td><code>users=[...]<\/code><\/td><td>Только для этих id<\/td><\/tr><tr><td><code>description=\"...\"<\/code><\/td><td>Команда появится в меню Telegram. Можно <code>{\"uz\": ..., \"ru\": ...}<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"фильтры\">Фильтры<a class=\"anchor\" href=\"#\" data-anchor=\"фильтры\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>F<\/code> даёт готовые фильтры. Их можно объединять через <code>&amp;<\/code> (и), <code>|<\/code> (или) и <code>~<\/code> (не).<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import F\n\n@bot.message(F.photo | F.document)\n@bot.message(F.text &amp; ~F.command)\n@bot.message(F.regex(r\"\\d{4}\"))\n@bot.message(F.contains(\"chegirma\", \"aksiya\"))\n@bot.message(F.user(123, 456))\n@bot.message(lambda ctx: len(ctx.text or \"\") &gt; 100)   # свой фильтр\nasync def h(ctx): ...<\/code><\/pre><\/figure><h2 id=\"router-разделить-код-на-файлы\">Router: разделить код на файлы<a class=\"anchor\" href=\"#\" data-anchor=\"router-разделить-код-на-файлы\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># handlers/shop.py\nfrom nicebot import Router\n\nrouter = Router(chat=\"private\")   # применяется ко всем обработчикам\n\n@router.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Do'kon\")\n\n# bot.py\nbot.include(\"handlers\")           # все Router'ы из папки\n# или: from handlers.shop import router; bot.include(router)<\/code><\/pre><\/figure><h2 id=\"все-типы-событий\">Все типы событий<a class=\"anchor\" href=\"#\" data-anchor=\"все-типы-событий\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>@bot.callback<\/code>, <code>@bot.inline<\/code>, <code>@bot.chosen_inline<\/code>, <code>@bot.edited<\/code>, <code>@bot.channel<\/code>, <code>@bot.join<\/code>, <code>@bot.leave<\/code>, <code>@bot.album<\/code>, <code>@bot.paid<\/code>, <code>@bot.pre_checkout<\/code>, <code>@bot.webapp_data<\/code>, <code>@bot.my_chat_member<\/code>, <code>@bot.chat_member<\/code>, <code>@bot.join_request<\/code>, <code>@bot.reaction<\/code>, <code>@bot.poll_answer<\/code>. Для любого другого апдейта: <code>@bot.event(\"chat_boost\")<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Если в обработчике написать <code>raise SkipHandler<\/code>, сработает следующий подходящий.<\/p><\/aside>", "toc": [["виды", "Виды"], ["параметры-обработчиков", "Параметры обработчиков"], ["фильтры", "Фильтры"], ["router-разделить-код-на-файлы", "Router: разделить код на файлы"], ["все-типы-событий", "Все типы событий"]], "text": "Виды Python Параметры обработчиков Эти параметры можно добавить к любому декоратору: Python Параметр Что делает admin=True Только для Nicebot(admins=[...]) chat=\"private\" private , group , supergroup , channel throttle=\"3s\" Ограничение частоты для одного пользователя. При превышении показывает «⏳ Подождите» typing=True Пока работает обработчик, показывается «печатает…». Можно и \"upload_photo\" state=\"x\" Только если пользователь в этом состоянии users=[...] Только для этих id description=\"...\" Команда появится в меню Telegram. Можно {\"uz\": ..., \"ru\": ...} Фильтры F даёт готовые фильтры. Их можно объединять через & (и), | (или) и ~ (не). Python Router: разделить код на файлы Python Все типы событий @bot.callback , @bot.inline , @bot.chosen_inline , @bot.edited , @bot.channel , @bot.join , @bot.leave , @bot.album , @bot.paid , @bot.pre_checkout , @bot.webapp_data , @bot.my_chat_member , @bot.chat_member , @bot.join_request , @bot.reaction , @bot.poll_answer . Для любого другого апдейта: @bot.event(\"chat_boost\") . Если в обработчике написать raise SkipHandler , сработает следующий подходящий.", "min": 2}, "ctx": {"title": "ctx — контекст", "desc": "Данные о входящем сообщении, отправка ответов и редактирование.", "html": "<h2 id=\"данные\">Данные<a class=\"anchor\" href=\"#\" data-anchor=\"данные\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.message()\nasync def info(ctx):\n    ctx.text        # текст сообщения (или подпись)\n    ctx.name        # имя пользователя\n    ctx.user        # пользователь из базы (сохраняется сам)\n    ctx.user_id     # Telegram id\n    ctx.chat_id     # chat id\n    ctx.command     # \"/start ref_5\" -&gt; \"start\"\n    ctx.args        # \"/give 10 ali\" -&gt; [\"10\", \"ali\"]\n    ctx.payload     # deep link: \"ref_5\"\n    ctx.lang        # \"uz\", \"ru\", \"en\"\n    ctx.is_private  # личный чат?\n    ctx.is_admin    # админ бота?\n    ctx.message     # полный объект Message\n    ctx.mention     # кликабельное имя (HTML)<\/code><\/pre><\/figure><h2 id=\"отправка\">Отправка<a class=\"anchor\" href=\"#\" data-anchor=\"отправка\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Salom!\")                          # текст\nawait ctx.reply(\"Tanlang\", buttons=[\"A\", \"B\"])    # с inline-кнопками\nawait ctx.reply(\"Yozing\", keyboard=[\"Menyu\"])     # нижняя клавиатура\nawait ctx.reply(\"30 soniyada o'chadi\", delete_after=\"30s\")\nawait ctx.reply(\"Ovozsiz\", silent=True, protect=True)\n\nawait ctx.photo(\"rasm.jpg\", caption=\"Mana\")       # файл, URL или file_id\nawait ctx.video(\"https://site.uz/v.mp4\")\nawait ctx.document(\"hisobot.pdf\")\nawait ctx.media_group([\"1.jpg\", \"2.jpg\", \"3.jpg\"], caption=\"Albom\")\nawait ctx.location(40.10, 65.37)\nawait ctx.poll(\"Qaysi biri?\", [\"Python\", \"Go\"])\nawait ctx.dice(\"🎯\")<\/code><\/pre><\/figure><p>Все методы отправки принимают одинаковые дополнительные параметры:<\/p><div class=\"table\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>buttons=<\/code><\/td><td>Inline-кнопки (<a href=\"#buttons\">Кнопки<\/a>)<\/td><\/tr><tr><td><code>keyboard=<\/code><\/td><td>Нижняя клавиатура. <code>False<\/code> закрывает её<\/td><\/tr><tr><td><code>columns=<\/code><\/td><td>Число столбцов кнопок<\/td><\/tr><tr><td><code>delete_after=\"1m\"<\/code><\/td><td>Удалить сообщение автоматически<\/td><\/tr><tr><td><code>silent=True<\/code><\/td><td>Без звука<\/td><\/tr><tr><td><code>protect=True<\/code><\/td><td>Запрет пересылки и сохранения<\/td><\/tr><tr><td><code>quote=True<\/code><\/td><td>Ответить реплаем на входящее сообщение<\/td><\/tr><tr><td><code>preview=False<\/code><\/td><td>Отключить превью ссылок<\/td><\/tr><tr><td><code>chat_id=<\/code><\/td><td>Отправить в другой чат<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"редактирование-и-ответы\">Редактирование и ответы<a class=\"anchor\" href=\"#\" data-anchor=\"редактирование-и-ответы\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.edit(\"Yangi matn\")               # изменить сообщение с нажатой кнопкой\nawait ctx.edit_buttons([Button(\"OK\", data=\"ok\")])\nawait ctx.respond(\"Javob\")                 # после кнопки редактирует, иначе отправляет\nawait ctx.answer(\"Saqlandi ✅\")             # всплывающее сообщение над кнопкой\nawait ctx.answer(\"Diqqat!\", alert=True)    # в виде окна\nawait ctx.delete()                          # удалить сообщение\nawait ctx.react(\"🔥\")                       # реакция\nawait ctx.pin()<\/code><\/pre><\/figure><p><code>ctx.edit()<\/code> сам выбирает, что редактировать: подпись, если в сообщении есть медиа, иначе текст. Ошибку «message is not modified» он молча пропускает.<\/p><h2 id=\"другие-полезные-методы\">Другие полезные методы<a class=\"anchor\" href=\"#\" data-anchor=\"другие-полезные-методы\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"table\"><table><thead><tr><th>Метод<\/th><th>Что делает<\/th><\/tr><\/thead><tbody><tr><td><code>ctx.forward(chat)<\/code> / <code>ctx.copy(chat)<\/code><\/td><td>Переслать сообщение в другой чат<\/td><\/tr><tr><td><code>ctx.download()<\/code> / <code>ctx.save(path)<\/code><\/td><td>Скачать файл<\/td><\/tr><tr><td><code>ctx.action(\"upload_photo\")<\/code><\/td><td>Показать статус<\/td><\/tr><tr><td><code>ctx.is_member(\"@kanal\")<\/code><\/td><td>Проверить подписку<\/td><\/tr><tr><td><code>ctx.notify_admins(text)<\/code><\/td><td>Сообщение админам<\/td><\/tr><tr><td><code>ctx.background(func)<\/code><\/td><td>Фоновая задача<\/td><\/tr><tr><td><code>ctx.t(\"key\")<\/code><\/td><td>Перевод<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["данные", "Данные"], ["отправка", "Отправка"], ["редактирование-и-ответы", "Редактирование и ответы"], ["другие-полезные-методы", "Другие полезные методы"]], "text": "Данные Python Отправка Python Все методы отправки принимают одинаковые дополнительные параметры: Параметр Значение buttons= Inline-кнопки ( Кнопки ) keyboard= Нижняя клавиатура. False закрывает её columns= Число столбцов кнопок delete_after=\"1m\" Удалить сообщение автоматически silent=True Без звука protect=True Запрет пересылки и сохранения quote=True Ответить реплаем на входящее сообщение preview=False Отключить превью ссылок chat_id= Отправить в другой чат Редактирование и ответы Python ctx.edit() сам выбирает, что редактировать: подпись, если в сообщении есть медиа, иначе текст. Ошибку «message is not modified» он молча пропускает. Другие полезные методы Метод Что делает ctx.forward(chat) / ctx.copy(chat) Переслать сообщение в другой чат ctx.download() / ctx.save(path) Скачать файл ctx.action(\"upload_photo\") Показать статус ctx.is_member(\"@kanal\") Проверить подписку ctx.notify_admins(text) Сообщение админам ctx.background(func) Фоновая задача ctx.t(\"key\") Перевод", "min": 1}, "formatting": {"title": "Форматирование", "desc": "HTML-разметка и безопасная вставка пользовательского текста.", "html": "<p>По умолчанию nicebot использует HTML parse mode, поэтому теги <code>&lt;b&gt;<\/code>, <code>&lt;i&gt;<\/code>, <code>&lt;code&gt;<\/code> и <code>&lt;a href&gt;<\/code> работают сразу.<\/p><h2 id=\"безопасная-работа-с-текстом-пользователя\">Безопасная работа с текстом пользователя<a class=\"anchor\" href=\"#\" data-anchor=\"безопасная-работа-с-текстом-пользователя\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>В тексте пользователя могут быть символы <code>&lt;<\/code> или <code>&amp;<\/code>. Если вставить его напрямую, Telegram вернёт ошибку. <code>html()<\/code> экранирует значения, а шаблон оставляет как есть:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import html, bold, link, mention\n\nname = ctx.text                                 # текст от пользователя\nawait ctx.reply(html(\"&lt;b&gt;Salom, {}!&lt;/b&gt;\", name))  # name безопасно экранируется\nawait ctx.reply(bold(\"Muhim\") + \" xabar\")\nawait ctx.reply(link(\"Saytimiz\", \"https://tezbaraka.uz\"))<\/code><\/pre><\/figure><p>Готовые помощники: <code>bold<\/code>, <code>italic<\/code>, <code>underline<\/code>, <code>strike<\/code>, <code>spoiler<\/code>, <code>code<\/code>, <code>pre<\/code>, <code>link<\/code>, <code>mention<\/code>, <code>quote<\/code>, <code>escape<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Даже при ошибке форматирования бот не упадёт. nicebot отправит сообщение без форматирования и запишет предупреждение в лог.<\/p><\/aside><h2 id=\"другие-режимы\">Другие режимы<a class=\"anchor\" href=\"#\" data-anchor=\"другие-режимы\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Nicebot(parse_mode=\"MarkdownV2\")<\/code> или <code>parse_mode=None<\/code>, чтобы работать без форматирования.<\/p>", "toc": [["безопасная-работа-с-текстом-пользователя", "Безопасная работа с текстом пользователя"], ["другие-режимы", "Другие режимы"]], "text": "По умолчанию nicebot использует HTML parse mode, поэтому теги <b> , <i> , <code> и <a href> работают сразу. Безопасная работа с текстом пользователя В тексте пользователя могут быть символы < или & . Если вставить его напрямую, Telegram вернёт ошибку. html() экранирует значения, а шаблон оставляет как есть: Python Готовые помощники: bold , italic , underline , strike , spoiler , code , pre , link , mention , quote , escape . Даже при ошибке форматирования бот не упадёт. nicebot отправит сообщение без форматирования и запишет предупреждение в лог. Другие режимы Nicebot(parse_mode=\"MarkdownV2\") или parse_mode=None , чтобы работать без форматирования.", "min": 1}, "buttons": {"title": "Inline-кнопки", "desc": "Inline-кнопки: on_click, параметры, шаблоны и авто-раскладка.", "html": "<h2 id=\"кнопка-и-её-действие\">Кнопка и её действие<a class=\"anchor\" href=\"#\" data-anchor=\"кнопка-и-её-действие\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>Button<\/code> принимает текст и одно действие. Удобнее всего <code>on_click<\/code>: при нажатии вызывается обычная функция. Не нужно придумывать callback data и ловить её отдельным обработчиком.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Button\n\nasync def buy(ctx):\n    await ctx.edit(\"✅ Sotib olindi\")\n\n@bot.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Mahsulot: Kitob — 50 000 so'm\", buttons=[\n        [Button(\"🛒 Sotib olish\", on_click=buy)],\n        [Button(\"🌐 Sayt\", url=\"https://tezbaraka.uz\"),\n         Button(\"📋 Promo\", copy=\"NICE2026\")],\n        [Button(\"📱 Ilova\", webapp=\"https://app.tezbaraka.uz\")],\n    ])<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/shop<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Mahsulot: Kitob — 50 000 so'm<\/p><div class=\"kb\"><div class=\"kb-row\"><span>🛒 Sotib olish<\/span><\/div><div class=\"kb-row\"><span>🌐 Sayt ↗<\/span><span>📋 Promo<\/span><\/div><div class=\"kb-row\"><span>📱 Ilova<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 🛒 Sotib olish<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>✅ Sotib olindi <i class=\"edited\" data-t=\"edited\"><\/i><\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><div class=\"table\"><table><thead><tr><th>Тип<\/th><th>Запись<\/th><\/tr><\/thead><tbody><tr><td>Функция<\/td><td><code>Button(\"OK\", on_click=func)<\/code><\/td><\/tr><tr><td>Ссылка<\/td><td><code>Button(\"Сайт\", url=\"https://...\")<\/code><\/td><\/tr><tr><td>Mini App<\/td><td><code>Button(\"App\", webapp=\"https://...\")<\/code><\/td><\/tr><tr><td>Копирование<\/td><td><code>Button(\"Код\", copy=\"PROMO\")<\/code><\/td><\/tr><tr><td>Поделиться<\/td><td><code>Button(\"Поделиться\", share=\"текст\")<\/code><\/td><\/tr><tr><td>Обычная data<\/td><td><code>Button(\"Да\", data=\"yes\")<\/code><\/td><\/tr><tr><td>Оплата<\/td><td><code>Button(\"Оплатить\", pay=True)<\/code><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"передача-параметров\">Передача параметров<a class=\"anchor\" href=\"#\" data-anchor=\"передача-параметров\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async def add_to_cart(ctx, id: int, qty: int):\n    await ctx.answer(f\"{id} dan {qty} ta qo'shildi\")\n\nButton(\"➕ Savatga\", on_click=add_to_cart, id=15, qty=2)<\/code><\/pre><\/figure><h2 id=\"шаблоны-callback\">Шаблоны callback<a class=\"anchor\" href=\"#\" data-anchor=\"шаблоны-callback\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.callback(\"product:{id:int}\")\nasync def product(ctx, id: int):\n    p = await Product.get(id=id)\n    await ctx.edit(f\"{p.title} — {p.price} so'm\")\n\n# кнопка сама заполняет шаблон:\nButton(\"Ko'rish\", on_click=product, id=5)      # callback_data = \"product:5\"<\/code><\/pre><\/figure><p>Типы: <code>int<\/code>, <code>float<\/code>, <code>bool<\/code>, <code>str<\/code> (по умолчанию) и <code>any<\/code>. Значения приходят в обработчик с правильным типом.<\/p><h2 id=\"автоматическая-раскладка\">Автоматическая раскладка<a class=\"anchor\" href=\"#\" data-anchor=\"автоматическая-раскладка\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># список: короткие кнопки сами встают в ряд\nawait ctx.reply(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\", \"XL\"])\n\n# или задайте число столбцов\nawait ctx.reply(\"Tanlang\", buttons=items, columns=2)\n\n# dict: текст -&gt; действие (функция, URL или data)\nawait ctx.reply(\"Menyu\", buttons={\"Profil\": profile, \"Sayt\": \"https://tezbaraka.uz\"})<\/code><\/pre><\/figure><h2 id=\"защищённые-кнопки\">Защищённые кнопки<a class=\"anchor\" href=\"#\" data-anchor=\"защищённые-кнопки\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Button(\"🎁 Bonus olish\", on_click=bonus, once=True)          # только один раз\nButton(\"⏳ Taklif\", on_click=offer, ttl=\"10m\")              # истекает через 10 минут\nButton(\"👤 Faqat siz\", on_click=mine, only=ctx.user_id)     # другие не смогут нажать<\/code><\/pre><\/figure><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Telegram ограничивает callback_data 64 байтами. nicebot хранит длинные данные в базе и кладёт в кнопку короткий ключ, вы этого даже не заметите. На нажатия тоже отвечается автоматически, поэтому «часики» на кнопке не зависают.<\/p><\/aside>", "toc": [["кнопка-и-её-действие", "Кнопка и её действие"], ["передача-параметров", "Передача параметров"], ["шаблоны-callback", "Шаблоны callback"], ["автоматическая-раскладка", "Автоматическая раскладка"], ["защищённые-кнопки", "Защищённые кнопки"]], "text": "Кнопка и её действие Button принимает текст и одно действие. Удобнее всего on_click : при нажатии вызывается обычная функция. Не нужно придумывать callback data и ловить её отдельным обработчиком. bot.py Тип Запись Функция Button(\"OK\", on_click=func) Ссылка Button(\"Сайт\", url=\"https://...\") Mini App Button(\"App\", webapp=\"https://...\") Копирование Button(\"Код\", copy=\"PROMO\") Поделиться Button(\"Поделиться\", share=\"текст\") Обычная data Button(\"Да\", data=\"yes\") Оплата Button(\"Оплатить\", pay=True) Передача параметров Python Шаблоны callback Python Типы: int , float , bool , str (по умолчанию) и any . Значения приходят в обработчик с правильным типом. Автоматическая раскладка Python Защищённые кнопки Python Telegram ограничивает callback_data 64 байтами. nicebot хранит длинные данные в базе и кладёт в кнопку короткий ключ, вы этого даже не заметите. На нажатия тоже отвечается автоматически, поэтому «часики» на кнопке не зависают.", "min": 1}, "keyboards": {"title": "Клавиатура и переключатели", "desc": "Нижняя клавиатура, кнопки контакта и геолокации, переключатели Toggle.", "html": "<h2 id=\"нижняя-reply-клавиатура\">Нижняя (reply) клавиатура<a class=\"anchor\" href=\"#\" data-anchor=\"нижняя-reply-клавиатура\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Raqamingizni yuboring\", keyboard=[\"📞 Raqam yuborish:contact\"])\nawait ctx.reply(\"Qayerdasiz?\", keyboard=[\"📍 Joylashuv:location\"])\nawait ctx.reply(\"Menyu\", keyboard=[\"🛍 Do'kon\", \"📞 Aloqa\", \"ℹ️ Haqida\"], columns=2)\nawait ctx.reply(\"Yopildi\", remove_keyboard=True)<\/code><\/pre><\/figure><p>Суффикс <code>:contact<\/code> создаёт кнопку запроса номера, а <code>:location<\/code> — кнопку запроса геолокации. Для сложных случаев есть <code>ReplyButton(\"...\", webapp=...)<\/code>.<\/p><h2 id=\"toggle-включить-и-выключить\">Toggle: включить и выключить<a class=\"anchor\" href=\"#\" data-anchor=\"toggle-включить-и-выключить\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Для меню настроек. При нажатии ✅ и ⬜️ меняются сами, а значение сохраняется для каждого пользователя.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Toggle\n\n@bot.command(\"sozlamalar\")\nasync def settings_menu(ctx):\n    await ctx.reply(\"⚙️ Sozlamalar\", buttons=[\n        [Toggle(\"Bildirishnomalar\", key=\"notify\", default=True)],\n        [Toggle(\"Kechki rejim\", key=\"night\")],\n    ])\n\n# читайте значение где угодно:\nif await ctx.setting(\"notify\"):\n    ...<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/sozlamalar<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>⚙️ Sozlamalar<\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Bildirishnomalar<\/span><\/div><div class=\"kb-row\"><span>⬜️ Kechki rejim<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 ⬜️ Kechki rejim<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>⚙️ Sozlamalar <i class=\"edited\" data-t=\"edited\"><\/i><\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Bildirishnomalar<\/span><\/div><div class=\"kb-row\"><span>✅ Kechki rejim<\/span><\/div><\/div><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>Чтобы сразу реагировать на изменение, укажите <code>Toggle(..., on_change=func)<\/code>: будет вызвана <code>func(ctx, value)<\/code>.<\/p>", "toc": [["нижняя-reply-клавиатура", "Нижняя (reply) клавиатура"], ["toggle-включить-и-выключить", "Toggle: включить и выключить"]], "text": "Нижняя (reply) клавиатура Python Суффикс :contact создаёт кнопку запроса номера, а :location — кнопку запроса геолокации. Для сложных случаев есть ReplyButton(\"...\", webapp=...) . Toggle: включить и выключить Для меню настроек. При нажатии ✅ и ⬜️ меняются сами, а значение сохраняется для каждого пользователя. bot.py Чтобы сразу реагировать на изменение, укажите Toggle(..., on_change=func) : будет вызвана func(ctx, value) .", "min": 1}, "conversations": {"title": "Диалоги", "desc": "ask, confirm, choose и form — диалоги без классов FSM.", "html": "<p>Это главное удобство nicebot. Вы задаёте вопрос и ждёте ответ прямо внутри той же функции.<\/p><h2 id=\"ask\">ask<a class=\"anchor\" href=\"#\" data-anchor=\"ask\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date\n\n@bot.command(\"register\")\nasync def register(ctx):\n    name  = await ctx.ask(\"Ismingiz?\")\n    age   = await ctx.ask(\"Yoshingiz?\", int)        # переспрашивает, если не число\n    phone = await ctx.ask(\"Raqamingiz?\", Phone)     # с кнопкой \"Отправить номер\"\n    size  = await ctx.ask(\"O'lcham?\", buttons=[\"S\", \"M\", \"L\"])\n    await ctx.reply(f\"Rahmat, {name}!\")<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/register<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>Ismingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:2\"><p>Ali<\/p><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Yoshingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:4\"><p>20<\/p><\/div><div class=\"msg bot\" style=\"--i:5\"><p>Raqamingiz?<\/p><\/div><div class=\"msg me\" style=\"--i:6\"><p>90 123 45 67<\/p><\/div><div class=\"msg bot\" style=\"--i:7\"><p>O'lcham?<\/p><div class=\"kb\"><div class=\"kb-row\"><span>S<\/span><span>M<\/span><span>L<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:8\"><span>👆 M<\/span><\/div><div class=\"msg bot\" style=\"--i:9\"><p>Rahmat, Ali!<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><ul><li>Если пользователь напишет <code>/cancel<\/code> или нажмёт «🚫 Отмена», диалог тихо завершится<\/li><li>Если 10 минут нет ответа, появится «⌛️ Время ожидания истекло». Это меняется через <code>timeout=\"5m\"<\/code><\/li><li>При неверном значении показывается понятная ошибка и вопрос задаётся снова. Число попыток задаётся через <code>retries=<\/code><\/li><\/ul><h2 id=\"confirm\">confirm<a class=\"anchor\" href=\"#\" data-anchor=\"confirm\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><div class=\"demo\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">if await ctx.confirm(\"Buyurtmani tasdiqlaysizmi?\"):\n    await ctx.reply(\"✅ Qabul qilindi\")\nelse:\n    await ctx.reply(\"Bekor qilindi\")<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg bot\" style=\"--i:0\"><p>Buyurtmani tasdiqlaysizmi?<\/p><div class=\"kb\"><div class=\"kb-row\"><span>✅ Ha<\/span><span>❌ Yo'q<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:1\"><span>👆 ✅ Ha<\/span><\/div><div class=\"msg bot\" style=\"--i:2\"><p>✅ Qabul qilindi<\/p><\/div><\/div><\/div><!--/chat--><\/div><\/div><h2 id=\"choose\">choose<a class=\"anchor\" href=\"#\" data-anchor=\"choose\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">city = await ctx.choose(\"Shahringiz?\", [\"Toshkent\", \"Navoiy\", \"Buxoro\"])\n\ntags = await ctx.choose(\n    \"Qiziqishlaringiz?\",\n    {\"⚽️ Sport\": \"sport\", \"🎵 Musiqa\": \"music\", \"💻 IT\": \"it\"},\n    multiple=True,       # отметить ✅/⬜️ и нажать \"Готово\"\n)                        # -&gt; [\"sport\", \"it\"]<\/code><\/pre><\/figure><h2 id=\"form-несколько-вопросов-подряд\">form: несколько вопросов подряд<a class=\"anchor\" href=\"#\" data-anchor=\"form-несколько-вопросов-подряд\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date, Integer\n\ndata = await ctx.form(\n    name=\"Ismingiz?\",\n    age=Integer(\"Yoshingiz?\", min=14, max=99),\n    phone=Phone(\"Telefon raqamingiz?\"),\n    email=Email(\"Email manzilingiz?\"),\n    birthday=Date(\"Tug'ilgan kuningiz? (KK.OO.YYYY)\"),\n)\nawait ctx.reply(f\"{data.name}, {data.phone}\")<\/code><\/pre><\/figure><p>Результат <code>form<\/code> — это <code>dict<\/code>, но к полям можно обращаться и через точку: <code>data.name<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p>Можно вести диалоги с тысячами пользователей одновременно. Каждый ждёт в своём обработчике и не мешает остальным.<\/p><\/aside>", "toc": [["ask", "ask"], ["confirm", "confirm"], ["choose", "choose"], ["form-несколько-вопросов-подряд", "form: несколько вопросов подряд"]], "text": "Это главное удобство nicebot. Вы задаёте вопрос и ждёте ответ прямо внутри той же функции. ask bot.py Если пользователь напишет /cancel или нажмёт «🚫 Отмена», диалог тихо завершится Если 10 минут нет ответа, появится «⌛️ Время ожидания истекло». Это меняется через timeout=\"5m\" При неверном значении показывается понятная ошибка и вопрос задаётся снова. Число попыток задаётся через retries= confirm bot.py choose Python form: несколько вопросов подряд Python Результат form — это dict , но к полям можно обращаться и через точку: data.name . Можно вести диалоги с тысячами пользователей одновременно. Каждый ждёт в своём обработчике и не мешает остальным.", "min": 1}, "validators": {"title": "Валидаторы", "desc": "Проверка телефона, email, даты, чисел и других ответов.", "html": "<p>Валидатор проверяет ответ пользователя и превращает его в чистое значение.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Text, Integer, Number, Phone, Email, Url, Date, Choice, Regex, Photo, File, Location\n\nawait ctx.ask(\"Izoh?\", Text(min=10, max=500))\nawait ctx.ask(\"Summa?\", Number(min=1000))\nawait ctx.ask(\"Rasm yuboring\", Photo)              # -&gt; PhotoSize (есть file_id)\nawait ctx.ask(\"Pasport seriyasi?\", Regex(r\"[A-Z]{2}\\d{7}\"))\nawait ctx.ask(\"Kod?\", lambda t: t.upper())         # своя функция<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Валидатор<\/th><th>Возвращает<\/th><th>Дополнительно<\/th><\/tr><\/thead><tbody><tr><td><code>Text(min=, max=)<\/code><\/td><td><code>str<\/code><\/td><td>Ограничение длины<\/td><\/tr><tr><td><code>Integer(min=, max=)<\/code> / <code>int<\/code><\/td><td><code>int<\/code><\/td><td>Понимает пробелы: <code>1 000 000<\/code><\/td><\/tr><tr><td><code>Number<\/code> / <code>float<\/code><\/td><td><code>float<\/code><\/td><td>Принимает запятую: <code>12,5<\/code><\/td><\/tr><tr><td><code>Phone<\/code><\/td><td><code>\"+998901234567\"<\/code><\/td><td>Кнопка контакта. Проверяет коды узбекских операторов<\/td><\/tr><tr><td><code>Email<\/code><\/td><td><code>str<\/code><\/td><td>Приводит к нижнему регистру<\/td><\/tr><tr><td><code>Url<\/code><\/td><td><code>str<\/code><\/td><td>Должна начинаться с <code>https://<\/code><\/td><\/tr><tr><td><code>Date(format=)<\/code><\/td><td><code>date<\/code><\/td><td>Формат по умолчанию: <code>ДД.ММ.ГГГГ<\/code><\/td><\/tr><tr><td><code>Choice(choices=)<\/code><\/td><td><code>str<\/code><\/td><td>Показывает варианты кнопками<\/td><\/tr><tr><td><code>Regex(pattern)<\/code><\/td><td><code>str<\/code><\/td><td><\/td><\/tr><tr><td><code>Photo<\/code> / <code>File<\/code><\/td><td>медиа-объект<\/td><td>Есть <code>.file_id<\/code><\/td><\/tr><tr><td><code>Location<\/code><\/td><td><code>Location<\/code><\/td><td>Кнопка геолокации<\/td><\/tr><\/tbody><\/table><\/div><p>Номер телефона можно вводить в любом виде: <code>90 123 45 67<\/code>, <code>+998 (90) 123-45-67<\/code> или <code>8 90 1234567<\/code>. Результат всегда <code>+998901234567<\/code>.<\/p>", "toc": [], "text": "Валидатор проверяет ответ пользователя и превращает его в чистое значение. Python Валидатор Возвращает Дополнительно Text(min=, max=) str Ограничение длины Integer(min=, max=) / int int Понимает пробелы: 1 000 000 Number / float float Принимает запятую: 12,5 Phone \"+998901234567\" Кнопка контакта. Проверяет коды узбекских операторов Email str Приводит к нижнему регистру Url str Должна начинаться с https:// Date(format=) date Формат по умолчанию: ДД.ММ.ГГГГ Choice(choices=) str Показывает варианты кнопками Regex(pattern) str Photo / File медиа-объект Есть .file_id Location Location Кнопка геолокации Номер телефона можно вводить в любом виде: 90 123 45 67 , +998 (90) 123-45-67 или 8 90 1234567 . Результат всегда +998901234567 .", "min": 1}, "state": {"title": "Состояния (state)", "desc": "Состояние в базе для процессов, которые длятся днями.", "html": "<p>Чаще всего хватает <code>ctx.ask()<\/code>. Но если пользователь долго, например несколько дней, находится на одном шаге, используйте состояние. Оно хранится в базе и не теряется после перезапуска.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"feedback\")\nasync def feedback(ctx):\n    await ctx.set_state(\"feedback\", step=1)\n    await ctx.reply(\"Fikringizni yozing:\")\n\n@bot.text(state=\"feedback\")\nasync def got_feedback(ctx, text):\n    data = await ctx.state_data()      # {\"step\": 1}\n    await ctx.clear_state()\n    await ctx.reply(\"Rahmat!\")<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Метод<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>await ctx.set_state(\"имя\", **data)<\/code><\/td><td>Установить состояние<\/td><\/tr><tr><td><code>await ctx.get_state()<\/code><\/td><td>Текущее состояние или <code>None<\/code><\/td><\/tr><tr><td><code>await ctx.state_data()<\/code><\/td><td>Сохранённые данные<\/td><\/tr><tr><td><code>await ctx.update_data(**data)<\/code><\/td><td>Добавить данные<\/td><\/tr><tr><td><code>await ctx.clear_state()<\/code><\/td><td>Очистить<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [], "text": "Чаще всего хватает ctx.ask() . Но если пользователь долго, например несколько дней, находится на одном шаге, используйте состояние. Оно хранится в базе и не теряется после перезапуска. Python Метод Значение await ctx.set_state(\"имя\", **data) Установить состояние await ctx.get_state() Текущее состояние или None await ctx.state_data() Сохранённые данные await ctx.update_data(**data) Добавить данные await ctx.clear_state() Очистить", "min": 1}, "menus": {"title": "Меню и пагинация", "desc": "Многоуровневое меню и постраничный вывод длинных списков.", "html": "<h2 id=\"многоуровневое-меню\">Многоуровневое меню<a class=\"anchor\" href=\"#\" data-anchor=\"многоуровневое-меню\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Меню описывается словарём. Навигация и кнопка «⬅️ Назад» работают автоматически, а сообщение редактируется на месте, без отправки нового.<\/p><div class=\"demo stack\"><div class=\"demo-code\"><figure class=\"code\"><figcaption><span class=\"code-lang\">bot.py<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Menu\n\nmain = Menu(\"🏠 Bosh menyu\", {\n    \"🛍 Do'kon\": Menu(\"Bo'limni tanlang\", {\n        \"👕 Kiyim\": \"Kiyimlar tez orada qo'shiladi\",\n        \"📚 Kitoblar\": show_books,        # вызывается функция\n    }),\n    \"📞 Aloqa\": \"+998 90 123 45 67\",\n    \"🌐 Sayt\": \"https://tezbaraka.uz\",\n})\n\n@bot.command(\"menu\")\nasync def menu(ctx):\n    await ctx.menu(main)    # \"⬅️ Назад\" добавляется сам<\/code><\/pre><\/figure><\/div><div class=\"demo-chat\"><div class=\"demo-label\"><span class=\"dot\"><\/span><span data-t=\"result\"><\/span><\/div><!--chat--><div class=\"chat\" data-chat><div class=\"chat-head\"><span class=\"chat-ava\" aria-hidden=\"true\">nb<\/span><div class=\"chat-who\"><b>nicebot<\/b><small data-t=\"bot\"><\/small><\/div><button class=\"chat-replay\" type=\"button\" data-replay data-t-title=\"replay\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><path d=\"M4 4v4.5h4.5\"/><\/svg><\/button><\/div><div class=\"chat-body\"><div class=\"msg me\" style=\"--i:0\"><p>/menu<\/p><\/div><div class=\"msg bot\" style=\"--i:1\"><p>🏠 Bosh menyu<\/p><div class=\"kb\"><div class=\"kb-row\"><span>🛍 Do'kon<\/span><span>📞 Aloqa<\/span><span>🌐 Sayt ↗<\/span><\/div><\/div><\/div><div class=\"tap\" style=\"--i:2\"><span>👆 🛍 Do'kon<\/span><\/div><div class=\"msg bot\" style=\"--i:3\"><p>Bo'limni tanlang <i class=\"edited\" data-t=\"edited\"><\/i><\/p><div class=\"kb\"><div class=\"kb-row\"><span>👕 Kiyim<\/span><span>📚 Kitoblar<\/span><\/div><div class=\"kb-row\"><span>⬅️ Orqaga<\/span><\/div><\/div><\/div><\/div><\/div><!--/chat--><\/div><\/div><p>Типы значений: текст (будет показан), <code>Menu<\/code> или <code>dict<\/code> (подменю), функция (будет вызвана), URL (кнопка-ссылка) или <code>Button<\/code>.<\/p><h2 id=\"пагинация\">Пагинация<a class=\"anchor\" href=\"#\" data-anchor=\"пагинация\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Разбивает длинный список на страницы с кнопками ◀️ 2/5 ▶️.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">products = await Product.all().order_by(\"title\")\nawait ctx.paginate(\n    products,\n    per_page=10,\n    title=\"📦 Mahsulotlar\",\n    render=lambda p, i: f\"{i + 1}. {p.title} — {p.price} so'm\",\n)\n# можно листать и кнопки:\nawait ctx.paginate([Button(p.title, on_click=open_product, id=p.id) for p in products], columns=2)<\/code><\/pre><\/figure>", "toc": [["многоуровневое-меню", "Многоуровневое меню"], ["пагинация", "Пагинация"]], "text": "Многоуровневое меню Меню описывается словарём. Навигация и кнопка «⬅️ Назад» работают автоматически, а сообщение редактируется на месте, без отправки нового. bot.py Типы значений: текст (будет показан), Menu или dict (подменю), функция (будет вызвана), URL (кнопка-ссылка) или Button . Пагинация Разбивает длинный список на страницы с кнопками ◀️ 2/5 ▶️. Python", "min": 1}, "database": {"title": "База данных (ORM)", "desc": "Один ORM для SQLite, PostgreSQL, MySQL и MongoDB.", "html": "<p>В nicebot есть собственная ORM. Один и тот же код работает в SQLite, PostgreSQL, MySQL/MariaDB и MongoDB. Все четыре проверены автотестами.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Nicebot(db=\"sqlite:///bot.db\")\nNicebot(db=\"postgres://user:pass@localhost:5432/mybot\")\nNicebot(db=\"mysql://user:pass@localhost:3306/mybot\")\nNicebot(db=\"mongodb://localhost:27017/mybot\")<\/code><\/pre><\/figure><h2 id=\"модель\">Модель<a class=\"anchor\" href=\"#\" data-anchor=\"модель\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Model, fields\n\nclass Product(Model):\n    title = fields.Str(120)\n    price = fields.Int(default=0)\n    active = fields.Bool(default=True)\n    tags = fields.JSON(default=list)\n    created = fields.DateTime(auto_now_add=True)\n\nclass Order(Model):\n    user = fields.ForeignKey(\"User\")\n    product = fields.ForeignKey(Product)\n    qty = fields.Int(default=1)<\/code><\/pre><\/figure><p>Поля: <code>Int<\/code>, <code>BigInt<\/code>, <code>Float<\/code>, <code>Str(max_length)<\/code>, <code>Text<\/code>, <code>Bool<\/code>, <code>DateTime(auto_now_add=, auto_now=)<\/code>, <code>Date<\/code>, <code>JSON<\/code> и <code>ForeignKey<\/code>. Общие параметры: <code>default=<\/code>, <code>null=<\/code>, <code>unique=<\/code>, <code>index=<\/code> и <code>choices=<\/code>.<\/p><aside class=\"note\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 7.6v.2\"/><\/svg><p><strong>Автомиграция:<\/strong> при запуске бота создаются таблицы. Если добавить в модель новое поле, столбец добавится сам. Ваши данные никогда не удаляются.<\/p><\/aside><h2 id=\"создание-чтение-обновление-удаление\">Создание, чтение, обновление, удаление<a class=\"anchor\" href=\"#\" data-anchor=\"создание-чтение-обновление-удаление\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">p = await Product.create(title=\"Kitob\", price=50_000)\n\np = await Product.get(id=1)              # если нет — DoesNotExist\np = await Product.get_or_none(title=\"X\") # если нет — None\nuser, created = await User.get_or_create(id=5, defaults={\"first_name\": \"Ali\"})\n\np.price = 45_000\nawait p.save()\nawait p.update(price=40_000)            # только это поле\nawait p.increment(\"price\", 1000)\nawait p.delete()<\/code><\/pre><\/figure><h2 id=\"запросы\">Запросы<a class=\"anchor\" href=\"#\" data-anchor=\"запросы\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">cheap = await Product.filter(price__lt=100_000, active=True).order_by(\"price\")\ncount = await Product.filter(title__icontains=\"kitob\").count()\nlast5 = await Product.all().order_by(\"-created\").limit(5)\npage2 = await Product.all().page(2, 10)\ntitles = await Product.all().values_list(\"title\")\ntotal = await Order.filter(user=ctx.user).sum(\"qty\")\n\nfrom nicebot import Q, Col\nawait Product.filter(Q(price__gt=1_000_000) | Q(active=False))\nawait User.filter(id=5).update(balance=Col(\"balance\") + 1000)<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Lookup<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>price=5<\/code><\/td><td>равно<\/td><\/tr><tr><td><code>price__ne=5<\/code><\/td><td>не равно<\/td><\/tr><tr><td><code>__gt<\/code> <code>__gte<\/code> <code>__lt<\/code> <code>__lte<\/code><\/td><td>больше или меньше<\/td><\/tr><tr><td><code>__in=[...]<\/code> / <code>__not_in<\/code><\/td><td>в списке или вне его<\/td><\/tr><tr><td><code>__contains<\/code> / <code>__icontains<\/code><\/td><td>содержит (<code>i<\/code> — без учёта регистра)<\/td><\/tr><tr><td><code>__startswith<\/code> / <code>__endswith<\/code><\/td><td>начинается или заканчивается на<\/td><\/tr><tr><td><code>__isnull=True<\/code><\/td><td>пусто<\/td><\/tr><tr><td><code>__between=(a, b)<\/code><\/td><td>в диапазоне<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"foreignkey\">ForeignKey<a class=\"anchor\" href=\"#\" data-anchor=\"foreignkey\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p><code>await order.product<\/code> загружает связанный объект и кэширует его. <code>order.product_id<\/code> — это само число.<\/p><h2 id=\"транзакции\">Транзакции<a class=\"anchor\" href=\"#\" data-anchor=\"транзакции\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async with bot.db.transaction():\n    await Order.create(user=ctx.user, product=p)\n    await p.update(stock=Col(\"stock\") - 1)\n# при ошибке отменятся оба действия<\/code><\/pre><\/figure><p>В MongoDB транзакции работают только в replica set, поэтому там <code>transaction()<\/code> ничего не делает.<\/p>", "toc": [["модель", "Модель"], ["создание-чтение-обновление-удаление", "Создание, чтение, обновление, удаление"], ["запросы", "Запросы"], ["foreignkey", "ForeignKey"], ["транзакции", "Транзакции"]], "text": "В nicebot есть собственная ORM. Один и тот же код работает в SQLite, PostgreSQL, MySQL/MariaDB и MongoDB. Все четыре проверены автотестами. Python Модель Python Поля: Int , BigInt , Float , Str(max_length) , Text , Bool , DateTime(auto_now_add=, auto_now=) , Date , JSON и ForeignKey . Общие параметры: default= , null= , unique= , index= и choices= . Автомиграция: при запуске бота создаются таблицы. Если добавить в модель новое поле, столбец добавится сам. Ваши данные никогда не удаляются. Создание, чтение, обновление, удаление Python Запросы Python Lookup Значение price=5 равно price__ne=5 не равно __gt __gte __lt __lte больше или меньше __in=[...] / __not_in в списке или вне его __contains / __icontains содержит ( i — без учёта регистра) __startswith / __endswith начинается или заканчивается на __isnull=True пусто __between=(a, b) в диапазоне ForeignKey await order.product загружает связанный объект и кэширует его. order.product_id — это само число. Транзакции Python В MongoDB транзакции работают только в replica set, поэтому там transaction() ничего не делает.", "min": 2}, "users": {"title": "Пользователи и рефералы", "desc": "Пользователи сохраняются сами, свои поля и реферальная система.", "html": "<p>Каждый, кто написал боту, автоматически сохраняется в таблицу <code>nb_users<\/code> и доступен через <code>ctx.user<\/code>. Имя, username и время последней активности тоже обновляются сами.<\/p><div class=\"table\"><table><thead><tr><th>Поле<\/th><th><\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>Telegram id<\/td><\/tr><tr><td><code>first_name<\/code>, <code>last_name<\/code>, <code>username<\/code><\/td><td><\/td><\/tr><tr><td><code>lang<\/code><\/td><td>Выбранный язык<\/td><\/tr><tr><td><code>phone<\/code><\/td><td>Телефон<\/td><\/tr><tr><td><code>is_blocked<\/code><\/td><td>Заблокировал ли бота (автоматически)<\/td><\/tr><tr><td><code>is_premium<\/code><\/td><td>Telegram Premium<\/td><\/tr><tr><td><code>referrer_id<\/code><\/td><td>Кто пригласил<\/td><\/tr><tr><td><code>data<\/code><\/td><td>Любой JSON<\/td><\/tr><tr><td><code>created_at<\/code>, <code>last_seen<\/code><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"добавить-свои-поля\">Добавить свои поля<a class=\"anchor\" href=\"#\" data-anchor=\"добавить-свои-поля\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot, User, fields\n\nclass Customer(User):              # та же таблица \"nb_users\", новые столбцы\n    balance = fields.Int(default=0)\n    city = fields.Str(64, null=True)\n\nbot = Nicebot(token=\"...\", user_model=Customer)\n\n@bot.command(\"balans\")\nasync def balans(ctx, user: Customer):\n    await ctx.reply(f\"Balans: {user.balance} so'm\")<\/code><\/pre><\/figure><h2 id=\"реферальная-система\">Реферальная система<a class=\"anchor\" href=\"#\" data-anchor=\"реферальная-система\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Новому пользователю, пришедшему по ссылке <code>ctx.ref_link<\/code>, <code>referrer_id<\/code> записывается автоматически.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"taklif\")\nasync def invite(ctx):\n    n = await ctx.user.referrals_count()\n    await ctx.reply(f\"Havolangiz: {ctx.ref_link}\\nTaklif qilganlaringiz: {n}\")\n\n@bot.on_referral\nasync def rewarded(ctx, referrer):\n    await referrer.update(balance=Col(\"balance\") + 5000)\n    await bot.send_message(referrer.id, \"🎉 Do'stingiz qo'shildi, +5000!\")<\/code><\/pre><\/figure><h2 id=\"события-жизненного-цикла\">События жизненного цикла<a class=\"anchor\" href=\"#\" data-anchor=\"события-жизненного-цикла\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on_startup\nasync def ready(bot):\n    await bot.notify_admins(\"✅ Bot ishga tushdi\")\n\n@bot.on_new_user\nasync def welcome(ctx, user):\n    await bot.notify_admins(f\"🆕 Yangi foydalanuvchi: {user.mention}\")<\/code><\/pre><\/figure>", "toc": [["добавить-свои-поля", "Добавить свои поля"], ["реферальная-система", "Реферальная система"], ["события-жизненного-цикла", "События жизненного цикла"]], "text": "Каждый, кто написал боту, автоматически сохраняется в таблицу nb_users и доступен через ctx.user . Имя, username и время последней активности тоже обновляются сами. Поле id Telegram id first_name , last_name , username lang Выбранный язык phone Телефон is_blocked Заблокировал ли бота (автоматически) is_premium Telegram Premium referrer_id Кто пригласил data Любой JSON created_at , last_seen Добавить свои поля Python Реферальная система Новому пользователю, пришедшему по ссылке ctx.ref_link , referrer_id записывается автоматически. Python События жизненного цикла Python", "min": 1}, "i18n": {"title": "Мультиязычность", "desc": "JSON-файлы переводов, чтобы бот говорил на нескольких языках.", "html": "<p>Положите в папку <code>locales/<\/code> по JSON-файлу на каждый язык:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">JSON<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-json\">// locales/uz.json\n{ \"hello\": \"Assalomu alaykum, {name}!\", \"menu\": { \"shop\": \"🛍 Do'kon\" } }\n\n// locales/ru.json\n{ \"hello\": \"Здравствуйте, {name}!\", \"menu\": { \"shop\": \"🛍 Магазин\" } }<\/code><\/pre><\/figure><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(ctx.t(\"hello\", name=ctx.name))\nawait ctx.reply(ctx.t(\"menu.shop\"))\nawait ctx.set_lang(\"ru\")        # сохраняет язык пользователя<\/code><\/pre><\/figure><p>Язык пользователя определяется в таком порядке: сначала язык, сохранённый через <code>ctx.set_lang()<\/code>, затем язык приложения Telegram, и в конце <code>Nicebot(lang=\"uz\")<\/code>. Если ключ не найден, берётся текст на языке по умолчанию. Собственные тексты библиотеки («Да», «Отменено» и другие) уже есть на uz, ru и en. Их тоже можно переопределить в своём файле, например: <code>\"nb.yes\": \"Конечно\"<\/code>.<\/p>", "toc": [], "text": "Положите в папку locales/ по JSON-файлу на каждый язык: JSON Python Язык пользователя определяется в таком порядке: сначала язык, сохранённый через ctx.set_lang() , затем язык приложения Telegram, и в конце Nicebot(lang=\"uz\") . Если ключ не найден, берётся текст на языке по умолчанию. Собственные тексты библиотеки («Да», «Отменено» и другие) уже есть на uz, ru и en. Их тоже можно переопределить в своём файле, например: \"nb.yes\": \"Конечно\" .", "min": 1}, "admin": {"title": "Админ-панель и статистика", "desc": "Готовые админ-команды, статистика и отчёты об ошибках.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", admins=[123456789])\n# появляются в меню админов автоматически:\n# /stats        — статистика\n# /broadcast    — реплай на сообщение, чтобы разослать\n# /maintenance  — режим техработ (on / off)\n# /backup       — копия базы SQLite<\/code><\/pre><\/figure><p>Админ-команды видны только в меню администраторов. Обычные пользователи их не видят и не могут использовать.<\/p><h2 id=\"статистика\">Статистика<a class=\"anchor\" href=\"#\" data-anchor=\"статистика\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">s = await bot.stats()\n# {\"users\": 1520, \"dau\": 310, \"mau\": 1104, \"new_today\": 42, \"blocked\": 37,\n#  \"retention_d7\": 34.5, \"top_commands\": [(\"start\", 900), ...], ...}<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Показатель<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>DAU / WAU / MAU<\/td><td>Активные за 1, 7 и 30 дней<\/td><\/tr><tr><td><code>retention_d7<\/code><\/td><td>Сколько пришедших 7–14 дней назад вернулись за последнюю неделю (%)<\/td><\/tr><tr><td><code>top_commands<\/code><\/td><td>Самые популярные команды за 30 дней<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"режим-техработ\">Режим техработ<a class=\"anchor\" href=\"#\" data-anchor=\"режим-техработ\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Когда включено <code>await bot.maintenance(True)<\/code>, все, кроме админов, получают сообщение «🛠 технические работы». Режим сохраняется и после перезапуска.<\/p><h2 id=\"отчёты-об-ошибках\">Отчёты об ошибках<a class=\"anchor\" href=\"#\" data-anchor=\"отчёты-об-ошибках\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><p>Если в обработчике произошла ошибка, пользователь получает вежливое сообщение, а админы — отчёт с traceback. Одинаковая ошибка отправляется не чаще раза в 10 минут.<\/p>", "toc": [["статистика", "Статистика"], ["режим-техработ", "Режим техработ"], ["отчёты-об-ошибках", "Отчёты об ошибках"]], "text": "Python Админ-команды видны только в меню администраторов. Обычные пользователи их не видят и не могут использовать. Статистика Python Показатель Значение DAU / WAU / MAU Активные за 1, 7 и 30 дней retention_d7 Сколько пришедших 7–14 дней назад вернулись за последнюю неделю (%) top_commands Самые популярные команды за 30 дней Режим техработ Когда включено await bot.maintenance(True) , все, кроме админов, получают сообщение «🛠 технические работы». Режим сохраняется и после перезапуска. Отчёты об ошибках Если в обработчике произошла ошибка, пользователь получает вежливое сообщение, а админы — отчёт с traceback. Одинаковая ошибка отправляется не чаще раза в 10 минут.", "min": 1}, "broadcast": {"title": "Рассылка", "desc": "Сообщение всем пользователям: с лимитом скорости и продолжением.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">result = await bot.broadcast(\n    \"🎉 Yangi aksiya boshlandi!\",\n    buttons=[Button(\"Ko'rish\", url=\"https://tezbaraka.uz\")],\n    id=\"aksiya-noyabr\",     # при остановке продолжится с тем же id\n)\n# {\"total\": 1500, \"sent\": 1462, \"failed\": 38, \"blocked\": 35}\n\nawait bot.broadcast(lambda uid: f\"Salom! Sizning id: {uid}\")\nawait bot.broadcast(None, copy_from=(chat_id, message_id))   # скопировать любое сообщение<\/code><\/pre><\/figure><ul><li>Лимиты Telegram учитываются: скорость по умолчанию 25 сообщений в секунду, меняется через <code>rate=<\/code><\/li><li>При ошибке 429 библиотека ждёт нужное время и продолжает<\/li><li>Заблокировавшие бота помечаются <code>is_blocked=True<\/code> и в следующий раз пропускаются<\/li><li>Если указан <code>id=<\/code>, прогресс сохраняется каждые 20 сообщений. Если бот остановился, вызовите рассылку снова с тем же <code>id<\/code>, и она продолжится с места остановки<\/li><li>Функция <code>on_progress=<\/code> получает текущее состояние каждые 3 секунды<\/li><\/ul>", "toc": [], "text": "Python Лимиты Telegram учитываются: скорость по умолчанию 25 сообщений в секунду, меняется через rate= При ошибке 429 библиотека ждёт нужное время и продолжает Заблокировавшие бота помечаются is_blocked=True и в следующий раз пропускаются Если указан id= , прогресс сохраняется каждые 20 сообщений. Если бот остановился, вызовите рассылку снова с тем же id , и она продолжится с места остановки Функция on_progress= получает текущее состояние каждые 3 секунды", "min": 1}, "payments": {"title": "Платежи (Telegram Stars)", "desc": "Приём оплаты через Telegram Stars.", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"premium\")\nasync def premium(ctx):\n    await ctx.invoice(\"Premium\", \"30 kunlik obuna\", amount=100, payload=\"premium30\")\n\n@bot.paid()\nasync def paid(ctx):\n    sp = ctx.message.successful_payment\n    await ctx.user.update(data={**ctx.user.data, \"premium\": True})\n    await ctx.reply(f\"⭐️ {sp.total_amount} Stars uchun rahmat!\")<\/code><\/pre><\/figure><p><code>pre_checkout_query<\/code> подтверждается автоматически. Если хотите проверять сами, напишите обработчик <code>@bot.pre_checkout()<\/code>. Возврат денег: <code>await ctx.refund()<\/code>.<\/p>", "toc": [], "text": "Python pre_checkout_query подтверждается автоматически. Если хотите проверять сами, напишите обработчик @bot.pre_checkout() . Возврат денег: await ctx.refund() .", "min": 1}, "groups": {"title": "Группы, подписка и поддержка", "desc": "Модерация групп, капча, обязательная подписка и поддержка.", "html": "<h2 id=\"управление-группой\">Управление группой<a class=\"anchor\" href=\"#\" data-anchor=\"управление-группой\" aria-hidden=\"true\" tabindex=\"-1\">#<\/a><\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">Python<\/span><button class=\"copy\" type=\"button\" data-copy aria-label=\"Copy\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8\"/><\/svg><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"warn\")\nasync def warn(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.warn(\"Reklama taqiqlangan\", limit=3)   # бан после 3\n\n@bot.command(\"mute\")\nasync def mute(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.mute(\"1h\")       # того, кому сделан реплай, на 1 час\n\nawait ctx.ban(for_=\"7d\")\nawait ctx.unban()\nawait ctx.kick()<\/code><\/pre><\/figure><p>Эти методы работают с пользователем, на чьё сообщение сделан реплай, или принимают <code
