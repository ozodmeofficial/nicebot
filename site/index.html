\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Phone, Email, Date, Integer\n\ndata = await ctx.form(\n    name=\"Ismingiz?\",\n    age=Integer(\"Yoshingiz?\", min=14, max=99),\n    phone=Phone(\"Telefon raqamingiz?\"),\n    email=Email(\"Email manzilingiz?\"),\n    birthday=Date(\"Tug'ilgan kuningiz? (KK.OO.YYYY)\"),\n)\nawait ctx.reply(f\"{data.name}, {data.phone}\")<\/code><\/pre><\/figure><p>Результат <code>form<\/code> — это <code>dict<\/code>, но к полям можно обращаться и через точку: <code>data.name<\/code>.<\/p><aside class=\"note\"><p>Можно вести диалоги с тысячами пользователей одновременно. Каждый ждёт в своём обработчике и не мешает остальным.<\/p><\/aside>", "toc": [["ask", "ask"], ["confirm", "confirm"], ["choose", "choose"], ["form-несколько-вопросов-подряд", "form: несколько вопросов подряд"]], "text": "Это главное удобство nicebot. Вы задаёте вопрос и ждёте ответ прямо внутри той же функции. ask python Если пользователь напишет /cancel или нажмёт «🚫 Отмена», диалог тихо завершится Если 10 минут нет ответа, появится «⌛️ Время ожидания истекло». Это меняется через timeout=\"5m\" При неверном значении показывается понятная ошибка и вопрос задаётся снова. Число попыток задаётся через retries= confirm python choose python form: несколько вопросов подряд python Результат form — это dict , но к полям можно обращаться и через точку: data.name . Можно вести диалоги с тысячами пользователей одновременно. Каждый ждёт в своём обработчике и не мешает остальным."}, "validators": {"title": "Валидаторы", "html": "<p>Валидатор проверяет ответ пользователя и превращает его в чистое значение.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Text, Integer, Number, Phone, Email, Url, Date, Choice, Regex, Photo, File, Location\n\nawait ctx.ask(\"Izoh?\", Text(min=10, max=500))\nawait ctx.ask(\"Summa?\", Number(min=1000))\nawait ctx.ask(\"Rasm yuboring\", Photo)              # -&gt; PhotoSize (есть file_id)\nawait ctx.ask(\"Pasport seriyasi?\", Regex(r\"[A-Z]{2}\\d{7}\"))\nawait ctx.ask(\"Kod?\", lambda t: t.upper())         # своя функция<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Валидатор<\/th><th>Возвращает<\/th><th>Дополнительно<\/th><\/tr><\/thead><tbody><tr><td><code>Text(min=, max=)<\/code><\/td><td><code>str<\/code><\/td><td>Ограничение длины<\/td><\/tr><tr><td><code>Integer(min=, max=)<\/code> / <code>int<\/code><\/td><td><code>int<\/code><\/td><td>Понимает пробелы: <code>1 000 000<\/code><\/td><\/tr><tr><td><code>Number<\/code> / <code>float<\/code><\/td><td><code>float<\/code><\/td><td>Принимает запятую: <code>12,5<\/code><\/td><\/tr><tr><td><code>Phone<\/code><\/td><td><code>\"+998901234567\"<\/code><\/td><td>Кнопка контакта. Проверяет коды узбекских операторов<\/td><\/tr><tr><td><code>Email<\/code><\/td><td><code>str<\/code><\/td><td>Приводит к нижнему регистру<\/td><\/tr><tr><td><code>Url<\/code><\/td><td><code>str<\/code><\/td><td>Должна начинаться с <code>https://<\/code><\/td><\/tr><tr><td><code>Date(format=)<\/code><\/td><td><code>date<\/code><\/td><td>Формат по умолчанию: <code>ДД.ММ.ГГГГ<\/code><\/td><\/tr><tr><td><code>Choice(choices=)<\/code><\/td><td><code>str<\/code><\/td><td>Показывает варианты кнопками<\/td><\/tr><tr><td><code>Regex(pattern)<\/code><\/td><td><code>str<\/code><\/td><td><\/td><\/tr><tr><td><code>Photo<\/code> / <code>File<\/code><\/td><td>медиа-объект<\/td><td>Есть <code>.file_id<\/code><\/td><\/tr><tr><td><code>Location<\/code><\/td><td><code>Location<\/code><\/td><td>Кнопка геолокации<\/td><\/tr><\/tbody><\/table><\/div><p>Номер телефона можно вводить в любом виде: <code>90 123 45 67<\/code>, <code>+998 (90) 123-45-67<\/code> или <code>8 90 1234567<\/code>. Результат всегда <code>+998901234567<\/code>.<\/p>", "toc": [], "text": "Валидатор проверяет ответ пользователя и превращает его в чистое значение. python Валидатор Возвращает Дополнительно Text(min=, max=) str Ограничение длины Integer(min=, max=) / int int Понимает пробелы: 1 000 000 Number / float float Принимает запятую: 12,5 Phone \"+998901234567\" Кнопка контакта. Проверяет коды узбекских операторов Email str Приводит к нижнему регистру Url str Должна начинаться с https:// Date(format=) date Формат по умолчанию: ДД.ММ.ГГГГ Choice(choices=) str Показывает варианты кнопками Regex(pattern) str Photo / File медиа-объект Есть .file_id Location Location Кнопка геолокации Номер телефона можно вводить в любом виде: 90 123 45 67 , +998 (90) 123-45-67 или 8 90 1234567 . Результат всегда +998901234567 ."}, "state": {"title": "Состояния (state)", "html": "<p>Чаще всего хватает <code>ctx.ask()<\/code>. Но если пользователь долго, например несколько дней, находится на одном шаге, используйте состояние. Оно хранится в базе и не теряется после перезапуска.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"feedback\")\nasync def feedback(ctx):\n    await ctx.set_state(\"feedback\", step=1)\n    await ctx.reply(\"Fikringizni yozing:\")\n\n@bot.text(state=\"feedback\")\nasync def got_feedback(ctx, text):\n    data = await ctx.state_data()      # {\"step\": 1}\n    await ctx.clear_state()\n    await ctx.reply(\"Rahmat!\")<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Метод<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>await ctx.set_state(\"имя\", **data)<\/code><\/td><td>Установить состояние<\/td><\/tr><tr><td><code>await ctx.get_state()<\/code><\/td><td>Текущее состояние или <code>None<\/code><\/td><\/tr><tr><td><code>await ctx.state_data()<\/code><\/td><td>Сохранённые данные<\/td><\/tr><tr><td><code>await ctx.update_data(**data)<\/code><\/td><td>Добавить данные<\/td><\/tr><tr><td><code>await ctx.clear_state()<\/code><\/td><td>Очистить<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [], "text": "Чаще всего хватает ctx.ask() . Но если пользователь долго, например несколько дней, находится на одном шаге, используйте состояние. Оно хранится в базе и не теряется после перезапуска. python Метод Значение await ctx.set_state(\"имя\", **data) Установить состояние await ctx.get_state() Текущее состояние или None await ctx.state_data() Сохранённые данные await ctx.update_data(**data) Добавить данные await ctx.clear_state() Очистить"}, "menus": {"title": "Меню и пагинация", "html": "<h2 id=\"многоуровневое-меню\">Многоуровневое меню<\/h2><p>Меню описывается словарём. Навигация и кнопка «⬅️ Назад» работают автоматически, а сообщение редактируется на месте, без отправки нового.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Menu\n\nmain = Menu(\"🏠 Bosh menyu\", {\n    \"🛍 Do'kon\": Menu(\"Bo'limni tanlang\", {\n        \"👕 Kiyim\": \"Kiyimlar tez orada qo'shiladi\",\n        \"📚 Kitoblar\": show_books,        # вызывается функция\n    }),\n    \"📞 Aloqa\": \"+998 90 123 45 67\",\n    \"🌐 Sayt\": \"https://tezbaraka.uz\",\n})\n\n@bot.command(\"menu\")\nasync def menu(ctx):\n    await ctx.menu(main)    # \"⬅️ Назад\" добавляется сам<\/code><\/pre><\/figure><p>Типы значений: текст (будет показан), <code>Menu<\/code> или <code>dict<\/code> (подменю), функция (будет вызвана), URL (кнопка-ссылка) или <code>Button<\/code>.<\/p><h2 id=\"пагинация\">Пагинация<\/h2><p>Разбивает длинный список на страницы с кнопками ◀️ 2/5 ▶️.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">products = await Product.all().order_by(\"title\")\nawait ctx.paginate(\n    products,\n    per_page=10,\n    title=\"📦 Mahsulotlar\",\n    render=lambda p, i: f\"{i + 1}. {p.title} — {p.price} so'm\",\n)\n# можно листать и кнопки:\nawait ctx.paginate([Button(p.title, on_click=open_product, id=p.id) for p in products], columns=2)<\/code><\/pre><\/figure>", "toc": [["многоуровневое-меню", "Многоуровневое меню"], ["пагинация", "Пагинация"]], "text": "Многоуровневое меню Меню описывается словарём. Навигация и кнопка «⬅️ Назад» работают автоматически, а сообщение редактируется на месте, без отправки нового. python Типы значений: текст (будет показан), Menu или dict (подменю), функция (будет вызвана), URL (кнопка-ссылка) или Button . Пагинация Разбивает длинный список на страницы с кнопками ◀️ 2/5 ▶️. python"}, "database": {"title": "База данных (ORM)", "html": "<p>В nicebot есть собственная ORM. Один и тот же код работает в SQLite, PostgreSQL, MySQL/MariaDB и MongoDB. Все четыре проверены автотестами.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">Nicebot(db=\"sqlite:///bot.db\")\nNicebot(db=\"postgres://user:pass@localhost:5432/mybot\")\nNicebot(db=\"mysql://user:pass@localhost:3306/mybot\")\nNicebot(db=\"mongodb://localhost:27017/mybot\")<\/code><\/pre><\/figure><h2 id=\"модель\">Модель<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Model, fields\n\nclass Product(Model):\n    title = fields.Str(120)\n    price = fields.Int(default=0)\n    active = fields.Bool(default=True)\n    tags = fields.JSON(default=list)\n    created = fields.DateTime(auto_now_add=True)\n\nclass Order(Model):\n    user = fields.ForeignKey(\"User\")\n    product = fields.ForeignKey(Product)\n    qty = fields.Int(default=1)<\/code><\/pre><\/figure><p>Поля: <code>Int<\/code>, <code>BigInt<\/code>, <code>Float<\/code>, <code>Str(max_length)<\/code>, <code>Text<\/code>, <code>Bool<\/code>, <code>DateTime(auto_now_add=, auto_now=)<\/code>, <code>Date<\/code>, <code>JSON<\/code> и <code>ForeignKey<\/code>. Общие параметры: <code>default=<\/code>, <code>null=<\/code>, <code>unique=<\/code>, <code>index=<\/code> и <code>choices=<\/code>.<\/p><aside class=\"note\"><p><strong>Автомиграция:<\/strong> при запуске бота создаются таблицы. Если добавить в модель новое поле, столбец добавится сам. Ваши данные никогда не удаляются.<\/p><\/aside><h2 id=\"создание-чтение-обновление-удаление\">Создание, чтение, обновление, удаление<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">p = await Product.create(title=\"Kitob\", price=50_000)\n\np = await Product.get(id=1)              # если нет — DoesNotExist\np = await Product.get_or_none(title=\"X\") # если нет — None\nuser, created = await User.get_or_create(id=5, defaults={\"first_name\": \"Ali\"})\n\np.price = 45_000\nawait p.save()\nawait p.update(price=40_000)            # только это поле\nawait p.increment(\"price\", 1000)\nawait p.delete()<\/code><\/pre><\/figure><h2 id=\"запросы\">Запросы<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">cheap = await Product.filter(price__lt=100_000, active=True).order_by(\"price\")\ncount = await Product.filter(title__icontains=\"kitob\").count()\nlast5 = await Product.all().order_by(\"-created\").limit(5)\npage2 = await Product.all().page(2, 10)\ntitles = await Product.all().values_list(\"title\")\ntotal = await Order.filter(user=ctx.user).sum(\"qty\")\n\nfrom nicebot import Q, Col\nawait Product.filter(Q(price__gt=1_000_000) | Q(active=False))\nawait User.filter(id=5).update(balance=Col(\"balance\") + 1000)<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Lookup<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td><code>price=5<\/code><\/td><td>равно<\/td><\/tr><tr><td><code>price__ne=5<\/code><\/td><td>не равно<\/td><\/tr><tr><td><code>__gt<\/code> <code>__gte<\/code> <code>__lt<\/code> <code>__lte<\/code><\/td><td>больше или меньше<\/td><\/tr><tr><td><code>__in=[...]<\/code> / <code>__not_in<\/code><\/td><td>в списке или вне его<\/td><\/tr><tr><td><code>__contains<\/code> / <code>__icontains<\/code><\/td><td>содержит (<code>i<\/code> — без учёта регистра)<\/td><\/tr><tr><td><code>__startswith<\/code> / <code>__endswith<\/code><\/td><td>начинается или заканчивается на<\/td><\/tr><tr><td><code>__isnull=True<\/code><\/td><td>пусто<\/td><\/tr><tr><td><code>__between=(a, b)<\/code><\/td><td>в диапазоне<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"foreignkey\">ForeignKey<\/h2><p><code>await order.product<\/code> загружает связанный объект и кэширует его. <code>order.product_id<\/code> — это само число.<\/p><h2 id=\"транзакции\">Транзакции<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">async with bot.db.transaction():\n    await Order.create(user=ctx.user, product=p)\n    await p.update(stock=Col(\"stock\") - 1)\n# при ошибке отменятся оба действия<\/code><\/pre><\/figure><p>В MongoDB транзакции работают только в replica set, поэтому там <code>transaction()<\/code> ничего не делает.<\/p>", "toc": [["модель", "Модель"], ["создание-чтение-обновление-удаление", "Создание, чтение, обновление, удаление"], ["запросы", "Запросы"], ["foreignkey", "ForeignKey"], ["транзакции", "Транзакции"]], "text": "В nicebot есть собственная ORM. Один и тот же код работает в SQLite, PostgreSQL, MySQL/MariaDB и MongoDB. Все четыре проверены автотестами. python Модель python Поля: Int , BigInt , Float , Str(max_length) , Text , Bool , DateTime(auto_now_add=, auto_now=) , Date , JSON и ForeignKey . Общие параметры: default= , null= , unique= , index= и choices= . Автомиграция: при запуске бота создаются таблицы. Если добавить в модель новое поле, столбец добавится сам. Ваши данные никогда не удаляются. Создание, чтение, обновление, удаление python Запросы python Lookup Значение price=5 равно price__ne=5 не равно __gt __gte __lt __lte больше или меньше __in=[...] / __not_in в списке или вне его __contains / __icontains содержит ( i — без учёта регистра) __startswith / __endswith начинается или заканчивается на __isnull=True пусто __between=(a, b) в диапазоне ForeignKey await order.product загружает связанный объект и кэширует его. order.product_id — это само число. Транзакции python В MongoDB транзакции работают только в replica set, поэтому там transaction() ничего не делает."}, "users": {"title": "Пользователи и рефералы", "html": "<p>Каждый, кто написал боту, автоматически сохраняется в таблицу <code>nb_users<\/code> и доступен через <code>ctx.user<\/code>. Имя, username и время последней активности тоже обновляются сами.<\/p><div class=\"table\"><table><thead><tr><th>Поле<\/th><th><\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>Telegram id<\/td><\/tr><tr><td><code>first_name<\/code>, <code>last_name<\/code>, <code>username<\/code><\/td><td><\/td><\/tr><tr><td><code>lang<\/code><\/td><td>Выбранный язык<\/td><\/tr><tr><td><code>phone<\/code><\/td><td>Телефон<\/td><\/tr><tr><td><code>is_blocked<\/code><\/td><td>Заблокировал ли бота (автоматически)<\/td><\/tr><tr><td><code>is_premium<\/code><\/td><td>Telegram Premium<\/td><\/tr><tr><td><code>referrer_id<\/code><\/td><td>Кто пригласил<\/td><\/tr><tr><td><code>data<\/code><\/td><td>Любой JSON<\/td><\/tr><tr><td><code>created_at<\/code>, <code>last_seen<\/code><\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"добавить-свои-поля\">Добавить свои поля<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot, User, fields\n\nclass Customer(User):              # та же таблица \"nb_users\", новые столбцы\n    balance = fields.Int(default=0)\n    city = fields.Str(64, null=True)\n\nbot = Nicebot(token=\"...\", user_model=Customer)\n\n@bot.command(\"balans\")\nasync def balans(ctx, user: Customer):\n    await ctx.reply(f\"Balans: {user.balance} so'm\")<\/code><\/pre><\/figure><h2 id=\"реферальная-система\">Реферальная система<\/h2><p>Новому пользователю, пришедшему по ссылке <code>ctx.ref_link<\/code>, <code>referrer_id<\/code> записывается автоматически.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"taklif\")\nasync def invite(ctx):\n    n = await ctx.user.referrals_count()\n    await ctx.reply(f\"Havolangiz: {ctx.ref_link}\\nTaklif qilganlaringiz: {n}\")\n\n@bot.on_referral\nasync def rewarded(ctx, referrer):\n    await referrer.update(balance=Col(\"balance\") + 5000)\n    await bot.send_message(referrer.id, \"🎉 Do'stingiz qo'shildi, +5000!\")<\/code><\/pre><\/figure><h2 id=\"события-жизненного-цикла\">События жизненного цикла<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on_startup\nasync def ready(bot):\n    await bot.notify_admins(\"✅ Bot ishga tushdi\")\n\n@bot.on_new_user\nasync def welcome(ctx, user):\n    await bot.notify_admins(f\"🆕 Yangi foydalanuvchi: {user.mention}\")<\/code><\/pre><\/figure>", "toc": [["добавить-свои-поля", "Добавить свои поля"], ["реферальная-система", "Реферальная система"], ["события-жизненного-цикла", "События жизненного цикла"]], "text": "Каждый, кто написал боту, автоматически сохраняется в таблицу nb_users и доступен через ctx.user . Имя, username и время последней активности тоже обновляются сами. Поле id Telegram id first_name , last_name , username lang Выбранный язык phone Телефон is_blocked Заблокировал ли бота (автоматически) is_premium Telegram Premium referrer_id Кто пригласил data Любой JSON created_at , last_seen Добавить свои поля python Реферальная система Новому пользователю, пришедшему по ссылке ctx.ref_link , referrer_id записывается автоматически. python События жизненного цикла python"}, "i18n": {"title": "Мультиязычность", "html": "<p>Положите в папку <code>locales/<\/code> по JSON-файлу на каждый язык:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">json<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-json\">// locales/uz.json\n{ \"hello\": \"Assalomu alaykum, {name}!\", \"menu\": { \"shop\": \"🛍 Do'kon\" } }\n\n// locales/ru.json\n{ \"hello\": \"Здравствуйте, {name}!\", \"menu\": { \"shop\": \"🛍 Магазин\" } }<\/code><\/pre><\/figure><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(ctx.t(\"hello\", name=ctx.name))\nawait ctx.reply(ctx.t(\"menu.shop\"))\nawait ctx.set_lang(\"ru\")        # сохраняет язык пользователя<\/code><\/pre><\/figure><p>Язык пользователя определяется в таком порядке: сначала язык, сохранённый через <code>ctx.set_lang()<\/code>, затем язык приложения Telegram, и в конце <code>Nicebot(lang=\"uz\")<\/code>. Если ключ не найден, берётся текст на языке по умолчанию. Собственные тексты библиотеки («Да», «Отменено» и другие) уже есть на uz, ru и en. Их тоже можно переопределить в своём файле, например: <code>\"nb.yes\": \"Конечно\"<\/code>.<\/p>", "toc": [], "text": "Положите в папку locales/ по JSON-файлу на каждый язык: json python Язык пользователя определяется в таком порядке: сначала язык, сохранённый через ctx.set_lang() , затем язык приложения Telegram, и в конце Nicebot(lang=\"uz\") . Если ключ не найден, берётся текст на языке по умолчанию. Собственные тексты библиотеки («Да», «Отменено» и другие) уже есть на uz, ru и en. Их тоже можно переопределить в своём файле, например: \"nb.yes\": \"Конечно\" ."}, "admin": {"title": "Админ-панель и статистика", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", admins=[123456789])\n# появляются в меню админов автоматически:\n# /stats        — статистика\n# /broadcast    — реплай на сообщение, чтобы разослать\n# /maintenance  — режим техработ (on / off)\n# /backup       — копия базы SQLite<\/code><\/pre><\/figure><p>Админ-команды видны только в меню администраторов. Обычные пользователи их не видят и не могут использовать.<\/p><h2 id=\"статистика\">Статистика<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">s = await bot.stats()\n# {\"users\": 1520, \"dau\": 310, \"mau\": 1104, \"new_today\": 42, \"blocked\": 37,\n#  \"retention_d7\": 34.5, \"top_commands\": [(\"start\", 900), ...], ...}<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Показатель<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>DAU / WAU / MAU<\/td><td>Активные за 1, 7 и 30 дней<\/td><\/tr><tr><td><code>retention_d7<\/code><\/td><td>Сколько пришедших 7–14 дней назад вернулись за последнюю неделю (%)<\/td><\/tr><tr><td><code>top_commands<\/code><\/td><td>Самые популярные команды за 30 дней<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"режим-техработ\">Режим техработ<\/h2><p>Когда включено <code>await bot.maintenance(True)<\/code>, все, кроме админов, получают сообщение «🛠 технические работы». Режим сохраняется и после перезапуска.<\/p><h2 id=\"отчёты-об-ошибках\">Отчёты об ошибках<\/h2><p>Если в обработчике произошла ошибка, пользователь получает вежливое сообщение, а админы — отчёт с traceback. Одинаковая ошибка отправляется не чаще раза в 10 минут.<\/p>", "toc": [["статистика", "Статистика"], ["режим-техработ", "Режим техработ"], ["отчёты-об-ошибках", "Отчёты об ошибках"]], "text": "python Админ-команды видны только в меню администраторов. Обычные пользователи их не видят и не могут использовать. Статистика python Показатель Значение DAU / WAU / MAU Активные за 1, 7 и 30 дней retention_d7 Сколько пришедших 7–14 дней назад вернулись за последнюю неделю (%) top_commands Самые популярные команды за 30 дней Режим техработ Когда включено await bot.maintenance(True) , все, кроме админов, получают сообщение «🛠 технические работы». Режим сохраняется и после перезапуска. Отчёты об ошибках Если в обработчике произошла ошибка, пользователь получает вежливое сообщение, а админы — отчёт с traceback. Одинаковая ошибка отправляется не чаще раза в 10 минут."}, "broadcast": {"title": "Рассылка", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">result = await bot.broadcast(\n    \"🎉 Yangi aksiya boshlandi!\",\n    buttons=[Button(\"Ko'rish\", url=\"https://tezbaraka.uz\")],\n    id=\"aksiya-noyabr\",     # при остановке продолжится с тем же id\n)\n# {\"total\": 1500, \"sent\": 1462, \"failed\": 38, \"blocked\": 35}\n\nawait bot.broadcast(lambda uid: f\"Salom! Sizning id: {uid}\")\nawait bot.broadcast(None, copy_from=(chat_id, message_id))   # скопировать любое сообщение<\/code><\/pre><\/figure><ul><li>Лимиты Telegram учитываются: скорость по умолчанию 25 сообщений в секунду, меняется через <code>rate=<\/code><\/li><li>При ошибке 429 библиотека ждёт нужное время и продолжает<\/li><li>Заблокировавшие бота помечаются <code>is_blocked=True<\/code> и в следующий раз пропускаются<\/li><li>Если указан <code>id=<\/code>, прогресс сохраняется каждые 20 сообщений. Если бот остановился, вызовите рассылку снова с тем же <code>id<\/code>, и она продолжится с места остановки<\/li><li>Функция <code>on_progress=<\/code> получает текущее состояние каждые 3 секунды<\/li><\/ul>", "toc": [], "text": "python Лимиты Telegram учитываются: скорость по умолчанию 25 сообщений в секунду, меняется через rate= При ошибке 429 библиотека ждёт нужное время и продолжает Заблокировавшие бота помечаются is_blocked=True и в следующий раз пропускаются Если указан id= , прогресс сохраняется каждые 20 сообщений. Если бот остановился, вызовите рассылку снова с тем же id , и она продолжится с места остановки Функция on_progress= получает текущее состояние каждые 3 секунды"}, "payments": {"title": "Платежи (Telegram Stars)", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"premium\")\nasync def premium(ctx):\n    await ctx.invoice(\"Premium\", \"30 kunlik obuna\", amount=100, payload=\"premium30\")\n\n@bot.paid()\nasync def paid(ctx):\n    sp = ctx.message.successful_payment\n    await ctx.user.update(data={**ctx.user.data, \"premium\": True})\n    await ctx.reply(f\"⭐️ {sp.total_amount} Stars uchun rahmat!\")<\/code><\/pre><\/figure><p><code>pre_checkout_query<\/code> подтверждается автоматически. Если хотите проверять сами, напишите обработчик <code>@bot.pre_checkout()<\/code>. Возврат денег: <code>await ctx.refund()<\/code>.<\/p>", "toc": [], "text": "python pre_checkout_query подтверждается автоматически. Если хотите проверять сами, напишите обработчик @bot.pre_checkout() . Возврат денег: await ctx.refund() ."}, "groups": {"title": "Группы, подписка и поддержка", "html": "<h2 id=\"управление-группой\">Управление группой<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"warn\")\nasync def warn(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.warn(\"Reklama taqiqlangan\", limit=3)   # бан после 3\n\n@bot.command(\"mute\")\nasync def mute(ctx):\n    if await ctx.is_chat_admin():\n        await ctx.mute(\"1h\")       # того, кому сделан реплай, на 1 час\n\nawait ctx.ban(for_=\"7d\")\nawait ctx.unban()\nawait ctx.kick()<\/code><\/pre><\/figure><p>Эти методы работают с пользователем, на чьё сообщение сделан реплай, или принимают <code>user_id=<\/code>. Бот должен быть админом группы.<\/p><h2 id=\"капча\">Капча<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", captcha=\"2m\")\n# новичок, не нажавший \"🤖 Я не робот\" за 2 минуты, удаляется<\/code><\/pre><\/figure><h2 id=\"обязательная-подписка\">Обязательная подписка<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", required_channels=[\"@kanalim\", \"@yangiliklar\"])\n# неподписанный пользователь видит каналы и кнопку \"✅ Проверить\"<\/code><\/pre><\/figure><p>Бот должен быть админом канала, иначе он не сможет проверить подписку. Результат кэшируется на минуту, поэтому лишних запросов к Telegram нет.<\/p><h2 id=\"режим-поддержки\">Режим поддержки<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(token=\"...\", support_chat=-1001234567890)\n# личные сообщения без обработчика уходят в группу;\n# реплай в группе отправляется пользователю<\/code><\/pre><\/figure>", "toc": [["управление-группой", "Управление группой"], ["капча", "Капча"], ["обязательная-подписка", "Обязательная подписка"], ["режим-поддержки", "Режим поддержки"]], "text": "Управление группой python Эти методы работают с пользователем, на чьё сообщение сделан реплай, или принимают user_id= . Бот должен быть админом группы. Капча python Обязательная подписка python Бот должен быть админом канала, иначе он не сможет проверить подписку. Результат кэшируется на минуту, поэтому лишних запросов к Telegram нет. Режим поддержки python"}, "middleware": {"title": "Middleware, DI и ошибки", "html": "<h2 id=\"middleware\">Middleware<\/h2><p>Middleware оборачивает каждый апдейт и может выполнять код до и после обработчика.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import time\n\n@bot.middleware\nasync def timing(ctx, next):\n    start = time.perf_counter()\n    await next()                                  # следующий шаг / обработчик\n    print(f\"{ctx.text!r}: {time.perf_counter() - start:.3f}s\")\n\n@bot.middleware\nasync def ban_check(ctx, next):\n    if ctx.user and ctx.user.data.get(\"banned\"):\n        return                                    # без next() обработка останавливается\n    await next()<\/code><\/pre><\/figure><h2 id=\"внедрение-зависимостей-di\">Внедрение зависимостей (DI)<\/h2><p>Обработчик запрашивает нужное по имени или типу параметра:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from dataclasses import dataclass\n\n@dataclass\nclass Settings:\n    price: int = 50_000\n\nbot.provide(Settings, Settings())\n\n@bot.callback(\"buy:{id:int}\")\nasync def buy(ctx, id: int, user: Customer, cfg: Settings, text, args):\n    ...   # просите нужное по имени или типу<\/code><\/pre><\/figure><p>По имени доступны: <code>bot<\/code>, <code>message<\/code>, <code>callback<\/code>, <code>user<\/code>, <code>chat<\/code>, <code>text<\/code>, <code>args<\/code>, <code>arg<\/code>, <code>payload<\/code>, <code>data<\/code>, <code>value<\/code>, <code>album<\/code>, <code>lang<\/code>, <code>state<\/code>, <code>config<\/code>, <code>db<\/code> и <code>storage<\/code>, а также параметры callback и regex.<\/p><h2 id=\"ошибки\">Ошибки<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.error(ValueError)\nasync def bad_value(ctx, error):\n    await ctx.reply(f\"Xato qiymat: {error}\")\n\n# остальные ошибки: вежливое сообщение пользователю,\n# а админам — отчёт с traceback<\/code><\/pre><\/figure>", "toc": [["middleware", "Middleware"], ["внедрение-зависимостей-di", "Внедрение зависимостей (DI)"], ["ошибки", "Ошибки"]], "text": "Middleware Middleware оборачивает каждый апдейт и может выполнять код до и после обработчика. python Внедрение зависимостей (DI) Обработчик запрашивает нужное по имени или типу параметра: python По имени доступны: bot , message , callback , user , chat , text , args , arg , payload , data , value , album , lang , state , config , db и storage , а также параметры callback и regex. Ошибки python"}, "miniapp": {"title": "Mini App", "html": "<p>В nicebot есть веб-сервер, который работает в одном процессе с ботом. Он отдаёт файлы Mini App и создаёт API-эндпоинты. Подпись <code>initData<\/code> Telegram проверяется через HMAC автоматически.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.webapp(\"webapp\")                # отдаёт webapp/index.html\n\n@bot.api(\"/api/score\")\nasync def score(req):\n    user = await req.db_user()          # initData проверен, пользователь известен\n    points = int(req.json[\"points\"])\n    await user.update(data={**user.data, \"score\": points})\n    return {\"ok\": True, \"score\": points}\n\n@bot.command(\"play\")\nasync def play(ctx):\n    await ctx.reply(\"O'ynash\", buttons=[Button(\"🎮 Boshlash\", webapp=\"https://game.tezbaraka.uz\")])\n\nbot.start(port=8080)<\/code><\/pre><\/figure><p>На стороне браузера подключается готовый <code>nicebot.js<\/code>. Он сам добавляет <code>initData<\/code> к запросам:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">html<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-xml\">&lt;script src=\"https://telegram.org/js/telegram-web-app.js\"&gt;&lt;/script&gt;\n&lt;script src=\"/nicebot.js\"&gt;&lt;/script&gt;\n&lt;script&gt;\n  nicebot.post(\"/api/score\", { points: 120 }).then(r =&gt; console.log(r.score));\n  console.log(nicebot.user.first_name);\n&lt;/script&gt;<\/code><\/pre><\/figure><p>Если <code>initData<\/code> неверный или устарел, запрос отклоняется с кодом <code>401<\/code>. <code>@bot.api(..., auth=False)<\/code> создаёт открытый эндпоинт. В объекте <code>WebAppRequest<\/code> есть <code>user<\/code>, <code>json<\/code>, <code>query<\/code>, <code>params<\/code> и <code>db_user()<\/code>.<\/p>", "toc": [], "text": "В nicebot есть веб-сервер, который работает в одном процессе с ботом. Он отдаёт файлы Mini App и создаёт API-эндпоинты. Подпись initData Telegram проверяется через HMAC автоматически. python На стороне браузера подключается готовый nicebot.js . Он сам добавляет initData к запросам: html Если initData неверный или устарел, запрос отклоняется с кодом 401 . @bot.api(..., auth=False) создаёт открытый эндпоинт. В объекте WebAppRequest есть user , json , query , params и db_user() ."}, "scheduler": {"title": "Планировщик, фон и кэш", "html": "<h2 id=\"задачи-по-расписанию\">Задачи по расписанию<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.every(\"1h\")\nasync def sync_prices(bot):\n    ...\n\n@bot.at(\"09:00\", tz=\"Asia/Tashkent\")\nasync def morning(bot):\n    await bot.broadcast(\"☀️ Xayrli tong!\")\n\n@bot.at(\"18:00\", days=[\"mon\", \"fri\"])\nasync def weekly_report(bot):\n    await bot.notify_admins(str(await bot.stats()))<\/code><\/pre><\/figure><p>Дни пишутся по-английски (<code>mon<\/code>…<code>sun<\/code>) или по-узбекски (<code>du<\/code>, <code>se<\/code>, <code>chor<\/code>, <code>pay<\/code>, <code>ju<\/code>, <code>shan<\/code>, <code>yak<\/code>).<\/p><h2 id=\"фоновые-задачи\">Фоновые задачи<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"report\")\nasync def report(ctx):\n    ctx.background(build_heavy_report, ctx.user_id, retries=3)   # обработчик завершается сразу\n    await ctx.reply(\"Hisobot tayyorlanmoqda, tayyor bo'lgach yuboraman\")\n\nbot.later(\"10m\", bot.send_message(admin_id, \"10 daqiqa o'tdi\"))<\/code><\/pre><\/figure><p>Если фоновая задача падает, она повторяется с экспоненциальной паузой. При остановке бота незавершённые задачи дожидаются.<\/p><h2 id=\"кэш\">Кэш<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import cache\n\n@cache(\"10m\")\nasync def dollar_rate():\n    ...   # реальный запрос раз в 10 минут<\/code><\/pre><\/figure><h2 id=\"файлы\">Файлы<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.on(\"document\")\nasync def doc(ctx):\n    data = await ctx.download()               # bytes\n    await ctx.save(f\"uploads/{ctx.message.document.file_name}\")\n\nawait ctx.photo(\"logo.png\")   # в первый раз загружается,\nawait ctx.photo(\"logo.png\")   # дальше мгновенно по file_id<\/code><\/pre><\/figure>", "toc": [["задачи-по-расписанию", "Задачи по расписанию"], ["фоновые-задачи", "Фоновые задачи"], ["кэш", "Кэш"], ["файлы", "Файлы"]], "text": "Задачи по расписанию python Дни пишутся по-английски ( mon … sun ) или по-узбекски ( du , se , chor , pay , ju , shan , yak ). Фоновые задачи python Если фоновая задача падает, она повторяется с экспоненциальной паузой. При остановке бота незавершённые задачи дожидаются. Кэш python Файлы python"}, "deploy": {"title": "Запуск и деплой", "html": "<figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot.start()                                   # polling\nbot.start(reload=True)                        # перезапуск при изменении кода\nbot.start(webhook=\"https://bot.tezbaraka.uz/hook\", port=8080)\nNicebot.run_all(shop_bot, support_bot)        # несколько ботов в одном процессе<\/code><\/pre><\/figure><h2 id=\"polling-или-webhook\">Polling или webhook<\/h2><p>Polling не требует настройки и подходит для небольших и средних ботов. Для webhook нужен домен с HTTPS. nicebot сам вызывает <code>setWebhook<\/code> с секретным токеном и проверяет входящие запросы. Состояние сервера можно проверить по адресу <code>/nicebot/health<\/code>.<\/p><h2 id=\"корректная-остановка\">Корректная остановка<\/h2><p>При Ctrl+C или SIGTERM бот перестаёт получать новые апдейты и ждёт завершения работающих обработчиков. Затем он подтверждает offset в Telegram, поэтому при перезапуске ни один апдейт не теряется и не обрабатывается дважды.<\/p><h2 id=\"docker\">Docker<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">docker<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-dockerfile\">FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install --no-cache-dir \"nicebot[postgres]\"\nCMD [\"python\", \"bot.py\"]<\/code><\/pre><\/figure><h2 id=\"надёжность\">Надёжность<\/h2><ul><li>Flood control (429): библиотека ждёт нужное число секунд и повторяет запрос<\/li><li>Сетевые ошибки и 5xx: до 3 повторов с экспоненциальной паузой<\/li><li>Неизвестные новые типы апдейтов не ломают бота: они записываются в лог и пропускаются<\/li><li>Число одновременных обработчиков ограничено параметром <code>max_concurrency=256<\/code><\/li><\/ul>", "toc": [["polling-или-webhook", "Polling или webhook"], ["корректная-остановка", "Корректная остановка"], ["docker", "Docker"], ["надёжность", "Надёжность"]], "text": "python Polling или webhook Polling не требует настройки и подходит для небольших и средних ботов. Для webhook нужен домен с HTTPS. nicebot сам вызывает setWebhook с секретным токеном и проверяет входящие запросы. Состояние сервера можно проверить по адресу /nicebot/health . Корректная остановка При Ctrl+C или SIGTERM бот перестаёт получать новые апдейты и ждёт завершения работающих обработчиков. Затем он подтверждает offset в Telegram, поэтому при перезапуске ни один апдейт не теряется и не обрабатывается дважды. Docker docker Надёжность Flood control (429): библиотека ждёт нужное число секунд и повторяет запрос Сетевые ошибки и 5xx: до 3 повторов с экспоненциальной паузой Неизвестные новые типы апдейтов не ломают бота: они записываются в лог и пропускаются Число одновременных обработчиков ограничено параметром max_concurrency=256"}, "testing": {"title": "Тестирование", "html": "<p>Бота можно проверить без Telegram, как настоящий пользователь. Фальшивый API записывает все вызовы.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from bot import bot\n\nasync def test_register():\n    async with bot.test() as t:\n        ali = t.user(first_name=\"Ali\")\n        await ali.send(\"/register\")\n        assert t.last.text == \"Ismingiz?\"\n        await ali.send(\"Ali\")\n        await ali.send(\"25\")\n        await ali.click(\"M\")\n        assert \"Rahmat\" in t.last.text<\/code><\/pre><\/figure><div class=\"table\"><table><tbody><tr><td><code>t.user(...)<\/code><\/td><td>Тестовый пользователь<\/td><\/tr><tr><td><code>user.send(text)<\/code><\/td><td>Отправить сообщение<\/td><\/tr><tr><td><code>user.click(\"текст\")<\/code><\/td><td>Нажать кнопку<\/td><\/tr><tr><td><code>user.send_photo()<\/code> / <code>send_contact()<\/code> / <code>send_location()<\/code> / <code>send_album()<\/code><\/td><td>Отправить медиа<\/td><\/tr><tr><td><code>t.last<\/code><\/td><td>Последнее сообщение: <code>.text<\/code>, <code>.buttons<\/code>, <code>.keyboard<\/code><\/td><\/tr><tr><td><code>t.messages<\/code> / <code>t.texts<\/code><\/td><td>Все сообщения<\/td><\/tr><tr><td><code>t.calls_of(\"sendPhoto\")<\/code><\/td><td>Вызовы API<\/td><\/tr><tr><td><code>t.blocked = {id}<\/code><\/td><td>Пользователь, заблокировавший бота<\/td><\/tr><\/tbody><\/table><\/div><p>Работает с <code>pytest<\/code> и <code>pytest-asyncio<\/code>.<\/p>", "toc": [], "text": "Бота можно проверить без Telegram, как настоящий пользователь. Фальшивый API записывает все вызовы. python t.user(...) Тестовый пользователь user.send(text) Отправить сообщение user.click(\"текст\") Нажать кнопку user.send_photo() / send_contact() / send_location() / send_album() Отправить медиа t.last Последнее сообщение: .text , .buttons , .keyboard t.messages / t.texts Все сообщения t.calls_of(\"sendPhoto\") Вызовы API t.blocked = {id} Пользователь, заблокировавший бота Работает с pytest и pytest-asyncio ."}, "features": {"title": "50 возможностей", "html": "<section class=\"fgroup\"><h2 id=\"диалоги\">Диалоги <span class=\"fcount\">5<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">01<\/span><div><code>await ctx.ask()<\/code><p>Вопрос-ответ без классов FSM<\/p><\/div><\/li><li><span class=\"fnum\">02<\/span><div><code>ctx.confirm()<\/code><p>Вопрос «Да/Нет», возвращает True/False<\/p><\/div><\/li><li><span class=\"fnum\">03<\/span><div><code>ctx.choose(multiple=True)<\/code><p>Выбор нескольких вариантов с ✅/⬜️<\/p><\/div><\/li><li><span class=\"fnum\">04<\/span><div><code>ctx.form()<\/code><p>Несколько вопросов, валидация и переспрос<\/p><\/div><\/li><li><span class=\"fnum\">05<\/span><div><code>Валидаторы<\/code><p>Телефон (+998), email, дата, число, URL, фото и другие<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"кнопки\">Кнопки <span class=\"fcount\">12<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">06<\/span><div><code>Button(on_click=)<\/code><p>Кнопка привязывается прямо к функции<\/p><\/div><\/li><li><span class=\"fnum\">07<\/span><div><code>Шаблоны callback<\/code><p>\"buy:{id:int}\" разбирается автоматически<\/p><\/div><\/li><li><span class=\"fnum\">08<\/span><div><code>Авто-раскладка<\/code><p>Короткие кнопки сами встают в один ряд<\/p><\/div><\/li><li><span class=\"fnum\">09<\/span><div><code>Toggle<\/code><p>Настройки ✅/⬜️, значение сохраняется<\/p><\/div><\/li><li><span class=\"fnum\">10<\/span><div><code>ttl= и only=<\/code><p>Кнопки с таймером и только для одного человека<\/p><\/div><\/li><li><span class=\"fnum\">11<\/span><div><code>once=True<\/code><p>Одноразовая кнопка<\/p><\/div><\/li><li><span class=\"fnum\">12<\/span><div><code>Без лимита 64 байта<\/code><p>Длинные данные callback хранятся в базе<\/p><\/div><\/li><li><span class=\"fnum\">13<\/span><div><code>Автоответ<\/code><p>«Часики» на кнопке не зависают<\/p><\/div><\/li><li><span class=\"fnum\">14<\/span><div><code>Сокращения reply<\/code><p>\"📞 Номер:contact\", \":location\"<\/p><\/div><\/li><li><span class=\"fnum\">15<\/span><div><code>ctx.respond()<\/code><p>Редактирует, если нажата кнопка, иначе отправляет<\/p><\/div><\/li><li><span class=\"fnum\">16<\/span><div><code>Многоуровневое Menu<\/code><p>Кнопка «Назад» автоматически<\/p><\/div><\/li><li><span class=\"fnum\">17<\/span><div><code>ctx.paginate()<\/code><p>Пагинация ◀️ 2/5 ▶️<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"данные\">Данные <span class=\"fcount\">4<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">18<\/span><div><code>Встроенная ORM<\/code><p>Один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями<\/p><\/div><\/li><li><span class=\"fnum\">19<\/span><div><code>ctx.user<\/code><p>Пользователь сохраняется в базу автоматически<\/p><\/div><\/li><li><span class=\"fnum\">20<\/span><div><code>i18n<\/code><p>ctx.t(), готовые тексты uz/ru/en<\/p><\/div><\/li><li><span class=\"fnum\">21<\/span><div><code>Кэш file_id<\/code><p>Локальный файл загружается один раз<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"бизнес\">Бизнес <span class=\"fcount\">10<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">22<\/span><div><code>Реферальная система<\/code><p>ctx.ref_link, referrer_id и @bot.on_referral<\/p><\/div><\/li><li><span class=\"fnum\">23<\/span><div><code>Рассылка<\/code><p>Лимиты, пометка заблокировавших, продолжение после остановки<\/p><\/div><\/li><li><span class=\"fnum\">24<\/span><div><code>Админ-панель<\/code><p>/stats, /broadcast, /maintenance и /backup<\/p><\/div><\/li><li><span class=\"fnum\">25<\/span><div><code>Аналитика<\/code><p>DAU/MAU, retention и топ команд<\/p><\/div><\/li><li><span class=\"fnum\">26<\/span><div><code>Обязательная подписка<\/code><p>required_channels=[…]<\/p><\/div><\/li><li><span class=\"fnum\">27<\/span><div><code>Режим поддержки<\/code><p>Сообщение уходит в группу, ответ возвращается пользователю<\/p><\/div><\/li><li><span class=\"fnum\">28<\/span><div><code>Режим техработ<\/code><p>Админы продолжают пользоваться ботом<\/p><\/div><\/li><li><span class=\"fnum\">29<\/span><div><code>Telegram Stars<\/code><p>ctx.invoice() и @bot.paid<\/p><\/div><\/li><li><span class=\"fnum\">30<\/span><div><code>Группы и капча<\/code><p>ban, mute, warn (3 → бан), капча для новых участников<\/p><\/div><\/li><li><span class=\"fnum\">31<\/span><div><code>Отчёты об ошибках<\/code><p>Traceback автоматически отправляется админам<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"архитектура\">Архитектура <span class=\"fcount\">11<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">32<\/span><div><code>DI через type hints<\/code><p>async def h(ctx, user: Customer, cfg: Settings)<\/p><\/div><\/li><li><span class=\"fnum\">33<\/span><div><code>Nicebot.from_env()<\/code><p>Настройка из файла .env<\/p><\/div><\/li><li><span class=\"fnum\">34<\/span><div><code>bot.include(\"handlers\")<\/code><p>Автоматический поиск Router'ов<\/p><\/div><\/li><li><span class=\"fnum\">35<\/span><div><code>@cache(\"5m\")<\/code><p>Кэш для async-функций<\/p><\/div><\/li><li><span class=\"fnum\">36<\/span><div><code>ctx.background()<\/code><p>Фоновые задачи с повторами<\/p><\/div><\/li><li><span class=\"fnum\">37<\/span><div><code>@bot.every / @bot.at<\/code><p>Планировщик с часовыми поясами<\/p><\/div><\/li><li><span class=\"fnum\">38<\/span><div><code>Альбомы<\/code><p>Media group приходит списком в один обработчик<\/p><\/div><\/li><li><span class=\"fnum\">39<\/span><div><code>Сервер Mini App<\/code><p>Файлы и проверка initData (HMAC) в процессе бота<\/p><\/div><\/li><li><span class=\"fnum\">40<\/span><div><code>Mini App RPC<\/code><p>Эндпоинты @bot.api и готовый nicebot.js<\/p><\/div><\/li><li><span class=\"fnum\">41<\/span><div><code>Несколько ботов<\/code><p>Nicebot.run_all(bot1, bot2)<\/p><\/div><\/li><li><span class=\"fnum\">42<\/span><div><code>typing=True<\/code><p>Пока работает обработчик, видно «печатает…»<\/p><\/div><\/li><\/ol><\/section><section class=\"fgroup\"><h2 id=\"надёжность\">Надёжность <span class=\"fcount\">8<\/span><\/h2><ol class=\"flist\"><li><span class=\"fnum\">43<\/span><div><code>Защита от флуда<\/code><p>При ошибке 429 ждёт и повторяет<\/p><\/div><\/li><li><span class=\"fnum\">44<\/span><div><code>throttle=<\/code><p>Ограничение частоты против спама<\/p><\/div><\/li><li><span class=\"fnum\">45<\/span><div><code>Корректная остановка<\/code><p>При перезапуске апдейты не теряются<\/p><\/div><\/li><li><span class=\"fnum\">46<\/span><div><code>Безопасное форматирование<\/code><p>html() и повторная отправка при ошибке разметки<\/p><\/div><\/li><li><span class=\"fnum\">47<\/span><div><code>delete_after=<\/code><p>Автоудаление сообщений<\/p><\/div><\/li><li><span class=\"fnum\">48<\/span><div><code>Hot reload<\/code><p>bot.start(reload=True)<\/p><\/div><\/li><li><span class=\"fnum\">49<\/span><div><code>Набор для тестов<\/code><p>bot.test(): тесты без Telegram<\/p><\/div><\/li><li><span class=\"fnum\">50<\/span><div><code>CLI<\/code><p>nicebot new mybot<\/p><\/div><\/li><\/ol><\/section>", "toc": [], "text": "Диалоги 5 01 await ctx.ask() Вопрос-ответ без классов FSM 02 ctx.confirm() Вопрос «Да/Нет», возвращает True/False 03 ctx.choose(multiple=True) Выбор нескольких вариантов с ✅/⬜️ 04 ctx.form() Несколько вопросов, валидация и переспрос 05 Валидаторы Телефон (+998), email, дата, число, URL, фото и другие Кнопки 12 06 Button(on_click=) Кнопка привязывается прямо к функции 07 Шаблоны callback \"buy:{id:int}\" разбирается автоматически 08 Авто-раскладка Короткие кнопки сами встают в один ряд 09 Toggle Настройки ✅/⬜️, значение сохраняется 10 ttl= и only= Кнопки с таймером и только для одного человека 11 once=True Одноразовая кнопка 12 Без лимита 64 байта Длинные данные callback хранятся в базе 13 Автоответ «Часики» на кнопке не зависают 14 Сокращения reply \"📞 Номер:contact\", \":location\" 15 ctx.respond() Редактирует, если нажата кнопка, иначе отправляет 16 Многоуровневое Menu Кнопка «Назад» автоматически 17 ctx.paginate() Пагинация ◀️ 2/5 ▶️ Данные 4 18 Встроенная ORM Один API для SQLite, PostgreSQL, MySQL и MongoDB, с автомиграциями 19 ctx.user Пользователь сохраняется в базу автоматически 20 i18n ctx.t(), готовые тексты uz/ru/en 21 Кэш file_id Локальный файл загружается один раз Бизнес 10 22 Реферальная система ctx.ref_link, referrer_id и @bot.on_referral 23 Рассылка Лимиты, пометка заблокировавших, продолжение после остановки 24 Админ-панель /stats, /broadcast, /maintenance и /backup 25 Аналитика DAU/MAU, retention и топ команд 26 Обязательная подписка required_channels=[…] 27 Режим поддержки Сообщение уходит в группу, ответ возвращается пользователю 28 Режим техработ Админы продолжают пользоваться ботом 29 Telegram Stars ctx.invoice() и @bot.paid 30 Группы и капча ban, mute, warn (3 → бан), капча для новых участников 31 Отчёты об ошибках Traceback автоматически отправляется админам Архитектура 11 32 DI через type hints async def h(ctx, user: Customer, cfg: Settings) 33 Nicebot.from_env() Настройка из файла .env 34 bot.include(\"handlers\") Автоматический поиск Router'ов 35 @cache(\"5m\") Кэш для async-функций 36 ctx.background() Фоновые задачи с повторами 37 @bot.every / @bot.at Планировщик с часовыми поясами 38 Альбомы Media group приходит списком в один обработчик 39 Сервер Mini App Файлы и проверка initData (HMAC) в процессе бота 40 Mini App RPC Эндпоинты @bot.api и готовый nicebot.js 41 Несколько ботов Nicebot.run_all(bot1, bot2) 42 typing=True Пока работает обработчик, видно «печатает…» Надёжность 8 43 Защита от флуда При ошибке 429 ждёт и повторяет 44 throttle= Ограничение частоты против спама 45 Корректная остановка При перезапуске апдейты не теряются 46 Безопасное форматирование html() и повторная отправка при ошибке разметки 47 delete_after= Автоудаление сообщений 48 Hot reload bot.start(reload=True) 49 Набор для тестов bot.test(): тесты без Telegram 50 CLI nicebot new mybot"}, "api": {"title": "Bot API", "html": "<p><code>Nicebot<\/code> напрямую даёт все методы Bot API. Они сгенерированы автоматически из официальной спецификации и полностью типизированы, поэтому редактор подсказывает каждый параметр.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># все 185 методов Bot API в snake_case\nawait bot.send_message(chat_id, \"Salom\")\nawait bot.set_chat_title(chat_id, \"Yangi nom\")\nmember = await bot.get_chat_member(chat_id, user_id)\nprint(member.status)      # \"member\", \"administrator\", ...<\/code><\/pre><\/figure><p>Типы доступны через <code>from nicebot import types<\/code>, например <code>types.Message<\/code> или <code>types.InlineKeyboardButton<\/code>. Они построены на msgspec и очень быстро читают JSON. Код не сломается, даже если Telegram добавит новое поле.<\/p><h2 id=\"версии\">Версии<\/h2><div class=\"table\"><table><tbody><tr><td>nicebot<\/td><td>0.1.0<\/td><\/tr><tr><td>Bot API<\/td><td>10.3<\/td><\/tr><tr><td>Python<\/td><td>3.10+<\/td><\/tr><tr><td>Лицензия<\/td><td>MIT<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["версии", "Версии"]], "text": "Nicebot напрямую даёт все методы Bot API. Они сгенерированы автоматически из официальной спецификации и полностью типизированы, поэтому редактор подсказывает каждый параметр. python Типы доступны через from nicebot import types , например types.Message или types.InlineKeyboardButton . Они построены на msgspec и очень быстро читают JSON. Код не сломается, даже если Telegram добавит новое поле. Версии nicebot 0.1.0 Bot API 10.3 Python 3.10+ Лицензия MIT"}}, "home": {"title": "Меньше кода. Всё уже внутри.", "lead": "nicebot — Python-библиотека для Telegram-ботов. База данных, кнопки, диалоги, переводы и админ-панель доступны в одном импорте.", "cta": "Начать", "cta2": "50 возможностей", "stat1": "методов Bot API", "stat2": "базы данных", "stat3": "готовых возможностей"}}, "en": {"ui": {"search": "Search…", "on_this_page": "On this page", "copy": "Copy", "copied": "Copied", "prev": "Previous", "next": "Next", "menu": "Contents", "no_results": "No results", "theme": "Theme", "edit_hint": "Bot API", "tagline": "A Python library for Telegram bots"}, "groups": {"start": "Getting started", "basics": "Basics", "ui": "Buttons and dialogs", "data": "Data", "business": "Business tools", "advanced": "Advanced", "reference": "Reference"}, "pages": {"intro": {"title": "Introduction", "html": "<p>nicebot is a Python library that makes writing Telegram bots as simple as possible. One import, one object and plain functions. A database, buttons, dialogs, translations, statistics and an admin panel are built in.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><p>This is a complete, working bot. There is no <code>Dispatcher<\/code>, no <code>Router<\/code> and no state classes, and the user is saved to the database automatically.<\/p><h2 id=\"why-nicebot\">Why nicebot?<\/h2><p>Let's compare a simple sign-up bot. First, aiogram:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">import asyncio\nfrom aiogram import Bot, Dispatcher, F, Router\nfrom aiogram.filters import Command, CommandStart\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.fsm.state import State, StatesGroup\nfrom aiogram.fsm.storage.memory import MemoryStorage\nfrom aiogram.types import Message\n\nrouter = Router()\n\nclass Reg(StatesGroup):\n    name = State()\n    age = State()\n\n@router.message(CommandStart())\nasync def start(message: Message, state: FSMContext):\n    await state.set_state(Reg.name)\n    await message.answer(\"Ismingiz?\")\n\n@router.message(Reg.name)\nasync def got_name(message: Message, state: FSMContext):\n    await state.update_data(name=message.text)\n    await state.set_state(Reg.age)\n    await message.answer(\"Yoshingiz?\")\n\n@router.message(Reg.age)\nasync def got_age(message: Message, state: FSMContext):\n    if not message.text.isdigit():\n        await message.answer(\"Butun son kiriting.\")\n        return\n    data = await state.get_data()\n    await state.clear()\n    await message.answer(f\"{data['name']}, {message.text} yosh\")\n\nasync def main():\n    bot = Bot(\"TOKEN\")\n    dp = Dispatcher(storage=MemoryStorage())\n    dp.include_router(router)\n    await dp.start_polling(bot)\n\nasyncio.run(main())<\/code><\/pre><\/figure><p>The same bot in nicebot:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"TOKEN\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    name = await ctx.ask(\"Ismingiz?\")\n    age = await ctx.ask(\"Yoshingiz?\", int)\n    await ctx.reply(f\"{name}, {age} yosh\")\n\nbot.start()<\/code><\/pre><\/figure><p><code>ctx.ask()<\/code> asks a question and waits for the answer. Pass <code>int<\/code> and the bot politely asks again until it gets a number. You don't write a <code>StatesGroup<\/code>, and you don't store or clear any state.<\/p><h2 id=\"whats-inside\">What's inside<\/h2><ul><li><strong>Full Bot API 10.3:<\/strong> 403 types and 185 methods generated from the official specification<\/li><li><strong>Built-in ORM:<\/strong> one API for SQLite, PostgreSQL, MySQL and MongoDB, with automatic migrations<\/li><li><strong>Dialogs:<\/strong> <code>ask<\/code>, <code>confirm<\/code>, <code>choose<\/code>, <code>form<\/code> and ready-made validators<\/li><li><strong>Buttons:<\/strong> <code>on_click<\/code>, templates, toggles, expiring and one-time buttons, automatic layout<\/li><li><strong>Business:<\/strong> referrals, broadcasts, statistics, admin panel, required subscription, support, Telegram Stars<\/li><li><strong>Reliability:<\/strong> waits out flood limits, retries on network errors, loses no updates on restart<\/li><li><strong>Speed:<\/strong> msgspec types and a single connection pool<\/li><\/ul><p>The full list is on the <a href=\"#features\" data-nav>50 features<\/a> page.<\/p><aside class=\"note\"><p>nicebot is built on <code>async<\/code>. Every handler is an <code>async def<\/code>, and every call to Telegram is written with <code>await<\/code>.<\/p><\/aside>", "toc": [["why-nicebot", "Why nicebot?"], ["whats-inside", "What's inside"]], "text": "nicebot is a Python library that makes writing Telegram bots as simple as possible. One import, one object and plain functions. A database, buttons, dialogs, translations, statistics and an admin panel are built in. python This is a complete, working bot. There is no Dispatcher , no Router and no state classes, and the user is saved to the database automatically. Why nicebot? Let's compare a simple sign-up bot. First, aiogram: python The same bot in nicebot: python ctx.ask() asks a question and waits for the answer. Pass int and the bot politely asks again until it gets a number. You don't write a StatesGroup , and you don't store or clear any state. What's inside Full Bot API 10.3: 403 types and 185 methods generated from the official specification Built-in ORM: one API for SQLite, PostgreSQL, MySQL and MongoDB, with automatic migrations Dialogs: ask , confirm , choose , form and ready-made validators Buttons: on_click , templates, toggles, expiring and one-time buttons, automatic layout Business: referrals, broadcasts, statistics, admin panel, required subscription, support, Telegram Stars Reliability: waits out flood limits, retries on network errors, loses no updates on restart Speed: msgspec types and a single connection pool The full list is on the 50 features page. nicebot is built on async . Every handler is an async def , and every call to Telegram is written with await ."}, "install": {"title": "Installation", "html": "<p>You need Python 3.10 or newer.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">pip install nicebot                 # with SQLite\npip install \"nicebot[postgres]\"     # + PostgreSQL\npip install \"nicebot[mysql]\"        # + MySQL / MariaDB\npip install \"nicebot[mongo]\"        # + MongoDB\npip install \"nicebot[redis]\"        # + Redis\npip install \"nicebot[all]\"          # everything<\/code><\/pre><\/figure><p>The part in square brackets installs the driver for that database. SQLite works without extras.<\/p><h2 id=\"create-a-ready-made-project\">Create a ready-made project<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">nicebot new mybot\ncd mybot\npython bot.py<\/code><\/pre><\/figure><p>The command creates this layout:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">text<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-plaintext\">mybot/\n├── bot.py            # main file\n├── .env              # BOT_TOKEN, DATABASE_URL, ADMINS\n├── handlers/\n│   └── basic.py      # handlers with a Router\n└── locales/\n    ├── uz.json\n    ├── ru.json\n    └── en.json<\/code><\/pre><\/figure><p>Open <code>.env<\/code> and replace <code>BOT_TOKEN<\/code> with the token @BotFather gave you.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">BOT_TOKEN=123456:ABC-your-token\nDATABASE_URL=sqlite:///bot.db\nADMINS=123456789,987654321\nTZ=Asia/Tashkent<\/code><\/pre><\/figure><h2 id=\"check-the-version\">Check the version<\/h2><p><code>nicebot version<\/code> prints the library, Bot API and Python versions.<\/p>", "toc": [["create-a-ready-made-project", "Create a ready-made project"], ["check-the-version", "Check the version"]], "text": "You need Python 3.10 or newer. bash The part in square brackets installs the driver for that database. SQLite works without extras. Create a ready-made project bash The command creates this layout: text Open .env and replace BOT_TOKEN with the token @BotFather gave you. bash Check the version nicebot version prints the library, Bot API and Python versions."}, "first-bot": {"title": "Your first bot", "html": "<h2 id=\"1-get-a-token\">1. Get a token<\/h2><p>Open @BotFather in Telegram, send <code>/newbot<\/code>, then choose a name and a username. You'll get a token like <code>123456:ABC-DEF...<\/code>. Never share it.<\/p><h2 id=\"2-write-the-code\">2. Write the code<\/h2><p>Create <code>bot.py<\/code>:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import Nicebot\n\nbot = Nicebot(token=\"123456:ABC...\")\n\n@bot.command(\"start\")\nasync def start(ctx):\n    await ctx.reply(f\"Salom, {ctx.name}!\")\n\nbot.start()<\/code><\/pre><\/figure><h2 id=\"3-run-it\">3. Run it<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">bash<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-bash\">python bot.py<\/code><\/pre><\/figure><p>The terminal shows <code>✅ @your_bot ishga tushdi<\/code>. Send <code>/start<\/code> to your bot and it greets you by name.<\/p><h2 id=\"what-happened\">What happened?<\/h2><div class=\"table\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>Nicebot(token=...)<\/code><\/td><td>Creates the bot. Without <code>db<\/code>, an in-memory SQLite is used<\/td><\/tr><tr><td><code>@bot.command(\"start\")<\/code><\/td><td>Calls the function below when <code>/start<\/code> arrives<\/td><\/tr><tr><td><code>async def start(ctx)<\/code><\/td><td><code>ctx<\/code> knows everything about the current message<\/td><\/tr><tr><td><code>await ctx.reply(...)<\/code><\/td><td>Sends a reply to this chat<\/td><\/tr><tr><td><code>bot.start()<\/code><\/td><td>Starts receiving messages. Stop it with Ctrl+C<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><p>To keep data after a restart, write <code>Nicebot(token=..., db=\"sqlite:///bot.db\")<\/code>.<\/p><\/aside><h2 id=\"reload-on-code-changes\">Reload on code changes<\/h2><p>With <code>bot.start(reload=True)<\/code> the bot restarts itself every time you save a file, which is very handy during development.<\/p>", "toc": [["1-get-a-token", "1. Get a token"], ["2-write-the-code", "2. Write the code"], ["3-run-it", "3. Run it"], ["what-happened", "What happened?"], ["reload-on-code-changes", "Reload on code changes"]], "text": "1. Get a token Open @BotFather in Telegram, send /newbot , then choose a name and a username. You'll get a token like 123456:ABC-DEF... . Never share it. 2. Write the code Create bot.py : python 3. Run it bash The terminal shows ✅ @your_bot ishga tushdi . Send /start to your bot and it greets you by name. What happened? Line Meaning Nicebot(token=...) Creates the bot. Without db , an in-memory SQLite is used @bot.command(\"start\") Calls the function below when /start arrives async def start(ctx) ctx knows everything about the current message await ctx.reply(...) Sends a reply to this chat bot.start() Starts receiving messages. Stop it with Ctrl+C To keep data after a restart, write Nicebot(token=..., db=\"sqlite:///bot.db\") . Reload on code changes With bot.start(reload=True) the bot restarts itself every time you save a file, which is very handy during development."}, "concepts": {"title": "Core concepts", "html": "<p>nicebot has only three concepts.<\/p><h2 id=\"bot\">Bot<\/h2><p><code>Nicebot<\/code> is your whole application. The token, database, admins, language and other settings go here.<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">bot = Nicebot(\n    token=\"...\",\n    db=\"postgres://user:pass@localhost/mybot\",\n    admins=[123456789],\n    lang=\"uz\",                       # default language\n    required_channels=[\"@mykanal\"],  # required subscription\n    support_chat=-1001234567890,     # support group\n    captcha=\"2m\",                    # for new group members\n    tz=\"Asia/Tashkent\",\n)<\/code><\/pre><\/figure><h2 id=\"handler\">Handler<\/h2><p>A handler is an <code>async<\/code> function that runs when something happens. The decorator says when: <code>@bot.command(\"start\")<\/code>, <code>@bot.text(\"salom\")<\/code>, <code>@bot.callback(\"buy:{id:int}\")<\/code> and so on. Handlers are checked in the order you declare them, and the first match runs.<\/p><h2 id=\"ctx-context\">ctx (context)<\/h2><p>A new <code>ctx<\/code> is created for every message and passed to the handler as the first argument. It does two jobs:<\/p><ul><li><strong>it gives you data:<\/strong> <code>ctx.text<\/code>, <code>ctx.user<\/code>, <code>ctx.chat_id<\/code>, <code>ctx.args<\/code>…<\/li><li><strong>it acts:<\/strong> <code>ctx.reply()<\/code>, <code>ctx.edit()<\/code>, <code>ctx.ask()<\/code>, <code>ctx.photo()<\/code>…<\/li><\/ul><h2 id=\"lifecycle\">Lifecycle<\/h2><p>When a message arrives, this happens:<\/p><ol><li>If the user is answering a <code>ctx.ask()<\/code>, the message goes there<\/li><li>Built-in middleware runs: the user is saved, maintenance mode and required subscription are checked<\/li><li>Your middleware runs<\/li><li>The first matching handler is called<\/li><li>If nothing matched, <code>@bot.fallback()<\/code> or support mode handles it<\/li><li>If a button was pressed and you didn't answer it, <code>answerCallbackQuery<\/code> is sent automatically<\/li><\/ol>", "toc": [["bot", "Bot"], ["handler", "Handler"], ["ctx-context", "ctx (context)"], ["lifecycle", "Lifecycle"]], "text": "nicebot has only three concepts. Bot Nicebot is your whole application. The token, database, admins, language and other settings go here. python Handler A handler is an async function that runs when something happens. The decorator says when: @bot.command(\"start\") , @bot.text(\"salom\") , @bot.callback(\"buy:{id:int}\") and so on. Handlers are checked in the order you declare them, and the first match runs. ctx (context) A new ctx is created for every message and passed to the handler as the first argument. It does two jobs: it gives you data: ctx.text , ctx.user , ctx.chat_id , ctx.args … it acts: ctx.reply() , ctx.edit() , ctx.ask() , ctx.photo() … Lifecycle When a message arrives, this happens: If the user is answering a ctx.ask() , the message goes there Built-in middleware runs: the user is saved, maintenance mode and required subscription are checked Your middleware runs The first matching handler is called If nothing matched, @bot.fallback() or support mode handles it If a button was pressed and you didn't answer it, answerCallbackQuery is sent automatically"}, "handlers": {"title": "Handlers", "html": "<h2 id=\"kinds\">Kinds<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"help\", description=\"Yordam\")\nasync def help_(ctx):\n    await ctx.reply(\"Men nima qila olaman...\")\n\n@bot.text(\"salom\")                       # exact text (case-insensitive)\nasync def salom(ctx):\n    await ctx.reply(\"Va alaykum assalom!\")\n\n@bot.text(contains=\"narx\")               # if it contains \"narx\"\nasync def narx(ctx):\n    await ctx.reply(\"Narxlar: ...\")\n\n@bot.text(regex=r\"^buy (?P&lt;qty&gt;\\d+)$\")  # regex groups become parameters\nasync def buy(ctx, qty: int):\n    await ctx.reply(f\"{qty} dona\")\n\n@bot.on(\"photo\")                          # a photo arrived\nasync def photo(ctx):\n    await ctx.reply(\"Chiroyli rasm!\")\n\n@bot.text()                               # any plain text\nasync def echo(ctx):\n    await ctx.reply(ctx.text)\n\n@bot.fallback()                           # when nothing else matched\nasync def unknown(ctx):\n    await ctx.reply(\"Tushunmadim 🤔\")<\/code><\/pre><\/figure><h2 id=\"handler-options\">Handler options<\/h2><p>You can add these options to any decorator:<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.command(\"admin\", admin=True)              # admins only\n@bot.command(\"bonus\", throttle=\"1d\")           # once a day\n@bot.command(\"report\", typing=True)            # shows \"typing...\"\n@bot.text(\"salom\", chat=\"private\")             # private chats only\n@bot.text(state=\"waiting_phone\")               # only in this state\n@bot.command(\"vip\", users=[111, 222])          # only these people\n@bot.message(F.photo &amp; F.private)              # filters\n@bot.deep_link(r\"promo_(?P&lt;code&gt;\\w+)\")         # t.me/bot?start=promo_X\nasync def handler(ctx): ...<\/code><\/pre><\/figure><div class=\"table\"><table><thead><tr><th>Option<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td><code>admin=True<\/code><\/td><td>Only for <code>Nicebot(admins=[...])<\/code><\/td><\/tr><tr><td><code>chat=\"private\"<\/code><\/td><td><code>private<\/code>, <code>group<\/code>, <code>supergroup<\/code>, <code>channel<\/code><\/td><\/tr><tr><td><code>throttle=\"3s\"<\/code><\/td><td>Rate limit per user. When exceeded, shows \"⏳ Please wait\"<\/td><\/tr><tr><td><code>typing=True<\/code><\/td><td>Shows \"typing…\" while the handler runs. <code>\"upload_photo\"<\/code> works too<\/td><\/tr><tr><td><code>state=\"x\"<\/code><\/td><td>Only when the user is in this state<\/td><\/tr><tr><td><code>users=[...]<\/code><\/td><td>Only for these ids<\/td><\/tr><tr><td><code>description=\"...\"<\/code><\/td><td>The command appears in Telegram's menu. <code>{\"uz\": ..., \"ru\": ...}<\/code> also works<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"filters\">Filters<\/h2><p><code>F<\/code> provides ready-made filters. Combine them with <code>&amp;<\/code> (and), <code>|<\/code> (or) and <code>~<\/code> (not).<\/p><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">from nicebot import F\n\n@bot.message(F.photo | F.document)\n@bot.message(F.text &amp; ~F.command)\n@bot.message(F.regex(r\"\\d{4}\"))\n@bot.message(F.contains(\"chegirma\", \"aksiya\"))\n@bot.message(F.user(123, 456))\n@bot.message(lambda ctx: len(ctx.text or \"\") &gt; 100)   # your own filter\nasync def h(ctx): ...<\/code><\/pre><\/figure><h2 id=\"router-split-code-into-files\">Router: split code into files<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\"># handlers/shop.py\nfrom nicebot import Router\n\nrouter = Router(chat=\"private\")   # applies to every handler\n\n@router.command(\"shop\")\nasync def shop(ctx):\n    await ctx.reply(\"Do'kon\")\n\n# bot.py\nbot.include(\"handlers\")           # every Router in the folder\n# or: from handlers.shop import router; bot.include(router)<\/code><\/pre><\/figure><h2 id=\"all-event-kinds\">All event kinds<\/h2><p><code>@bot.callback<\/code>, <code>@bot.inline<\/code>, <code>@bot.chosen_inline<\/code>, <code>@bot.edited<\/code>, <code>@bot.channel<\/code>, <code>@bot.join<\/code>, <code>@bot.leave<\/code>, <code>@bot.album<\/code>, <code>@bot.paid<\/code>, <code>@bot.pre_checkout<\/code>, <code>@bot.webapp_data<\/code>, <code>@bot.my_chat_member<\/code>, <code>@bot.chat_member<\/code>, <code>@bot.join_request<\/code>, <code>@bot.reaction<\/code>, <code>@bot.poll_answer<\/code>. For any other update: <code>@bot.event(\"chat_boost\")<\/code>.<\/p><aside class=\"note\"><p><code>raise SkipHandler<\/code> inside a handler lets the next matching handler run.<\/p><\/aside>", "toc": [["kinds", "Kinds"], ["handler-options", "Handler options"], ["filters", "Filters"], ["router-split-code-into-files", "Router: split code into files"], ["all-event-kinds", "All event kinds"]], "text": "Kinds python Handler options You can add these options to any decorator: python Option What it does admin=True Only for Nicebot(admins=[...]) chat=\"private\" private , group , supergroup , channel throttle=\"3s\" Rate limit per user. When exceeded, shows \"⏳ Please wait\" typing=True Shows \"typing…\" while the handler runs. \"upload_photo\" works too state=\"x\" Only when the user is in this state users=[...] Only for these ids description=\"...\" The command appears in Telegram's menu. {\"uz\": ..., \"ru\": ...} also works Filters F provides ready-made filters. Combine them with & (and), | (or) and ~ (not). python Router: split code into files python All event kinds @bot.callback , @bot.inline , @bot.chosen_inline , @bot.edited , @bot.channel , @bot.join , @bot.leave , @bot.album , @bot.paid , @bot.pre_checkout , @bot.webapp_data , @bot.my_chat_member , @bot.chat_member , @bot.join_request , @bot.reaction , @bot.poll_answer . For any other update: @bot.event(\"chat_boost\") . raise SkipHandler inside a handler lets the next matching handler run."}, "ctx": {"title": "ctx: the context", "html": "<h2 id=\"data\">Data<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">@bot.message()\nasync def info(ctx):\n    ctx.text        # message text (or caption)\n    ctx.name        # user's first name\n    ctx.user        # user row from the database (saved automatically)\n    ctx.user_id     # Telegram id\n    ctx.chat_id     # chat id\n    ctx.command     # \"/start ref_5\" -&gt; \"start\"\n    ctx.args        # \"/give 10 ali\" -&gt; [\"10\", \"ali\"]\n    ctx.payload     # deep link: \"ref_5\"\n    ctx.lang        # \"uz\", \"ru\", \"en\"\n    ctx.is_private  # private chat?\n    ctx.is_admin    # bot admin?\n    ctx.message     # the full Message object\n    ctx.mention     # clickable name (HTML)<\/code><\/pre><\/figure><h2 id=\"sending\">Sending<\/h2><figure class=\"code\"><figcaption><span class=\"code-lang\">python<\/span><button class=\"copy\" type=\"button\" data-copy><span data-t=\"copy\"><\/span><\/button><\/figcaption><pre><code class=\"language-python\">await ctx.reply(\"Salom!\")                          # text\nawait ctx.reply(\"Tanlang\", buttons=[\"A\", \"B\"])    # with inline buttons\nawait ctx.reply(\"Yozing\", keyboard=[\"Menyu\"])     # bottom keyboard\nawait ctx.reply(\"30 soniyada o'chadi\", delete_after=\"30s\")\nawait ctx.reply(\"Ovozsiz\", silent=True, protect=True)\n\nawait ctx.photo(\"rasm.jpg\", caption=\"Mana\")       # file, URL or file_id\nawait ctx.video(\"https://site.uz/v.mp4\")\nawait ctx.document(\"hisobot.pdf\")\nawait ctx.media_group([\"1.jpg\", \"2.jpg\", \"3.jpg\"], caption=\"Albom\")\nawait ctx.location(40.10, 65.37)\nawait ctx.poll(\"Qaysi biri?\", [\"Python\", \"Go\"])\nawait ctx.dice(\"🎯\")<\/code><\/pre><\/figure><p>Every send method accepts the same extra options:<\/p><div class=\"table\"><table><thead><tr><th>Option<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>buttons=<\/code><\/td><td>Inline buttons (<a href=\"#buttons\" data-nav>Buttons<\/a>)<\/td><\/tr><tr><td><code>keyboard=<\/code><\/td><td>Bottom keyboard. <code>False<\/code> closes it<\/td><\/tr><tr><td><code>columns=<\/code><\/td><td>Number of button columns<\/td><\/tr><tr><td><code>delete_after=\"1m\"<\/code><\/td><td>Delete the message automatically<\/td><\/tr><tr><td><code>silent=True<\/code><\/td><td>No notification sound<\/td><\/tr><tr><td><code>protect=True<\/code><\/td><td>Disallow forwarding and saving<\/td><\/tr><tr><td><code>quote=True<\/code><\/td><td>Reply to the incoming message<\/td><\/tr><tr><td><code>preview=False<\/code><\/td><td>Disable link previews<\/td><\/tr><tr><td><code>chat_id=<\/code><\/td><td>Send to another c
